  }

  function desenharListaTransacoes() {
    var alvo = $('listaTransacoes');
    if (!alvo) return;
    alvo.textContent = '';

    var termo = buscaTransacoes.trim().toLowerCase();
    var faixa = faixaDoPeriodo();
    var itens = lancamentosDoPeriodo().filter(function (l) {
      if (filtroTransacoes !== 'todas' && l.tipo !== filtroTransacoes) return false;
      if (!termo) return true;
      return (l.descricao + ' ' + l.categoria + ' ' + (l.subcategoria || ''))
        .toLowerCase().indexOf(termo) >= 0;
    });

    if (!itens.length) {
      var c = cartao('liso');
      c.appendChild(estadoVazio(
        termo ? 'Nada encontrado' : 'Nenhum lançamento',
        termo ? 'Tente outro termo de busca.'
              : 'Toque no + para registrar o primeiro movimento ' + faixa.rotulo + '.'
      ));
      alvo.appendChild(c);
      return;
    }

    var porDia = {};
    itens.forEach(function (l) { (porDia[l.data] = porDia[l.data] || []).push(l); });

    Object.keys(porDia).sort().reverse().forEach(function (data) {
      var doDia = porDia[data].slice().sort(function (a, b) { return (b.criadoEm || 0) - (a.criadoEm || 0); });
      var totalDia = doDia.reduce(function (s, l) {
        return s + (l.tipo === 'entrada' ? l.valor : l.tipo === 'saida' ? -l.valor : 0);
      }, 0);

      var cab = no('div', 'dia-cabecalho');
      juntar(cab, no('div', 'dia-nome', nomeDoDia(data)), no('div', 'dia-total num', comSinal(totalDia)));
      alvo.appendChild(cab);

      var cartaoDia = cartao('liso');
      doDia.forEach(function (l) { cartaoDia.appendChild(linhaLancamento(l)); });
      alvo.appendChild(cartaoDia);
    });

    // O resumo soma o que está na tela, não o período inteiro.
    //
    // Antes, "Lançamentos" vinha da lista filtrada e "Entradas"/"Saídas"
    // vinham do período cru. Com um filtro ou uma busca ligados, o mesmo
    // cartão dizia 35 lançamentos e somava os milhares que estavam fora
    // dele — um número não tinha nada a ver com o outro.
    var totais = totaisDaLista(itens);
    var entradas = totais.entradas, saidas = totais.saidas, saldo = totais.saldo;
    var recortado = filtroTransacoes !== 'todas' || !!termo;

    var resumo = cartao();
    resumo.style.marginTop = '16px';
    var linhaResumo = no('div', 'cartao-topo');
    linhaResumo.style.marginBottom = '8px';
    juntar(linhaResumo,
      no('div', 'cartao-titulo', 'Saldo do período'),
      no('div', 'linha-valor num ' + (saldo >= 0 ? 'verde' : 'vermelho'), emReais(saldo))
    );
    resumo.appendChild(linhaResumo);
    var gradeResumo = no('div', 'resumo-grade');
    gradeResumo.style.marginTop = '0';
    [['Entradas', entradas, 'verde'], ['Saídas', saidas, 'vermelho'],
     ['Lançamentos', itens.length, '']].forEach(function (item) {
      var d = no('div');
      d.appendChild(no('div', 'r', item[0]));
      d.appendChild(no('div', 'v ' + item[2], item[0] === 'Lançamentos' ? String(item[1]) : emReais(item[1])));
      gradeResumo.appendChild(d);
    });
    // Por que a soma da tela não bate com a conta de cabeça: a fatura paga
    // está listada, mas não entra em "Saídas" para não contar duas vezes.
    if (totais.valorDasFaturas > 0) {
      var notaFat = no('div', 'linha-nota',
        'Fora de "Saídas": ' + emReais(totais.valorDasFaturas) + ' de fatura paga. ' +
        'O gasto já está nas compras do cartão.');
      notaFat.style.marginTop = '10px';
      resumo.appendChild(notaFat);
    }
    resumo.appendChild(gradeResumo);
    var rodape = 'De ' + dataBr(faixa.de) + ' a ' + dataBr(faixa.ate) + '.';
    // Com filtro ou busca ligados, dizer só o período faria pensar que a
    // soma é de tudo o que aconteceu nele.
    if (recortado) {
      var recorte = [];
      if (filtroTransacoes !== 'todas') {
        recorte.push({ entrada: 'só receitas', saida: 'só despesas',
                       transferencia: 'só transferências' }[filtroTransacoes] || 'filtrado');
      }
      if (termo) recorte.push('busca por "' + buscaTransacoes.trim() + '"');
      rodape += ' Somando só o que está nesta lista: ' + recorte.join(' e ') + '.';
    }
    resumo.appendChild(no('div', 'linha-nota', rodape));
    alvo.appendChild(resumo);
  }

  function linhaLancamento(l) {
    var b = botao('linha', null, function () { abrirFolhaLancamento(l.id); });
    var cor = l.tipo === 'entrada' ? '#34D399' : l.tipo === 'saida' ? '#F87171' : '#60A5FA';
    var sinal = l.tipo === 'entrada' ? '+' : l.tipo === 'saida' ? '−' : '⇄';

    var sub;
    if (l.tipo === 'transferencia') {
      var origem = achar(estado.contas, l.contaId);
      var destino = achar(estado.contas, l.contaDestinoId);
      sub = (origem ? origem.nome : '—') + ' → ' + (destino ? destino.nome : '—');
    } else {
      var conta = achar(estado.contas, l.contaId);
      // A subcategoria fica encostada na categoria, com o mesmo separador
      // do resto da linha: é detalhe da categoria, não um terceiro assunto.
      sub = l.categoria + (l.subcategoria ? ' · ' + l.subcategoria : '') +
            (conta ? ' · ' + conta.nome : '');
    }

    // A linha continua aqui, com o valor certo — ela só não entra no total
    // de despesas. Emendado no subtítulo, esse aviso virava uma frase só
    // com a categoria e a conta; como etiqueta, dá para ver de relance.
    var foraDaDespesa = l.tipo === 'saida' && !contaComoDespesa(l);
    var texto = juntar(no('div', 'linha-texto'),
      no('div', 'linha-titulo', l.descricao || (l.tipo === 'transferencia' ? 'Transferência' : l.categoria)),
      no('div', 'linha-sub', sub));
    if (foraDaDespesa) {
      var marca = no('span', 'etiqueta fora', 'não conta como despesa');
      marca.style.marginTop = '5px';
      texto.appendChild(marca);
    }

    juntar(b,
      selo(cor, sinal),
      texto,
      juntar(no('div', 'linha-fim'),
        no('div', 'linha-valor num ' + (l.tipo === 'entrada' ? 'verde' : l.tipo === 'saida' ? 'vermelho' : ''),
          (l.tipo === 'entrada' ? '+ ' : l.tipo === 'saida' ? '− ' : '') + emReais(l.valor)))
    );
    return b;
  }

  // Lançamentos que passaram por esta conta, do mais novo para o mais antigo.
  // Abrir o extrato de uma conta com muitos lançamentos demorava um tempo
  // visível: filtrar e ordenar tudo acontecia no toque. Como na Visão geral
  // as contas estão ali na tela, esperando um toque, a conta é feita antes,
  // na folga do navegador. Saindo da Visão geral o cache é solto: não vale
  // ocupar memória com o que não vai ser aberto.
  var extratoPronto = {};
  var preparoMarcado = 0;

  function lancamentosDaConta(id) {
    if (extratoPronto[id]) return extratoPronto[id];
    var fora = estado.lancamentos.filter(function (l) {
      return l.contaId === id || l.contaDestinoId === id;
    }).sort(function (a, b) {
      if (a.data !== b.data) return a.data < b.data ? 1 : -1;
      return (b.criadoEm || 0) - (a.criadoEm || 0);
    });
    return fora;
  }

  function soltarExtratos() {
    extratoPronto = {};
    if (preparoMarcado) {
      if (window.cancelIdleCallback) cancelIdleCallback(preparoMarcado);
      else clearTimeout(preparoMarcado);
      preparoMarcado = 0;
    }
  }

  // Uma conta por vez, sempre na folga: com muitas contas o preparo não pode
  // virar o próprio travamento que ele existe para evitar.
  function prepararExtratos() {
    soltarExtratos();
    var fila = estado.contas.map(function (c) { return c.id; });
    var naFolga = window.requestIdleCallback ||
      function (fn) { return setTimeout(function () { fn({ timeRemaining: function () { return 8; } }); }, 60); };

    function passo(prazo) {
      preparoMarcado = 0;
      while (fila.length && (!prazo || prazo.timeRemaining() > 4)) {
        var id = fila.shift();
        if (!extratoPronto[id]) {
          extratoPronto[id] = estado.lancamentos.filter(function (l) {
            return l.contaId === id || l.contaDestinoId === id;
          }).sort(function (a, b) {
            if (a.data !== b.data) return a.data < b.data ? 1 : -1;
            return (b.criadoEm || 0) - (a.criadoEm || 0);
          });
        }
      }
      if (fila.length) preparoMarcado = naFolga(passo);
    }

    if (fila.length) preparoMarcado = naFolga(passo);
  }

  // Quanto este lançamento mexeu nesta conta: positivo entra, negativo sai.
  function efeitoNaConta(l, id) {
    if (l.tipo === 'entrada') return l.contaId === id ? l.valor : 0;
    if (l.tipo === 'saida') return l.contaId === id ? -l.valor : 0;
    if (l.contaDestinoId === id) return l.valor;
    if (l.contaId === id) return -l.valor;
    return 0;
  }

  function linhaExtrato(l, id) {
    var efeito = efeitoNaConta(l, id);
    var b = botao('linha', null, function () { abrirFolhaLancamento(l.id); });
    var cor = efeito > 0 ? '#34D399' : efeito < 0 ? '#F87171' : '#60A5FA';
    var sinal = efeito > 0 ? '+' : efeito < 0 ? '−' : '⇄';

    var sub;
    if (l.tipo === 'transferencia') {
      var outra = achar(estado.contas, l.contaDestinoId === id ? l.contaId : l.contaDestinoId);
      sub = (efeito > 0 ? 'Veio de ' : 'Foi para ') + (outra ? outra.nome : 'outra conta');
    } else {
      sub = l.categoria;
    }

    juntar(b,
      selo(cor, sinal),
      juntar(no('div', 'linha-texto'),
        no('div', 'linha-titulo', l.descricao || (l.tipo === 'transferencia' ? 'Transferência' : l.categoria)),
        no('div', 'linha-sub', sub)),
      juntar(no('div', 'linha-fim'),
        no('div', 'linha-valor num ' + (efeito > 0 ? 'verde' : efeito < 0 ? 'vermelho' : ''),
          (efeito > 0 ? '+ ' : efeito < 0 ? '− ' : '') + emReais(Math.abs(efeito) || l.valor)))
    );
    return b;
  }

  // Duas transações iguais no mesmo dia costumam ser importação repetida.
  // Não é prova, então eu só aponto: quem decide é quem viu o extrato.
  function repetidosDaConta(id) {
    var mapa = {};
    lancamentosDaConta(id).forEach(function (l) {
      var k = l.data + '|' + l.valor + '|' + l.tipo + '|' + (l.descricao || '');
      (mapa[k] = mapa[k] || []).push(l);
    });
    var grupos = [];
    Object.keys(mapa).forEach(function (k) { if (mapa[k].length > 1) grupos.push(mapa[k]); });
    grupos.sort(function (a, b) { return a[0].data < b[0].data ? 1 : -1; });
    return grupos;
  }

  function resumoDaConta(id) {
    var r = { entradas: 0, saidas: 0, entrou: 0, saiu: 0, quantos: 0,
              transferencias: 0, futuros: 0, primeira: '', ultima: '' };
    var hoje = hojeTexto();
    lancamentosDaConta(id).forEach(function (l) {
      r.quantos++;
      if (l.data > hoje) r.futuros++;
      if (!r.ultima || l.data > r.ultima) r.ultima = l.data;
      if (!r.primeira || l.data < r.primeira) r.primeira = l.data;
      if (l.tipo === 'transferencia') { r.transferencias++; }
      var e = efeitoNaConta(l, id);
      if (e > 0) { r.entradas++; r.entrou += e; }
      else if (e < 0) { r.saidas++; r.saiu += -e; }
    });
    return r;
  }

  // Saldo mês a mês. É por aqui que se acha onde a conta descolou do banco:
  // basta comparar cada linha com o extrato daquele mês.
  function saldoPorMes(id) {
    var conta = achar(estado.contas, id);
    var linhas = [];
    var porMes = {};
    lancamentosDaConta(id).forEach(function (l) {
      var k = l.data.slice(0, 7);
      if (!porMes[k]) porMes[k] = { entrou: 0, saiu: 0, quantos: 0 };
      var e = efeitoNaConta(l, id);
      porMes[k].quantos++;
      if (e > 0) porMes[k].entrou += e; else porMes[k].saiu += -e;
    });
    var chaves = Object.keys(porMes).sort();
    var corrente = conta ? conta.saldoInicial : 0;
    chaves.forEach(function (k) {
      var m = porMes[k];
      corrente += m.entrou - m.saiu;
      linhas.push({ mes: k, entrou: m.entrou, saiu: m.saiu, quantos: m.quantos, saldo: corrente });
    });
    linhas.reverse();
    return linhas;
  }

  // Data e hora de quando o lançamento entrou no app. É o que separa duas
  // transações idênticas uma da outra.
  function quandoEntrou(ms) {
    var d = new Date(inteiro(ms) || Date.now());
    return dataBr(deData(d)) + ' às ' +
      String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') +
      ':' + String(d.getSeconds()).padStart(2, '0');
  }

  function nomeDoMesChave(k) {
    var p = k.split('-');
    return MESES[+p[1] - 1].slice(0, 3) + '/' + p[0].slice(2);
  }

  // Tirar uma importação inteira: os lançamentos daquela leva somem, e o
  // registro dela também.
  function desfazerImportacao(impId, aoTerminar) {
    var imp = null;
    (estado.importacoes || []).forEach(function (i) { if (i.id === impId) imp = i; });
    if (!imp) return;
    perguntar({
      titulo: 'Tirar esta importação?',
      texto: 'Isso apaga os ' + imp.quantos + ' lançamento(s) que entraram nessa leva' +
             (imp.arquivo ? ' (' + imp.arquivo + ')' : '') + '. O que você lançou à mão não é tocado.',
      ok: 'Tirar tudo', tom: 'perigo'
    }, function () {
      var tirados = 0;
      estado.lancamentos = estado.lancamentos.filter(function (l) {
        if (l.importacaoId !== impId) return true;
        marcarExcluido('lancamentos', l.id);
        tirados++;
        return false;
      });
      estado.importacoes = (estado.importacoes || []).filter(function (i) { return i.id !== impId; });
      salvar();
      avisar(tirados + ' lançamento(s) removidos.');
      if (aoTerminar) aoTerminar();
    });
  }

  function abrirFolhaConferencia(id) {
    var conta = achar(estado.contas, id);
    if (!conta) return;

    abrirFolha('Conferir ' + conta.nome, function (folha) {
      var forma = no('div');
      var saldo = saldoConta(id, null);
      var r = resumoDaConta(id);

      forma.appendChild(no('p', 'linha-sub',
        'Compare o que está aqui com o extrato do banco. O saldo do app é o saldo inicial ' +
        'da conta mais tudo o que entrou, menos tudo o que saiu.'));

      // ---- bate com o banco? ----
      var conf = cartao();
      conf.appendChild(no('div', 'rotulo', 'Saldo pelo app'));
      conf.appendChild(no('div', 'valorao num' + (saldo < 0 ? ' vermelho' : ''), emReais(saldo)));
      conf.appendChild(no('div', 'linha-nota',
        'Saldo inicial ' + emReais(conta.saldoInicial) + ' + entradas ' + emReais(r.entrou) +
        ' − saídas ' + emReais(r.saiu)));

      var campoBanco = entradaValor(saldo, false);
      conf.appendChild(campo('Saldo que o banco mostra', campoBanco));

      var diferenca = no('div', 'linha-nota');
      diferenca.style.marginTop = '-4px';
      conf.appendChild(diferenca);

      var ajustar = botao('btn btn-fantasma', 'Acertar o saldo inicial', function () {
        var alvo = digitosParaCentavos(campoBanco.value);
        var falta = alvo - saldo;
        if (!falta) { avisar('Já está batendo.'); return; }
        perguntar({
          titulo: 'Acertar o saldo inicial?',
          texto: 'Para o app fechar em ' + emReais(alvo) + ', o saldo inicial de "' + conta.nome +
                 '" passa de ' + emReais(conta.saldoInicial) + ' para ' + emReais(conta.saldoInicial + falta) +
                 '.\n\nIsso serve quando o extrato que você importou não pega desde o começo da conta. ' +
                 'Se o que está errado são os lançamentos, é melhor tirar a importação lá embaixo.',
          ok: 'Acertar'
        }, function () {
          conta.saldoInicial += falta;
          salvar();
          fecharFolha();
          setTimeout(function () { abrirFolhaConferencia(id); }, 240);
        });
      });
      ajustar.style.marginTop = '10px';
      conf.appendChild(ajustar);
      forma.appendChild(conf);

      function medirDiferenca() {
        var alvo = digitosParaCentavos(campoBanco.value);
        var falta = alvo - saldo;
        if (!falta) {
          diferenca.textContent = 'Está batendo com o banco.';
          diferenca.className = 'linha-nota verde';
          ajustar.disabled = true;
          return;
        }
        diferenca.textContent = 'Faltam ' + emReais(Math.abs(falta)) +
          (falta > 0 ? ' para o app chegar no saldo do banco.' : ' a mais no app do que no banco.');
        diferenca.className = 'linha-nota vermelho';
        ajustar.disabled = false;
      }
      campoBanco.addEventListener('input', medirDiferenca);
      campoBanco.addEventListener('change', medirDiferenca);
      medirDiferenca();

      // ---- o que tem dentro ----
      var num = cartao();
      num.appendChild(no('div', 'rotulo', 'O que está lançado'));
      var grade = no('div', 'grade-conf');
      [['Lançamentos', String(r.quantos)],
       ['Entradas', r.entradas + ' · ' + emReais(r.entrou)],
       ['Saídas', r.saidas + ' · ' + emReais(r.saiu)],
       ['Transferências', String(r.transferencias)],
       ['Primeiro', r.primeira ? dataBr(r.primeira) : '—'],
       ['Último', r.ultima ? dataBr(r.ultima) : '—']].forEach(function (par) {
        var b = no('div', 'conf-item');
        b.appendChild(no('div', 'conf-rotulo', par[0]));
        b.appendChild(no('div', 'conf-valor', par[1]));
        grade.appendChild(b);
      });
      num.appendChild(grade);
      if (r.futuros) {
        num.appendChild(no('div', 'linha-nota vermelho',
          r.futuros + ' lançamento(s) com data no futuro. Isso costuma ser ano lido errado no extrato.'));
      }
      forma.appendChild(num);

      // ---- mês a mês ----
      var meses = saldoPorMes(id);
      if (meses.length) {
        var mm = cartao();
        mm.appendChild(no('div', 'rotulo', 'Mês a mês'));
        mm.appendChild(no('div', 'linha-nota',
          'O saldo de cada linha é como a conta fechou naquele mês. Compare com o extrato ' +
          'do banco para achar onde as contas se separam.'));
        // Conta de anos inteiros não cabe numa tela só, e cortar os mais
        // antigos esconde justo onde a diferença costuma começar.
        var caixaMeses = no('div');
        mm.appendChild(caixaMeses);
        var pagMes = 0;
        var POR_PAGINA_MES = 12;

        function desenharMeses() {
          var paginas = Math.max(1, Math.ceil(meses.length / POR_PAGINA_MES));
          pagMes = Math.min(Math.max(pagMes, 0), paginas - 1);
          var de = pagMes * POR_PAGINA_MES;
          var ate = Math.min(de + POR_PAGINA_MES, meses.length);
          caixaMeses.textContent = '';

          function barra() {
            var b = no('div', 'paginas');
            var antes = botao('btn-mini', '‹ Anteriores', function () { pagMes--; desenharMeses(); });
            antes.disabled = pagMes === 0;
            var depois = botao('btn-mini', 'Próximos ›', function () { pagMes++; desenharMeses(); });
            depois.disabled = pagMes >= paginas - 1;
            juntar(b, antes,
              no('span', 'paginas-conta', (de + 1) + '–' + ate + ' de ' + meses.length + ' meses'),
              depois);
            return b;
          }

          if (paginas > 1) caixaMeses.appendChild(barra());
          var tab = no('div', 'tabela-conf');
          var cab = no('div', 'conf-linha conf-cab');
          ['Mês', 'Entrou', 'Saiu', 'Saldo'].forEach(function (t) { cab.appendChild(no('span', null, t)); });
          tab.appendChild(cab);
          meses.slice(de, ate).forEach(function (m) {
            var l = no('div', 'conf-linha');
            l.appendChild(no('span', null, nomeDoMesChave(m.mes)));
            l.appendChild(no('span', 'verde', emReais(m.entrou)));
            l.appendChild(no('span', 'vermelho', emReais(m.saiu)));
            l.appendChild(no('span', 'num' + (m.saldo < 0 ? ' vermelho' : ''), emReais(m.saldo)));
            tab.appendChild(l);
          });
          caixaMeses.appendChild(tab);
          if (paginas > 1) caixaMeses.appendChild(barra());
        }
        desenharMeses();
        forma.appendChild(mm);
      }

      // ---- possíveis repetidos ----
      var grupos = repetidosDaConta(id);
      if (grupos.length) {
        var rep = cartao();
        rep.appendChild(no('div', 'rotulo', 'Possíveis repetidos'));
        rep.appendChild(no('div', 'linha-nota',
          grupos.length + ' grupo(s) com data, valor e descrição iguais. Pode ser importação ' +
          'repetida — ou pode ser real, como duas compras iguais no mesmo dia. Toque para abrir ' +
          'o grupo e ver uma por uma.'));

        var caixaRep = no('div');
        rep.appendChild(caixaRep);
        var pagRep = 0;
        var POR_PAGINA_REP = 10;
        var abertos = {};

        function desenharRepetidos() {
          var paginas = Math.max(1, Math.ceil(grupos.length / POR_PAGINA_REP));
          pagRep = Math.min(Math.max(pagRep, 0), paginas - 1);
          var de = pagRep * POR_PAGINA_REP;
          var ate = Math.min(de + POR_PAGINA_REP, grupos.length);
          caixaRep.textContent = '';

          function barra() {
            var b = no('div', 'paginas');
            var antes = botao('btn-mini', '‹ Anteriores', function () { pagRep--; desenharRepetidos(); });
            antes.disabled = pagRep === 0;
            var depois = botao('btn-mini', 'Próximos ›', function () { pagRep++; desenharRepetidos(); });
            depois.disabled = pagRep >= paginas - 1;
            juntar(b, antes,
              no('span', 'paginas-conta', (de + 1) + '–' + ate + ' de ' + grupos.length + ' grupos'),
              depois);
            return b;
          }

          if (paginas > 1) caixaRep.appendChild(barra());

          grupos.slice(de, ate).forEach(function (g, i) {
            var chave = de + i;
            var aberto = !!abertos[chave];
            // O grupo abre em vez de pular direto para um lançamento: com
            // duas iguais, ninguém sabe qual delas abriu.
            var l = botao('linha', null, function () {
              abertos[chave] = !aberto;
              desenharRepetidos();
            });
            juntar(l,
              selo('#F87171', String(g.length)),
              juntar(no('div', 'linha-texto'),
                no('div', 'linha-titulo', g[0].descricao || g[0].categoria),
                no('div', 'linha-sub', dataBr(g[0].data) + ' · ' + g.length + ' vezes')),
              juntar(no('div', 'linha-fim'),
                no('div', 'linha-valor num', emReais(g[0].valor)),
                no('div', 'linha-sub', aberto ? 'fechar ▴' : 'ver ▾')));
            caixaRep.appendChild(l);

            if (!aberto) return;
            var dentro = no('div', 'grupo-aberto');
            g.forEach(function (l2, k) {
              // Duas iguais ficariam com a mesma cara. O que separa uma da
              // outra é de onde ela veio: qual arquivo, ou quando entrou.
              var deOnde = '';
              (estado.importacoes || []).forEach(function (imp) {
                if (imp.id === l2.importacaoId) deOnde = imp.arquivo || imp.banco || 'extrato importado';
              });
              if (!deOnde) deOnde = l2.importacaoId ? 'extrato importado' : 'lançado à mão';
              var b = botao('linha', null, function () { abrirFolhaLancamento(l2.id); });
              juntar(b,
                selo('#8A7A55', String(k + 1)),
                juntar(no('div', 'linha-texto'),
                  no('div', 'linha-titulo', l2.descricao || l2.categoria),
                  no('div', 'linha-sub', l2.categoria + ' · ' + deOnde),
                  no('div', 'linha-nota', 'entrou em ' + quandoEntrou(l2.criadoEm))),
                no('div', 'linha-valor num', emReais(l2.valor)));
              dentro.appendChild(b);
            });
            caixaRep.appendChild(dentro);
          });

          if (paginas > 1) caixaRep.appendChild(barra());
        }
        desenharRepetidos();
        forma.appendChild(rep);
      }

      // ---- importações desta conta ----
      var minhas = (estado.importacoes || []).filter(function (i) { return i.contaId === id; })
        .sort(function (a, b) { return b.quando - a.quando; });
      var imp = cartao();
      imp.appendChild(no('div', 'rotulo', 'Extratos importados'));
      if (!minhas.length) {
        imp.appendChild(no('div', 'linha-nota',
          'Nenhuma importação registrada nesta conta. Extratos importados antes desta versão ' +
          'não aparecem aqui, mas os lançamentos deles continuam na lista.'));
      } else {
        imp.appendChild(no('div', 'linha-nota',
          'Se uma leitura saiu errada, dá para tirar a leva inteira sem mexer no resto.'));
        minhas.forEach(function (i) {
          var linha = no('div', 'linha');
          var sub = i.quantos + ' lançamento(s)' +
            (i.de ? ' · ' + dataBr(i.de) + ' a ' + dataBr(i.ate) : '');
          juntar(linha,
            juntar(no('div', 'linha-texto'),
              no('div', 'linha-titulo', i.arquivo || i.banco || 'Extrato'),
              no('div', 'linha-sub', sub)),
            botao('btn-mini', 'Tirar', function () {
              desfazerImportacao(i.id, function () {
                fecharFolha();
                setTimeout(function () { abrirFolhaConferencia(id); }, 240);
              });
            }));
          imp.appendChild(linha);
          if (i.saldoExtrato != null) {
            imp.appendChild(no('div', 'linha-nota',
              'O extrato terminava com saldo de ' + emReais(i.saldoExtrato) + '.'));
          }
        });
      }
      forma.appendChild(imp);

      // ---- recomeçar do zero ----
      // Extrato importado errado antes de existir o registro de importações
      // só sai assim. É perigoso, então fica no fim e pergunta duas vezes.
      if (r.quantos) {
        var zerar = cartao();
        zerar.appendChild(no('div', 'rotulo', 'Recomeçar esta conta'));
        zerar.appendChild(no('div', 'linha-nota',
          'Apaga os ' + r.quantos + ' lançamento(s) desta conta e devolve o saldo inicial a zero. ' +
          'Serve quando um extrato entrou todo errado e você quer importar de novo do começo. ' +
          'As outras contas não são tocadas.'));
        var bZerar = botao('btn btn-vermelho', 'Apagar tudo desta conta', function () {
          perguntar({
            titulo: 'Apagar tudo desta conta?',
            texto: 'Vão embora ' + r.quantos + ' lançamento(s) de "' + conta.nome + '", ' +
                   'incluindo transferências que envolvam ela. Isso não tem volta — se quiser ' +
                   'guardar antes, faça um backup em Mais.',
            ok: 'Apagar tudo', tom: 'perigo'
          }, function () {
            var idos = 0;
            estado.lancamentos = estado.lancamentos.filter(function (l) {
              if (l.contaId !== id && l.contaDestinoId !== id) return true;
              marcarExcluido('lancamentos', l.id);
              idos++;
              return false;
            });
            estado.importacoes = (estado.importacoes || []).filter(function (i) { return i.contaId !== id; });
            conta.saldoInicial = 0;
            salvar();
            avisar(idos + ' lançamento(s) apagados.');
            fecharFolha();
            setTimeout(function () { abrirFolhaConferencia(id); }, 240);
          });
        });
        bZerar.style.marginTop = '10px';
        zerar.appendChild(bZerar);
        forma.appendChild(zerar);
      }

      folha.appendChild(forma);
    });
  }

  // Ver de onde saiu uma fatia da rosca.
  //
  // Os lançamentos saem da mesma lista que gerou os números do cartão, não
  // dos lançamentos crus do período: em despesas a fatura paga fica de fora,
  // porque as compras do cartão já estão contadas. Listar o cru aqui daria
  // uma soma diferente da que está escrita na fatia, e aí a tela discutiria
  // consigo mesma.
  //
  // "Demais" não é categoria: é o resto que não coube na rosca. Por isso
  // `nomes` é uma lista — uma categoria só, ou todas as do resto.
  function abrirFolhaCategoria(faixa, tipo, nomes, rotulo) {
    var lado = tipo === 'entrada' ? 'entrada' : 'saida';
    var dados = porCategoriaDaLista(lancamentosNaFaixa(faixa), lado);
    var quer = {};
    nomes.forEach(function (n) { quer[n] = true; });
    var itens = dados.base.filter(function (l) {
      return l.tipo === lado && quer[l.categoria];
    }).sort(function (a, b) { return a.data < b.data ? 1 : a.data > b.data ? -1 : 0; });
    var soma = itens.reduce(function (t, l) { return t + l.valor; }, 0);

    abrirFolha(rotulo, function (folha) {
      var topo = cartao();
      topo.appendChild(no('div', 'rotulo', lado === 'entrada' ? 'Recebido' : 'Gasto'));
      topo.appendChild(no('div', 'valorao num' + (lado === 'entrada' ? ' verde' : ''), emReais(soma)));
      topo.appendChild(no('div', 'linha-nota',
        itens.length + (itens.length === 1 ? ' lançamento' : ' lançamentos') +
        ' · ' + Math.round(pct(soma, dados.total)) + '% ' +
        (lado === 'entrada' ? 'das receitas' : 'dos gastos') + ' ' + faixa.rotulo));
      if (nomes.length > 1) {
        topo.appendChild(no('div', 'linha-nota',
          'Junta ' + nomes.length + ' categorias que não couberam no gráfico: ' +
          nomes.join(', ') + '.'));
      }
      folha.appendChild(topo);

      if (!itens.length) {
        var vazio = cartao('liso');
        vazio.appendChild(estadoVazio('Nada neste período',
          'Nenhum lançamento desta categoria entre ' + dataBr(faixa.de) + ' e ' + dataBr(faixa.ate) + '.'));
        folha.appendChild(vazio);
        return;
      }

      var porDia = {};
      var ordem = [];
      itens.forEach(function (l) {
        if (!porDia[l.data]) { porDia[l.data] = []; ordem.push(l.data); }
        porDia[l.data].push(l);
      });
      ordem.forEach(function (data) {
        var doDia = porDia[data];
        var totalDia = doDia.reduce(function (t, l) { return t + l.valor; }, 0);
        var cab = no('div', 'dia-cabecalho');
        juntar(cab, no('div', 'dia-nome', nomeDoDia(data)), no('div', 'dia-total num', emReais(totalDia)));
        folha.appendChild(cab);
        var bloco = cartao('liso');
        doDia.forEach(function (l) { bloco.appendChild(linhaLancamento(l)); });
        folha.appendChild(bloco);
      });
    });
  }

  function abrirExtratoConta(id) {
    var conta = achar(estado.contas, id);
    if (!conta) return;

    abrirFolha(conta.nome, function (folha) {
      var saldo = saldoConta(id, null);

      var topo = cartao();
      topo.appendChild(no('div', 'rotulo', 'Saldo atual'));
      topo.appendChild(no('div', 'valorao num' + (saldo < 0 ? ' vermelho' : ''), emReais(saldo)));
      topo.appendChild(no('div', 'linha-nota', conta.tipo + ' · saldo inicial de ' + emReais(conta.saldoInicial)));

      var conferir = botao('btn btn-ouro', 'Conferir esta conta', function () {
        fecharFolha();
        setTimeout(function () { abrirFolhaConferencia(id); }, 240);
      });
      conferir.style.marginTop = '14px';
      topo.appendChild(conferir);

      var editar = botao('btn btn-fantasma', 'Editar esta conta', function () {
        fecharFolha();
        setTimeout(function () { abrirFolhaConta(id); }, 240);
      });
      editar.style.marginTop = '8px';
      topo.appendChild(editar);
      folha.appendChild(topo);

      var itens = lancamentosDaConta(id);
      if (!itens.length) {
        var vazio = cartao('liso');
        vazio.appendChild(estadoVazio('Nenhum movimento ainda',
          'Os lançamentos feitos nesta conta aparecem aqui, do mais recente para o mais antigo.'));
        folha.appendChild(vazio);
        return;
      }

      var porDia = {};
      var ordem = [];
      itens.forEach(function (l) {
        if (!porDia[l.data]) { porDia[l.data] = []; ordem.push(l.data); }
        porDia[l.data].push(l);
      });

      // Uma conta com anos de extrato tem milhares de linhas, e montar todas
      // de uma vez é o que fazia o toque demorar. Vão em blocos: o primeiro
      // aparece na hora e o resto só se a pessoa descer.
      var POR_VEZ = 150;
      var desenhados = 0;
      var caixaMais = no('div');

      function maisUmBloco() {
        var linhas = 0;
        while (desenhados < ordem.length && linhas < POR_VEZ) {
          var data = ordem[desenhados++];
          var doDia = porDia[data];
          var totalDia = doDia.reduce(function (soma, l) { return soma + efeitoNaConta(l, id); }, 0);

          var cab = no('div', 'dia-cabecalho');
          juntar(cab, no('div', 'dia-nome', nomeDoDia(data)), no('div', 'dia-total num', comSinal(totalDia)));
          folha.insertBefore(cab, caixaMais);

          var cartaoDia = cartao('liso');
          doDia.forEach(function (l) { cartaoDia.appendChild(linhaExtrato(l, id)); });
          folha.insertBefore(cartaoDia, caixaMais);
          linhas += doDia.length;
        }
        pintarMais();
      }

      function pintarMais() {
        caixaMais.textContent = '';
        if (desenhados >= ordem.length) return;
        var faltam = itens.length;
        for (var i = 0; i < desenhados; i++) faltam -= porDia[ordem[i]].length;
        var b = botao('btn btn-fantasma', 'Ver mais ' + faltam + ' movimento' + (faltam === 1 ? '' : 's'),
          function () { maisUmBloco(); });
        b.style.marginTop = '12px';
        caixaMais.appendChild(b);
      }

      folha.appendChild(caixaMais);
      maisUmBloco();
    });
  }

  // ---------- Análises calculadas ----------
  // =========================================================================
  // Motor de análise. Um princípio manda em tudo aqui: nada é inventado.
  // Quando não há histórico suficiente para uma afirmação, a afirmação não
  // é feita — o app diz que ainda está conhecendo o padrão da pessoa.
  // =========================================================================

  var META_ECONOMIA_PADRAO = 20;   // % da renda, quando a pessoa não escolheu

  function metaDeEconomia() {
    var m = estado.perfil && estado.perfil.metaEconomia;
    return m == null ? META_ECONOMIA_PADRAO : Math.min(Math.max(inteiro(m), 1), 90);
  }

  // Meses que têm algum lançamento, do mais antigo para o mais novo.
  function mesesComLancamento() {
    var vistos = {};
    estado.lancamentos.forEach(function (l) { if (l.data) vistos[l.data.slice(0, 7)] = true; });
    return Object.keys(vistos).sort();
  }

  // As compras lançadas dentro dos cartões, por mês.
  function comprasNoCartao(ano, mes) {
    var ids = {};
    cartoes().forEach(function (c) { ids[c.id] = c; });
    var fora = [];
    lancamentosDoMes(ano, mes).forEach(function (l) {
      if (l.tipo === 'saida' && ids[l.contaId]) fora.push(l);
    });
    return fora;
  }

  // A base de gastos de um mês, já sem contar duas vezes. É a mesma regra
  // do app inteiro (gastosPorCategoria); aqui só ganha um nome próprio
  // porque a análise fala dela o tempo todo.
  function baseDeGastos(ano, mes) {
    return gastosPorCategoria(ano, mes, 'saida');
  }

  // A composição de uma fatura: para onde o dinheiro do cartão foi.
  function composicaoDoCartao(ano, mes) {
    var mapa = {}, total = 0;
    comprasNoCartao(ano, mes).forEach(function (l) {
      mapa[l.categoria] = (mapa[l.categoria] || 0) + l.valor;
      total += l.valor;
    });
    var lista = Object.keys(mapa).map(function (n) { return { nome: n, valor: mapa[n] }; })
      .sort(function (a, b) { return b.valor - a.valor; });
    return { lista: lista, total: total };
  }

  // ---- o padrão da própria pessoa -----------------------------------------
  // Comparo você com você. Nada de "a média dos brasileiros".

  function percentil(ordenados, p) {
    if (!ordenados.length) return 0;
    var i = (ordenados.length - 1) * p;
    var baixo = Math.floor(i), alto = Math.ceil(i);
    if (baixo === alto) return ordenados[baixo];
    return ordenados[baixo] + (ordenados[alto] - ordenados[baixo]) * (i - baixo);
  }

  // Faixa habitual de uma série. Com poucos meses, a faixa é o intervalo
  // inteiro; com mais, corto as pontas para o eventual mês esquisito não
  // virar régua.
  function faixaDoPadrao(valores) {
    if (!valores.length) return null;
    var v = valores.slice().sort(function (a, b) { return a - b; });
    var meio = percentil(v, 0.5);
    var de = v.length <= 3 ? v[0] : percentil(v, 0.25);
    var ate = v.length <= 3 ? v[v.length - 1] : percentil(v, 0.75);
    return { n: v.length, mediana: Math.round(meio), de: Math.round(de), ate: Math.round(ate) };
  }

  // Os meses fechados antes do mês em análise, do mais recente para trás.
  function mesesAnteriores(ano, mes, quantos) {
    var fora = [];
    var a = ano, m = mes;
    for (var i = 0; i < quantos; i++) {
      var ant = mesAnteriorAo(a, m);
      a = ant.ano; m = ant.mes;
      fora.push({ ano: a, mes: m });
    }
    return fora;
  }

  // Histórico de gastos, no total ou de uma categoria. Só entram meses que
  // tiveram algum lançamento: mês sem registro não é mês de gasto zero.
  function historicoDeGastos(ano, mes, categoria, quantos) {
    var comDados = {};
    mesesComLancamento().forEach(function (k) { comDados[k] = true; });
    var valores = [];
    mesesAnteriores(ano, mes, quantos || 6).forEach(function (p) {
      if (!comDados[prefixoMes(p.ano, p.mes)]) return;
      var b = baseDeGastos(p.ano, p.mes);
      if (!categoria) { valores.push(b.total); return; }
      var achou = 0;
      b.lista.forEach(function (c) { if (c.nome === categoria) achou = c.valor; });
      valores.push(achou);
    });
    return valores;
  }

  // ---- despesas que se repetem --------------------------------------------

  function chaveDeRecorrencia(l) {
    var nome = nomeDeOrigem(l.descricao) || String(l.categoria || '');
    return nome + '|' + Math.round(l.valor / 100);
  }

  // Uma despesa é recorrente quando o mesmo nome e o mesmo valor aparecem em
  // meses diferentes. Isso é fato observado, não chute.
  function despesasRecorrentes() {
    var grupos = {};
    estado.lancamentos.forEach(function (l) {
      if (l.tipo !== 'saida' || !l.valor) return;
      var chave = chaveDeRecorrencia(l);
      if (!chave || chave.charAt(0) === '|') return;
      (grupos[chave] = grupos[chave] || []).push(l);
    });

    var fora = [];
    Object.keys(grupos).forEach(function (chave) {
      var itens = grupos[chave].slice().sort(function (a, b) { return a.data < b.data ? 1 : -1; });
      var meses = {};
      itens.forEach(function (l) { meses[l.data.slice(0, 7)] = true; });
      var quantos = Object.keys(meses).length;
      if (quantos < 2) return;
      fora.push({
        chave: chave,
        descricao: itens[0].descricao || itens[0].categoria,
        categoria: itens[0].categoria,
        valor: itens[0].valor,
        meses: quantos,
        ultimo: itens[0].data,
        lancamentos: itens
      });
    });
    return fora.sort(function (a, b) { return b.valor - a.valor; });
  }

  // Categorias em que faz sentido perguntar se ainda vale a pena. Aluguel,
  // imposto e financiamento não se revisa numa tarde.
  var REVISAVEIS = ['Assinaturas', 'Lazer', 'Alimentação', 'Outros', 'Casa', 'Transporte'];

  function decisaoDeRecorrente(chave) {
    return (estado.revisados && estado.revisados[chave]) || '';
  }

  // O que pode merecer uma olhada — nunca "o que você deve cancelar".
  function recorrentesRevisaveis() {
    return despesasRecorrentes().filter(function (r) {
      if (decisaoDeRecorrente(r.chave) === 'manter') return false;
      return REVISAVEIS.indexOf(r.categoria) >= 0;
    });
  }

  // ---- nota de saúde financeira -------------------------------------------
  // Cada parte só entra na conta quando existe dado para ela. Sem metas, sem
  // orçamento ou sem cartão, essas partes simplesmente não pesam — em vez de
  // virarem zero e derrubarem a nota de quem não usa aquilo.

  // Guardar é o que sobra. Sobrando zero ou menos, você guardou zero: o
  // "-16%" que aparecia não era o quanto foi guardado, era o tamanho do
  // buraco. São coisas diferentes e a tela dizia uma pela outra.
  function taxaDeGuardado(sobra, entradas) {
    if (entradas <= 0 || sobra <= 0) return 0;
    return Math.round((sobra / entradas) * 100);
  }

  function fraseDoGuardado(sobra, entradas, meta) {
    if (sobra > 0) {
      return 'Você guardou ' + taxaDeGuardado(sobra, entradas) + '% e sua meta é ' + meta + '%.';
    }
    if (sobra === 0) return 'Você guardou zero este mês. Sua meta é ' + meta + '%.';
    return 'Você guardou zero este mês: saiu ' + emReais(-sobra) +
           ' a mais do que entrou. Sua meta é ' + meta + '%.';
  }

  // O quanto sobrou nos meses fechados, para a meta não ficar presa ao
  // retrato de um mês só. Mês sem lançamento não conta como mês de sobra
  // zero: ele simplesmente não tem dado.
  function historicoDeSobra(ano, mes, quantos) {
    var comDados = {};
    mesesComLancamento().forEach(function (m) { comDados[m] = true; });
    var fora = [];
    mesesAnteriores(ano, mes, quantos).forEach(function (p) {
      if (!comDados[prefixoMes(p.ano, p.mes)]) return;
      var t = totaisDoMes(p.ano, p.mes);
      if (t.entradas <= 0) return;
      var sobra = t.entradas - baseDeGastos(p.ano, p.mes).total;
      fora.push({ ano: p.ano, mes: p.mes, sobra: sobra,
                  taxa: taxaDeGuardado(sobra, t.entradas) });
    });
    return fora;
  }

  function notaDoHistorico(ano, mes) {
    var h = historicoDeSobra(ano, mes, 3);
    if (!h.length) return null;
    return {
      rotulo: 'Últimos meses:',
      itens: h.map(function (x) {
        return {
          texto: MESES[x.mes].slice(0, 3).toLowerCase() + ' ' +
                 (x.sobra > 0 ? emReais(x.sobra) + ' (' + x.taxa + '%)'
                              : x.sobra === 0 ? emReais(0) : '−' + emReais(-x.sobra)),
          cor: x.sobra > 0 ? 'var(--verde)' : x.sobra === 0 ? 'var(--texto)' : 'var(--vermelho)'
        };
      })
    };
  }

  function partesDaSaude(ano, mes) {
    var partes = [];
    var t = totaisDoMes(ano, mes);
    var base = baseDeGastos(ano, mes);
    var meta = metaDeEconomia();

    if (t.entradas > 0) {
      var sobraMes = t.entradas - base.total;
      var guardado = taxaDeGuardado(sobraMes, t.entradas);
      partes.push({
        chave: 'sobra', peso: 30, nota: Math.max(0, Math.min(100, (guardado / meta) * 100)),
        rotulo: 'Quanto sobrou',
        detalhe: (sobraMes > 0
          ? 'guardou ' + guardado + '% da renda'
          : 'guardou 0% — saíram ' + emReais(-sobraMes) + ' a mais') +
          ' · sua meta é ' + meta + '%'
      });
    }

    var hist = historicoDeGastos(ano, mes, null, 6);
    if (hist.length >= 3) {
      var p = faixaDoPadrao(hist);
      var razao = p.mediana > 0 ? base.total / p.mediana : 1;
      partes.push({
        chave: 'padrao', peso: 25, nota: Math.max(0, Math.min(100, 100 - (razao - 1) * 200)),
        rotulo: 'Gastos x seu padrão',
        detalhe: emReais(base.total) + ' contra ' + emReais(p.mediana) + ' de costume'
      });
    }

    if (estado.orcamentos.geral > 0) {
      var usoOrc = base.total / estado.orcamentos.geral;
      partes.push({
        chave: 'orcamento', peso: 15, nota: Math.max(0, Math.min(100, (1.5 - usoOrc) * 200)),
        rotulo: 'Orçamento do mês',
        detalhe: Math.round(usoOrc * 100) + '% do que você planejou'
      });
    }

    var noCartao = composicaoDoCartao(ano, mes).total;
    if (cartoes().length && t.entradas > 0 && noCartao > 0) {
      // Quanto da renda passou pelo cartão neste mês. Metade da renda já é
      // um sinal; a nota cai conforme esse peso sobe.
      var peso = noCartao / t.entradas;
      partes.push({
        chave: 'cartao', peso: 15, nota: Math.max(0, Math.min(100, 100 - (peso / 0.5) * 100)),
        rotulo: 'Peso do cartão',
        detalhe: emReais(noCartao) + ' · ' + Math.round(peso * 100) + '% da sua renda'
      });
    }

    if (estado.metas.length) {
      var soma = 0;
      estado.metas.forEach(function (m) { soma += Math.min(100, pct(m.guardado, m.alvo)); });
      partes.push({
        chave: 'metas', peso: 10, nota: soma / estado.metas.length,
        rotulo: 'Suas metas',
        detalhe: estado.metas.length + ' meta(s) em andamento'
      });
    }

    // Investir só entra para quem investe: para quem não tem ativo nenhum,
    // isso não é um defeito, é uma etapa que ainda não começou.
    var aporte = 0;
    lancamentosDoMes(ano, mes).forEach(function (l) {
      if (l.tipo === 'saida' && ehAporte(l)) aporte += l.valor;
    });
    if (estado.ativos.length || aporte > 0) {
      var pctAporte = t.entradas > 0 ? (aporte / t.entradas) * 100 : 0;
      partes.push({
        chave: 'investir', peso: 10, nota: Math.max(0, Math.min(100, (pctAporte / 10) * 100)),
        rotulo: 'Quanto foi investido',
        detalhe: aporte > 0 ? emReais(aporte) + ' no mês' : 'nada aportado neste mês'
      });
    }

    return partes;
  }

  function fimDoMes(ano, mes) {
    return textoDeData(ano, mes, new Date(ano, mes + 1, 0).getDate());
  }

  function notaDaSaude(ano, mes) {
    var partes = partesDaSaude(ano, mes);
    var mesesTotais = mesesComLancamento().length;
    // Duas partes e dois meses: abaixo disso qualquer nota seria chute.
    if (partes.length < 2 || mesesTotais < 2) {
      return { pronta: false, partes: partes, meses: mesesTotais };
    }
    var pesos = 0, soma = 0;
    partes.forEach(function (p) { pesos += p.peso; soma += p.nota * p.peso; });
    var valor = Math.round(soma / pesos);
    return {
      pronta: true, valor: valor, partes: partes, meses: mesesTotais,
      faixa: valor >= 80 ? 'Excelente' : valor >= 65 ? 'Boa' : valor >= 45 ? 'Atenção' : 'Frágil',
      cor: valor >= 80 ? 'var(--verde)' : valor >= 65 ? 'var(--verde)'
         : valor >= 45 ? 'var(--ouro)' : 'var(--vermelho)'
    };
  }

  function notaAnterior(ano, mes) {
    var ant = mesAnteriorAo(ano, mes);
    if (mesesComLancamento().indexOf(prefixoMes(ant.ano, ant.mes)) < 0) return null;
    var n = notaDaSaude(ant.ano, ant.mes);
    return n.pronta ? n.valor : null;
  }

  // ---- os achados do mês --------------------------------------------------
  // Cada achado carrega: o que é, por que aconteceu e o que dá para fazer.
  // Prioridade 1 pede atenção agora; 3 é curiosidade e fica na análise
  // completa, longe da tela principal.

  // Quando o histórico é sempre o mesmo valor, "entre X e X" não é faixa.
  function comoVoceCostuma(p) {
    if (p.de === p.ate) return 'Você costuma gastar ' + emReais(p.mediana);
    return 'Você costuma ficar entre ' + emReais(p.de) + ' e ' + emReais(p.ate);
  }

  function analiseDoMes(ano, mes) {
    var achados = [];
    var t = totaisDoMes(ano, mes);
    var base = baseDeGastos(ano, mes);
    var ant = mesAnteriorAo(ano, mes);
    var temAnterior = mesesComLancamento().indexOf(prefixoMes(ant.ano, ant.mes)) >= 0;
    var baseAnt = temAnterior ? baseDeGastos(ant.ano, ant.mes) : null;
    var meta = metaDeEconomia();
    var hoje = hojeTexto();
    var noMesAtual = prefixoMes(ano, mes) === hoje.slice(0, 7);

    function juntarAchado(a) { achados.push(a); }

    // 1) Saldo negativo — nada é mais urgente que sair mais do que entrou.
    if (t.entradas > 0 && t.entradas - base.total < 0) {
      juntarAchado({
        id: 'saldo', prioridade: 1, icone: '⚠', tom: 'ruim',
        titulo: 'Saiu mais do que entrou',
        valor: comSinal(t.entradas - base.total), valorCor: 'var(--vermelho)',
        explicacao: 'Entraram ' + emReais(t.entradas) + ' e saíram ' + emReais(base.total) + '.',
        detalhes: base.lista.slice(0, 3).map(function (c) {
          return { rotulo: c.nome, valor: emReais(c.valor) };
        }),
        acao: { rotulo: 'Ver as saídas', abrir: function () { irParaTransacoes('saida', ''); } }
      });
    }

    // 2) Categorias fora do próprio padrão. Preciso de pelo menos três meses
    //    fechados para dizer que existe um padrão.
    var foraDoPadrao = [];
    base.lista.forEach(function (c) {
      var hist = historicoDeGastos(ano, mes, c.nome, 6).filter(function (v) { return v > 0; });
      if (hist.length < 3) return;
      var p = faixaDoPadrao(hist);
      if (!p.ate || c.valor <= p.ate) return;
      var acima = c.valor - p.mediana;
      var pctAcima = p.mediana > 0 ? (acima / p.mediana) * 100 : 0;
      if (pctAcima < 25 || acima < 5000) return;
      foraDoPadrao.push({ nome: c.nome, valor: c.valor, padrao: p, acima: acima, pct: pctAcima });
    });
    foraDoPadrao.sort(function (a, b) { return b.acima - a.acima; });

    foraDoPadrao.slice(0, 2).forEach(function (f, i) {
      juntarAchado({
        id: 'padrao-' + f.nome, prioridade: i === 0 ? 1 : 2, icone: '🔎', tom: 'atencao',
        titulo: f.nome + ' acima do seu padrão',
        valor: '+' + emReais(f.acima), valorCor: 'var(--vermelho)',
        explicacao: 'Este mês: ' + emReais(f.valor) + '. ' + comoVoceCostuma(f.padrao) + '.',
        detalhes: [
          { rotulo: 'Este mês', valor: emReais(f.valor) },
          { rotulo: 'Seu padrão', valor: f.padrao.de === f.padrao.ate ? emReais(f.padrao.mediana)
              : emReais(f.padrao.de) + ' – ' + emReais(f.padrao.ate) },
          { rotulo: 'Diferença', valor: '+' + f.pct.toFixed(0) + '%' }
        ],
        acao: { rotulo: 'Ver lançamentos', abrir: function () { irParaTransacoes('saida', f.nome); } }
      });
    });

    // 3) A fatura do cartão: o que ela tem dentro, e o que mudou nela.
    var fatura = composicaoDoCartao(ano, mes);
    if (fatura.total > 0) {
      var faturaAnt = temAnterior ? composicaoDoCartao(ant.ano, ant.mes) : null;
      var subiu = faturaAnt ? fatura.total - faturaAnt.total : 0;
      var mudancas = [];
      if (faturaAnt) {
        var mapaAnt = {};
        faturaAnt.lista.forEach(function (c) { mapaAnt[c.nome] = c.valor; });
        fatura.lista.forEach(function (c) {
          var dif = c.valor - (mapaAnt[c.nome] || 0);
          if (dif > 0) mudancas.push({ nome: c.nome, dif: dif });
        });
        mudancas.sort(function (a, b) { return b.dif - a.dif; });
      }

      if (faturaAnt && subiu > 20000 && faturaAnt.total > 0 &&
          (subiu / faturaAnt.total) * 100 >= 25) {
        // Se o aumento da fatura é o mesmo aumento que já apontei numa
        // categoria, não são duas notícias: é uma, com duas leituras.
        var mesmaHistoria = mudancas.length && foraDoPadrao.length &&
          mudancas[0].nome === foraDoPadrao[0].nome &&
          Math.abs(mudancas[0].dif - foraDoPadrao[0].acima) <= foraDoPadrao[0].acima * 0.3;
        if (mesmaHistoria) {
          var jaTem = achados.filter(function (x) { return x.id === 'padrao-' + mudancas[0].nome; })[0];
          if (jaTem) {
            // Um número manda no cartão: a diferença para o próprio padrão.
            // O cartão entra como origem, não como um segundo valor.
            jaTem.explicacao += ' A diferença veio pela fatura do cartão.';
            jaTem.acao = { rotulo: 'Analisar a fatura',
                           abrir: function () { abrirComposicaoDaFatura(ano, mes); } };
          }
        } else {
          juntarAchado({
            id: 'fatura-subiu', prioridade: 1, icone: '💳', tom: 'atencao',
            titulo: 'Sua fatura aumentou',
            valor: '+' + emReais(subiu), valorCor: 'var(--vermelho)',
            explicacao: 'De ' + emReais(faturaAnt.total) + ' para ' + emReais(fatura.total) +
              ' em relação ao mês anterior.',
            rotuloDetalhes: 'O que mudou',
            detalhes: mudancas.slice(0, 3).map(function (m) {
              return { rotulo: m.nome, valor: '+' + emReais(m.dif) };
            }),
            acao: { rotulo: 'Entender esse aumento',
                    abrir: function () { abrirComposicaoDaFatura(ano, mes); } }
          });
        }
      } else if (fatura.total >= base.total * 0.35 && base.total > 0) {
        juntarAchado({
          id: 'fatura-peso', prioridade: 2, icone: '💳', tom: 'info',
          titulo: 'Seu maior impacto é o cartão',
          valor: emReais(fatura.total), valorCor: 'var(--ouro)',
          explicacao: Math.round(pct(fatura.total, base.total)) + '% das suas saídas passaram pelo cartão.',
          rotuloDetalhes: 'Onde foi',
          detalhes: fatura.lista.slice(0, 3).map(function (c) {
            return { rotulo: c.nome, valor: emReais(c.valor) };
          }),
          acao: { rotulo: 'Analisar a fatura',
                  abrir: function () { abrirComposicaoDaFatura(ano, mes); } }
        });
      }
    }

    // 4) A meta de economia, com o quanto falta em reais.
    if (t.entradas > 0) {
      var sobra = t.entradas - base.total;
      var alvo = Math.round(t.entradas * meta / 100);
      var falta = alvo - sobra;
      if (falta > 0) {
        juntarAchado({
          id: 'meta-economia', prioridade: sobra <= 0 ? 1 : 2, icone: '🎯', tom: 'atencao',
          titulo: 'Sua meta de economia',
          valor: emReais(falta) + ' abaixo', valorCor: 'var(--ouro)',
          explicacao: fraseDoGuardado(sobra, t.entradas, meta),
          progresso: { feito: Math.max(sobra, 0), alvo: alvo },
          nota: notaDoHistorico(ano, mes),
          acao: { rotulo: 'Encontrar onde economizar',
                  abrir: function () { abrirOndeEconomizar(ano, mes); } }
        });
      } else {
        juntarAchado({
          id: 'meta-batida', prioridade: 3, icone: '🎉', tom: 'bom',
          titulo: 'Meta de economia batida',
          valor: taxaDeGuardado(sobra, t.entradas) + '% guardados', valorCor: 'var(--verde)',
          explicacao: 'Acima da sua meta de ' + meta + '%. Sobraram ' + emReais(sobra) + '.',
          progresso: { feito: sobra, alvo: alvo },
          nota: notaDoHistorico(ano, mes),
          acao: null
        });
      }
    }

    // 5) Orçamento estourado.
    if (estado.orcamentos.geral > 0 && base.total > estado.orcamentos.geral) {
      juntarAchado({
        id: 'orcamento', prioridade: 1, icone: '📊', tom: 'ruim',
        titulo: 'Orçamento do mês estourado',
        valor: '+' + emReais(base.total - estado.orcamentos.geral), valorCor: 'var(--vermelho)',
        explicacao: 'Você planejou ' + emReais(estado.orcamentos.geral) + ' e gastou ' +
          emReais(base.total) + '.',
        acao: { rotulo: 'Ver as saídas', abrir: function () { irParaTransacoes('saida', ''); } }
      });
    }

    // 6) Despesas que se repetem — o total comprometido não é economia.
    var recorrentes = despesasRecorrentes();
    if (recorrentes.length) {
      var comprometido = recorrentes.reduce(function (s, r) { return s + r.valor; }, 0);
      var revisaveis = recorrentesRevisaveis();
      var potencial = revisaveis.reduce(function (s, r) { return s + r.valor; }, 0);
      juntarAchado({
        id: 'recorrentes', prioridade: revisaveis.length ? 2 : 3, icone: '🔁', tom: 'info',
        titulo: recorrentes.length + ' despesas que se repetem',
        valor: emReais(comprometido) + '/mês', valorCor: 'var(--texto)',
        explicacao: revisaveis.length
          ? revisaveis.length + ' delas podem valer uma revisão, somando ' + emReais(potencial) + '/mês.'
          : 'Nenhuma delas é do tipo que costuma valer revisão.',
        acao: revisaveis.length
          ? { rotulo: 'Revisar despesas', abrir: function () { abrirRevisarRecorrentes(); } }
          : null
      });
    }

    // 7) Projeção do fim do mês. Só no mês corrente, e só depois que já
    //    passou um pedaço dele: com três dias de dados, projetar é adivinhar.
    if (noMesAtual) {
      var dia = +hoje.slice(8, 10);
      var noMes = new Date(ano, mes + 1, 0).getDate();
      var histTotal = historicoDeGastos(ano, mes, null, 6);
      if (dia >= 8 && histTotal.length >= 3) {
        var projetado = Math.round(base.total / dia * noMes);
        var pad = faixaDoPadrao(histTotal);
        var difProj = projetado - pad.mediana;
        juntarAchado({
          id: 'projecao', prioridade: Math.abs(difProj) > pad.mediana * 0.2 ? 2 : 3,
          icone: '📈', tom: difProj > 0 ? 'atencao' : 'bom',
          titulo: 'Estimativa para o fim do mês',
          valor: '≈ ' + emReais(projetado), valorCor: difProj > 0 ? 'var(--ouro)' : 'var(--verde)',
          explicacao: 'Você já gastou ' + emReais(base.total) + ' em ' + dia + ' dias. ' +
            'Mantendo o ritmo, fecharia perto disso — é estimativa, não certeza.',
          detalhes: [
            { rotulo: 'Seu padrão', valor: emReais(pad.mediana) },
            { rotulo: 'Diferença estimada', valor: comSinal(difProj) }
          ],
          acao: { rotulo: 'Ver as saídas', abrir: function () { irParaTransacoes('saida', ''); } }
        });
      }
    }

    // 8) O que melhorou. Fecha a conversa com o que deu certo.
    if (baseAnt) {
      var mapaA = {};
      baseAnt.lista.forEach(function (c) { mapaA[c.nome] = c.valor; });
      var quedas = [];
      base.lista.forEach(function (c) {
        var antes = mapaA[c.nome];
        if (!antes) return;
        var dif = antes - c.valor;
        if (dif > 5000 && (dif / antes) * 100 >= 15) quedas.push({ nome: c.nome, dif: dif, antes: antes });
      });
      quedas.sort(function (a, b) { return b.dif - a.dif; });
      if (quedas.length) {
        juntarAchado({
          id: 'queda', prioridade: 3, icone: '↓', tom: 'bom',
          titulo: quedas[0].nome + ' caiu',
          valor: '−' + emReais(quedas[0].dif), valorCor: 'var(--verde)',
          explicacao: 'De ' + emReais(quedas[0].antes) + ' para ' +
            emReais(quedas[0].antes - quedas[0].dif) + ' em relação ao mês anterior.',
          acao: { rotulo: 'Ver lançamentos',
                  abrir: function () { irParaTransacoes('saida', quedas[0].nome); } }
        });
      }
    }

    achados.sort(function (a, b) { return a.prioridade - b.prioridade; });

    return {
      totais: t, base: base, temAnterior: temAnterior,
      achados: achados,
      principais: achados.filter(function (a) { return a.prioridade <= 2; }).slice(0, 3),
      proxima: achados.filter(function (a) { return a.acao && a.prioridade <= 2; })[0] || null,
      meses: mesesComLancamento().length
    };
  }

  // =========================================================================
  // A tela de análise. Uma pergunta manda em cada elemento: isso ajuda a
  // decidir alguma coisa? Se não ajuda, sai da frente e vai para a análise
  // completa.
  // =========================================================================

  function irParaTransacoes(filtro, categoria) {
    periodo.tipo = 'escolhido';
    periodo.de = textoDeData(mesAtivo.ano, mesAtivo.mes, 1);
    periodo.ate = fimDoMes(mesAtivo.ano, mesAtivo.mes);
    filtroTransacoes = filtro || 'todas';
    buscaTransacoes = categoria || '';
    fecharFolha();
    setTimeout(function () { irPara('transacoes'); }, 160);
  }

  function anelDaNota(nota, tamanho) {
    var r = tamanho / 2 - 6;
    var volta = 2 * Math.PI * r;
    var svg = svgNo('svg', { viewBox: '0 0 ' + tamanho + ' ' + tamanho,
                             width: tamanho, height: tamanho, 'class': 'anel-nota' });
    svg.setAttribute('aria-hidden', 'true');
    svg.appendChild(svgNo('circle', {
      cx: tamanho / 2, cy: tamanho / 2, r: r, fill: 'none',
      stroke: 'var(--borda)', 'stroke-width': 5
    }));
    var arco = svgNo('circle', {
      cx: tamanho / 2, cy: tamanho / 2, r: r, fill: 'none',
      stroke: nota.cor, 'stroke-width': 5, 'stroke-linecap': 'round',
      transform: 'rotate(-90 ' + tamanho / 2 + ' ' + tamanho / 2 + ')'
    });
    arco.style.strokeDasharray = volta;
    arco.style.strokeDashoffset = volta;
    arco.style.transition = 'stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)';
    svg.appendChild(arco);
    setTimeout(function () {
      arco.style.strokeDashoffset = volta * (1 - Math.min(nota.valor, 100) / 100);
    }, 60);
    return svg;
  }

      c.appendChild(no('div', 'rotulo', 'Saúde financeira'));

    var linha = no('div', 'saude-linha');
    var esq = no('div', 'saude-anel');
    esq.appendChild(anelDaNota(nota, 84));

    meio.appendChild(no('span', 'saude-valor', String(nota.valor)));
    meio.appendChild(no('span', 'saude-de', '/100'));

    var antes = notaAnterior(ano, mes);

  // Um achado na tela: título curto, número, uma explicação e um caminho.
  function cartaoDeAchado(a, indice) {
    var c = cartao('achado tom-' + a.tom);
    c.style.animationDelay = (indice * 60) + 'ms';

    var topo = no('div', 'achado-topo');
    topo.appendChild(no('span', 'achado-icone', a.icone));
    topo.appendChild(no('span', 'achado-titulo', a.titulo));
    c.appendChild(topo);

    if (a.valor) {
      var v = no('div', 'achado-valor', a.valor);
      if (a.valorCor) v.style.color = a.valorCor;
      c.appendChild(v);
    }
    c.appendChild(no('p', 'achado-texto', a.explicacao));

    if (a.progresso) {
      var barra = no('div', 'meta-barra');
      var dentro = no('div', 'meta-cheio');
      dentro.style.width = Math.min(100, pct(a.progresso.feito, a.progresso.alvo)) + '%';
      barra.appendChild(dentro);
      c.appendChild(barra);
      var leg = no('div', 'meta-legenda');
      leg.appendChild(no('span', null, emReais(a.progresso.feito) + ' guardados'));
      leg.appendChild(no('span', null, 'meta ' + emReais(a.progresso.alvo)));
      c.appendChild(leg);
    }

    if (a.nota) {
      var nt = no('div', 'achado-nota');
      nt.appendChild(no('span', null, a.nota.rotulo + ' '));
      a.nota.itens.forEach(function (x, i) {
        if (i) nt.appendChild(no('span', null, '  ·  '));
        var e = no('span', null, x.texto);
        e.style.color = x.cor;
        nt.appendChild(e);
      });
      c.appendChild(nt);
    }

    if (a.detalhes && a.detalhes.length) {
      var d = no('div', 'achado-detalhes');
      if (a.rotuloDetalhes) d.appendChild(no('div', 'rotulo', a.rotuloDetalhes));
      a.detalhes.forEach(function (x) {
        var l = no('div', 'achado-linha');
        l.appendChild(no('span', null, x.rotulo));
        l.appendChild(no('span', 'num', x.valor));
        d.appendChild(l);
      });
      c.appendChild(d);
    }

    if (a.acao) {
      var b = botao('btn-acao', a.acao.rotulo + ' ›', a.acao.abrir);
      c.appendChild(b);
    }
    return c;
  }

  // Onde dá para melhorar: categorias acima do próprio padrão. O número é a
  // diferença para o costume, e é chamado de potencial — não de promessa.
  function abrirOndeEconomizar(ano, mes) {
    var base = baseDeGastos(ano, mes);
    var achados = [];
    base.lista.forEach(function (c) {
      var hist = historicoDeGastos(ano, mes, c.nome, 6).filter(function (v) { return v > 0; });
      if (hist.length < 3) return;
      var p = faixaDoPadrao(hist);
      var acima = c.valor - p.mediana;
      if (acima < 3000) return;
      achados.push({ nome: c.nome, valor: c.valor, padrao: p, potencial: acima });
    });
    achados.sort(function (a, b) { return b.potencial - a.potencial; });

    abrirFolha('Onde você pode melhorar', function (folha) {
      var forma = no('div');
      if (!achados.length) {
        forma.appendChild(no('p', 'linha-sub',
          'Nenhuma categoria está acima do seu padrão neste mês — ou ainda não tenho ' +
          'três meses de histórico para comparar. Sem isso, apontar um lugar para cortar ' +
          'seria chute.'));
        folha.appendChild(forma);
        return;
      }
      var total = achados.reduce(function (s, a) { return s + a.potencial; }, 0);
      forma.appendChild(no('p', 'linha-sub',
        'Estas categorias estão acima do que você costuma gastar. O valor é a diferença ' +
        'para o seu próprio padrão: é um potencial, não uma garantia.'));

      var c = cartao();
      achados.forEach(function (a) {
        var l = botao('linha', null, function () { irParaTransacoes('saida', a.nome); });
        juntar(l,
          selo(corDeCategoria(a.nome), a.nome.charAt(0)),
          juntar(no('div', 'linha-texto'),
            no('div', 'linha-titulo', a.nome),
            no('div', 'linha-sub', emReais(a.valor) + ' · costuma ser ' + emReais(a.padrao.mediana))),
          juntar(no('div', 'linha-fim'),
            no('div', 'linha-valor num ouro', emReais(a.potencial)),
            no('div', 'linha-nota', 'potencial')));
        c.appendChild(l);
      });
      forma.appendChild(c);

      var soma = cartao();
      soma.appendChild(no('div', 'rotulo', 'Potencial identificado'));
      soma.appendChild(no('div', 'valorao num', emReais(total)));
      soma.appendChild(no('div', 'linha-nota',
        'Soma das diferenças para o seu padrão. Voltar ao costume nessas categorias ' +
        'liberaria perto disso.'));
      forma.appendChild(soma);
      folha.appendChild(forma);
    });
  }

  // Revisar as despesas que se repetem. O app nunca diz para cancelar: ele
  // mostra o que se repete e pergunta se ainda faz sentido.
  function abrirRevisarRecorrentes() {
    montar();
    function montar() {
      var todas = despesasRecorrentes();
      var comprometido = todas.reduce(function (s, r) { return s + r.valor; }, 0);
      var lista = recorrentesRevisaveis();

      abrirFolha('Despesas que se repetem', function (folha) {
        var forma = no('div');
        var topo = cartao();
        topo.appendChild(no('div', 'rotulo', 'Total comprometido'));
        topo.appendChild(no('div', 'valorao num', emReais(comprometido) + '/mês'));
        topo.appendChild(no('div', 'linha-nota',
          todas.length + ' lançamentos que se repetem. Isso é o que já está comprometido — ' +
          'não é o quanto dá para economizar.'));
        forma.appendChild(topo);

        if (!lista.length) {
          forma.appendChild(no('p', 'linha-sub',
            'Nada aqui é do tipo que costuma valer uma revisão, ou você já marcou tudo ' +
            'como "manter". Aluguel, imposto e financiamento ficam de fora de propósito.'));
          folha.appendChild(forma);
          return;
        }

        var potencial = lista.reduce(function (s, r) { return s + r.valor; }, 0);
        var c = cartao();
        c.appendChild(no('div', 'rotulo', 'Pode valer uma olhada'));
        c.appendChild(no('div', 'linha-nota',
          lista.length + ' despesa(s) somando ' + emReais(potencial) + '/mês. ' +
          'O app não sabe se você ainda usa — quem sabe é você.'));

        lista.forEach(function (r) {
          var item = no('div', 'recorrente');
          var linha = botao('linha', null, function () {
            irParaTransacoes('saida', nomeDeOrigem(r.descricao) || r.categoria);
          });
          juntar(linha,
            selo(corDeCategoria(r.categoria), r.categoria.charAt(0)),
            juntar(no('div', 'linha-texto'),
              no('div', 'linha-titulo', r.descricao),
              no('div', 'linha-sub', r.categoria + ' · em ' + r.meses + ' meses · último em ' +
                dataBr(r.ultimo))),
            no('div', 'linha-valor num', emReais(r.valor)));
          item.appendChild(linha);

          var acoes = no('div', 'recorrente-acoes');
          acoes.appendChild(botao('btn-mini', 'Continuo usando', function () {
            marcarRecorrente(r.chave, 'manter');
            fecharFolha();
            setTimeout(montar, 240);
          }));
          acoes.appendChild(botao('btn-mini', 'Ver lançamentos', function () {
            irParaTransacoes('saida', nomeDeOrigem(r.descricao) || r.categoria);
          }));
          item.appendChild(acoes);
          c.appendChild(item);
        });
        forma.appendChild(c);
        folha.appendChild(forma);
      });
    }
  }

  function marcarRecorrente(chave, decisao) {
    if (!estado.revisados) estado.revisados = {};
    estado.revisados[chave] = decisao;
    salvar();
    avisar(decisao === 'manter' ? 'Marcada como em uso.' : 'Marcada para revisar.');
  }

  // Tudo o que o motor achou, inclusive o que é pequeno demais para brigar
  // por espaço na tela principal.
  function abrirAnaliseCompleta(ano, mes) {
    var an = analiseDoMes(ano, mes);
    abrirFolha('Análise de ' + MESES[mes], function (folha) {
      var forma = no('div');
      var faixas = [[1, 'Merece atenção agora'], [2, 'Vale acompanhar'], [3, 'Pequenos sinais']];
      faixas.forEach(function (f) {
        var doNivel = an.achados.filter(function (a) { return a.prioridade === f[0]; });
        if (!doNivel.length) return;
        var r = no('div', 'rotulo', f[1]);
        r.style.margin = '18px 2px 8px';
        forma.appendChild(r);
        doNivel.forEach(function (a, i) { forma.appendChild(cartaoDeAchado(a, i)); });
      });
      if (!an.achados.length) {
        forma.appendChild(no('p', 'linha-sub',
          'Nada fora do comum neste mês. Continue registrando: quanto mais histórico, ' +
          'mais fino fica o que eu consigo apontar.'));
      }
      folha.appendChild(forma);
    });
  }

  // O bloco de análise no topo do Mais. Em cinco segundos: como estou, o que
  // pede atenção, e o que dá para fazer.
  function blocoDeAnalise() {
    var caixa = no('div');
    var ano = mesAtivo.ano, mes = mesAtivo.mes;
    var an = analiseDoMes(ano, mes);

    caixa.appendChild(cartaoDeSaude(ano, mes));

    // Sem histórico não há análise: dizer qualquer coisa aqui seria inventar.
    if (an.meses < 2 && !an.achados.length) {
      var vazio = cartao();
      vazio.appendChild(no('div', 'rotulo', 'Ainda conhecendo seu padrão'));
      vazio.appendChild(no('p', 'achado-texto',
        'Registre seus lançamentos por mais alguns meses. A partir daí eu comparo você ' +
        'com você mesmo e mostro o que mudou.'));
      caixa.appendChild(vazio);
      return caixa;
    }

    if (!an.principais.length) {
      var tudoBem = cartao('achado tom-bom');
      var topoOk = no('div', 'achado-topo');
      topoOk.appendChild(no('span', 'achado-icone', '✓'));
      topoOk.appendChild(no('span', 'achado-titulo', 'Tudo dentro do padrão'));
      tudoBem.appendChild(topoOk);
      tudoBem.appendChild(no('p', 'achado-texto',
        'Seus gastos estão perto do que costumam ser. Nada pedindo atenção neste mês.'));
      caixa.appendChild(tudoBem);
    } else {
      an.principais.forEach(function (a, i) { caixa.appendChild(cartaoDeAchado(a, i)); });
    }

    if (an.proxima) {
      var prox = cartao('proxima');
      var topoP = no('div', 'achado-topo');
      topoP.appendChild(no('span', 'achado-icone', '🚀'));
      topoP.appendChild(no('span', 'achado-titulo', 'Próxima ação'));
      prox.appendChild(topoP);
      prox.appendChild(no('p', 'achado-texto', frasePraAcao(an.proxima)));
      prox.appendChild(botao('btn btn-ouro', an.proxima.acao.rotulo, an.proxima.acao.abrir));
      caixa.appendChild(prox);
    }

    var verTudo = botao('linha linha-verTudo', null, function () { abrirAnaliseCompleta(ano, mes); });
    juntar(verTudo,
      juntar(no('div', 'linha-texto'),
        no('div', 'linha-titulo', 'Ver análise completa'),
        no('div', 'linha-sub', an.achados.length + ' observação(ões) sobre ' + MESES[mes])),
      no('div', 'linha-nota', '›'));
    caixa.appendChild(verTudo);
    return caixa;
  }

  // A próxima ação é sempre uma só, escrita como convite e não como ordem.
  function frasePraAcao(a) {
    if (a.id === 'fatura-subiu') return 'Sua fatura subiu. Veja quais compras causaram a diferença.';
    if (a.id === 'meta-economia') return 'Veja em quais categorias existe espaço para chegar mais perto da sua meta.';
    if (a.id === 'recorrentes') return 'Você tem despesas que se repetem todo mês. Vale conferir se todas ainda fazem sentido.';
    if (a.id === 'saldo') return 'Este mês saiu mais do que entrou. Olhar as maiores saídas ajuda a entender por quê.';
    if (a.id === 'orcamento') return 'O mês passou do que você tinha planejado. Vale ver onde a diferença aconteceu.';
    if (a.id === 'projecao') return 'No ritmo atual o mês fecharia acima do seu costume. Dá tempo de ajustar.';
    if (a.id.indexOf('padrao-') === 0) return a.titulo + '. Ver de onde veio a diferença ajuda a decidir o que fazer.';
    return a.explicacao;
  }

  // Calendário de verdade no lugar do input de data: o ano rola de lado em
  // cima, os meses rolam de lado embaixo, e o dia é um toque. Expõe .value
  // como o input antigo, então quem usava continua usando igual.
  var DIAS_CURTOS = ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'];

  function calendarioData(valor, rotulo, aoMudar) {
    var caixa = no('div');
    var escolhido = ehData(valor) ? valor : hojeTexto();
    var p = partes(escolhido);
    var anoVisto = p.ano, mesVisto = p.mes;

    var cabecalho = no('div', 'cal-rotulo');
    cabecalho.appendChild(no('span', 'rotulo', rotulo));
    var lido = no('span', 'num');
    cabecalho.appendChild(lido);
    caixa.appendChild(cabecalho);

    var cal = no('div', 'cal');
    caixa.appendChild(cal);

    var fitaAno = no('div', 'cal-fita');
    var textoAno = no('div', 'cal-ano');
    fitaAno.appendChild(botao('cal-seta', '‹', function () { mudarAno(-1); }));
    fitaAno.appendChild(textoAno);
    fitaAno.appendChild(botao('cal-seta', '›', function () { mudarAno(1); }));
    cal.appendChild(fitaAno);

    var fitaMes = no('div', 'cal-fita');
    var textoMes = no('div', 'cal-mes');
    fitaMes.appendChild(botao('cal-seta', '‹', function () { mudarMes(-1); }));
    fitaMes.appendChild(textoMes);
    fitaMes.appendChild(botao('cal-seta', '›', function () { mudarMes(1); }));
    cal.appendChild(fitaMes);

    var grade = no('div', 'cal-grade');
    cal.appendChild(grade);

    function mudarAno(n) { anoVisto += n; desenharCal(); }
    function mudarMes(n) {
      mesVisto += n;
      while (mesVisto > 11) { mesVisto -= 12; anoVisto++; }
      while (mesVisto < 0) { mesVisto += 12; anoVisto--; }
      desenharCal();
    }

    // Arrastar de lado: no ano muda o ano, no resto muda o mês.
    function arrastar(alvo, aoLado) {
      var x0 = null, y0 = null;
      alvo.addEventListener('touchstart', function (e) {
        x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
      }, { passive: true });
      alvo.addEventListener('touchend', function (e) {
        if (x0 == null) return;
        var t = e.changedTouches[0];
        var dx = t.clientX - x0, dy = t.clientY - y0;
        x0 = null;
        if (Math.abs(dx) > 44 && Math.abs(dx) > Math.abs(dy) * 1.5) aoLado(dx < 0 ? 1 : -1);
      }, { passive: true });
    }
    arrastar(fitaAno, mudarAno);
    arrastar(grade, mudarMes);
    arrastar(fitaMes, mudarMes);

    function desenharCal() {
      textoAno.textContent = String(anoVisto);
      textoMes.textContent = MESES[mesVisto];
      lido.textContent = dataBr(escolhido);
      grade.textContent = '';
      DIAS_CURTOS.forEach(function (d) { grade.appendChild(no('div', 'cal-cab', d)); });

      var primeiro = new Date(anoVisto, mesVisto, 1);
      var vazios = primeiro.getDay();
      var noMes = new Date(anoVisto, mesVisto + 1, 0).getDate();
      var doAnterior = new Date(anoVisto, mesVisto, 0).getDate();
      var hoje = hojeTexto();

      for (var i = 0; i < 42; i++) {
        var dia, mes = mesVisto, ano = anoVisto, fora = false;
        if (i < vazios) { dia = doAnterior - vazios + 1 + i; mes--; fora = true; }
        else if (i - vazios < noMes) { dia = i - vazios + 1; }
        else { dia = i - vazios - noMes + 1; mes++; fora = true; }
        if (mes < 0) { mes = 11; ano--; }
        if (mes > 11) { mes = 0; ano++; }
        if (i >= vazios + noMes && i >= 35) break;

        var texto = textoDeData(ano, mes, dia);
        var classes = 'cal-dia' + (fora ? ' fora' : '') +
          (texto === escolhido ? ' escolhido' : '') + (texto === hoje ? ' hoje' : '');
        grade.appendChild(botao(classes, String(dia), (function (t) {
          return function () {
            escolhido = t;
            var q = partes(t);
            anoVisto = q.ano; mesVisto = q.mes;
            desenharCal();
            if (aoMudar) aoMudar(t);
          };
        })(texto)));
      }
    }

    desenharCal();
    Object.defineProperty(caixa, 'value', {
      get: function () { return escolhido; },
      set: function (v) {
        if (!ehData(v)) return;
        escolhido = v;
        var q = partes(v);
        anoVisto = q.ano; mesVisto = q.mes;
        desenharCal();
      }
    });
    return caixa;
  }

  // Número escrito à mão, com vírgula ou ponto. Nada de type=number: no
  // celular ele engole o que a pessoa digita quando o formato não bate.
  function entradaTextoNumero(valor, dica) {
    var i = no('input', 'entrada');
    i.type = 'text';
    i.id = proximoId();
    i.inputMode = 'decimal';
    i.autocomplete = 'off';
    i.value = String(valor == null ? '' : valor).replace('.', ',');
    if (dica) i.placeholder = dica;
    i.addEventListener('input', function () {
      var limpo = i.value.replace(/[^0-9.,]/g, '').replace(/[.,]/g, function (m, pos, todo) {
        return todo.slice(0, pos).search(/[.,]/) >= 0 ? '' : ',';
      });
      if (limpo !== i.value) i.value = limpo;

  function entradaSelecao(opcoes, valor, titulo) {

    function achou() {
      for (var i = 0; i < lista.length; i++) if (lista[i].valor === atual) return lista[i];
      return lista[0] || null;
    }

    function pintar() {
      var op = achou();
      rotulo.textContent = op ? op.rotulo : '';
      rotulo.style.color = op && op.valor === '' ? 'var(--fraco)' : '';
    }

    b.addEventListener('click', function () {

      abrirEscolha({

        valor: atual

        atual = escolhido;
        pintar();
        if (typeof b.aoMudar === 'function') b.aoMudar(atual);
      });
    });

    Object.defineProperty(b, 'value', {
      get: function () { var op = achou(); return op ? op.valor : ''; },
      set: function (v) { atual = v; pintar(); }
    });
    b.trocarOpcoes = function (novas, novoValor) {
      lista = novas.slice();
      if (novoValor !== undefined) atual = novoValor;
      pintar();
    };
    pintar();
    return b;

      try { i.setSelectionRange(n, n); } catch (e) { /* alguns navegadores recusam */ }
    }

    i.addEventListener('input', function () {
      i.value = telefoneBonito(i.value);

  // `aoAdicionar` põe um chip "+ Adicionar" no fim do grupo. Ele não é
  // escolha: nunca fica marcado e não entra no rodízio do aria-pressed.
  function grupoChips(opcoes, selecionado, aoEscolher, aoAdicionar) {
    var caixa = no('div', 'chips');
    caixa.setAttribute('role', 'group');
    opcoes.forEach(function (op) {
      var rotulo = typeof op === 'string' ? op : op.rotulo;
      var valor = typeof op === 'string' ? op : op.valor;
      var c = botao('chip', rotulo, function () {
        Array.prototype.forEach.call(caixa.children, function (outro) {
          if (outro.classList.contains('chip-mais')) return;
          outro.setAttribute('aria-pressed', outro === c ? 'true' : 'false');
        });
        aoEscolher(valor);
      });
      c.setAttribute('aria-pressed', valor === selecionado ? 'true' : 'false');
      caixa.appendChild(c);
    });
    if (aoAdicionar) {
      var mais = botao('chip chip-mais', '+ Adicionar', aoAdicionar);
      mais.setAttribute('aria-pressed', 'false');
      caixa.appendChild(mais);
    }
    return caixa;
  }
