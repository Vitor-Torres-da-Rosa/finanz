  }

  // ---------- Sugestão de categoria ----------

  function sugerirCategoria(descricao, tipo) {
    var texto = descricao.toLowerCase().trim();
    if (!texto) return null;

    // 1) Descrição igual a algo já lançado antes
    var iguais = estado.lancamentos.filter(function (l) {
      return l.tipo === tipo && l.descricao && l.descricao.toLowerCase().trim() === texto;
    });
    if (iguais.length) {
      var ultimo = iguais[iguais.length - 1];
      return { categoria: ultimo.categoria, subcategoria: ultimo.subcategoria || '' };
    }

    // 2) Palavras conhecidas
    for (var i = 0; i < PISTAS.length; i++) {
      var categoria = PISTAS[i][0];
      if (categoriasDe(tipo).indexOf(categoria) < 0) continue;
      var palavras = PISTAS[i][2];
      for (var j = 0; j < palavras.length; j++) {
        if (texto.indexOf(palavras[j]) >= 0) {
          return { categoria: categoria, subcategoria: PISTAS[i][1] || '' };
        }
      }
    }
    return null;
  }

  // ---------- Folha: lançamento ----------

  function abrirFolhaLancamento(id, rascunho) {
    var existente = id ? achar(estado.lancamentos, id) : null;
    if (id && !existente) return;

    contaPadrao();

    var dados = rascunho || (existente ? {
      tipo: existente.tipo,
      valor: existente.valor,
      descricao: existente.descricao,
      categoria: existente.categoria,
      subcategoria: existente.subcategoria || '',
      data: existente.data,
      contaId: existente.contaId || estado.contas[0].id,
      contaDestinoId: existente.contaDestinoId || ''
    } : {
      tipo: 'saida',
      valor: 0,
      descricao: '',
      categoria: 'Outros',
      subcategoria: '',
      data: dataPadrao(),
      contaId: estado.contas[0].id,
      contaDestinoId: estado.contas.length > 1 ? estado.contas[1].id : ''
    });

    var categoriaTocada = rascunho ? !!rascunho.categoriaTocada : !!existente;

    abrirFolha(existente ? 'Editar lançamento' : 'Novo lançamento', function (folha) {
      var forma = no('div', 'forma');
      forma.setAttribute('data-tipo', dados.tipo);

      var tipos = segmentos([
        { valor: 'saida', rotulo: 'Saída' },
        { valor: 'entrada', rotulo: 'Entrada' },
        { valor: 'transferencia', rotulo: 'Transferência' }
      ], dados.tipo, function (v) {
        if (v === dados.tipo) return;
        var novo = coletar();
        novo.tipo = v;
        novo.categoriaTocada = categoriaTocada;
        if (v !== 'transferencia' && categoriasDe(v).indexOf(novo.categoria) < 0) {
          novo.categoria = 'Outros';
          novo.subcategoria = '';
        }
        abrirFolhaLancamento(id, novo);
      });
      forma.appendChild(tipos);

      var campoValorEl = entradaValor(dados.valor, true);
      forma.appendChild(campo('Valor', campoValorEl));

      var campoDescricao = entradaTexto(dados.descricao,
        dados.tipo === 'transferencia' ? 'Ex.: Reserva para o mês' : 'Ex.: Abastecimento no posto');
      forma.appendChild(campo('Descrição', campoDescricao));

      var caixaChips = null;
      var caixaSub = null;
      if (dados.tipo !== 'transferencia') {
        // Criar categoria abre outra folha por cima desta, então o que está
        // digitado vai junto e volta preenchido — como já acontece ao
        // trocar de tipo.
        function comCategoriaNova() {
          var novo = coletar();
          novo.categoriaTocada = true;
          criarCategoria(dados.tipo, function (nome) {
            if (nome) { novo.categoria = nome; novo.subcategoria = ''; }
            abrirFolhaLancamento(id, novo);
          });
        }

        caixaChips = grupoChips(categoriasDe(dados.tipo), dados.categoria, function (c) {
          dados.categoria = c;
          dados.subcategoria = '';
          categoriaTocada = true;
          pintarSubs();
        }, comCategoriaNova);
        forma.appendChild(campo('Categoria', caixaChips));

        caixaSub = no('div');
        forma.appendChild(campo('Subcategoria', caixaSub));
        pintarSubs();

        campoDescricao.addEventListener('input', function () {
          if (categoriaTocada) return;
          var sugerida = sugerirCategoria(campoDescricao.value, dados.tipo);
          if (!sugerida || sugerida.categoria === dados.categoria) return;
          dados.categoria = sugerida.categoria;
          dados.subcategoria = sugerida.subcategoria || '';
          Array.prototype.forEach.call(caixaChips.children, function (chip) {
            if (chip.classList.contains('chip-mais')) return;
            chip.setAttribute('aria-pressed', chip.textContent === sugerida.categoria ? 'true' : 'false');
          });
          pintarSubs();
        });
      }

      function pintarSubs() {
        if (!caixaSub) return;
        caixaSub.textContent = '';
        var subs = subcategoriasDe(dados.tipo, dados.categoria);
        // "Nenhuma" primeiro, porque subcategoria é opcional e precisa ter
        // como voltar atrás sem trocar de categoria.
        var opcoes = [{ valor: '', rotulo: 'Nenhuma' }].concat(subs.map(function (sc) {
          return { valor: sc, rotulo: sc };
        }));
        caixaSub.appendChild(grupoChips(opcoes, dados.subcategoria || '', function (sc) {
          dados.subcategoria = sc;
        }, function () {
          var novo = coletar();
          novo.categoriaTocada = true;
          criarSubcategoria(dados.tipo, dados.categoria, function (nome) {
            if (nome) novo.subcategoria = nome;
            abrirFolhaLancamento(id, novo);
          });
        }));
      }

      var campoConta = entradaSelecao(opcoesDeConta(), dados.contaId);
      forma.appendChild(campo(dados.tipo === 'transferencia' ? 'De qual conta' : 'Conta', campoConta));

      var campoDestino = null;
      if (dados.tipo === 'transferencia') {
        campoDestino = entradaSelecao(opcoesDeConta(), dados.contaDestinoId);
        forma.appendChild(campo('Para qual conta', campoDestino));
      }

      var campoData = entradaData(dados.data);
      forma.appendChild(campo('Data', campoData));

      function coletar() {
        return {
          tipo: dados.tipo,
          valor: digitosParaCentavos(campoValorEl.value),
          descricao: campoDescricao.value,
          categoria: dados.categoria,
          subcategoria: dados.subcategoria || '',
          data: campoData.value,
          contaId: campoConta.value,
          contaDestinoId: campoDestino ? campoDestino.value : dados.contaDestinoId
        };
      }

      var acoes = no('div', 'acoes');
      acoes.appendChild(botao('btn btn-ouro', 'Salvar', function () {
        var valor = digitosParaCentavos(campoValorEl.value);
        if (valor <= 0) { mostrarErro(forma, 'Informe um valor maior que zero.'); return; }
        if (!ehData(campoData.value)) { mostrarErro(forma, 'Escolha uma data válida.'); return; }
        if (dados.tipo === 'transferencia') {
          if (!campoDestino.value || campoDestino.value === campoConta.value) {
            mostrarErro(forma, 'Escolha duas contas diferentes para a transferência.');
            return;
          }
        }

        var registro = {
          id: existente ? existente.id : novoId(),
          tipo: dados.tipo,
          valor: valor,
          descricao: campoDescricao.value.trim(),
          categoria: dados.tipo === 'transferencia' ? 'Transferência' : dados.categoria,
          subcategoria: dados.tipo === 'transferencia' ? '' : (dados.subcategoria || ''),
          data: campoData.value,
          contaId: campoConta.value,
          contaDestinoId: dados.tipo === 'transferencia' ? campoDestino.value : '',
          criadoEm: existente ? existente.criadoEm : Date.now()
        };

        if (existente) {
          estado.lancamentos = estado.lancamentos.map(function (l) { return l.id === existente.id ? registro : l; });
        } else {
          estado.lancamentos.push(registro);
        }

        salvar();
        var p = partes(registro.data);
        mesAtivo = { ano: p.ano, mes: p.mes };
        fecharFolha();
        desenhar();
        avisar(existente ? 'Lançamento atualizado.' : 'Lançamento salvo.');
      }));

      if (existente) {
        acoes.appendChild(botao('btn btn-perigo', 'Excluir lançamento', function () {
          perguntar({
            titulo: 'Excluir este lançamento?',
            texto: 'Não dá para desfazer.',
            ok: 'Excluir lançamento', tom: 'perigo'
          }, function () {
            marcarExcluido('lancamentos', existente.id);
            estado.lancamentos = estado.lancamentos.filter(function (l) { return l.id !== existente.id; });
            salvar();
            fecharFolha();
            desenhar();
            avisar('Lançamento excluído.');
          });
        }));
      }

      forma.appendChild(acoes);
      folha.appendChild(forma);

      setTimeout(function () { campoValorEl.focus(); }, 270);
    });
  }

  function dataPadrao() {
    var hoje = new Date();
    if (hoje.getFullYear() === mesAtivo.ano && hoje.getMonth() === mesAtivo.mes) return hojeTexto();
    return textoDeData(mesAtivo.ano, mesAtivo.mes, 1);
  }

  // ---------- Folha: conta ----------

  function abrirFolhaConta(id, nasceCartao) {
    var existente = id ? achar(estado.contas, id) : null;
    if (id && !existente) return;
    var cor = existente ? existente.cor : CORES[estado.contas.length % CORES.length];
    var chaveBanco = existente ? (existente.banco || '') : '';
    var ehNovoCartao = !existente && nasceCartao;
    var ehFolhaDeCartao = ehNovoCartao || (existente && ehCartao(existente));

    var titulo = existente ? (ehCartao(existente) ? 'Editar cartão' : 'Editar conta')
                           : (ehNovoCartao ? 'Novo cartão' : 'Nova conta');

    abrirFolha(titulo, function (folha) {
      var forma = no('div');

      var campoNome = entradaTexto(existente ? existente.nome : '', 'Ex.: Nubank', 40);
      forma.appendChild(campo('Nome', campoNome));

      // Banco: escolher aqui já traz a cor e a marca.
      //
      // Num cartão a lista é só a dos bancos que a pessoa usa: o cartão vem
      // de onde ela já tem conta, e a lista inteira do app são dezenas de
      // nomes para achar um. Numa conta a lista continua inteira — é lá que
      // um banco novo entra pela primeira vez.
      function comoOpcoes(bancos) {
        return [{ valor: '', rotulo: 'Nenhum / outro' }].concat(
          bancos.map(function (b) { return { valor: b.chave, rotulo: b.nome }; }));
      }

      // Num cartão a lista começa curta: os bancos que a pessoa já usa. A
      // lista inteira do app são dezenas de nomes para achar um.
      //
      // Ela não fica trancada nessa lista: "Ver todos os bancos" abre a
      // lista inteira. E quem ainda não tem conta nenhuma vê logo a lista
      // inteira, senão o primeiro cartão de um app novo nasceria sem banco
      // — sem cor, sem marca e sem casar com o extrato importado.
      var meusBancos = bancosQueUso(chaveBanco);
      var listaCurta = ehFolhaDeCartao && meusBancos.length > 0;
      var opcoesBanco = comoOpcoes(listaCurta ? meusBancos : Extrato.listaDeBancos());
      if (listaCurta) opcoesBanco.push({ valor: '__todos', rotulo: 'Ver todos os bancos' });

      var linhaBanco = no('div', 'linha-dupla-campo');
      var campoBanco = entradaSelecao(opcoesBanco, chaveBanco, 'De qual banco?');
      campoBanco.aoMudar = function (v) {
        if (v === '__todos') {
          campoBanco.trocarOpcoes(comoOpcoes(Extrato.listaDeBancos()), chaveBanco);
          campoBanco.click();
          return;
        }
        chaveBanco = v;
        var b = v ? Extrato.bancoPorChave(v) : null;
        if (b) {
          cor = b.cor;
          if (!campoNome.value.trim()) campoNome.value = b.nome;
          pintarPaleta();
        }
      };
      linhaBanco.appendChild(campoBanco);
      forma.appendChild(campo('Banco', linhaBanco));

      // Vindo do "+ Novo" dos cartões, o tipo já está decidido: perguntar
      // de novo é oferecer quatro respostas erradas. Vindo do "+ Nova" das
      // contas, cartão sai da lista pelo mesmo motivo — ele nasce do outro
      // lado. Editando, a lista volta inteira: é o único lugar onde dá para
      // consertar um tipo escolhido errado.
      // A lista precisa conter o tipo escolhido: sem ele, `value` cai na
      // primeira opção e o cartão nasceria como conta corrente.
      var tiposOferecidos = existente ? TIPOS_CONTA
        : ehNovoCartao ? ['Cartão de crédito']
        : TIPOS_CONTA.filter(function (t) { return t !== 'Cartão de crédito'; });
      var campoTipo = entradaSelecao(tiposOferecidos.map(function (t) {
        return { valor: t, rotulo: t };
      }), existente ? existente.tipo : (ehNovoCartao ? 'Cartão de crédito' : 'Conta corrente'));
      campoTipo.aoMudar = function () { mostrarCamposDeCartao(); };
      if (!ehNovoCartao) forma.appendChild(campo('Tipo', campoTipo));

      var campoSaldo = entradaValor(existente ? existente.saldoInicial : 0, false);
      var caixaSaldo = campo('Saldo inicial', campoSaldo);
      forma.appendChild(caixaSaldo);
      var nota = no('div', 'linha-nota', 'O saldo atual é este valor mais os lançamentos desta conta.');
      nota.style.marginTop = '-8px';
      nota.style.marginBottom = '14px';
      forma.appendChild(nota);

      // Os dois dias do cartão, e só fazem sentido em cartão de crédito.
      //
      // Pergunto o melhor dia de compra, não o dia de fechamento: é o que o
      // aplicativo do banco mostra, e muitos nem mostram o fechamento. O
      // fechamento sai dele — é o dia anterior — e continua sendo o que
      // separa as compras por fatura aqui dentro.
      var fechaGuardado = existente && existente.fechamento ? existente.fechamento : 0;
      var caixaDias = no('div', 'duas');
      var campoMelhor = entradaSelecao(diasDoMes('Sem dia certo'),
        String(fechaGuardado ? melhorDiaDeCompra(fechaGuardado) : ''), 'Melhor dia de compra');
      var campoVence = entradaSelecao(diasDoMes('Sem dia certo'),
        String(existente && existente.vencimento ? existente.vencimento : ''), 'Vence no dia');
      caixaDias.appendChild(campo('Melhor dia de compra', campoMelhor));
      caixaDias.appendChild(campo('Vence no dia', campoVence));
      forma.appendChild(caixaDias);
      // Dos dois dias sai o que a pessoa teria de descobrir sozinha: em que
      // dia a fatura fecha, e quantos dias ela ganha comprando no melhor.
      var valorMelhor = no('div', 'entrada melhor-dia');
      var caixaMelhor = campo('A fatura fecha no dia', valorMelhor);
      forma.appendChild(caixaMelhor);

      var notaCartao = no('div', 'linha-nota');
      notaCartao.style.marginTop = '-8px';
      notaCartao.style.marginBottom = '14px';
      forma.appendChild(notaCartao);

      function pintarNotaCartao() {
        notaCartao.textContent = '';
        valorMelhor.textContent = '';
        var melhor = comoNumero(campoMelhor.value, 0);
        var vence = comoNumero(campoVence.value, 0);

        if (!melhor) {
          valorMelhor.classList.add('sem-conta');
          valorMelhor.textContent = 'Depende do melhor dia de compra';
          notaCartao.appendChild(no('div', null,
            'O melhor dia de compra é o que o aplicativo do banco mostra. Dele eu tiro o dia em que a fatura fecha, que é o que separa os gastos por fatura. Sem ele, uso o mês do lançamento.'));
          return;
        }

        var fecha = fechamentoPeloMelhorDia(melhor);
        valorMelhor.classList.remove('sem-conta');
        valorMelhor.appendChild(no('span', 'melhor-dia-num', 'Dia ' + fecha));
        if (vence) {
          var conta = prazoDaCompra(fecha, vence);
          valorMelhor.appendChild(no('span', 'melhor-dia-prazo', conta.dias + ' dias para pagar'));
          notaCartao.appendChild(no('div', 'ouro',
            'Comprando no dia ' + melhor + ', a fatura só vence em ' + dataBr(conta.vence) + '.'));
        } else {
          notaCartao.appendChild(no('div', 'ouro',
            'Diga também o dia do vencimento e eu mostro quantos dias você ganha.'));
        }
        notaCartao.appendChild(no('div', null,
          'O pior é o dia ' + fecha + ': a fatura fecha no mesmo dia, e a cobrança chega quase um mês antes.'));
      }
      campoMelhor.aoMudar = pintarNotaCartao;
      campoVence.aoMudar = pintarNotaCartao;
      pintarNotaCartao();

      function mostrarCamposDeCartao() {
        var cartao = campoTipo.value === 'Cartão de crédito';
        caixaDias.hidden = !cartao;
        caixaMelhor.hidden = !cartao;
        notaCartao.hidden = !cartao;
        nota.hidden = cartao;
        caixaSaldo.hidden = cartao;
        // Num cartão a cor vem da marca do banco, e escolher à mão só
        // atrapalha; o limite, ao contrário, só existe em cartão.
        caixaLimite.hidden = !cartao;
        notaLimite.hidden = !cartao;
        caixaCor.hidden = cartao;
      }

      var paleta = no('div', 'chips');
      function pintarPaleta() {
        paleta.textContent = '';
        // A cor da marca do banco entra na paleta, senão ela sumiria na
        // primeira vez que a pessoa abrisse a conta para editar.
        var cores = CORES.slice();
        if (cores.indexOf(cor) < 0) cores.unshift(cor);
        cores.forEach(function (c) {
          var b = botao('chip', ' ', function () {
            cor = c;
            Array.prototype.forEach.call(paleta.children, function (outro) {
              outro.setAttribute('aria-pressed', outro === b ? 'true' : 'false');
            });
          });
          b.style.background = c;
          b.style.borderColor = c;
          b.style.width = '38px';
          b.setAttribute('aria-pressed', c === cor ? 'true' : 'false');
          b.setAttribute('aria-label', 'Cor ' + c);
          paleta.appendChild(b);
        });
      }
      pintarPaleta();
      var caixaCor = campo('Cor', paleta);
      forma.appendChild(caixaCor);

      // O limite é o número que a pessoa olha no aplicativo do banco junto
      // com a fatura: sem ele não dá para dizer quanto ainda cabe.
      var campoLimite = entradaValor(existente ? (existente.limite || 0) : 0, false);
      var caixaLimite = campo('Limite do cartão', campoLimite);
      forma.appendChild(caixaLimite);
      var notaLimite = no('div', 'linha-nota',
        'Opcional. Com ele eu mostro quanto da fatura em aberto já ocupa o limite.');
      notaLimite.style.marginTop = '-8px';
      notaLimite.style.marginBottom = '14px';
      forma.appendChild(notaLimite);

      mostrarCamposDeCartao();

      var acoes = no('div', 'acoes');
      acoes.appendChild(botao('btn btn-ouro', 'Salvar', function () {
        var nome = campoNome.value.trim();
        if (!nome) { mostrarErro(forma, 'Dê um nome para a conta.'); return; }

        var cartaoAgora = campoTipo.value === 'Cartão de crédito';
        var fecha = fechamentoPeloMelhorDia(inteiro(campoMelhor.value));
        var vence = inteiro(campoVence.value);

        if (existente) {
          existente.nome = nome;
          existente.tipo = campoTipo.value;
          existente.saldoInicial = cartaoAgora ? 0 : digitosParaCentavos(campoSaldo.value);
          existente.cor = cor;
          existente.banco = chaveBanco;
          existente.fechamento = cartaoAgora ? fecha : 0;
          existente.vencimento = cartaoAgora ? vence : 0;
          existente.limite = cartaoAgora ? digitosParaCentavos(campoLimite.value) : 0;
        } else {
          estado.contas.push({
            id: novoId(), nome: nome, tipo: campoTipo.value,
            saldoInicial: cartaoAgora ? 0 : digitosParaCentavos(campoSaldo.value), cor: cor,
            banco: chaveBanco,
            fechamento: cartaoAgora ? fecha : 0,
            vencimento: cartaoAgora ? vence : 0,
            limite: cartaoAgora ? digitosParaCentavos(campoLimite.value) : 0
          });
        }
        salvar();
        fecharFolha();
        desenhar();
        avisar(existente ? 'Conta atualizada.' : 'Conta criada.');
      }));

      if (existente) {
        var eraCartao = ehCartao(existente);
        var palavra = eraCartao ? 'cartão' : 'conta';

        acoes.appendChild(botao('btn btn-perigo', 'Excluir ' + palavra, function () {
          var presos = estado.lancamentos.filter(function (l) {
            return l.contaId === existente.id || l.contaDestinoId === existente.id;
          });

          function apagarDeVez() {
            // Os lançamentos vão junto: sem a conta eles ficariam soltos,
            // sem saldo e sem aparecer em lugar nenhum.
            presos.forEach(function (l) { marcarExcluido('lancamentos', l.id); });
            var fora = {};
            presos.forEach(function (l) { fora[l.id] = true; });
            estado.lancamentos = estado.lancamentos.filter(function (l) { return !fora[l.id]; });
            marcarExcluido('contas', existente.id);
            estado.contas = estado.contas.filter(function (c) { return c.id !== existente.id; });
            salvar();
            fecharFolha();
            desenhar();
            avisar(eraCartao ? 'Cartão excluído.' : 'Conta excluída.');
          }

          if (!presos.length) {
            perguntar({
              titulo: 'Excluir ' + (eraCartao ? 'o cartão ' : 'a conta ') + existente.nome + '?',
              texto: 'Ele some das telas e dos relatórios.',
              ok: 'Excluir ' + palavra, tom: 'perigo'
            }, apagarDeVez);
            return;
          }

          perguntar({
            titulo: 'Excluir ' + (eraCartao ? 'o cartão ' : 'a conta ') + existente.nome + '?',
            texto: 'Tem ' + presos.length + ' lançamento(s) aqui dentro. Eles serão apagados junto — ' +
                   'inclusive os que vieram da fatura importada. Isso não tem volta.',
            ok: 'Excluir com os lançamentos', tom: 'perigo'
          }, apagarDeVez);
        }));
      }

      forma.appendChild(acoes);
      folha.appendChild(forma);
    });
  }

  // ---------- Folha: ativo ----------

  function abrirFolhaAtivo(id) {
    var existente = id ? achar(estado.ativos, id) : null;
    if (id && !existente) return;
    var classe = existente ? existente.classe : 'Renda Fixa';

    abrirFolha(existente ? 'Editar ativo' : 'Novo ativo', function (folha) {
      var forma = no('div');

      var campoNome = entradaTexto(existente ? existente.nome : '', 'Ex.: Tesouro Selic 2029', 50);
      forma.appendChild(campo('Nome do ativo', campoNome));

      forma.appendChild(campo('Classe', grupoChips(CLASSES_ATIVO, classe, function (c) { classe = c; })));

      var campoAplicado = entradaValor(existente ? existente.aplicado : 0, false);
      forma.appendChild(campo('Valor aplicado', campoAplicado));

      var campoAtual = entradaValor(existente ? valorAtivo(existente) : 0, false);
      forma.appendChild(campo('Valor atual', campoAtual));

      var nota = no('div', 'linha-nota',
        'Cada vez que você atualizar o valor atual, guardamos a data para montar o gráfico de evolução.');
      nota.style.marginTop = '-8px';
      nota.style.marginBottom = '14px';
      forma.appendChild(nota);

      var acoes = no('div', 'acoes');
      acoes.appendChild(botao('btn btn-ouro', 'Salvar', function () {
        var nome = campoNome.value.trim();
        if (!nome) { mostrarErro(forma, 'Dê um nome para o ativo.'); return; }
        var atual = digitosParaCentavos(campoAtual.value);
        var aplicado = digitosParaCentavos(campoAplicado.value);
        var hoje = hojeTexto();

        if (existente) {
          existente.nome = nome;
          existente.classe = classe;
          existente.aplicado = aplicado;
          var ultimo = existente.historico[existente.historico.length - 1];
          if (ultimo && ultimo.data === hoje) ultimo.valor = atual;
          else existente.historico.push({ data: hoje, valor: atual });
        } else {
          estado.ativos.push({
            id: novoId(), nome: nome, classe: classe, aplicado: aplicado,
            historico: [{ data: hoje, valor: atual }]
          });
        }
        salvar();
        fecharFolha();
        desenhar();
        avisar(existente ? 'Ativo atualizado.' : 'Ativo cadastrado.');
      }));

      if (existente) {
        acoes.appendChild(botao('btn btn-perigo', 'Excluir ativo', function () {
          perguntar({
            titulo: 'Excluir ' + existente.nome + '?',
            texto: 'O histórico de valores desse ativo vai junto. Não dá para desfazer.',
            ok: 'Excluir ativo', tom: 'perigo'
          }, function () {
            marcarExcluido('ativos', existente.id);
            estado.ativos.forEach(function (a) {
              if (a.id === existente.id) a.historico.forEach(function (h) { marcarExcluido('ativo_historico', a.id + '|' + h.data); });
            });
            estado.ativos = estado.ativos.filter(function (a) { return a.id !== existente.id; });
            salvar();
            fecharFolha();
            desenhar();
            avisar('Ativo excluído.');
          });
        }));
      }

      forma.appendChild(acoes);
      folha.appendChild(forma);
    });
  }

  // ---------- Folha: meta ----------

  function abrirFolhaMeta(id) {
    var existente = id ? achar(estado.metas, id) : null;
    if (id && !existente) return;

    abrirFolha(existente ? 'Editar meta' : 'Nova meta', function (folha) {
      var forma = no('div');

      var campoNome = entradaTexto(existente ? existente.nome : '', 'Ex.: Viagem ao Japão', 50);
      forma.appendChild(campo('Nome', campoNome));

      var campoAlvo = entradaValor(existente ? existente.alvo : 0, false);
      forma.appendChild(campo('Quanto quer juntar', campoAlvo));

      var opcoesConta = [{ valor: '', rotulo: 'Nenhuma — eu digito o valor' }].concat(
        estado.contas.map(function (c) {
          return { valor: c.id, rotulo: c.nome, detalhe: emReais(saldoConta(c.id, null)) };
        }));
      var campoConta = entradaSelecao(opcoesConta,
        existente && existente.contaId ? existente.contaId : '', 'Conta da meta');
      forma.appendChild(campo('Qual conta guarda esse dinheiro (opcional)', campoConta));

      var campoGuardado = entradaValor(existente ? existente.guardado : 0, false);
      var caixaGuardado = campo('Já guardado', campoGuardado);
      forma.appendChild(caixaGuardado);

      var atalhos = no('div', 'chips');
      [5000, 10000, 20000, 50000].forEach(function (c) {
        atalhos.appendChild(botao('chip', '+ ' + emReais(c), function () {
          campoGuardado.value = emReais(digitosParaCentavos(campoGuardado.value) + c);
          pintarMeta();
        }));
      });
      var caixaAtalhos = campo('Adicionar rápido', atalhos);
      forma.appendChild(caixaAtalhos);

      var painelMeta = no('div', 'linha-nota');
      painelMeta.style.marginBottom = '14px';
      forma.appendChild(painelMeta);

      function pintarMeta() {
        var comConta = !!campoConta.value;
        caixaGuardado.style.display = comConta ? 'none' : '';
        caixaAtalhos.style.display = comConta ? 'none' : '';
        var alvoAgora = digitosParaCentavos(campoAlvo.value);
        var jaTem = comConta ? Math.max(saldoConta(campoConta.value, null), 0)
                             : digitosParaCentavos(campoGuardado.value);
        if (!alvoAgora) { painelMeta.textContent = ''; return; }
        painelMeta.textContent = emReais(jaTem) + ' de ' + emReais(alvoAgora) + ' — ' +
          Math.round(pct(jaTem, alvoAgora)) + '%' +
          (jaTem >= alvoAgora ? ', meta alcançada.' : ', faltam ' + emReais(alvoAgora - jaTem) + '.');
      }
      campoConta.aoMudar = pintarMeta;
      campoAlvo.addEventListener('input', pintarMeta);
      campoGuardado.addEventListener('input', pintarMeta);
      pintarMeta();

      var campoPrazo = entradaData(existente && existente.prazo ? existente.prazo : '');
      campoPrazo.value = existente ? existente.prazo : '';
      forma.appendChild(campo('Prazo (opcional)', campoPrazo));

      var acoes = no('div', 'acoes');
      acoes.appendChild(botao('btn btn-ouro', 'Salvar', function () {
        var nome = campoNome.value.trim();
        var alvo = digitosParaCentavos(campoAlvo.value);
        if (!nome) { mostrarErro(forma, 'Dê um nome para a meta.'); return; }
        if (alvo <= 0) { mostrarErro(forma, 'Informe quanto você quer juntar.'); return; }

        var registro = {
          id: existente ? existente.id : novoId(),
          nome: nome,
          alvo: alvo,
          guardado: digitosParaCentavos(campoGuardado.value),
          contaId: campoConta.value,
          prazo: ehData(campoPrazo.value) ? campoPrazo.value : ''
        };

        if (existente) estado.metas = estado.metas.map(function (m) { return m.id === existente.id ? registro : m; });
        else estado.metas.push(registro);

        salvar();
        fecharFolha();
        desenhar();
        avisar(existente ? 'Meta atualizada.' : 'Meta criada.');
      }));

      if (existente) {
        acoes.appendChild(botao('btn btn-perigo', 'Excluir meta', function () {
          perguntar({
            titulo: 'Excluir a meta ' + existente.nome + '?',
            texto: 'O valor já guardado não é lançado de volta em nenhuma conta.',
            ok: 'Excluir meta', tom: 'perigo'
          }, function () {
            marcarExcluido('metas', existente.id);
            estado.metas = estado.metas.filter(function (m) { return m.id !== existente.id; });
            salvar();
            fecharFolha();
            desenhar();
            avisar('Meta excluída.');
          });
        }));
      }

      forma.appendChild(acoes);
      folha.appendChild(forma);
    });
  }

  // ---------- Folha: orçamento ----------

  // O teto por categoria mede consumo, igual ao teto geral: a fatura paga
  // não conta de novo aqui.
  function gastoDaCategoria(nomeCat) {
    var total = 0;
    visaoDeConsumo(lancamentosDoMes(mesAtivo.ano, mesAtivo.mes)).lista.forEach(function (l) {
      if (l.tipo === 'saida' && l.categoria === nomeCat) total += l.valor;
    });
    return total;
  }

  function abrirFolhaOrcamento(rascunho) {
    var dados = rascunho || {
      geral: estado.orcamentos.geral,
      categorias: Object.keys(estado.orcamentos.categorias).map(function (c) {
        return { nome: c, valor: estado.orcamentos.categorias[c] };
      })
    };

    abrirFolha('Orçamento do mês', function (folha) {
      var forma = no('div');

      var campoGeral = entradaValor(dados.geral, false);
      forma.appendChild(campo('Teto de gastos do mês', campoGeral));

      var topo = no('div', 'cartao-topo');
      topo.style.marginBottom = '10px';
      juntar(topo,
        no('div', 'rotulo', 'Categorias'),
        botao('cartao-acao', dados.categorias.length ? 'Escolher' : '+ Escolher categorias', function () {
          dados.geral = digitosParaCentavos(campoGeral.value);
          lerValoresCategorias();
          empilhar({ tipo: 'aba', voltar: function () { abrirFolhaOrcamento(dados); } });
          abrirSeletorCategorias(dados);
        })
      );
      forma.appendChild(topo);

      var campos = {};
      function lerValoresCategorias() {
        dados.categorias.forEach(function (c) {
          if (campos[c.nome]) c.valor = digitosParaCentavos(campos[c.nome].value);
        });
      }

      if (!dados.categorias.length) {
        var vazio = no('p', 'linha-sub', 'Sem teto por categoria. Toque em "Escolher categorias" para separar quanto pode gastar em cada uma.');
        vazio.style.marginBottom = '8px';
        forma.appendChild(vazio);
      } else {
        dados.categorias.forEach(function (c) {
          var linha = no('div', 'orc-item');
          var rot = no('div', 'rot', c.nome);
          var gasto = gastoDaCategoria(c.nome);
          rot.appendChild(no('small', null, gasto > 0 ? 'gasto em ' + MESES[mesAtivo.mes] + ': ' + emReais(gasto) : 'sem gasto neste mês'));
          var entrada = entradaValor(c.valor, false);
          campos[c.nome] = entrada;
          var tirar = botao('tirar', '×', function () {
            lerValoresCategorias();
            dados.categorias = dados.categorias.filter(function (x) { return x.nome !== c.nome; });
            abrirFolhaOrcamento(dados);
          });
          tirar.setAttribute('aria-label', 'Tirar ' + c.nome);
          juntar(linha, rot, entrada, tirar);
          forma.appendChild(linha);
        });
      }

      var acoes = no('div', 'acoes');
      acoes.appendChild(botao('btn btn-ouro', 'Salvar orçamento', function () {
        lerValoresCategorias();
        estado.orcamentos.geral = digitosParaCentavos(campoGeral.value);
        estado.orcamentos.categorias = {};
        dados.categorias.forEach(function (c) {
          if (c.valor > 0) estado.orcamentos.categorias[c.nome] = c.valor;
        });
        salvar();
        fecharFolha();
        desenhar();
        avisar('Orçamento salvo.');
      }));
      forma.appendChild(acoes);
      folha.appendChild(forma);
    });
  }

  function abrirSeletorCategorias(dados) {
    abrirFolha('Categorias', function (folha) {
      folha.appendChild(no('p', 'linha-sub', 'Marque as categorias que você quer limitar. O valor ao lado é o que já foi gasto em ' + MESES[mesAtivo.mes] + '.'));

      var lista = no('div', 'cartao liso');
      lista.style.marginTop = '14px';

      function estaMarcada(nomeCat) {
        return dados.categorias.some(function (c) { return c.nome === nomeCat; });
      }

      function desenharLista() {
        lista.textContent = '';
        categoriasDe('saida').forEach(function (nomeCat) {
          var gasto = gastoDaCategoria(nomeCat);
          var linha = botao('cat-linha', null, function () {
            if (estaMarcada(nomeCat)) {
              dados.categorias = dados.categorias.filter(function (c) { return c.nome !== nomeCat; });
            } else {
              dados.categorias.push({ nome: nomeCat, valor: gasto > 0 ? Math.ceil(gasto / 1000) * 1000 : 0 });
            }
            desenharLista();
          });
          linha.setAttribute('aria-pressed', estaMarcada(nomeCat) ? 'true' : 'false');
          juntar(linha,
            no('span', 'marca', estaMarcada(nomeCat) ? '✓' : ''),
            no('span', 'nome', nomeCat),
            no('span', 'gasto' + (gasto > 0 ? '' : ' zero'), gasto > 0 ? emReais(gasto) : '—')
          );
          lista.appendChild(linha);
        });

        var adicionar = botao('cat-linha', null, function () { abrirNovaCategoria(dados); });
        var maisMarca = no('span', 'marca');
        maisMarca.style.border = '0';
        maisMarca.style.color = 'var(--ouro)';
        maisMarca.appendChild(icone('mais', 18));
        juntar(adicionar, maisMarca, no('span', 'nome ouro', 'Adicionar categoria'));
        lista.appendChild(adicionar);
      }
      desenharLista();
      folha.appendChild(lista);

      var acoes = no('div', 'acoes');
      acoes.appendChild(botao('btn btn-ouro', 'Pronto', function () { voltarNavegacao(); }));
      folha.appendChild(acoes);
    });
  }

  function abrirNovaCategoria(dados) {
    empilhar({ tipo: 'aba', voltar: function () { abrirSeletorCategorias(dados); } });
    abrirFolha('Nova categoria', function (folha) {
      var forma = no('div');
      var campoNome = entradaTexto('', 'Ex.: Pet, Academia, Obra', 30);
      forma.appendChild(campo('Nome da categoria', campoNome));

      var acoes = no('div', 'acoes');
      acoes.appendChild(botao('btn btn-ouro', 'Criar e marcar', function () {
        var nome = campoNome.value.trim().slice(0, 30);
        if (!nome) { mostrarErro(forma, 'Escreva o nome da categoria.'); return; }
        if (categoriasDe('saida').indexOf(nome) >= 0) { mostrarErro(forma, 'Essa categoria já existe.'); return; }

        estado.categoriasExtras.saida.push(nome);
        dados.categorias.push({ nome: nome, valor: 0 });
        salvar();
        voltarNavegacao();
        avisar('Categoria ' + nome + ' criada.');
      }));
      forma.appendChild(acoes);
      folha.appendChild(forma);
    });
  }

  // ---------- Folha: reserva ----------

  function abrirFolhaReserva() {
    abrirFolha('Reserva de emergência', function (folha) {
      var forma = no('div');
      var p = estado.perfil;
      var meses = p.reservaMeses;

      forma.appendChild(no('p', 'linha-sub',
        'Quantos meses de despesa você quer ter guardados. Usamos a média das suas saídas dos últimos 3 meses.'));

      var chips = grupoChips(['3 meses', '6 meses', '12 meses'],
        meses + ' meses', function (v) { meses = parseInt(v, 10); atualizar(); });
      var wrap = campo(null, chips);
      wrap.style.marginTop = '14px';
      forma.appendChild(wrap);

      var opcoesConta = [{ valor: '', rotulo: 'Não tenho uma conta separada' }].concat(
        estado.contas.map(function (c) {
          return { valor: c.id, rotulo: c.nome, detalhe: emReais(saldoConta(c.id, null)) };
        }));
      var campoConta = entradaSelecao(opcoesConta, p.reservaConta || '', 'Conta da reserva');
      forma.appendChild(campo('Qual conta guarda a reserva (opcional)', campoConta));

      var campoManual = entradaValor(p.reservaManual, false);
      var caixaManual = campo('Ou informe o valor à mão', campoManual);
      forma.appendChild(caixaManual);

      var painel = cartao();
      forma.appendChild(painel);

      function atualizar() {
        var media = mediaDespesas(3);
        var ideal = media * meses;
        var contaId = campoConta.value;
        var manual = digitosParaCentavos(campoManual.value);
        var guardado = contaId ? Math.max(saldoConta(contaId, null), 0)
                     : manual > 0 ? manual
                     : Math.max(totalEmContas(null), 0);
        caixaManual.style.display = contaId ? 'none' : '';

        painel.textContent = '';
        painel.appendChild(no('div', 'rotulo', 'Reserva ideal'));
        painel.appendChild(no('div', 'valorao pequeno num ouro', emReais(ideal)));
        painel.appendChild(no('div', 'linha-nota',
          meses + ' meses × ' + emReais(media) + ' de despesa média por mês.'));

        var grade = no('div', 'resumo-grade');
        [['Você tem', guardado, 'verde'], ['Falta', Math.max(ideal - guardado, 0),
          ideal - guardado > 0 ? 'vermelho' : 'verde']].forEach(function (item) {
          var d = no('div');
          d.appendChild(no('div', 'r', item[0]));
          d.appendChild(no('div', 'v ' + item[2], emReais(item[1])));
          grade.appendChild(d);
        });
        painel.appendChild(grade);
        painel.appendChild(progresso(guardado, ideal || 1,
          guardado >= ideal ? 'var(--verde)' : 'var(--ouro)'));
      }
      campoConta.aoMudar = atualizar;
      campoManual.addEventListener('input', atualizar);
      atualizar();

      var acoes = no('div', 'acoes');
      acoes.appendChild(botao('btn btn-ouro', 'Salvar', function () {
        estado.perfil.reservaMeses = meses;
        estado.perfil.reservaConta = campoConta.value;
        estado.perfil.reservaManual = digitosParaCentavos(campoManual.value);
        salvar();
        fecharFolha();
        desenhar();
        avisar('Reserva ajustada para ' + meses + ' meses.');
      }));
      acoes.appendChild(botao('btn btn-fantasma', 'Não preciso de reserva', function () {
        perguntar({
          titulo: 'Tirar a reserva do Planejar?',
          texto: 'O cartão some da tela. Para trazer de volta, é em Mais → Preferências.',
          ok: 'Tirar do Planejar'
        }, function () {
          estado.perfil.reservaLigada = false;
          salvar();
          fecharFolha();
          desenhar();
          avisar('Reserva desligada. Volte por Mais → Preferências.');
        });
      }));
      forma.appendChild(acoes);
      folha.appendChild(forma);
    });
  }

  // ---------- Folha: aposentadoria ----------

  function abrirFolhaAposentadoria() {
    abrirFolha('Aposentadoria', function (folha) {
      var forma = no('div');
      var p = estado.perfil;

      var campoIdade = entradaTextoNumero(p.idadeAtual, '30');
      forma.appendChild(campo('Sua idade hoje', campoIdade));

      var campoAlvo = entradaTextoNumero(p.idadeAposentadoria, '60');
      forma.appendChild(campo('Idade em que quer parar', campoAlvo));

      var opcoesConta = [{ valor: '', rotulo: 'Nenhuma — começar do zero' }].concat(
        estado.contas.map(function (c) {
          return { valor: c.id, rotulo: c.nome, detalhe: emReais(saldoConta(c.id, null)) };
        }));
      var campoConta = entradaSelecao(opcoesConta, p.contaAposentadoria || '', 'Conta da aposentadoria');
      forma.appendChild(campo('Qual conta guarda esse dinheiro (opcional)', campoConta));

      var campoAporte = entradaValor(p.aporteMensal, false);
      forma.appendChild(campo('Quanto pretende aportar por mês', campoAporte));

      var campoTaxa = entradaTextoNumero(p.rendimentoAnual, '8');
      forma.appendChild(campo('Rendimento esperado ao ano (%)', campoTaxa));

      var campoInflacao = entradaTextoNumero(p.inflacaoAnual, '4');
      forma.appendChild(campo('Inflação anual estimada (%)', campoInflacao));

      var campoRetirada = entradaTextoNumero(p.retiradaAnual, '4');
      forma.appendChild(campo('Quanto pretende retirar por ano (%)', campoRetirada));

      var campoMeta = entradaValor(p.metaPatrimonio, false);
      forma.appendChild(campo('Meta de patrimônio (opcional)', campoMeta));

      var painel = cartao();
      forma.appendChild(painel);

      // A conta roda com o que está escrito agora, sem precisar salvar antes.
      function simular() {
        var guardado = estadoAtualDoPerfil();
        var antes = {};
        Object.keys(guardado).forEach(function (k) { antes[k] = p[k]; p[k] = guardado[k]; });
        var a = calculoAposentadoria();
        Object.keys(antes).forEach(function (k) { p[k] = antes[k]; });
        return a;
      }

      function estadoAtualDoPerfil() {
        var idade = Math.min(Math.max(Math.round(comoNumero(campoIdade.value, 30)), 14), 100);
        var alvo = Math.min(Math.max(Math.round(comoNumero(campoAlvo.value, 60)), 15), 110);
        return {
          idadeAtual: idade,
          idadeAposentadoria: alvo,
          contaAposentadoria: campoConta.value,
          aporteMensal: digitosParaCentavos(campoAporte.value),
          rendimentoAnual: Math.min(Math.max(comoNumero(campoTaxa.value, 8), 0), 60),
          inflacaoAnual: Math.min(Math.max(comoNumero(campoInflacao.value, 4), 0), 40),
          retiradaAnual: Math.min(Math.max(comoNumero(campoRetirada.value, 4), 0.1), 20),
          metaPatrimonio: digitosParaCentavos(campoMeta.value)
        };
      }

      function pintar() {
        var a = simular();
        painel.textContent = '';
        painel.appendChild(no('div', 'rotulo',
          'Projeção aos ' + Math.round(comoNumero(campoAlvo.value, 60)) + ' anos'));
        painel.appendChild(no('div', 'valorao pequeno num ouro', emReais(a.bruto)));

        [
          ['Capital de partida', emReais(a.capital)],
          ['Total investido', emReais(a.investido)],
          ['Total em juros', emReais(a.juros)],
          ['Juros no montante', numeroBr(a.jurosPct) + '%'],
          ['Multiplicador', numeroBr(Math.round(a.multiplicador * 10) / 10) + 'x'],
          ['Taxa mensal', numeroBr(a.taxaMes) + '%'],
          ['Taxa real (sem inflação)', numeroBr(a.taxaRealAno) + '% ao ano'],
          ['Vale hoje', emReais(a.real)],
          ['Renda passiva', emReais(a.rendaPassiva) + ' por mês']
        ].forEach(function (par) {
          var l = no('div', 'parcela-linha');
          juntar(l, no('span', 'q', par[0]), no('span', 'v num', par[1]));
          painel.appendChild(l);
        });

        if (a.meta > 0) {
          var caixaMeta = no('div');
          caixaMeta.style.marginTop = '12px';
          var topoM = no('div', 'legenda-item');
          topoM.style.marginBottom = '5px';
          juntar(topoM, no('span', 'nome', 'Meta de patrimônio'),
            no('span', 'pct num', Math.round(a.metaPct) + '%'));
          caixaMeta.appendChild(topoM);
          caixaMeta.appendChild(progresso(a.bruto, a.meta,
            a.metaPct >= 100 ? 'var(--verde)' : 'var(--ouro)'));
          painel.appendChild(caixaMeta);
        }

        painel.appendChild(no('div', 'linha-nota',
          'Juros compostos mês a mês sobre ' + a.anos + ' anos. É uma estimativa, não uma promessa.'));
      }

      [campoIdade, campoAlvo, campoAporte, campoTaxa, campoInflacao, campoRetirada, campoMeta]
        .forEach(function (c) { c.addEventListener('input', pintar); });
      campoConta.aoMudar = pintar;
      pintar();

      var acoes = no('div', 'acoes');
      acoes.appendChild(botao('btn btn-ouro', 'Salvar', function () {
        var novo = estadoAtualDoPerfil();
        if (novo.idadeAposentadoria <= novo.idadeAtual) {
          mostrarErro(forma, 'A idade de parar precisa ser maior que a idade de hoje.');
          return;
        }
        Object.keys(novo).forEach(function (k) { estado.perfil[k] = novo[k]; });
        salvar();
        fecharFolha();
        desenhar();
        avisar('Projeção atualizada.');
      }));
      forma.appendChild(acoes);
      folha.appendChild(forma);
    });
  }

  // ---------- Folha: preferências ----------

  function abrirFolhaPreferencias() {
    abrirFolha('Preferências', function (folha) {
      var forma = no('div');

      var campoNome = entradaTexto(estado.perfil.nome, 'Como quer ser chamado', 40);
      forma.appendChild(campo('Seu nome', campoNome));

      // Assinatura do orçamento em PDF. Sem isso o papel sai só com o
      // primeiro nome, o que não passa muita confiança para o cliente.
      var campoNegocio = entradaTexto(estado.perfil.negocio || '',
        'Ex.: Vitor Torres Elétrica (opcional)', 60);
      forma.appendChild(campo('Nome do seu negócio', campoNegocio));
      var campoContato = entradaTexto(estado.perfil.contato || '',
        'Telefone ou e-mail que vai no orçamento (opcional)', 40);
      forma.appendChild(campo('Contato no orçamento', campoContato));
      var notaOrc = no('div', 'linha-nota', 'Estes dois aparecem no topo do PDF do orçamento.');
      notaOrc.style.marginTop = '-8px';
      forma.appendChild(notaOrc);

      // Quanto da renda você quer guardar. É a régua da análise: a nota de
      // saúde e o "quanto falta" saem daqui.
      var campoMeta = entradaSelecao(
        [5, 10, 15, 20, 25, 30, 40, 50].map(function (n) {
          return { valor: String(n), rotulo: n + '% da renda',
                   detalhe: n <= 10 ? 'começando' : n <= 20 ? 'o mais comum' : 'agressivo' };
        }), String(metaDeEconomia()), 'Quanto quer guardar por mês');
      forma.appendChild(campo('Meta de economia', campoMeta));
      var notaMeta = no('div', 'linha-nota');
      notaMeta.style.marginTop = '-8px';
      forma.appendChild(notaMeta);
      function pintarMeta() {
        var t = totaisDoMes(mesAtivo.ano, mesAtivo.mes);
        var p = inteiro(campoMeta.value) || 20;
        notaMeta.textContent = t.entradas > 0
          ? 'Com a renda deste mês, isso seria guardar ' +
            emReais(Math.round(t.entradas * p / 100)) + '.'
          : 'É a régua da sua nota de saúde e do "quanto falta" na análise.';
      }
      campoMeta.aoMudar = function () { pintarMeta(); };
      pintarMeta();

      var reserva = estado.perfil.reservaLigada !== false;
      var marcaReserva = botao('lembrar', null, function () {
        reserva = !reserva;
        marcaReserva.setAttribute('aria-pressed', reserva ? 'true' : 'false');
        marcaReserva.querySelector('.caixinha').textContent = reserva ? '✓' : '';
      });
      marcaReserva.setAttribute('aria-pressed', reserva ? 'true' : 'false');
      marcaReserva.style.margin = '4px 0 6px';
      marcaReserva.appendChild(no('span', 'caixinha', reserva ? '✓' : ''));
      marcaReserva.appendChild(no('span', null, 'Mostrar a reserva de emergência'));
      forma.appendChild(marcaReserva);
      forma.appendChild(no('div', 'linha-nota',
        'Desmarcado, o cartão da reserva some da tela Planejar. Nada do que você já ajustou se perde.'));

      var acoes = no('div', 'acoes');
      acoes.appendChild(botao('btn btn-ouro', 'Salvar', function () {
        estado.perfil.nome = campoNome.value.trim().slice(0, 40);
        estado.perfil.metaEconomia = inteiro(campoMeta.value) || 20;
        estado.perfil.negocio = campoNegocio.value.trim().slice(0, 60);
        estado.perfil.contato = campoContato.value.trim().slice(0, 40);
        estado.perfil.reservaLigada = reserva;
        salvar();
        fecharFolha();
        desenhar();
        avisar('Preferências salvas.');
      }));
      forma.appendChild(acoes);
      folha.appendChild(forma);
    });
  }

  // ---------- Relatórios ----------

  function par(rotulo, valor, classe) {
    var d = no('div', 'rel-par');
    juntar(d, no('span', null, rotulo), no('span', 'v ' + (classe || ''), valor));
    return d;
  }

  function tabela(colunas, linhas) {
    var t = no('table', 'rel-tabela');
    var thead = no('thead');
    var tr = no('tr');
    colunas.forEach(function (c) {
      var th = no('th', c.numerica ? 'n' : null, c.rotulo);
      tr.appendChild(th);
    });
    thead.appendChild(tr);
    t.appendChild(thead);

    var tbody = no('tbody');
    linhas.forEach(function (linha) {
      var l = no('tr');
      linha.forEach(function (celula, i) {
        var td = no('td', (colunas[i].numerica ? 'n ' : '') + (celula.classe || ''), celula.texto);
        l.appendChild(td);
      });
      tbody.appendChild(l);
    });
    t.appendChild(tbody);
    return t;
  }

  function celula(texto, classe) { return { texto: texto, classe: classe || '' }; }

  function abrirRelatorio(tipo) {
    var alvo = $('relConteudo');
    alvo.textContent = '';

    var periodo = MESES[mesAtivo.mes] + ' de ' + mesAtivo.ano;
    var t = totaisDoMes(mesAtivo.ano, mesAtivo.mes);
    var gastos = gastosPorCategoria(mesAtivo.ano, mesAtivo.mes);

    var titulos = {
      resumo: 'Resumo executivo',
      fluxo: 'Fluxo de caixa',
      investimentos: 'Investimentos',
      clientes: 'Clientes e cobranças',
      ir: 'Apoio ao imposto de renda'
    };

    alvo.appendChild(no('h1', null, titulos[tipo]));
    alvo.appendChild(no('div', 'rel-sub',
      (tipo === 'ir' ? 'Ano de ' + mesAtivo.ano : periodo) +
      ' · gerado em ' + dataBr(hojeTexto()) + (estado.perfil.nome ? ' · ' + estado.perfil.nome : '')));

    if (tipo === 'resumo') {
      alvo.appendChild(no('h2', null, 'Patrimônio'));
      alvo.appendChild(par('Total em contas', emReais(totalEmContas(null))));
      alvo.appendChild(par('Total investido', emReais(totalInvestido(null))));
      alvo.appendChild(par('Patrimônio líquido', emReais(patrimonio(null))));

      alvo.appendChild(no('h2', null, 'Resultado do mês'));
      alvo.appendChild(par('Receitas', emReais(t.entradas), 'verde'));
      alvo.appendChild(par('Despesas', emReais(t.saidas), 'vermelho'));
      alvo.appendChild(par('Resultado', emReais(t.saldo), t.saldo >= 0 ? 'verde' : 'vermelho'));
      if (t.entradas > 0) {
        alvo.appendChild(par('Taxa de poupança', ((t.saldo / t.entradas) * 100).toFixed(1).replace('.', ',') + '%'));
      }
      if (t.valorDasFaturas > 0) {
        alvo.appendChild(no('p', 'rel-nota',
          'Não entram em Despesas ' + emReais(t.valorDasFaturas) + ' de fatura de cartão paga neste mês: ' +
          'as compras que formaram essa fatura já estão contadas acima, uma vez só.'));
      }

      if (estado.contas.length) {
        alvo.appendChild(no('h2', null, 'Contas'));
        alvo.appendChild(tabela(
          [{ rotulo: 'Conta' }, { rotulo: 'Tipo' }, { rotulo: 'Saldo', numerica: true }],
          estado.contas.map(function (c) {
            return [celula(c.nome), celula(c.tipo), celula(emReais(saldoConta(c.id, null)))];
          })
        ));
      }

      if (gastos.lista.length) {
        alvo.appendChild(no('h2', null, 'Gastos por categoria'));
        alvo.appendChild(tabela(
          [{ rotulo: 'Categoria' }, { rotulo: 'Valor', numerica: true }, { rotulo: '%', numerica: true }],
          gastos.lista.map(function (g) {
            return [celula(g.nome), celula(emReais(g.valor)), celula(Math.round(pct(g.valor, gastos.total)) + '%')];
          })
        ));
      }

      if (estado.metas.length) {
        alvo.appendChild(no('h2', null, 'Metas'));
        alvo.appendChild(tabela(
          [{ rotulo: 'Meta' }, { rotulo: 'Guardado', numerica: true }, { rotulo: 'Alvo', numerica: true }, { rotulo: '%', numerica: true }],
          estado.metas.map(function (m) {
            return [celula(m.nome), celula(emReais(m.guardado)), celula(emReais(m.alvo)),
                    celula(Math.round(pct(m.guardado, m.alvo)) + '%')];
          })
        ));
      }
    }

    if (tipo === 'fluxo') {
      // Este relatório é sobre dinheiro entrando e saindo das contas, não
      // sobre consumo. Os dois números aparecem, cada um com seu nome.
      alvo.appendChild(no('h2', null, 'Movimento das contas'));
      alvo.appendChild(par('Entradas', emReais(t.entradas), 'verde'));
      alvo.appendChild(par('Saídas das contas', emReais(t.saidasCaixa), 'vermelho'));
      alvo.appendChild(par('Resultado', emReais(t.saldoCaixa), t.saldoCaixa >= 0 ? 'verde' : 'vermelho'));
      if (t.saidasCaixa !== t.saidas) {
        alvo.appendChild(no('h2', null, 'Consumo do mês'));
        alvo.appendChild(par('Despesas', emReais(t.saidas), 'vermelho'));
        alvo.appendChild(no('p', 'rel-nota',
          'São duas contas diferentes e as duas estão certas. "Saídas das contas" é o dinheiro ' +
          'que deixou as contas no mês — a fatura paga entra aqui, a compra no cartão ainda não. ' +
          '"Despesas" é o que foi gasto de fato — a compra no cartão entra aqui, a fatura paga não, ' +
          'senão o mesmo gasto seria contado duas vezes.'));
      }

      var itens = lancamentosDoMes(mesAtivo.ano, mesAtivo.mes).slice().sort(function (a, b) {
        return a.data < b.data ? -1 : a.data > b.data ? 1 : (a.criadoEm || 0) - (b.criadoEm || 0);
      });

      alvo.appendChild(no('h2', null, 'Lançamentos (' + itens.length + ')'));
      if (!itens.length) {
        alvo.appendChild(no('p', 'rel-nota', 'Nenhum lançamento neste mês.'));
      } else {
        alvo.appendChild(tabela(
          [{ rotulo: 'Data' }, { rotulo: 'Descrição' }, { rotulo: 'Categoria' }, { rotulo: 'Valor', numerica: true }],
          itens.map(function (l) {
            var sinal = l.tipo === 'entrada' ? '+' : l.tipo === 'saida' ? '−' : '';
            return [
              celula(dataBr(l.data)),
              celula(l.descricao || '—'),
              celula(l.categoria),
              celula(sinal + ' ' + emReais(l.valor), l.tipo === 'entrada' ? 'verde' : l.tipo === 'saida' ? 'vermelho' : '')
            ];
          })
        ));
      }

      // Os dois lados: onde o dinheiro entrou e onde ele saiu.
      var receitas = gastosPorCategoria(mesAtivo.ano, mesAtivo.mes, 'entrada');
      if (receitas.lista.length) {
        alvo.appendChild(no('h2', null, 'Receitas por categoria'));
        alvo.appendChild(tabela(
          [{ rotulo: 'Categoria' }, { rotulo: 'Valor', numerica: true }, { rotulo: '%', numerica: true }],
          receitas.lista.map(function (g) {
            return [celula(g.nome), celula(emReais(g.valor)), celula(Math.round(pct(g.valor, receitas.total)) + '%')];
          })
        ));
      }

      if (gastos.lista.length) {
        alvo.appendChild(no('h2', null, 'Despesas por categoria'));
        alvo.appendChild(tabela(
          [{ rotulo: 'Categoria' }, { rotulo: 'Valor', numerica: true }, { rotulo: '%', numerica: true }],
          gastos.lista.map(function (g) {
            return [celula(g.nome), celula(emReais(g.valor)), celula(Math.round(pct(g.valor, gastos.total)) + '%')];
          })
        ));
      }
    }

    if (tipo === 'investimentos') {
      var total = totalInvestido(null);
      var aplicado = totalAplicado();
      alvo.appendChild(no('h2', null, 'Posição'));
      alvo.appendChild(par('Valor aplicado', emReais(aplicado)));
      alvo.appendChild(par('Valor atual', emReais(total)));
      alvo.appendChild(par('Resultado', comSinal(total - aplicado), total - aplicado >= 0 ? 'verde' : 'vermelho'));
      if (aplicado > 0) {
        alvo.appendChild(par('Rentabilidade', (((total - aplicado) / aplicado) * 100).toFixed(2).replace('.', ',') + '%'));
      }

      if (!estado.ativos.length) {
        alvo.appendChild(no('p', 'rel-nota', 'Nenhum ativo cadastrado.'));
      } else {
        alvo.appendChild(no('h2', null, 'Ativos'));
        alvo.appendChild(tabela(
          [{ rotulo: 'Ativo' }, { rotulo: 'Classe' }, { rotulo: 'Aplicado', numerica: true },
           { rotulo: 'Atual', numerica: true }, { rotulo: 'Rent.', numerica: true }],
          estado.ativos.map(function (a) {
            var atual = valorAtivo(a);
            var rend = a.aplicado > 0 ? ((atual - a.aplicado) / a.aplicado) * 100 : 0;
            return [
              celula(a.nome), celula(a.classe), celula(emReais(a.aplicado)), celula(emReais(atual)),
              celula(rend.toFixed(2).replace('.', ',') + '%', rend >= 0 ? 'verde' : 'vermelho')
            ];
          })
        ));

        var aloc = alocacaoPorClasse();
        alvo.appendChild(no('h2', null, 'Alocação'));
        alvo.appendChild(tabela(
          [{ rotulo: 'Classe' }, { rotulo: 'Valor', numerica: true }, { rotulo: '%', numerica: true }],
          aloc.lista.map(function (c) {
            return [celula(c.nome), celula(emReais(c.valor)), celula(Math.round(pct(c.valor, aloc.total)) + '%')];
          })
        ));
      }
    }

    if (tipo === 'clientes') {
      var geral = resumoGeralClientes();
      alvo.appendChild(no('h2', null, 'Resumo de todos os clientes'));
      alvo.appendChild(par('Clientes cadastrados', String(estado.clientes.length)));
      alvo.appendChild(par('Serviços prestados', String(estado.servicos.length)));
      alvo.appendChild(par('Valor total dos serviços', emReais(geral.total)));
      alvo.appendChild(par('Já recebido', emReais(geral.pago), 'verde'));
      alvo.appendChild(par('Falta receber', emReais(geral.restante), geral.restante > 0 ? 'vermelho' : 'verde'));
      var prox = proximoPagamentoGeral();
      if (prox) alvo.appendChild(par('Próximo pagamento previsto', dataBr(prox)));

      if (!estado.clientes.length) {
        alvo.appendChild(no('p', 'rel-nota', 'Nenhum cliente cadastrado.'));
      } else {
        alvo.appendChild(no('h2', null, 'Por cliente'));
        alvo.appendChild(tabela(
          [{ rotulo: 'Cliente' }, { rotulo: 'Telefone' }, { rotulo: 'Total', numerica: true },
           { rotulo: 'Pago', numerica: true }, { rotulo: 'Falta', numerica: true }, { rotulo: 'Situação' }],
          estado.clientes.map(function (c) {
            var r = resumoCliente(c.id);
            var sit = situacaoCliente(c);
            return [
              celula(c.nome), celula(c.telefone || '—'), celula(emReais(r.total)),
              celula(emReais(r.pago), 'verde'),
              celula(emReais(r.restante), r.restante > 0 ? 'vermelho' : ''),
              celula(sit.texto)
            ];
          })
        ));

        estado.clientes.forEach(function (c) {
          var servicos = servicosDoCliente(c.id);
          var pagamentos = pagamentosDoCliente(c.id);
          if (!servicos.length && !pagamentos.length) return;
          var r = resumoCliente(c.id);

          alvo.appendChild(no('h2', null, c.nome));
          alvo.appendChild(par('Total / Pago / Falta',
            emReais(r.total) + ' · ' + emReais(r.pago) + ' · ' + emReais(r.restante)));
          if (c.proximoPagamento) alvo.appendChild(par('Próximo pagamento', dataBr(c.proximoPagamento)));

          if (servicos.length) {
            alvo.appendChild(tabela(
              [{ rotulo: 'Data' }, { rotulo: 'Serviço' }, { rotulo: 'Valor', numerica: true }],
              servicos.slice().reverse().map(function (s) {
                return [celula(dataBr(s.data)), celula(s.nome), celula(emReais(s.valor))];
              })
            ));
          }
          if (pagamentos.length) {
            alvo.appendChild(tabela(
              [{ rotulo: 'Data' }, { rotulo: 'Referente a' }, { rotulo: 'Pago', numerica: true }],
              pagamentos.slice().reverse().map(function (p) {
                var s = p.servicoId ? achar(estado.servicos, p.servicoId) : null;
                return [celula(dataBr(p.data)), celula(s ? s.nome : '—'), celula(emReais(p.valor), 'verde')];
              })
            ));
          }
        });
      }
    }

    if (tipo === 'ir') {
      var ano = mesAtivo.ano;
      var fimDoAno = ano + '-12-31';
      var fimAnterior = (ano - 1) + '-12-31';

      // Com o ano ainda correndo, "em 31/12" é uma data que não chegou: o
      // app mostrava o valor de hoje com o rótulo de dezembro, afirmando
      // uma coisa que ainda não aconteceu. Enquanto o ano não fecha, a
      // posição é a de hoje e a tela diz isso.
      var agora = hojeTexto();
      var anoAberto = fimDoAno > agora;
      var ateAgora = anoAberto ? agora : fimDoAno;
      var rotuloAte = anoAberto ? 'Hoje, ' + dataBr(agora) : 'Em 31/12/' + ano;

      alvo.appendChild(no('h2', null, anoAberto
        ? 'Posição hoje, ' + dataBr(agora)
        : 'Posição em 31/12/' + ano));
      if (anoAberto) {
        alvo.appendChild(no('p', 'rel-nota',
          'O ano de ' + ano + ' ainda não fechou. Estes são os valores de hoje, não os de ' +
          '31/12 — a declaração pede a posição do último dia do ano, então volte aqui em janeiro.'));
      }
      if (!estado.ativos.length) {
        alvo.appendChild(no('p', 'rel-nota', 'Nenhum ativo cadastrado.'));
      } else {
        alvo.appendChild(tabela(
          [{ rotulo: 'Ativo' }, { rotulo: 'Classe' }, { rotulo: 'Em 31/12/' + (ano - 1), numerica: true },
           { rotulo: rotuloAte, numerica: true }],
          estado.ativos.map(function (a) {
            return [celula(a.nome), celula(a.classe),
                    celula(emReais(valorAtivoEm(a, fimAnterior))),
                    celula(emReais(valorAtivoEm(a, ateAgora)))];
          })
        ));
        alvo.appendChild(par('Total em 31/12/' + (ano - 1), emReais(totalInvestido(fimAnterior))));
        alvo.appendChild(par('Total ' + (anoAberto ? 'hoje' : 'em 31/12/' + ano),
          emReais(totalInvestido(ateAgora))));
        alvo.appendChild(par(anoAberto ? 'Variação no ano até aqui' : 'Variação no ano',
          comSinal(totalInvestido(ateAgora) - totalInvestido(fimAnterior))));
      }

      var rendimentos = estado.lancamentos.filter(function (l) {
        return l.tipo === 'entrada' && l.categoria === 'Rendimentos' && l.data.indexOf(String(ano)) === 0;
      });
      alvo.appendChild(no('h2', null, 'Rendimentos lançados em ' + ano));
      if (!rendimentos.length) {
        alvo.appendChild(no('p', 'rel-nota', 'Nenhuma entrada na categoria Rendimentos neste ano.'));
      } else {
        alvo.appendChild(tabela(
          [{ rotulo: 'Data' }, { rotulo: 'Descrição' }, { rotulo: 'Valor', numerica: true }],
          rendimentos.map(function (l) {
            return [celula(dataBr(l.data)), celula(l.descricao || '—'), celula(emReais(l.valor))];
          })
        ));
        alvo.appendChild(par('Total', emReais(rendimentos.reduce(function (s, l) { return s + l.valor; }, 0))));
      }

      // Saúde e Educação são as categorias que quase sempre aparecem na
      // declaração. O app não sabe o que é dedutível — quem sabe é a
      // Receita e quem declara —, mas sabe separar o que foi gasto nelas
      // no ano, que é o trabalho chato de garimpar no extrato.
      var CATEGORIAS_IR = ['Saúde', 'Educação'];
      var doAno = estado.lancamentos.filter(function (l) {
        return l.tipo === 'saida' && l.data.indexOf(String(ano)) === 0 &&
               CATEGORIAS_IR.indexOf(l.categoria) >= 0;
      }).sort(function (a, b) { return a.data < b.data ? -1 : a.data > b.data ? 1 : 0; });

      alvo.appendChild(no('h2', null, 'Gastos de Saúde e Educação em ' + ano));
      if (!doAno.length) {
        alvo.appendChild(no('p', 'rel-nota',
          'Nenhuma saída nessas categorias neste ano.'));
      } else {
        alvo.appendChild(tabela(
          [{ rotulo: 'Data' }, { rotulo: 'Categoria' }, { rotulo: 'Descrição' },
           { rotulo: 'Valor', numerica: true }],
          doAno.map(function (l) {
            return [celula(dataBr(l.data)), celula(l.categoria),
                    celula(l.descricao || '—'), celula(emReais(l.valor))];
          })
        ));
        CATEGORIAS_IR.forEach(function (cat) {
          var soma = doAno.reduce(function (s, l) { return l.categoria === cat ? s + l.valor : s; }, 0);
          if (soma > 0) alvo.appendChild(par('Total em ' + cat, emReais(soma)));
        });
        alvo.appendChild(par('Total das duas',
          emReais(doAno.reduce(function (s, l) { return s + l.valor; }, 0))));
        alvo.appendChild(no('p', 'rel-nota',
          'Esta lista é um ponto de partida, não uma conta de dedução. O que entra na ' +
          'declaração, com que limite e com que comprovante, é regra da Receita — ' +
          'confirme com quem faz a sua declaração antes de usar qualquer número daqui.'));
      }

      alvo.appendChild(no('p', 'rel-nota',
        'Este relatório é um apoio montado com os dados que você mesmo cadastrou. ' +
        'Ele não substitui os informes oficiais dos bancos e corretoras, que são a fonte válida para a declaração.'));
    }

    alvo.appendChild(no('p', 'rel-nota',
      'Gerado pelo Finanz a partir dos dados guardados neste aparelho. Para salvar em PDF, use o botão acima e escolha "Salvar como PDF" no destino de impressão.'));

    $('relatorio').classList.add('aberto');
    document.body.style.overflow = 'hidden';
    $('relatorio').scrollTop = 0;
    empilhar({ tipo: 'relatorio' });
  }

  function fecharRelatorioEfeito() {
    $('relatorio').classList.remove('aberto');
    document.body.style.overflow = '';
