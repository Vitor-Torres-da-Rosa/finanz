    for (var i = 0; i < 20; i++) {
      if (i > 0 && i % 5 === 0) saida += '-';
      saida += alfabeto[bytes[i] % alfabeto.length];
    }
    return saida;
  }

  // ---------- Contas de usuário ----------

  function lerContas() {
    try {
      var lista = JSON.parse(localStorage.getItem(CHAVE_CONTAS) || '[]');
      return Array.isArray(lista) ? lista : [];
    } catch (e) { return []; }
  }

  function gravarContas(lista) {
    try {
      localStorage.setItem(CHAVE_CONTAS, JSON.stringify(lista));
    } catch (e) {
      avisar('Não foi possível salvar. Armazenamento cheio?');
    }
  }

  function normalizarEmail(email) { return String(email || '').trim().toLowerCase(); }

  var sessao = null;          // { contaId, chave }
  var filaSalvar = Promise.resolve();

  function salvar() {
    limparCacheDeFatura();
    soltarExtratos();
    if (!sessao) return;

    // Com servidor configurado, a identidade é a da nuvem e o cofre local
    // vira cópia de trabalho, cifrada com a chave deste aparelho.
    if (NUVEM.ligada) {
      filaSalvar = filaSalvar.then(function () {
        return cifrar(sessao.chave, estado).then(function (cofre) {
          try { localStorage.setItem('caixa.cofre.' + sessao.contaId, cofre); } catch (e) { /* sem espaço */ }
        });
      }).then(function () {
        agendarSincronia();
      }).catch(function () {
        avisar('Não foi possível salvar os dados.');
      });
      return filaSalvar;
    }

    filaSalvar = filaSalvar.then(function () {
      return cifrar(sessao.chave, estado).then(function (cofre) {
        var contas = lerContas();
        var conta = achar(contas, sessao.contaId);
        if (!conta) return;
        conta.cofre = cofre;
        conta.atualizadoEm = Date.now();
        gravarContas(contas);
      });
    }).then(function () {
      agendarSincronia();
    }).catch(function () {
      avisar('Não foi possível salvar os dados.');
    });
    return filaSalvar;
  }

  // Dados soltos das versões anteriores, para levar na primeira conta criada.
  function dadosParaImportar() {
    if (localStorage.getItem('caixa.importado.v3')) return null;
    var bruto = null;
    try { bruto = JSON.parse(localStorage.getItem(CHAVE) || 'null'); } catch (e) { bruto = null; }
    if (bruto) return limparEstado(bruto);
    return migrarDaV1();
  }

  function marcarImportado() {
    try { localStorage.setItem('caixa.importado.v3', '1'); } catch (e) { /* sem espaço, tudo bem */ }
  }

  function criarConta(nome, email, senha) {
    var contas = lerContas();
    var codigo = gerarCodigoRecuperacao();
    var saltSenha = paraBase64(bytesAleatorios(16));
    var saltCodigo = paraBase64(bytesAleatorios(16));
    var chaveMestra;

    return novaChaveMestra().then(function (chave) {
      chaveMestra = chave;
      return Promise.all([
        embrulhar(chaveMestra, senha, saltSenha),
        embrulhar(chaveMestra, codigo, saltCodigo),
        cifrar(chaveMestra, dadosParaImportar() || estadoPadrao())
      ]);
    }).then(function (r) {
      var conta = {
        id: novoId(),
        nome: nome,
        email: normalizarEmail(email),
        criadoEm: Date.now(),
        atualizadoEm: Date.now(),
        saltSenha: saltSenha,
        saltCodigo: saltCodigo,
        envelopeSenha: r[0],
        envelopeCodigo: r[1],
        cofre: r[2]
      };
      contas.push(conta);
      gravarContas(contas);
      marcarImportado();
      return { conta: conta, chave: chaveMestra, codigo: codigo };
    });
  }

  function entrarComSenha(conta, senha) {
    return desembrulhar(conta.envelopeSenha, senha, conta.saltSenha);
  }

  function entrarComCodigo(conta, codigo) {
    return desembrulhar(conta.envelopeCodigo, String(codigo).trim().toUpperCase(), conta.saltCodigo);
  }

  function trocarSenha(conta, chaveMestra, novaSenha) {
    var salt = paraBase64(bytesAleatorios(16));
    return embrulhar(chaveMestra, novaSenha, salt).then(function (envelope) {
      var contas = lerContas();
      var alvo = achar(contas, conta.id);
      if (!alvo) return;
      alvo.saltSenha = salt;
      alvo.envelopeSenha = envelope;
      gravarContas(contas);
    });
  }

  function guardarSessao(contaId, chave, lembrar) {
    return exportarChave(chave).then(function (bruta) {
      var pacote = JSON.stringify({ contaId: contaId, chave: bruta });
      try {
        sessionStorage.setItem(CHAVE_SESSAO, pacote);
        if (lembrar) localStorage.setItem(CHAVE_SESSAO, pacote);
        else localStorage.removeItem(CHAVE_SESSAO);
      } catch (e) { /* sessão só nesta aba */ }
    });
  }

  function limparSessao() {
    try {
      sessionStorage.removeItem(CHAVE_SESSAO);
      localStorage.removeItem(CHAVE_SESSAO);
    } catch (e) { /* nada a fazer */ }
  }

  function sessaoGuardada() {
    var bruto = null;
    try { bruto = sessionStorage.getItem(CHAVE_SESSAO) || localStorage.getItem(CHAVE_SESSAO); } catch (e) { return null; }
    if (!bruto) return null;
    try { return JSON.parse(bruto); } catch (e) { return null; }
  }

  function abrirCofre(conta, chave) {
    sessao = { contaId: conta.id, chave: chave };
    return decifrar(chave, conta.cofre).then(function (dados) {
      estado = limparEstado(dados);
    }).catch(function () {
      estado = estadoPadrao();
    });
  }

  function sair() {
    limparSessao();
    if (NUVEM.ligada) nuvemEsquecer();
    sessao = null;
    estado = estadoPadrao();
    telaAtiva = 'inicio';
    abaInicio = 'geral';
    mostrarEntrada('abertura');
  }

  // ---------- Nuvem: conexão com o Supabase ----------
  //
  // Sem biblioteca: são chamadas diretas às APIs do Supabase.
  // GoTrue cuida do login em /auth/v1, PostgREST cuida dos dados em
  // /rest/v1. A chave publicável vai em todo pedido; o token da pessoa
  // vai no Authorization e é ele que faz o RLS liberar só as linhas dela.

  // O nome antigo continua valendo: um config.js dos tempos do Caixa
  // segue funcionando sem precisar de troca.
  var CFG = window.FINANZ_CONFIG || window.CAIXA_CONFIG || {};
  var NUVEM = {
    ligada: !!(CFG.supabaseUrl && CFG.supabaseAnonKey),
    url: String(CFG.supabaseUrl || '').replace(/\/+$/, ''),
    chave: String(CFG.supabaseAnonKey || '')
  };
  var CHAVE_NUVEM = 'caixa.nuvem.v3';
  var CHAVE_APARELHO = 'caixa.aparelho.v3';

  var sessaoNuvem = null;   // { access_token, refresh_token, expira_em, usuario }

  function lerSessaoNuvem() {
    try {
      var bruto = localStorage.getItem(CHAVE_NUVEM);
      return bruto ? JSON.parse(bruto) : null;
    } catch (e) { return null; }
  }

  function gravarSessaoNuvem(dados) {
    sessaoNuvem = dados;
    try {
      if (dados) localStorage.setItem(CHAVE_NUVEM, JSON.stringify(dados));
      else localStorage.removeItem(CHAVE_NUVEM);
    } catch (e) { /* sem espaço, segue só nesta aba */ }
  }

  function nuvemEsquecer() { gravarSessaoNuvem(null); }

  function guardarSessaoDoServidor(resposta) {
    if (!resposta || !resposta.access_token) return null;
    var dados = {
      access_token: resposta.access_token,
      refresh_token: resposta.refresh_token || '',
      expira_em: Date.now() + ((resposta.expires_in || 3600) * 1000),
      usuario: {
        id: resposta.user ? resposta.user.id : '',
        email: resposta.user ? resposta.user.email : '',
        nome: resposta.user && resposta.user.user_metadata ? (resposta.user.user_metadata.full_name || '') : ''
      }
    };
    gravarSessaoNuvem(dados);
    return dados;
  }

  function erroDoServidor(corpo, status) {
    var msg = '';
    var codigo = '';
    if (corpo && typeof corpo === 'object') {
      msg = corpo.error_description || corpo.msg || corpo.message || corpo.error || corpo.hint || '';
      codigo = corpo.error_code || corpo.code || '';
    }
    if (!msg) msg = 'O servidor respondeu ' + status + '.';
    var e = new Error(msg);
    e.codigo = String(codigo);
    return e;
  }

  function pedirNuvem(caminho, opcoes) {
    opcoes = opcoes || {};
    var cabecalhos = {
      'apikey': NUVEM.chave,
      'Content-Type': 'application/json'
    };
    if (opcoes.token !== false) {
      var token = sessaoNuvem && sessaoNuvem.access_token ? sessaoNuvem.access_token : NUVEM.chave;
      cabecalhos['Authorization'] = 'Bearer ' + token;
    }
    Object.keys(opcoes.cabecalhos || {}).forEach(function (k) { cabecalhos[k] = opcoes.cabecalhos[k]; });

    return fetch(NUVEM.url + caminho, {
      method: opcoes.metodo || 'GET',
      headers: cabecalhos,
      body: opcoes.corpo != null ? JSON.stringify(opcoes.corpo) : undefined
    }).then(function (resposta) {
      return resposta.text().then(function (texto) {
        var corpo = null;
        if (texto) { try { corpo = JSON.parse(texto); } catch (e) { corpo = texto; } }
        if (!resposta.ok) throw erroDoServidor(corpo, resposta.status);
        return corpo;
      });
    });
  }

  // Renova o token quando falta menos de um minuto, para o pedido
  // seguinte não morrer no meio da sincronização.
  function comTokenValido() {
    if (!sessaoNuvem) return Promise.reject(new Error('Sem sessão na nuvem.'));
    if (sessaoNuvem.expira_em - Date.now() > 60000) return Promise.resolve(sessaoNuvem);
    if (!sessaoNuvem.refresh_token) return Promise.resolve(sessaoNuvem);
    return pedirNuvem('/auth/v1/token?grant_type=refresh_token', {
      metodo: 'POST',
      token: false,
      corpo: { refresh_token: sessaoNuvem.refresh_token }
    }).then(function (r) {
      return guardarSessaoDoServidor(r) || sessaoNuvem;
    });
  }

  // O endereço de volta vai explícito em cada pedido que gera e-mail.
  // Sem isso o Supabase usa o Site URL do painel, que pode estar apontando
  // para outro lugar e derruba o link de confirmação num 404.
  function comRetorno(caminho) {
    return caminho + (caminho.indexOf('?') >= 0 ? '&' : '?') +
      'redirect_to=' + encodeURIComponent(nuvemEnderecoRetorno());
  }

  function nuvemReenviarConfirmacao(email) {
    return pedirNuvem(comRetorno('/auth/v1/resend'), {
      metodo: 'POST',
      token: false,
      corpo: { email: normalizarEmail(email), type: 'signup' }
    });
  }

  function nuvemCadastrar(email, senha, nome) {
    return pedirNuvem(comRetorno('/auth/v1/signup'), {
      metodo: 'POST',
      token: false,
      corpo: {
        email: normalizarEmail(email),
        password: senha,
        data: { full_name: nome }
      }
    }).then(function (r) {
      // Com confirmação de e-mail ligada o servidor não devolve token.
      return { sessao: guardarSessaoDoServidor(r), precisaConfirmar: !r.access_token };
    });
  }

  function nuvemEntrar(email, senha) {
    return pedirNuvem('/auth/v1/token?grant_type=password', {
      metodo: 'POST',
      token: false,
      corpo: { email: normalizarEmail(email), password: senha }
    }).then(function (r) {
      var s = guardarSessaoDoServidor(r);
      if (!s) throw new Error('O servidor não devolveu a sessão.');
      return s;
    });
  }

  function nuvemEnderecoRetorno() {
    return location.origin + location.pathname;
  }

  // O servidor diz quais logins sociais estão ligados. Sem isso o app
  // mandaria a pessoa para uma página de erro em JSON.
  var provedoresLigados = null;

  function carregarProvedores() {
    if (!NUVEM.ligada || provedoresLigados) return;
    pedirNuvem('/auth/v1/settings', { token: false }).then(function (r) {
      var ext = (r && r.external) || {};
      provedoresLigados = { google: !!ext.google, apple: !!ext.apple, facebook: !!ext.facebook };
    }).catch(function () {
      provedoresLigados = { google: false, apple: false, facebook: false };
    }).then(function () {
      if (!$('entrada').classList.contains('escondida')) montarEntrada();
    });
  }

  function nuvemEntrarComGoogle() {
    var destino = NUVEM.url + '/auth/v1/authorize?provider=google&redirect_to=' +
      encodeURIComponent(nuvemEnderecoRetorno());
    location.assign(destino);
  }

  // Depois do Google, o token volta no pedaço da URL depois do #.
  function nuvemCapturarRetorno() {
    // Link expirado ou já usado volta com o erro na parte de consulta.
    var consulta = new URLSearchParams(location.search);
    if (consulta.get('error') || consulta.get('error_description')) {
      var motivo = consulta.get('error_description') || consulta.get('error');
      history.replaceState(null, '', location.pathname);
      avisar('Link do e-mail: ' + motivo);
      return false;
    }

    if (!location.hash || location.hash.length < 2) return false;
    var params = new URLSearchParams(location.hash.slice(1));
    var erro = params.get('error_description') || params.get('error');
    var token = params.get('access_token');
    if (!token && !erro) return false;

    history.replaceState(null, '', location.pathname + location.search);

    if (erro) { avisar('Login social: ' + erro); return false; }

    gravarSessaoNuvem({
      access_token: token,
      refresh_token: params.get('refresh_token') || '',
      expira_em: Date.now() + (parseInt(params.get('expires_in'), 10) || 3600) * 1000,
      usuario: { id: '', email: '', nome: '' }
    });
    return true;
  }

  function nuvemBuscarUsuario() {
    return comTokenValido().then(function () {
      return pedirNuvem('/auth/v1/user', {});
    }).then(function (u) {
      if (sessaoNuvem && u && u.id) {
        sessaoNuvem.usuario = {
          id: u.id,
          email: u.email || '',
          nome: (u.user_metadata && u.user_metadata.full_name) || ''
        };
        gravarSessaoNuvem(sessaoNuvem);
      }
      return u;
    });
  }

  function nuvemSairDoServidor() {
    if (!sessaoNuvem) return Promise.resolve();
    return pedirNuvem('/auth/v1/logout', { metodo: 'POST' }).catch(function () { /* já expirou, tudo bem */ });
  }

  // Chave só deste aparelho, para o cofre local continuar cifrado quando
  // a identidade é a da nuvem. Ela fica guardada ao lado dos dados, então
  // vale como camada a mais, não como segredo: quem protege de verdade é
  // a conta no servidor e o bloqueio do aparelho.
  function chaveDoAparelho() {
    var guardada = null;
    try { guardada = localStorage.getItem(CHAVE_APARELHO); } catch (e) { guardada = null; }
    if (guardada) return importarChave(guardada);
    return novaChaveMestra().then(function (chave) {
      return exportarChave(chave).then(function (bruta) {
        try { localStorage.setItem(CHAVE_APARELHO, bruta); } catch (e) { /* segue sem guardar */ }
        return chave;
      });
    });
  }

  // ---------- Nuvem: sincronização dos dados ----------

  function ouNulo(v) { return v ? v : null; }

  // Ordem importa: uma tabela só entra depois daquela de quem ela depende.
  var TABELAS_SINCRONIA = ['contas', 'lancamentos', 'ativos', 'ativo_historico',
                           'clientes', 'servicos', 'pagamentos', 'parcelas', 'metas'];

  function linhasDoEstado(uid) {
    var historico = [];
    estado.ativos.forEach(function (a) {
      a.historico.forEach(function (p) {
        historico.push({ id: a.id + '|' + p.data, user_id: uid, ativo_id: a.id, data: p.data, valor: p.valor });
      });
    });

    return {
      contas: estado.contas.map(function (c) {
        return { id: c.id, user_id: uid, nome: c.nome, tipo: c.tipo,
                 saldo_inicial: c.saldoInicial, cor: c.cor, banco: c.banco || '',
                 fechamento: c.fechamento || 0, vencimento: c.vencimento || 0,
                 limite: c.limite || 0 };
      }),
      lancamentos: estado.lancamentos.map(function (l) {
        return {
          id: l.id, user_id: uid, tipo: l.tipo, valor: l.valor, descricao: l.descricao,
          categoria: l.categoria, subcategoria: l.subcategoria || '',
          data: l.data, importacao_id: l.importacaoId || '',
          conta_id: ouNulo(l.contaId), conta_destino_id: ouNulo(l.contaDestinoId)
        };
      }),
      ativos: estado.ativos.map(function (a) {
        return { id: a.id, user_id: uid, nome: a.nome, classe: a.classe, aplicado: a.aplicado };
      }),
      ativo_historico: historico,
      clientes: estado.clientes.map(function (c) {
        return {
          id: c.id, user_id: uid, nome: c.nome, telefone: c.telefone, obs: c.obs,
          endereco: c.endereco || '',
          whatsapp: c.whatsapp !== false,
          telefones: telefonesDoCliente(c),
          proximo_pagamento: ouNulo(c.proximoPagamento)
        };
      }),
      servicos: estado.servicos.map(function (s) {
        return {
          id: s.id, user_id: uid, cliente_id: s.clienteId, nome: s.nome,
          tipo: s.tipo || 'Serviço',
          valor: s.valor, data: s.data, obs: s.obs
        };
      }),
      parcelas: estado.parcelas.map(function (p) {
        return {
          id: p.id, user_id: uid, cliente_id: p.clienteId, servico_id: ouNulo(p.servicoId),
          pagamento_id: ouNulo(p.pagamentoId), numero: p.numero, total: p.total,
          valor: p.valor, vencimento: p.vencimento,
          minimo: p.minimo || 0, juros_atraso: p.jurosAtraso || 0,
          quitada_em: ouNulo(p.quitadaEm)
        };
      }),
      pagamentos: estado.pagamentos.map(function (p) {
        return {
          id: p.id, user_id: uid, cliente_id: p.clienteId, servico_id: ouNulo(p.servicoId),
          parcela_id: ouNulo(p.parcelaId),
          lancamento_id: ouNulo(p.lancamentoId), valor: p.valor, data: p.data
        };
      }),
      metas: estado.metas.map(function (m) {
        return {
          id: m.id, user_id: uid, nome: m.nome, alvo: m.alvo, guardado: m.guardado,
          conta_id: ouNulo(m.contaId), prazo: ouNulo(m.prazo)
        };
      })
    };
  }

  function perfilParaLinha(uid) {
    var p = estado.perfil;
    return {
      id: uid,
      nome: p.nome,
      reserva_meses: p.reservaMeses,
      idade_atual: p.idadeAtual,
      idade_aposentadoria: p.idadeAposentadoria,
      aporte_mensal: p.aporteMensal,
      rendimento_anual: p.rendimentoAnual,
      inflacao_anual: p.inflacaoAnual,
      retirada_anual: p.retiradaAnual,
      meta_patrimonio: p.metaPatrimonio,
      conta_aposentadoria: ouNulo(p.contaAposentadoria),
      reserva_ligada: p.reservaLigada !== false,
      reserva_conta: ouNulo(p.reservaConta),
      reserva_manual: p.reservaManual,
      tipos_registro: estado.tiposRegistro || [],
      regras_categoria: estado.regrasCategoria || {},
      pares_ignorados: estado.paresIgnorados || [],
      importacoes: estado.importacoes || [],
      propostas: estado.propostas || [],
      negocio: p.negocio || '',
      contato: p.contato || '',
      // A coluna não aceita nulo; quem decide se vale é o lado que lê.
      taxas: p.taxas && p.taxas.bandeiras ? p.taxas : {},
      meta_economia: p.metaEconomia || 20,
      revisados: estado.revisados || {},
      orcamento_geral: estado.orcamentos.geral,
      objetivos: p.objetivos || []
    };
  }

  // Colunas e tabelas que nasceram depois do banco de alguém. Enquanto a
  // migração não roda lá, o servidor recusa o pedido inteiro — e a
  // sincronia de tudo parava por causa de um campo novo. Aqui o app percebe
  // o que falta, manda de novo sem aquilo e segue. O dado continua guardado
  // no aparelho e sobe sozinho assim que a coluna existir.
  var faltaNoBanco = {};

  function semColunas(linhas, colunas) {
    return linhas.map(function (l) {
      var copia = {};
      Object.keys(l).forEach(function (k) { if (colunas.indexOf(k) < 0) copia[k] = l[k]; });
      return copia;
    });
  }

  // Só estas podem ser deixadas de fora. A lista é curta de propósito: é o
  // conjunto das colunas que nasceram depois e que o app sabe viver sem.
  //
  // Sem esse cerco, um erro qualquer que mencionasse o nome de um campo
  // — "null value in column X", uma chave estrangeira com o nome dentro —
  // faria o app reenviar sem aquele campo e apagar no servidor um dado que
  // estava certo. Adivinhar a coluna pela mensagem é perigoso; uma lista
  // fechada não é.
  var COLUNAS_OPCIONAIS = { lancamentos: ['subcategoria'], contas: ['limite'] };

  function oQueFaltou(e, tabela) {
    var opcionais = COLUNAS_OPCIONAIS[tabela];
    if (!opcionais) return null;
    var msg = String((e && e.message) || '').toLowerCase();
    var codigo = String((e && e.codigo) || '');
    // PGRST204 é o "não achei essa coluna" do PostgREST; as outras duas são
    // as frases do Postgres para o mesmo caso.
    var ehColunaQueNaoExiste = codigo === 'PGRST204' ||
      /could not find the '[^']*' column/.test(msg) ||
      /column "[^"]*" of relation .* does not exist/.test(msg) ||
      /column [^ ]* does not exist/.test(msg);
    if (!ehColunaQueNaoExiste) return null;
    var achados = opcionais.filter(function (c) { return msg.indexOf(c.toLowerCase()) >= 0; });
    return achados.length ? achados : null;
  }

  function enviarLinhas(tabela, linhas, aoConflito) {
    if (!linhas.length) return Promise.resolve();
    if (faltaNoBanco['tabela:' + tabela]) return Promise.resolve();
    var tirar = faltaNoBanco['colunas:' + tabela] || [];
    var corpo = tirar.length ? semColunas(linhas, tirar) : linhas;
    var caminho = '/rest/v1/' + tabela + (aoConflito ? '?on_conflict=' + aoConflito : '');
    return pedirNuvem(caminho, {
      metodo: 'POST',
      corpo: corpo,
      cabecalhos: { 'Prefer': 'resolution=merge-duplicates,return=minimal' }
    }).catch(function (e) {
      var faltando = oQueFaltou(e, tabela);
      if (faltando) {
        faltaNoBanco['colunas:' + tabela] = tirar.concat(faltando);
        return enviarLinhas(tabela, linhas, aoConflito);
      }
      // Tabela que ainda não existe: some desta sincronia, volta na próxima
      // sessão, depois de a migração rodar.
      if (String((e && e.codigo) || '') === 'PGRST205' ||
          /relation .* does not exist|could not find the table/i.test(String((e && e.message) || ''))) {
        faltaNoBanco['tabela:' + tabela] = true;
        return null;
      }
      throw e;
    });
  }

  function nuvemEnviar() {
    if (!sessaoNuvem || !sessaoNuvem.usuario.id) return Promise.reject(new Error('Sem sessão na nuvem.'));
    var uid = sessaoNuvem.usuario.id;
    var linhas = linhasDoEstado(uid);
    var agora = new Date().toISOString();
    var tarefa = comTokenValido();

    // Perfil e o teto geral do orçamento
    tarefa = tarefa.then(function () { return enviarLinhas('perfis', [perfilParaLinha(uid)], 'id'); });

    // Demais tabelas, na ordem das dependências
    TABELAS_SINCRONIA.forEach(function (t) {
      tarefa = tarefa.then(function () { return enviarLinhas(t, linhas[t], 'id'); });
    });

    // Orçamento por categoria e categorias criadas na mão: troca tudo,
    // porque a chave é composta e some quando a pessoa desmarca.
    tarefa = tarefa.then(function () {
      return pedirNuvem('/rest/v1/orcamentos?user_id=eq.' + uid, { metodo: 'DELETE' });
    }).then(function () {
      var linhasOrc = Object.keys(estado.orcamentos.categorias).map(function (c) {
        return { user_id: uid, categoria: c, valor: estado.orcamentos.categorias[c] };
      });
      return enviarLinhas('orcamentos', linhasOrc, 'user_id,categoria');
    }).then(function () {
      return pedirNuvem('/rest/v1/categorias_extras?user_id=eq.' + uid, { metodo: 'DELETE' });
    }).then(function () {
      var extras = [];
      ['saida', 'entrada'].forEach(function (tipo) {
        (estado.categoriasExtras[tipo] || []).forEach(function (nome) {
          extras.push({ user_id: uid, tipo: tipo, nome: nome });
        });
      });
      return enviarLinhas('categorias_extras', extras, 'user_id,tipo,nome');
    }).then(function () {
      if (faltaNoBanco['tabela:subcategorias_extras']) return null;
      return pedirNuvem('/rest/v1/subcategorias_extras?user_id=eq.' + uid, { metodo: 'DELETE' })
        .catch(function () { return null; });
    }).then(function () {
      var subs = [];
      ['saida', 'entrada'].forEach(function (tipo) {
        var mapa = (estado.subcategoriasExtras && estado.subcategoriasExtras[tipo]) || {};
        Object.keys(mapa).forEach(function (cat) {
          (mapa[cat] || []).forEach(function (nome) {
            subs.push({ user_id: uid, tipo: tipo, categoria: cat, nome: nome });
          });
        });
      });
      return enviarLinhas('subcategorias_extras', subs, 'user_id,tipo,categoria,nome');
    });

    // Marca como excluído o que a pessoa apagou aqui.
    (estado.excluidos || []).forEach(function (marca) {
      if (TABELAS_SINCRONIA.indexOf(marca.t) < 0) return;
      tarefa = tarefa.then(function () {
        return pedirNuvem('/rest/v1/' + marca.t + '?id=eq.' + encodeURIComponent(marca.id), {
          metodo: 'PATCH',
          corpo: { excluido_em: agora },
          cabecalhos: { 'Prefer': 'return=minimal' }
        });
      });
    });

    return tarefa.then(function () {
      estado.excluidos = [];
      return true;
    });
  }

  function nuvemBaixar() {
    if (!sessaoNuvem || !sessaoNuvem.usuario.id) return Promise.reject(new Error('Sem sessão na nuvem.'));
    var recolhido = {};

    var tarefa = comTokenValido().then(function () {
      return pedirNuvem('/rest/v1/perfis?select=*', {});
    }).then(function (r) { recolhido.perfis = r || []; });

    TABELAS_SINCRONIA.forEach(function (t) {
      tarefa = tarefa.then(function () {
        return pedirNuvem('/rest/v1/' + t + '?select=*&excluido_em=is.null', {});
      }).then(function (r) { recolhido[t] = r || []; });
    });

    tarefa = tarefa.then(function () {
      return pedirNuvem('/rest/v1/orcamentos?select=*', {});
    }).then(function (r) { recolhido.orcamentos = r || []; })
      .then(function () { return pedirNuvem('/rest/v1/categorias_extras?select=*', {}); })
      .then(function (r) { recolhido.categorias_extras = r || []; })
      // Banco sem a migração nova: volta vazio em vez de derrubar a leitura.
      .then(function () {
        return pedirNuvem('/rest/v1/subcategorias_extras?select=*', {}).catch(function () { return []; });
      })
      .then(function (r) { recolhido.subcategorias_extras = r || []; });

    return tarefa.then(function () { return montarEstadoDeLinhas(recolhido); });
  }

  function montarEstadoDeLinhas(r) {
    var novo = estadoPadrao();

    var perfil = (r.perfis || [])[0];
    if (perfil) {
      novo.perfil.nome = perfil.nome || '';
      novo.perfil.reservaMeses = perfil.reserva_meses || 6;
      novo.perfil.idadeAtual = perfil.idade_atual || 30;
      novo.perfil.idadeAposentadoria = perfil.idade_aposentadoria || 60;
      novo.perfil.aporteMensal = perfil.aporte_mensal || 0;
      novo.perfil.rendimentoAnual = Number(perfil.rendimento_anual) || 8;
      novo.perfil.inflacaoAnual = perfil.inflacao_anual == null ? 4 : Number(perfil.inflacao_anual);
      novo.perfil.retiradaAnual = perfil.retirada_anual == null ? 4 : Number(perfil.retirada_anual);
      novo.perfil.metaPatrimonio = perfil.meta_patrimonio || 0;
      novo.perfil.contaAposentadoria = perfil.conta_aposentadoria || '';
      novo.perfil.reservaLigada = perfil.reserva_ligada !== false;
      novo.perfil.reservaConta = perfil.reserva_conta || '';
      novo.perfil.reservaManual = perfil.reserva_manual || 0;
      novo.tiposRegistro = perfil.tipos_registro || [];
      if (perfil.regras_categoria && typeof perfil.regras_categoria === 'object') {
        novo.regrasCategoria = perfil.regras_categoria;
      }
      if (Array.isArray(perfil.pares_ignorados)) novo.paresIgnorados = perfil.pares_ignorados;
      if (Array.isArray(perfil.importacoes)) novo.importacoes = perfil.importacoes;
      if (Array.isArray(perfil.propostas)) novo.propostas = perfil.propostas;
      if (perfil.taxas && Array.isArray(perfil.taxas.bandeiras) && perfil.taxas.bandeiras.length) {
        novo.perfil.taxas = perfil.taxas;
      }
      if (perfil.revisados && typeof perfil.revisados === 'object') novo.revisados = perfil.revisados;
      novo.perfil.metaEconomia = perfil.meta_economia || 20;
      novo.perfil.negocio = perfil.negocio || '';
      novo.perfil.contato = perfil.contato || '';
      novo.perfil.objetivos = perfil.objetivos || [];
      novo.orcamentos.geral = perfil.orcamento_geral || 0;
    }

    novo.contas = (r.contas || []).map(function (c) {
      return { id: c.id, nome: c.nome, tipo: c.tipo, saldoInicial: c.saldo_inicial,
               cor: c.cor, banco: c.banco || '',
               fechamento: c.fechamento || 0, vencimento: c.vencimento || 0,
               limite: c.limite || 0 };
    });

    novo.lancamentos = (r.lancamentos || []).map(function (l) {
      return {
        id: l.id, tipo: l.tipo, valor: l.valor, descricao: l.descricao || '',
        categoria: l.categoria || 'Outros', subcategoria: l.subcategoria || '', data: l.data,
        contaId: l.conta_id || '', contaDestinoId: l.conta_destino_id || '',
        importacaoId: l.importacao_id || '',
        criadoEm: Date.parse(l.criado_em) || Date.now()
      };
    });

    var porAtivo = {};
    (r.ativo_historico || []).forEach(function (p) {
      (porAtivo[p.ativo_id] = porAtivo[p.ativo_id] || []).push({ data: p.data, valor: p.valor });
    });
    novo.ativos = (r.ativos || []).map(function (a) {
      var h = (porAtivo[a.id] || []).sort(function (x, y) { return x.data < y.data ? -1 : 1; });
      return {
        id: a.id, nome: a.nome, classe: a.classe, aplicado: a.aplicado,
        historico: h.length ? h : [{ data: hojeTexto(), valor: a.aplicado }]
      };
    });

    novo.metas = (r.metas || []).map(function (m) {
      return {
        id: m.id, nome: m.nome, alvo: m.alvo, guardado: m.guardado,
        contaId: m.conta_id || '', prazo: m.prazo || ''
      };
    });

    novo.clientes = (r.clientes || []).map(function (c) {
      return {
        id: c.id, nome: c.nome, telefone: c.telefone || '', obs: c.obs || '',
        endereco: c.endereco || '',
        whatsapp: c.whatsapp !== false,
        telefones: Array.isArray(c.telefones) ? c.telefones : [],
        proximoPagamento: c.proximo_pagamento || '',
        criadoEm: Date.parse(c.criado_em) || Date.now()
      };
    });

    novo.servicos = (r.servicos || []).map(function (s) {
      return {
        id: s.id, clienteId: s.cliente_id, nome: s.nome, tipo: s.tipo || 'Serviço',
        valor: s.valor, data: s.data, obs: s.obs || '',
        criadoEm: Date.parse(s.criado_em) || Date.now()
      };
    });

    novo.parcelas = (r.parcelas || []).map(function (p) {
      return {
        id: p.id, clienteId: p.cliente_id, servicoId: p.servico_id || '',
        pagamentoId: p.pagamento_id || '', numero: p.numero, total: p.total,
        valor: p.valor, vencimento: soData(p.vencimento),
        minimo: p.minimo || 0, jurosAtraso: Number(p.juros_atraso) || 0,
        quitadaEm: soData(p.quitada_em),
        criadoEm: Date.parse(p.criado_em) || Date.now()
      };
    });

    novo.pagamentos = (r.pagamentos || []).map(function (p) {
      return {
        id: p.id, clienteId: p.cliente_id, servicoId: p.servico_id || '',
        parcelaId: p.parcela_id || '',
        lancamentoId: p.lancamento_id || '', valor: p.valor, data: p.data,
        criadoEm: Date.parse(p.criado_em) || Date.now()
      };
    });

    (r.orcamentos || []).forEach(function (o) { novo.orcamentos.categorias[o.categoria] = o.valor; });
    (r.categorias_extras || []).forEach(function (c) {
      if (novo.categoriasExtras[c.tipo]) novo.categoriasExtras[c.tipo].push(c.nome);
    });
    (r.subcategorias_extras || []).forEach(function (sc) {
      var mapa = novo.subcategoriasExtras[sc.tipo];
      if (!mapa) return;
      (mapa[sc.categoria] || (mapa[sc.categoria] = [])).push(sc.nome);
    });

    return limparEstado(novo);
  }

  // Registra o que foi apagado, para a nuvem apagar também.
  function marcarExcluido(tabela, id) {
    if (!NUVEM.ligada || !id) return;
    if (!estado.excluidos) estado.excluidos = [];
    estado.excluidos.push({ t: tabela, id: id });
  }

  var sincronizando = false;
  var tempoSincronia = null;

  // Enquanto uma folha, uma pergunta ou um seletor está aberto, a pessoa
  // está no meio de uma edição. Trocar o estado inteiro nessa hora joga
  // fora o que ela acabou de digitar, então a volta do servidor espera.
  function editorAberto() {
    return folhaAberta || dialogoAberto || !!escolhaAtual;
  }

  // A sincronia automática não pode gritar a cada tropeço de rede, mas
  // também não pode falhar em silêncio para sempre: quem confia que os
  // dados estão na nuvem precisa saber quando eles não estão.
  var falhaDaSincronia = null;

  function marcarFalhaDeSincronia(e) {
    var seguidas = (falhaDaSincronia ? falhaDaSincronia.seguidas : 0) + 1;
    falhaDaSincronia = {
      mensagem: (e && e.message) || 'motivo desconhecido',
      quando: Date.now(), seguidas: seguidas
    };
    return falhaDaSincronia;
  }

  function sincronizar(silenciosa) {
    if (!NUVEM.ligada || !sessaoNuvem || !sessaoNuvem.usuario.id) return Promise.resolve(false);
    if (sincronizando) return Promise.resolve(false);
    sincronizando = true;

    return nuvemEnviar().then(function () {
      return editorAberto() ? null : nuvemBaixar();
    }).then(function (doServidor) {
      if (!doServidor) {
        sincronizando = false;
        falhaDaSincronia = null;
        agendarSincronia();
        return false;
      }
      estado = doServidor;
      return salvar().then(function () {
        sincronizando = false;
        falhaDaSincronia = null;
        if (!silenciosa) avisar('Sincronizado com a nuvem.');
        desenhar();
        return true;
      });
    }).catch(function (e) {
      sincronizando = false;
      var f = marcarFalhaDeSincronia(e);
      if (!silenciosa) { avisar('Não sincronizou: ' + f.mensagem); return false; }
      // Três tentativas seguidas já não é tropeço de rede: é problema.
      if (f.seguidas === 3) {
        avisar('Seus dados não estão indo para a nuvem. Veja em Mais.');
      }
      return false;
    });
  }

  // Guarda logo e manda para a nuvem pouco depois, juntando as alterações
  // seguidas num pedido só.
  function agendarSincronia() {
    if (!NUVEM.ligada || !sessaoNuvem) return;
    clearTimeout(tempoSincronia);
    tempoSincronia = setTimeout(function () { sincronizar(true); }, 4000);
  }

  // Abre o cofre local do usuário da nuvem e entra no app.
  function entrarComoUsuarioDaNuvem(primeiroAcesso) {
    return nuvemBuscarUsuario().then(function () {
      return chaveDoAparelho();
    }).then(function (chave) {
      var uid = sessaoNuvem.usuario.id;
      sessao = { contaId: uid, chave: chave };
      var cofre = null;
      try { cofre = localStorage.getItem('caixa.cofre.' + uid); } catch (e) { cofre = null; }
      if (!cofre) { estado = estadoPadrao(); return; }
      return decifrar(chave, cofre).then(function (dados) {
        estado = limparEstado(dados);
      }).catch(function () {
        estado = estadoPadrao();
      });
    }).then(function () {
      if (!primeiroAcesso) return null;
      // Conta nova: leva junto o que já estava neste aparelho.
      var importar = dadosParaImportar();
      if (importar && (importar.lancamentos.length || importar.contas.length)) {
        estado = importar;
        marcarImportado();
      }
      return null;
    }).then(function () {
      esconderEntrada();
      telaAtiva = 'inicio';
      iniciarNavegacao();
      desenhar();
      return sincronizar(true);
    });
  }

  function achar(lista, id) {
    for (var i = 0; i < lista.length; i++) if (lista[i].id === id) return lista[i];
    return null;
  }

  function contaPadrao() {
    if (!estado.contas.length) {
      estado.contas.push({ id: novoId(), nome: 'Carteira', tipo: 'Dinheiro físico', saldoInicial: 0, cor: CORES[0] });
      salvar();
    }
    return estado.contas[0];
  }

  // ---------- Cálculos ----------

  function saldoConta(id, ate) {
    var c = achar(estado.contas, id);
    if (!c) return 0;
    var s = c.saldoInicial;
    estado.lancamentos.forEach(function (l) {
      if (ate && l.data > ate) return;
      if (l.tipo === 'entrada' && l.contaId === id) s += l.valor;
      else if (l.tipo === 'saida' && l.contaId === id) s -= l.valor;
      else if (l.tipo === 'transferencia') {
        if (l.contaId === id) s -= l.valor;
        if (l.contaDestinoId === id) s += l.valor;
      }
    });
    return s;
  }

  // Dinheiro que está mesmo nas contas. Cartão de crédito fica de fora: o
  // que você gastou nele ainda não saiu do banco, é dívida, não saldo.
  function totalEmContas(ate) {
    var cartao = {};
    estado.contas.forEach(function (c) { if (ehCartao(c)) cartao[c.id] = true; });

    var s = 0;
    estado.contas.forEach(function (c) { if (!ehCartao(c)) s += c.saldoInicial; });
    estado.lancamentos.forEach(function (l) {
      if (ate && l.data > ate) return;
      if (cartao[l.contaId]) return;
      if (l.tipo === 'entrada') s += l.valor;
      else if (l.tipo === 'saida') s -= l.valor;
    });
    return s;
  }

  // O que ainda se deve nos cartões, somando tudo o que não foi pago.
  //
  // Pagar a fatura tira dinheiro da conta corrente, então o lançamento que
  // vem do extrato é uma saída de lá — nunca uma entrada no cartão. Sem
  // contar esse pagamento aqui, a dívida só subia: cada compra somava e
  // nada nunca abatia. Transferência cujo destino é o cartão abate igual,
  // que é como fica quando a pessoa lança na mão.
  //
  // O abatimento não passa do que foi devido: ninguém paga mais fatura do
  // que comprou, e sem compra lançada não há fatura para abater.
  function dividaDeCartoes(ate) {
    var cartao = {};
    var inicial = 0;
    var temCartao = false;
    estado.contas.forEach(function (c) {
      if (!ehCartao(c)) return;
      cartao[c.id] = true;
      temCartao = true;
      inicial -= c.saldoInicial;
    });
    if (!temCartao) return 0;

    var compras = 0, creditos = 0, abatido = 0;
    estado.lancamentos.forEach(function (l) {
      if (ate && l.data > ate) return;
      if (cartao[l.contaId]) {
        if (l.tipo === 'saida') compras += l.valor;
        else if (l.tipo === 'entrada') creditos += l.valor;
        return;
      }
      if (l.tipo === 'transferencia' && cartao[l.contaDestinoId]) { abatido += l.valor; return; }
      if (ehPagamentoDeFatura(l)) abatido += l.valor;
    });

    var deveu = inicial + compras - creditos;
    return deveu - Math.min(abatido, Math.max(deveu, 0));
  }

  function valorAtivoEm(ativo, ate) {
    var valor = 0;
    var achou = false;
    for (var i = 0; i < ativo.historico.length; i++) {
      if (!ate || ativo.historico[i].data <= ate) { valor = ativo.historico[i].valor; achou = true; }
    }
    return achou ? valor : 0;
  }

  function valorAtivo(ativo) { return valorAtivoEm(ativo, null); }

  function totalInvestido(ate) {
    var s = 0;
    estado.ativos.forEach(function (a) { s += valorAtivoEm(a, ate); });
    return s;
  }

  function totalAplicado() {
    var s = 0;
    estado.ativos.forEach(function (a) { s += a.aplicado; });
    return s;
  }

  function patrimonio(ate) {
    return totalEmContas(ate) + totalInvestido(ate) - dividaDeCartoes(ate);
  }

  // ---------- Aposentadoria ----------
  //
  // Juros compostos mês a mês, como na planilha. A taxa real desconta a
  // inflação, para o número final valer em dinheiro de hoje.

  function calculoAposentadoria() {
    var p = estado.perfil;
    var anos = Math.max(0, p.idadeAposentadoria - p.idadeAtual);
    var meses = anos * 12;

    var capital = p.contaAposentadoria ? Math.max(saldoConta(p.contaAposentadoria, null), 0) : 0;

    var taxaAno = Math.max(p.rendimentoAnual || 0, 0) / 100;
    var inflacaoAno = Math.max(p.inflacaoAnual || 0, 0) / 100;
    // Taxa real de Fisher: o ganho acima da inflação.
    var taxaRealAno = inflacaoAno > 0 ? (1 + taxaAno) / (1 + inflacaoAno) - 1 : taxaAno;
    var taxaMes = Math.pow(1 + taxaAno, 1 / 12) - 1;
    var taxaRealMes = taxaRealAno > -1 ? Math.pow(1 + taxaRealAno, 1 / 12) - 1 : 0;

    function futuroCom(taxa) {
      if (Math.abs(taxa) < 1e-12) return capital + p.aporteMensal * meses;
      return capital * Math.pow(1 + taxa, meses) +
        p.aporteMensal * ((Math.pow(1 + taxa, meses) - 1) / taxa);
    }

    var bruto = Math.round(futuroCom(taxaMes));
    var real = Math.round(futuroCom(taxaRealMes));
    var investido = capital + p.aporteMensal * meses;
    var juros = bruto - investido;
    var retirada = Math.max(p.retiradaAnual || 4, 0) / 100;

    return {
      anos: anos, meses: meses, capital: capital,
      taxaAno: p.rendimentoAnual, inflacaoAno: p.inflacaoAnual,
      taxaRealAno: taxaRealAno * 100,
      taxaMes: taxaMes * 100,
      bruto: bruto, real: real,
      investido: investido, juros: juros,
      multiplicador: investido > 0 ? bruto / investido : 0,
      jurosPct: bruto > 0 ? (juros / bruto) * 100 : 0,
      rendaPassiva: Math.round(bruto * retirada / 12),
      meta: p.metaPatrimonio,
      metaPct: p.metaPatrimonio > 0 ? (bruto / p.metaPatrimonio) * 100 : 0
    };
  }

  // ---------- Reserva de emergência ----------

  function calculoReserva() {
    var p = estado.perfil;
    var media = mediaDespesas(3);
    var ideal = media * p.reservaMeses;
    var naConta = p.reservaConta ? Math.max(saldoConta(p.reservaConta, null), 0) : 0;
    var guardado = p.reservaConta ? naConta : (p.reservaManual > 0 ? p.reservaManual : Math.max(totalEmContas(null), 0));
    return {
      media: media, ideal: ideal, guardado: guardado, naConta: naConta,
      falta: Math.max(ideal - guardado, 0),
      manual: p.reservaManual,
      origem: p.reservaConta ? 'conta' : (p.reservaManual > 0 ? 'manual' : 'contas')
    };
  }

  // Quanto uma meta já tem guardado: a conta ligada manda, senão o valor digitado.
  function guardadoDaMeta(m) {
    if (m.contaId) {
      var c = achar(estado.contas, m.contaId);
      if (c) return Math.max(saldoConta(m.contaId, null), 0);
    }
    return Math.max(m.guardado || 0, 0);
  }

  function lancamentosDoMes(ano, mes) {
    var pre = prefixoMes(ano, mes);
    return estado.lancamentos.filter(function (l) { return l.data.indexOf(pre) === 0; });
  }

  // ---- fatura do cartão: uma regra só, valendo para o app inteiro ----------
  //
  // Pagar a fatura tira dinheiro da conta, mas não é um gasto novo: o gasto
  // foram as compras que entraram naquela fatura. Somar os dois é somar duas
  // vezes. Daí existirem duas leituras legítimas e diferentes do mesmo mês:
  //
  //   consumo — quanto foi gasto de fato: as compras contam, a fatura não
  //   caixa   — quanto saiu das contas: a fatura conta, as compras ainda não
  //
  // "Despesas", orçamento, rosca e relatórios por categoria são consumo.
  // O cartão "Fluxo de caixa" é caixa, e diz isso na tela.
  var TEXTO_FATURA = /(pag(amento|to)?\.?\s*(de\s*)?\.?\s*fat(ura)?|fat(ura)?\s*(do\s*)?cart|pgto\s*fat)/;

  // Aporte é a saída marcada como investimento — antes era a categoria
  // "Investimentos", hoje é a subcategoria de Financeiro. As duas contam,
  // porque backup antigo restaurado ainda traz a categoria velha.
  function ehAporte(l) {
    return l.categoria === 'Investimentos' ||
           (l.categoria === 'Financeiro' && l.subcategoria === 'Investimento');
  }

  function ehPagamentoDeFatura(l) {
    if (l.tipo !== 'saida') return false;
    if (ehCartao(achar(estado.contas, l.contaId))) return false;
    // Arquivar em Financeiro · Pagamento de fatura é dizer, na mão, o que a
    // descrição às vezes não diz. Vale tanto quanto o texto do extrato.
    if (l.categoria === 'Financeiro' && l.subcategoria === 'Pagamento de fatura') return true;
    return TEXTO_FATURA.test(semAcentoSimples(l.descricao || ''));
  }

  // Só dá para descontar a fatura quando as compras do cartão estão
  // lançadas. Sem elas o pagamento é o único retrato do gasto, e fica.
  function temComprasDeCartao(lista) {
    var ids = {};
    cartoes().forEach(function (c) { ids[c.id] = c; });
    for (var i = 0; i < lista.length; i++) {
      if (lista[i].tipo === 'saida' && ids[lista[i].contaId]) return true;
    }
    return false;
  }

  // A resposta por mês é a mesma para dezenas de linhas na tela, então fica
  // guardada até o próximo desenho ou a próxima gravação.
  var cacheDeCompras = {};

  function limparCacheDeFatura() { cacheDeCompras = {}; }

  function temComprasNoMes(ano, mes) {
    var chave = ano + '-' + mes;
    if (!(chave in cacheDeCompras)) {
      cacheDeCompras[chave] = temComprasDeCartao(lancamentosDoMes(ano, mes));
    }
    return cacheDeCompras[chave];
  }

  // A visão de consumo de uma lista: a mesma lista sem as faturas pagas,
  // mais o que saiu dela e por quê.
  function visaoDeConsumo(lista) {
    if (!temComprasDeCartao(lista)) {
      return { lista: lista, faturasPagas: [], valorDasFaturas: 0, modo: 'fatura' };
    }
    var faturas = [], valor = 0;
    var fora = lista.filter(function (l) {
      if (!ehPagamentoDeFatura(l)) return true;
      faturas.push(l);
      valor += l.valor;
      return false;
    });
    return { lista: fora, faturasPagas: faturas, valorDasFaturas: valor, modo: 'compras' };
  }

  // Este lançamento entra no total de despesas do mês dele? Serve para
  // marcar a linha em Transações sem recalcular o mês inteiro por linha.
  function contaComoDespesa(l) {
    if (l.tipo !== 'saida') return false;
    if (!ehPagamentoDeFatura(l)) return true;
    return !temComprasNoMes(+l.data.slice(0, 4), +l.data.slice(5, 7) - 1);
  }

  // Saída de dinheiro de verdade: o que deixou uma conta. A compra no cartão
  // ainda não saiu de lugar nenhum — ela sai quando a fatura é paga.
  function ehSaidaDeCaixa(l) {
    return l.tipo === 'saida' && !ehCartao(achar(estado.contas, l.contaId));
  }

  function totaisDaLista(lista) {
    var v = visaoDeConsumo(lista);
    var entradas = 0, saidas = 0, saidasCaixa = 0;
    lista.forEach(function (l) {
      if (l.tipo === 'entrada') entradas += l.valor;
      else if (ehSaidaDeCaixa(l)) saidasCaixa += l.valor;
    });
    v.lista.forEach(function (l) { if (l.tipo === 'saida') saidas += l.valor; });
    return {
      entradas: entradas, saidas: saidas, saldo: entradas - saidas,
      saidasCaixa: saidasCaixa, saldoCaixa: entradas - saidasCaixa,
      faturasPagas: v.faturasPagas, valorDasFaturas: v.valorDasFaturas, modo: v.modo
    };
  }

  function porCategoriaDaLista(lista, tipo) {
    var lado = tipo === 'entrada' ? 'entrada' : 'saida';
    var base = lado === 'saida'
      ? visaoDeConsumo(lista)
      : { lista: lista, faturasPagas: [], valorDasFaturas: 0, modo: 'fatura' };
    var mapa = {};
    var total = 0;
    base.lista.forEach(function (l) {
      if (l.tipo !== lado) return;
      mapa[l.categoria] = (mapa[l.categoria] || 0) + l.valor;
      total += l.valor;
    });
    var ordenada = Object.keys(mapa).map(function (nome) {
      return { nome: nome, valor: mapa[nome] };
    }).sort(function (a, b) { return b.valor - a.valor; });
    return {
      lista: ordenada, total: total, base: base.lista,
      faturasPagas: base.faturasPagas, valorDasFaturas: base.valorDasFaturas, modo: base.modo
    };
  }

  function totaisDoMes(ano, mes) { return totaisDaLista(lancamentosDoMes(ano, mes)); }

  function gastosPorCategoria(ano, mes, tipo) {
    return porCategoriaDaLista(lancamentosDoMes(ano, mes), tipo);
  }

  function alocacaoPorClasse() {
    var mapa = {};
    var total = 0;
    estado.ativos.forEach(function (a) {
      var v = valorAtivo(a);
      mapa[a.classe] = (mapa[a.classe] || 0) + v;
      total += v;
    });
    var lista = Object.keys(mapa).map(function (nome) {
      return { nome: nome, valor: mapa[nome] };
    }).sort(function (a, b) { return b.valor - a.valor; });
    return { lista: lista, total: total };
  }

  function mediaDespesas(meses) {
    var hoje = new Date();
    var soma = 0, contados = 0;
    for (var i = 1; i <= meses; i++) {
      var d = new Date(hoje.getFullYear(), hoje.getMonth() - i, 1);
      var t = totaisDoMes(d.getFullYear(), d.getMonth());
      if (t.entradas > 0 || t.saidas > 0) { soma += t.saidas; contados++; }
    }
    if (!contados) {
      var atual = totaisDoMes(hoje.getFullYear(), hoje.getMonth());
      return atual.saidas;
    }
    return Math.round(soma / contados);
  }

  function seriePatrimonio(dias) {
    var pontos = [];
    var fim = hojeTexto();
    for (var i = dias - 1; i >= 0; i--) {
      var d = somaDias(fim, -i);
      pontos.push({ data: d, valor: patrimonio(d) });
    }
    return pontos;
  }

  function serieInvestimentos(dias) {
    var pontos = [];
    var fim = hojeTexto();
    for (var i = dias - 1; i >= 0; i--) {
      var d = somaDias(fim, -i);
      pontos.push({ data: d, valor: totalInvestido(d) });
    }
    return pontos;
  }

  // ---------- Construção de elementos ----------

  function no(tag, classe, conteudo) {
    var e = document.createElement(tag);
    if (classe) e.className = classe;
    if (conteudo != null) e.textContent = conteudo;
    return e;
  }

  function juntar(pai) {
    for (var i = 1; i < arguments.length; i++) {
      var f = arguments[i];
      if (f) pai.appendChild(f);
    }
    return pai;
  }

  function botao(classe, conteudo, aoClicar) {
    var b = no('button', classe, conteudo);
    b.type = 'button';
    if (aoClicar) b.addEventListener('click', aoClicar);
    return b;
  }

  function svgNo(nome, atributos) {
    var e = document.createElementNS('http://www.w3.org/2000/svg', nome);
    Object.keys(atributos || {}).forEach(function (k) { e.setAttribute(k, atributos[k]); });
    return e;
  }

  var contadorId = 0;
  function idUnico() { contadorId += 1; return 'g' + contadorId; }

  // ---------- Gráfico de área ----------

  function graficoArea(pontos, cor) {
    var L = 320, A = 132, base = 108, topo = 12;
    var svg = svgNo('svg', {
      'class': 'grafico', viewBox: '0 0 ' + L + ' ' + A,
      preserveAspectRatio: 'none', role: 'img', height: '132'
    });
    svg.style.height = 'auto';

    if (pontos.length < 2) {
      svg.setAttribute('aria-label', 'Sem dados suficientes para o gráfico');
      return svg;
    }

    var valores = pontos.map(function (p) { return p.valor; });
    var min = Math.min.apply(null, valores);
    var max = Math.max.apply(null, valores);
    if (max === min) { max = min + 1; }
    var faixa = max - min;
    min -= faixa * 0.12;
    max += faixa * 0.12;

    function x(i) { return (i / (pontos.length - 1)) * L; }
    function y(v) { return base - ((v - min) / (max - min)) * (base - topo); }

    // Linhas de grade
    for (var g = 0; g <= 3; g++) {
      var yy = topo + ((base - topo) / 3) * g;
      svg.appendChild(svgNo('line', {
        x1: 0, y1: yy, x2: L, y2: yy,
        stroke: 'rgba(198,158,78,.16)', 'stroke-width': 1, 'vector-effect': 'non-scaling-stroke'
      }));
    }

    var d = '';
    pontos.forEach(function (p, i) { d += (i ? 'L' : 'M') + x(i).toFixed(2) + ' ' + y(p.valor).toFixed(2) + ' '; });

    var idGrad = idUnico();
    var defs = svgNo('defs', {});
    var grad = svgNo('linearGradient', { id: idGrad, x1: '0', y1: '0', x2: '0', y2: '1' });
    var p1 = svgNo('stop', { offset: '0%', 'stop-color': cor, 'stop-opacity': '.20' });
    var p2 = svgNo('stop', { offset: '100%', 'stop-color': cor, 'stop-opacity': '0' });
    juntar(grad, p1, p2);
    defs.appendChild(grad);
    svg.appendChild(defs);

    svg.appendChild(svgNo('path', {
      d: d + 'L' + L + ' ' + base + ' L0 ' + base + ' Z',
      fill: 'url(#' + idGrad + ')'
    }));

    svg.appendChild(svgNo('path', {
      d: d, fill: 'none', stroke: cor, 'stroke-width': 2,
      'stroke-linejoin': 'round', 'stroke-linecap': 'round',
      'vector-effect': 'non-scaling-stroke'
    }));

    var ultimo = pontos[pontos.length - 1];
    svg.appendChild(svgNo('circle', {
      cx: x(pontos.length - 1) - 1, cy: y(ultimo.valor), r: 3.5,
      fill: cor, stroke: '#08080A', 'stroke-width': 2
    }));

    svg.setAttribute('aria-label',
      'Evolução de ' + emReais(pontos[0].valor) + ' em ' + dataCurta(pontos[0].data) +
      ' até ' + emReais(ultimo.valor) + ' hoje');

    return svg;
  }

  function blocoGrafico(pontos, cor) {
    var caixa = no('div');
    caixa.appendChild(graficoArea(pontos, cor));
    if (pontos.length >= 2) {
      var eixo = no('div', 'grafico-eixo');
      var passo = Math.max(1, Math.floor((pontos.length - 1) / 4));
      for (var i = 0; i < pontos.length - 1; i += passo) {
        eixo.appendChild(no('span', null, dataCurta(pontos[i].data)));
      }
      eixo.appendChild(no('span', null, 'Hoje'));
      caixa.appendChild(eixo);
    }
    return caixa;
  }

  // ---------- Rosca ----------

  function rosca(segmentos, total, rotuloCentro) {
    var caixa = no('div', 'rosca-caixa');
    var raio = 56, largura = 20, centro = 70, circ = 2 * Math.PI * raio;

    var svg = svgNo('svg', { viewBox: '0 0 140 140', width: '168', height: '168', role: 'img' });
    svg.appendChild(svgNo('circle', {
      cx: centro, cy: centro, r: raio, fill: 'none',
      stroke: 'rgba(255,255,255,.07)', 'stroke-width': largura
    }));

    var acumulado = 0;
    segmentos.forEach(function (s, i) {
      if (!s.valor || total <= 0) return;
      var fatia = (s.valor / total) * circ;
      var arco = svgNo('circle', {
        cx: centro, cy: centro, r: raio, fill: 'none',
        stroke: s.cor || corDeCategoria(s.nome),
        'stroke-width': largura,
        'stroke-dasharray': Math.max(fatia - 2, 0.5) + ' ' + (circ - Math.max(fatia - 2, 0.5)),
        'stroke-dashoffset': -acumulado,
        'stroke-linecap': 'butt',
        transform: 'rotate(-90 ' + centro + ' ' + centro + ')'
      });
      svg.appendChild(arco);
      acumulado += fatia;
    });

    svg.setAttribute('aria-label', segmentos.map(function (s) {
      return s.nome + ' ' + Math.round(pct(s.valor, total)) + '%';
    }).join(', ') || 'Sem dados');

    caixa.appendChild(svg);

    var meio = no('div', 'rosca-centro');
    juntar(meio, no('div', 't', rotuloCentro || 'Total'), no('div', 'v', emReais(total)));
    caixa.appendChild(meio);

    return caixa;
  }

  // `aoTocar` transforma cada fatia em botão: quem vê 34% numa categoria
  // quer saber de onde saiu esse número, e o lugar de responder é a própria
  // linha que mostra o número. Sem ele, a legenda continua sendo só legenda.
  function legenda(segmentos, total, aoTocar) {
    var lista = no('div', 'legenda');
    segmentos.forEach(function (s, i) {
      var item = aoTocar
        ? botao('legenda-item legenda-alvo', null, function () { aoTocar(s); })
        : no('div', 'legenda-item');
      var bolinha = no('i', 'bolinha');
      bolinha.style.background = s.cor || corDeCategoria(s.nome);
      juntar(item,
        bolinha,
        no('span', 'nome', s.nome),
        no('span', 'val', emReais(s.valor)),
        no('span', 'pct', Math.round(pct(s.valor, total)) + '%')
      );
      if (aoTocar) {
        item.appendChild(no('span', 'legenda-seta', '\u203A'));
        item.setAttribute('aria-label', 'Ver os lançamentos de ' + s.nome);
      }
      lista.appendChild(item);
    });
    return lista;
  }

  function comCores(lista) {
    return lista.map(function (item) {
      return { nome: item.nome, valor: item.valor, cor: corDeCategoria(item.nome) };
    });
  }

  // ---------- Peças reutilizáveis ----------

  function cartao(classeExtra) {
    return no('div', 'cartao' + (classeExtra ? ' ' + classeExtra : ''));
  }

  function topoDeCartao(titulo, textoAcao, aoClicar) {
    var topo = no('div', 'cartao-topo');
    topo.appendChild(no('div', 'cartao-titulo', titulo));
    if (textoAcao) {
      var rotuloAcao = /^Ver /.test(textoAcao) ? textoAcao + ' ›' : textoAcao;
      topo.appendChild(botao('cartao-acao', rotuloAcao, aoClicar));
    }
    return topo;
  }

  function variacao(atual, anterior) {
    var el = no('div', 'variacao');
    if (!anterior) {
      el.className = 'variacao';
      el.appendChild(no('span', 'resto', 'sem base de comparação'));
      return el;
    }
    var dif = atual - anterior;
    var p = (dif / Math.abs(anterior)) * 100;
    el.className = 'variacao ' + (dif >= 0 ? 'sobe' : 'desce');
    el.appendChild(no('span', null, (dif >= 0 ? '↑ ' : '↓ ') + Math.abs(p).toFixed(1).replace('.', ',') + '%'));
    el.appendChild(no('span', 'resto', '(' + comSinal(dif) + ')'));
    return el;
  }

  function progresso(feito, alvo, cor) {
    var t = no('div', 'trilho');
    var i = no('i');
    i.style.width = Math.min(100, pct(feito, alvo)).toFixed(1) + '%';
    i.style.background = cor || 'var(--ouro)';
    t.appendChild(i);
    return t;
  }

  function segmentos(opcoes, ativo, aoTrocar) {
    var caixa = no('div', 'segmentos');
    caixa.setAttribute('role', 'tablist');
    opcoes.forEach(function (op) {
      var b = botao(null, op.rotulo, function () { aoTrocar(op.valor); });
      b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', op.valor === ativo ? 'true' : 'false');
      caixa.appendChild(b);
    });
    return caixa;
  }

  function estadoVazio(titulo, detalhe) {
    var v = no('div', 'vazio');
    v.appendChild(no('strong', null, titulo));
    v.appendChild(document.createTextNode(detalhe));
    return v;
  }

  // Um <label> ligado ao input abre o seletor com o toque da pessoa. O
  // click() por JavaScript funciona no computador, mas em vários Android
  // ele devolve um arquivo que o sistema depois não deixa ler.
  function rotuloDeArquivo(paraId, classe) {
    var l = no('label', classe);
    l.setAttribute('for', paraId);
    l.setAttribute('role', 'button');
    l.tabIndex = 0;
    l.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $(paraId).click(); }
    });
    return l;
  }

  function selo(cor, letra) {
    var s = no('div', 'selo', letra);
    s.style.background = cor + '22';
    s.style.color = cor;
    if (String(letra || '').length > 1) s.classList.add('selo-curto');
    return s;
  }

  // Claro ou escuro? Serve para escolher a cor do texto em cima da marca.
  function ehClara(hex) {
    var m = /^#([0-9a-fA-F]{6})$/.exec(String(hex || ''));
    if (!m) return false;
    var n = parseInt(m[1], 16);
    var r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    return (0.299 * r + 0.587 * g + 0.114 * b) > 150;
  }

  // O selo de uma conta. Quando eu sei o banco, o selo vira uma plaquinha
  // cheia na cor da marca, com o monograma — assim dois cartões não se
  // confundem na lista.
  function seloDeConta(c) {
    var b = c.banco ? Extrato.bancoPorChave(c.banco) : null;
    if (!b) return selo(c.cor, c.nome.charAt(0).toUpperCase());
    var s = no('div', 'selo selo-marca', b.marca);
    s.style.background = c.cor;
    s.style.color = ehClara(c.cor) ? '#12100C' : '#FFFFFF';
    if (b.marca.length > 2) s.classList.add('selo-curto');
    return s;
  }

  // ---------- Ícones ----------

  function caminho(d, extra) {
    var atrib = { d: d, stroke: 'currentColor', 'stroke-width': 1.7, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', fill: 'none' };
    Object.keys(extra || {}).forEach(function (k) { atrib[k] = extra[k]; });
    return svgNo('path', atrib);

  function campoEntrada(nomeIcone, tipo, dica, valor) {
    var caixa = no('div', 'ent-campo');
    var ic = no('div', 'icone');
    ic.appendChild(icone(nomeIcone));
    caixa.appendChild(ic);

    var input = no('input');
    input.type = tipo === 'senha' ? 'password' : tipo;
    input.placeholder = dica;
    input.value = valor || '';
    if (tipo === 'email') { input.autocapitalize = 'off'; input.autocorrect = 'off'; input.inputMode = 'email'; }
    if (tipo === 'tel') input.inputMode = 'tel';
    caixa.appendChild(input);

    if (tipo === 'senha') {
      var olho = botao('olho', null, function () {
        var escondida = input.type === 'password';
        input.type = escondida ? 'text' : 'password';
        olho.textContent = '';
        olho.appendChild(icone(escondida ? 'olhoFechado' : 'olho'));
        olho.setAttribute('aria-label', escondida ? 'Esconder senha' : 'Mostrar senha');
      });
      olho.appendChild(icone('olho'));
      olho.setAttribute('aria-label', 'Mostrar senha');
      caixa.appendChild(olho);
    }

    caixa.campo = input;
    return caixa;
  }

  function acionarSocial(provedor) {
    if (!NUVEM.ligada) {
      avisar('Entrar com Google, Apple ou Facebook precisa do servidor ligado.');
      return;
    }
    if (!provedoresLigados || !provedoresLigados[provedor]) {
      avisar('Esse login ainda não está habilitado no servidor.');
      return;
    }
    if (provedor !== 'google') {
      avisar('Por enquanto só o Google está ligado no aplicativo.');
      return;
    }
    nuvemEntrarComGoogle();
  }

    return !!(provedoresLigados &&

  function montarAbertura(folha) {
    folha.appendChild(marcaCaixa());

    var carrossel = no('div', 'carrossel');
    LAMINAS.forEach(function (lamina) {
      var slide = no('div');
      var h = no('h1', 'ent-titulo');
      h.appendChild(document.createTextNode(lamina.titulo[0]));
      h.appendChild(no('span', 'ouro', lamina.titulo[1]));
      slide.appendChild(h);
      slide.appendChild(no('p', 'ent-texto', lamina.texto));

      var grade = no('div', 'vantagens');
      lamina.vantagens.forEach(function (v) {
        var item = no('div', 'vantagem');
        var quadro = no('div', 'quadro');
        quadro.appendChild(icone(v[0]));
        item.appendChild(quadro);
        item.appendChild(no('div', 'nome', v[1]));
        item.appendChild(no('div', 'detalhe', v[2]));
        grade.appendChild(item);
      });
      slide.appendChild(grade);
      carrossel.appendChild(slide);
    });
    folha.appendChild(carrossel);

    var pontos = no('div', 'pontos');
    LAMINAS.forEach(function (_, i) {
      var p = no('i');
      if (i === 0) p.className = 'ativo';
      pontos.appendChild(p);
    });
    folha.appendChild(pontos);

    carrossel.addEventListener('scroll', function () {
      var indice = Math.round(carrossel.scrollLeft / carrossel.clientWidth);
      Array.prototype.forEach.call(pontos.children, function (p, i) {
        p.className = i === indice ? 'ativo' : '';
      });
    });

    var fundo = no('div', 'ent-fundo');

    var criar = botao('btn-dourado', null, function () { irEntrada('cadastro'); });
    criar.appendChild(icone('email'));
    criar.appendChild(no('span', null, 'Criar minha conta'));
    fundo.appendChild(criar);

    var entrar = botao('btn-contorno', null, function () { irEntrada('login'); });
    entrar.appendChild(icone('entrar'));
    entrar.appendChild(no('span', null, 'Entrar na minha conta'));
    fundo.appendChild(entrar);

    if (algumProvedorLigado()) {
      fundo.appendChild(no('div', 'separador', 'ou continue com'));
      var sociais = no('div', 'sociais-linha');
      if (provedoresLigados.google) sociais.appendChild(botaoSocial('Continuar com Google', logoGoogle(), 'google'));
      if (provedoresLigados.apple) sociais.appendChild(botaoSocial('Continuar com Apple', logoApple(), 'apple'));

      fundo.appendChild(sociais);

    var termos = no('p', 'termos');
    termos.appendChild(document.createTextNode('Ao continuar, você concorda com os '));

    termos.appendChild(document.createTextNode('.'));
    fundo.appendChild(termos);

    folha.appendChild(fundo);
  }

  // ---------- Empreendedor: cálculos ----------

  function servicosDoCliente(id) {

  }

  function pagamentosDoCliente(id) {

  }

  function parcelasDoCliente(id) {
    return estado.parcelas.filter(function (p) { return p.clienteId === id; })
      .sort(function (a, b) {
        if (a.vencimento !== b.vencimento) return a.vencimento < b.vencimento ? -1 : 1;
        return a.numero - b.numero;
      });
  }

  // Quanto já entrou nesta parcela.
  function pagoNaParcela(p) {
    var soma = 0;
    estado.pagamentos.forEach(function (g) { if (g.parcelaId === p.id) soma += g.valor; });
    // Compatibilidade: as parcelas antigas apontavam para um pagamento só.
    if (!soma && p.pagamentoId) {

      if (antigo) soma = antigo.valor;
    }
    return soma;
  }

  // Juros simples de atraso, contados por dia a partir da taxa mensal.
  // Param de correr assim que a parcela é quitada.
  function jurosDaParcela(p) {
    if (parcelaPaga(p)) return 0;

    if (taxa <= 0) return 0;
    var hoje = hojeTexto();
    if (p.vencimento >= hoje) return 0;
    var dias = Math.round((comoData(hoje) - comoData(p.vencimento)) / 86400000);

  // O que falta pagar nesta parcela, já com os juros de atraso.
  function faltaNaParcela(p) {
    if (parcelaPaga(p)) return 0;
    return Math.max(p.valor + jurosDaParcela(p) - pagoNaParcela(p), 0);
  }

  function parcelaPaga(p) {
    if (p.quitadaEm) return true;
    if (p.pagamentoId && achar(estado.pagamentos, p.pagamentoId)) return true;

  // ---------- O plano de parcelas ----------

  function planoDaParcela(p) {
    return estado.parcelas.filter(function (o) {
      return o.clienteId === p.clienteId && (o.servicoId || '') === (p.servicoId || '');
    }).sort(function (a, b) {
      if (a.vencimento !== b.vencimento) return a.vencimento < b.vencimento ? -1 : 1;

  // Nenhuma parcela nova passa da maior que já existe no combinado.

    var teto = 0;
    plano.forEach(function (p) { if (p.valor > teto) teto = p.valor; });

  function renumerarPlano(plano) {

  function abaterSobra(parcela, sobra, quando) {

  // Depois de mexer em dinheiro, a soma das parcelas em aberto tem que

  function acertarParcelas(clienteId, parcelaBase, fixaId) {
    var todas = parcelasDoCliente(clienteId);
    // Sem parcela nenhuma eu não invento um plano: a pessoa apagou de propósito.
    if (!todas.length) return;

    var abertas = todas.filter(function (p) { return !parcelaPaga(p); });
    var restante = Math.max(resumoCliente(clienteId).restante, 0);

    var fixa = fixaId ? achar(abertas, fixaId) : null;

    function apagar(lista) {
      if (!lista.length) return;
      var fora = {};
      lista.forEach(function (p) { fora[p.id] = true; marcarExcluido('parcelas', p.id); });
      estado.parcelas = estado.parcelas.filter(function (p) { return !fora[p.id]; });
    }

    if (restante <= 0) {
      apagar(abertas);
      renumerarCliente(clienteId);
      return;
    }

    // O valor combinado por parcela é o maior do plano: as sobras são menores.
    // A parcela recém-mexida fica de fora da régua — senão baixar uma parcela
    // encolheria o plano inteiro junto com ela.
    var padrao = 0;
    todas.forEach(function (p) {
      if (fixa && p.id === fixa.id) return;
      if (p.valor > padrao) padrao = p.valor;
    });
    if (padrao <= 0) padrao = restante;

    var quantas = Math.max(1, Math.ceil(restante / padrao));
    if (quantas > 240) { quantas = 240; padrao = Math.ceil(restante / 240); }

    abertas.sort(function (a, b) {
      if (a.vencimento !== b.vencimento) return a.vencimento < b.vencimento ? -1 : 1;
      return (a.numero || 0) - (b.numero || 0);
    });

    var modelo = (parcelaBase && achar(estado.parcelas, parcelaBase.id)) || abertas[0] || todas[0];
    var ultimoVencimento = '';
    todas.forEach(function (p) { if (p.vencimento > ultimoVencimento) ultimoVencimento = p.vencimento; });

    var sobrando = restante;
    for (var i = 0; i < quantas; i++) {
      var valor = i === quantas - 1 ? sobrando : Math.min(padrao, sobrando);
      sobrando -= valor;

      if (abertas[i]) {
        abertas[i].valor = valor;
        if (abertas[i].vencimento > ultimoVencimento) ultimoVencimento = abertas[i].vencimento;
        continue;
      }
      ultimoVencimento = somaMeses(ultimoVencimento || hojeTexto(), 1);
      estado.parcelas.push({
        id: novoId(),
        clienteId: clienteId,
        servicoId: modelo ? modelo.servicoId : '',
        numero: 0, total: 0,
        valor: valor,
        vencimento: ultimoVencimento,
        minimo: 0,
        jurosAtraso: modelo ? (modelo.jurosAtraso || 0) : 0,
        quitadaEm: '', pagamentoId: '',
        criadoEm: Date.now() + i
      });

    if (abertas.length > quantas) apagar(abertas.slice(quantas));

    var achado = '';

    return achado;

  // Quanto dá para pagar de menos nesta parcela.

    return Math.min(p.minimo, falta);

  function atrasoDoCliente(id) {

    var vencidas = parcelasDoCliente(id).filter(function (p) {
      return !parcelaPaga(p) && p.vencimento < hoje;
    });
    var total = vencidas.reduce(function (soma, p) { return soma + faltaNaParcela(p); }, 0);
    var juros = vencidas.reduce(function (soma, p) { return soma + jurosDaParcela(p); }, 0);

  function proximoVencimento(id) {
    var hoje = hojeTexto();
    var abertas = parcelasDoCliente(id).filter(function (p) {
      return !parcelaPaga(p) && p.vencimento >= hoje;
    });
    if (abertas.length) return abertas[0].vencimento;
    var cliente = achar(estado.clientes, id);
    return cliente && cliente.proximoPagamento ? cliente.proximoPagamento : '';
  }

  function clienteAtrasado(id) {
    var a = atrasoDoCliente(id);
    if (a.vencidas.length) return true;
    var cliente = achar(estado.clientes, id);
    return !!(cliente && cliente.proximoPagamento && cliente.proximoPagamento < hojeTexto() &&

  function resumoCliente(id) {
    var total = 0, pago = 0;
    estado.servicos.forEach(function (s) { if (s.clienteId === id) total += s.valor; });
    estado.pagamentos.forEach(function (p) { if (p.clienteId === id) pago += p.valor; });
    return { total: total, pago: pago, restante: total - pago };
  }

  function resumoGeralClientes() {
    var total = 0, pago = 0;
    estado.servicos.forEach(function (s) { total += s.valor; });
    estado.pagamentos.forEach(function (p) { pago += p.valor; });
    var atrasados = 0;
    var emAtraso = 0;
    estado.clientes.forEach(function (c) {
      if (!clienteAtrasado(c.id)) return;
      atrasados += 1;
      emAtraso += atrasoDoCliente(c.id).total;

    var r = resumoCliente(cliente.id);

    if (r.restante <= 0) return { classe: 'quitado', texto: 'quitado' };
    if (clienteAtrasado(cliente.id)) return { classe: 'atrasado', texto: 'atrasado' };

  // ---- os recados dos clientes ----------------------------------------
  //
  // Duas coisas que a ficha sabe e o dono do negócio ia ter que descobrir
  // sozinho: que hoje é dia de dinheiro entrando, e que um cliente está
  // acabando de pagar — que é a hora de oferecer o próximo serviço.

  function parcelasDeHoje(clienteId) {

    return parcelasDoCliente(clienteId).filter(function (p) { return !parcelaPaga(p); });

  // Está acabando: duas parcelas ou menos para quitar, e ainda deve algo.
  function estaAcabando(clienteId) {

    return resumoCliente(clienteId).restante > 0;

  function recadoDeHoje(cliente) {
    var hoje = parcelasDeHoje(cliente.id);
    if (!hoje.length) return null;

    var primeiro = (cliente.nome || '').trim().split(/\s+/)[0] || cliente.nome;
    return {
      tom: 'bom', icone: '💸',
      texto: hoje.length > 1
        ? 'Hoje tem Pix caindo na conta: ' + hoje.length + ' parcelas de ' + primeiro +
          ', somando ' + emReais(soma) + '.'
        : 'Hoje tem Pix caindo na conta: ' + emReais(soma) + ' de ' + primeiro + '.'
    };
  }

  function recadoDeFim(cliente) {
    if (!estaAcabando(cliente.id)) return null;
    var abertas = parcelasAbertas(cliente.id);
    var primeiro = (cliente.nome || '').trim().split(/\s+/)[0] || cliente.nome;
    return {
      tom: 'atencao', icone: '🤝',
      texto: abertas.length === 1
        ? primeiro + ' está na última parcela. Boa hora de oferecer o próximo serviço para não abrir buraco no mês que vem.'
        : 'Faltam 2 parcelas para ' + primeiro + ' quitar. Boa hora de oferecer o próximo serviço e manter a entrada mensal.'
    };

  function recadosDosClientes() {
    var fora = [];
    estado.clientes.forEach(function (c) {
      var hoje = recadoDeHoje(c);
      if (hoje) fora.push({ cliente: c, recado: hoje, ordem: 0 });
      var fim = recadoDeFim(c);
      if (fim) fora.push({ cliente: c, recado: fim, ordem: 1 });
    });
    return fora.sort(function (a, b) { return a.ordem - b.ordem; });
  }

  function proximoPagamentoGeral() {
    var datas = estado.clientes.filter(function (c) {
      return resumoCliente(c.id).restante > 0;
    }).map(function (c) { return proximoVencimento(c.id); })
      .filter(function (d) { return !!d; }).sort();
    return datas.length ? datas[0] : '';
  }

  // A conversa que vai pronta no WhatsApp. Quem envia é você.
  function mensagemDeCobranca(cliente) {
    var atraso = atrasoDoCliente(cliente.id);
    var primeiro = String(cliente.nome || '').split(' ')[0];
    var linhas = ['Oi, ' + primeiro + '! Tudo bem?'];

    if (atraso.vencidas.length) {
      linhas.push('');
      linhas.push('Passando para lembrar do pagamento que ficou em aberto:');
      atraso.vencidas.forEach(function (p) {
        var juros = jurosDaParcela(p);
        linhas.push('• ' + emReais(faltaNaParcela(p)) + ' — venceu em ' + dataBr(p.vencimento) +
          (p.total > 1 ? ' (parcela ' + p.numero + '/' + p.total + ')' : '') +
          (juros > 0 ? ', já com ' + emReais(juros) + ' de juros' : ''));
      });
      linhas.push('');
      linhas.push('Total em aberto: ' + emReais(atraso.total) + '.');
      if (atraso.vencidas.some(function (p) { return minimoDaParcela(p) > 0; })) {
        var minimos = atraso.vencidas.reduce(function (soma, p) { return soma + minimoDaParcela(p); }, 0);
        linhas.push('Dá para começar com ' + emReais(minimos) + ' e acertar o resto depois.');
      }
    } else {
      var r = resumoCliente(cliente.id);
      var proxima = proximoVencimento(cliente.id);
      linhas.push('');
      linhas.push('Passando para combinar o pagamento de ' + emReais(r.restante) +
        (proxima ? ', previsto para ' + dataBr(proxima) : '') + '.');
    }

    linhas.push('');
    linhas.push('Qualquer coisa é só me chamar. Obrigado!');
    return linhas.join('\n');
  }

  // ---------- Transferências entre contas ----------
  //
  // Uma saída numa conta com o mesmo valor de uma entrada em outra conta é
  // quase sempre o mesmo dinheiro andando de lugar. Isso não é receita nem
  // despesa, mas eu não decido sozinho: só aponto.
  //
  // O que amarra o par é o valor, e só ele. O nome nunca serviu: cada banco
  // escreve o seu jeito — "Pix enviado para VITOR TORRES F DA ROSA" de um
  // lado, "Pix recebido · Vitor Torres Fantinelli Da Rosa" do outro — e em
  // transferência entre bancos diferentes nem o titular aparece igual.
  //
  // A data só delimita. Antes o par exigia o mesmo dia, e aí passava batido
  // o caso comum: um extrato lança pela data em que o Pix saiu, o outro pela
  // data em que processou. Um Pix enviado dia 29 chegava importado como dia
  // 31, e o app não via transferência nenhuma — o dinheiro contava como
  // despesa de um lado e receita do outro. Cinco dias para cada lado cobrem
  // fim de semana e feriado, que é onde essa diferença nasce.

  var JANELA_TRANSFERENCIA = 5;

  function chaveDoPar(a, b) {
    return a.id < b.id ? a.id + '|' + b.id : b.id + '|' + a.id;
  }

  function parIgnorado(a, b) {
    var lista = estado.paresIgnorados || [];
    return lista.indexOf(chaveDoPar(a, b)) >= 0;
  }

  function paresDeTransferencia() {
    var saidas = [], entradas = [];
    estado.lancamentos.forEach(function (l) {
      if (!l.contaId) return;
      if (l.tipo === 'saida') saidas.push(l);
      else if (l.tipo === 'entrada') entradas.push(l);
    });
    if (!saidas.length || !entradas.length) return [];

    // Entradas agrupadas só por valor: a data entra depois, como janela.
    var porValor = {};
    entradas.forEach(function (l) {
      (porValor[l.valor] || (porValor[l.valor] = [])).push(l);
    });

    var possiveis = [];
    saidas.forEach(function (s) {
      var lista = porValor[s.valor];
      if (!lista) return;
      lista.forEach(function (e) {
        if (e.contaId === s.contaId) return;
        var dias = diasEntre(s.data, e.data);
        if (Math.abs(dias) > JANELA_TRANSFERENCIA) return;
        if (parIgnorado(s, e)) return;
        possiveis.push({ saida: s, entrada: e, dias: dias, chave: chaveDoPar(s, e) });
      });
    });

    // Com a janela aberta, um valor que se repete casa com mais de uma
    // entrada. O par mais perto no tempo ganha, e cada lançamento entra num
    // par só — senão o mesmo dinheiro seria juntado duas vezes.
    possiveis.sort(function (a, b) {
      var da = Math.abs(a.dias), db = Math.abs(b.dias);
      if (da !== db) return da - db;
      return a.saida.data < b.saida.data ? -1 : a.saida.data > b.saida.data ? 1 : 0;
    });

    var usados = {};
    var pares = [];
    possiveis.forEach(function (p) {
      if (usados[p.saida.id] || usados[p.entrada.id]) return;
      usados[p.saida.id] = true;
      usados[p.entrada.id] = true;
      pares.push(p);
    });

    // Na tela, do mais recente para o mais antigo, como todo resto do app.
    pares.sort(function (a, b) {
      return a.saida.data < b.saida.data ? 1 : a.saida.data > b.saida.data ? -1 : 0;
    });
    return pares;
  }

  function cartaoDeTransferencias(pares) {
    var c = cartao();
    c.appendChild(topoDeCartao('Transferências entre contas', null));
    var soma = pares.reduce(function (t, p) { return t + p.saida.valor; }, 0);
    c.appendChild(no('div', 'linha-nota',
      pares.length === 1
        ? 'Achei 1 saída com o mesmo valor de uma entrada em outra conta, no mesmo dia ou a poucos dias.'
        : 'Achei ' + pares.length + ' saídas com o mesmo valor de entradas em outras contas, no mesmo dia ou a poucos dias.'));
    c.appendChild(no('div', 'valorao pequeno num azul', emReais(soma)));
    c.appendChild(no('div', 'linha-nota',
      'Enquanto não conferir, esse dinheiro conta como receita de um lado e despesa do outro.'));
    var b = botao('btn btn-ouro', 'Conferir', function () { abrirFolhaTransferencias(); });
    b.style.marginTop = '14px';
    c.appendChild(b);
    return c;
  }

  function abrirFolhaTransferencias() {
    var pares = paresDeTransferencia();
    if (!pares.length) { avisar('Nada para conferir.'); return; }
    var marcados = {};
    pares.forEach(function (p) { marcados[p.chave] = true; });

    empilhar({ tipo: 'aba', voltar: function () {} });
    montarFolhaTransferencias(pares, marcados);
  }

  function montarFolhaTransferencias(pares, marcados) {
    var folhaEl = $('folha');
    var rolagem = folhaEl.classList.contains('aberta') ? folhaEl.scrollTop : 0;

    abrirFolha('Transferências entre contas', function (folha) {
