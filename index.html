      if (v == null) { aoEscolher(null); return; }
      // Tocar numa que você criou abre o que dá para fazer com ela.
      if (!categoriaDeFabrica(tipo, v)) { mexerNaCategoria(tipo, v, atual, aoEscolher); return; }
      aoEscolher(v);
    });
  }

  function criarCategoria(tipo, aoEscolher) {
    abrirFolhaTexto('Nova categoria', 'Nome da categoria', '', 'Ex.: Pet, Academia, Obra',
      function (nome) {
        var limpo = nome.trim().slice(0, 30);
        if (!limpo) return;
        if (categoriasDe(tipo).indexOf(limpo) >= 0) { avisar('Essa categoria já existe.'); aoEscolher(limpo); return; }
        estado.categoriasExtras[tipo].push(limpo);
        salvar();
        avisar('Categoria ' + limpo + ' criada.');
        aoEscolher(limpo);
      },
      function () { aoEscolher(null); });
  }

  // O mesmo seletor da categoria, um andar abaixo. "Sem subcategoria"
  // primeiro, porque ela é opcional. `aoEscolher` recebe null quando a
  // pessoa desiste e '' quando ela escolhe ficar sem nenhuma.
  function escolherSubcategoria(tipo, categoria, atual, aoEscolher) {
    var opcoes = [{ valor: '', rotulo: 'Sem subcategoria' }].concat(
      subcategoriasDe(tipo, categoria).map(function (sc) {
        return { valor: sc, rotulo: sc, icone: subDeFabrica(tipo, categoria, sc) ? null : 'lapis' };
      }));
    abrirEscolha({
      titulo: 'Subcategoria de ' + categoria,
      valor: atual || '',
      opcoes: opcoes,
      acao: {
        rotulo: '+ Criar subcategoria',
        aoTocar: function () { criarSubcategoria(tipo, categoria, aoEscolher); }
      }
    }, function (v) { aoEscolher(v == null ? null : v); });
  }

  function criarSubcategoria(tipo, categoria, aoTerminar) {
    abrirFolhaTexto('Nova subcategoria', 'Nome da subcategoria', '',
      'Ex.: Pedágio, Frete, Curso',
      function (nome) {
        var limpo = nome.trim().slice(0, 30);
        if (!limpo) { aoTerminar(null); return; }
        if (subcategoriasDe(tipo, categoria).indexOf(limpo) < 0) {
          guardarSubcategoria(tipo, categoria, limpo);
          salvar();
        }
        aoTerminar(limpo);
      },
      function () { aoTerminar(null); });
  }

  function mexerNaCategoria(tipo, nome, atual, aoEscolher) {
    abrirEscolha({
      titulo: nome,
      semMarca: true,
      opcoes: [
        { valor: 'usar', rotulo: 'Usar esta categoria' },
        { valor: 'renomear', rotulo: 'Renomear' },
        { valor: 'excluir', rotulo: 'Excluir a categoria' }
      ]
    }, function (v) {
      if (v === 'usar') { aoEscolher(nome); return; }
      if (v === 'renomear') { renomearCategoria(tipo, nome, aoEscolher); return; }
      if (v === 'excluir') { excluirCategoria(tipo, nome, aoEscolher); return; }
      escolherCategoria(tipo, atual, aoEscolher);
    });
  }

  function renomearCategoria(tipo, nome, aoEscolher) {
    abrirFolhaTexto('Renomear categoria', 'Nome da categoria', nome, '',
      function (novo) {
        var limpo = novo.trim().slice(0, 30);
        if (!limpo || limpo === nome) { aoEscolher(nome); return; }
        if (categoriasDe(tipo).indexOf(limpo) >= 0) { avisar('Já existe uma categoria com esse nome.'); aoEscolher(nome); return; }
        var i = estado.categoriasExtras[tipo].indexOf(nome);
        if (i >= 0) estado.categoriasExtras[tipo][i] = limpo;
        // Os lançamentos que estavam nela vão junto.
        estado.lancamentos.forEach(function (l) { if (l.tipo === tipo && l.categoria === nome) l.categoria = limpo; });
        Object.keys(estado.regrasCategoria || {}).forEach(function (k) {
          if (estado.regrasCategoria[k] === nome) estado.regrasCategoria[k] = limpo;
        });
        salvar();
        desenhar();
        aoEscolher(limpo);
      },
      function () { aoEscolher(nome); });
  }

  function excluirCategoria(tipo, nome, aoEscolher) {
    var usados = estado.lancamentos.filter(function (l) {
      return l.tipo === tipo && l.categoria === nome;
    }).length;
    perguntar({
      titulo: 'Excluir a categoria ' + nome + '?',
      texto: usados
        ? 'Os ' + usados + ' lançamento(s) que estão nela passam para "Outros". A categoria some da lista.'
        : 'Ela some da lista. Nenhum lançamento usa essa categoria.',
      ok: 'Excluir', tom: 'perigo',
      aoCancelar: function () { aoEscolher(nome); }
    }, function () {
      estado.categoriasExtras[tipo] = estado.categoriasExtras[tipo].filter(function (c) { return c !== nome; });
      estado.lancamentos.forEach(function (l) {
        if (l.tipo === tipo && l.categoria === nome) l.categoria = 'Outros';
      });
      Object.keys(estado.regrasCategoria || {}).forEach(function (k) {
        if (estado.regrasCategoria[k] === nome) delete estado.regrasCategoria[k];
      });
      salvar();
      desenhar();
      avisar('Categoria excluída.');
      aoEscolher('Outros');
    });
  }

  // ---------- Importar extrato do banco ----------

  var PREFIXOS_ORIGEM = [
    /^pix (enviado|recebido)( c6)? (para|de)\s+/,
    /^pix (enviado|recebido)( c6)?\s*[:\-–—]\s*/,
    /^transfer[êe]ncia (enviada|recebida)( pelo pix)?\s*[-–]?\s*/,
    /^(ted|doc) (enviad[ao]|recebid[ao])( para| de)?\s*[-–]?\s*/,
    /^(compra|pagamento|saque|d[ée]bito)( no| de| em)? ?(d[ée]bito|boleto|cart[ãa]o)?\s*[-–]\s*/,
    /^pagamento (de|efetuado)\s+/, /^compra em\s+/, /^recebimento de\s+/
  ];

  // Quem está do outro lado do lançamento. É por esse nome que a pessoa
  // reconhece o gasto, e é nele que a regra de categoria se apoia.
  function nomeDeOrigem(descricao) {
    var s = String(descricao || '').trim();
    var baixo = s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    for (var i = 0; i < PREFIXOS_ORIGEM.length; i++) {
      var m = PREFIXOS_ORIGEM[i].exec(baixo);
      if (m) { s = s.slice(m[0].length); break; }
    }
    return s.replace(/\s+/g, ' ').trim().toUpperCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '').slice(0, 60);
  }

  function regraDeCategoria(descricao) {
    var chave = nomeDeOrigem(descricao);
    return chave && estado.regrasCategoria ? (estado.regrasCategoria[chave] || '') : '';
  }

  var extratoLido = null;

  function nomeDoArquivo(arquivo) { return String((arquivo && arquivo.name) || '').toLowerCase(); }

  function abrirImportarExtrato() {
    var campo = $('arquivoExtrato');
    campo.removeAttribute('accept');
    campo.click();
  }

  // Na segunda tentativa eu peço tipos de documento. Com isso o Android abre
  // o navegador de pastas em vez da lista "Recentes", que é onde o acesso ao
  // arquivo costuma valer uma vez só.
  function escolherComoDocumento() {
    var campo = $('arquivoExtrato');
    campo.setAttribute('accept',
      'application/pdf,text/csv,text/plain,' +
      'application/vnd.ms-excel,' +
      'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,' +
      '.pdf,.csv,.xlsx,.xls,.ofx,.qfx,.txt');
    campo.click();
  }

  // Caminho que não depende de arquivo nenhum: a pessoa abre o extrato,
  // copia o texto e cola aqui. Serve quando o Android não deixa ler o
  // arquivo, e também para quem copia direto do site do banco.
  function abrirColarExtrato() {
    empilhar({ tipo: 'aba', voltar: function () {} });
    abrirFolha('Colar o extrato', function (folha) {
      var forma = no('div');
      forma.appendChild(no('p', 'ajuda',
        'Abra o extrato ou a fatura, segure em cima do texto, escolha "Selecionar tudo" e ' +
        'copie. Depois cole aqui embaixo. Serve também para o texto copiado do site do banco.'));

      var area = no('textarea', 'entrada area-colar');
      area.id = proximoId();
      area.rows = 10;
      area.placeholder = '06/09  Pix enviado para POSTO ...  -R$ 246,02';
      area.autocomplete = 'off';
      area.spellcheck = false;
      forma.appendChild(campo('Texto do extrato', area));

      var acoes = no('div', 'acoes');
      acoes.appendChild(botao('btn btn-ouro', 'Ler o que eu colei', function () {
        var texto = area.value || '';
        if (texto.trim().length < 12) { mostrarErro(forma, 'Cole o texto do extrato aqui.'); return; }

        // Com ponto e vírgula ou tabulação é planilha; senão é texto corrido.
        var linhas = texto.split(/\r?\n/);
        var tabular = linhas.filter(function (l) { return /;|\t/.test(l); }).length > linhas.length / 3;
        var lido = tabular ? Extrato.lerCsv(texto, '') : Extrato.lerLinhas(linhas, '');

        voltarNavegacao();
        setTimeout(function () {
          mostrarExtrato(lido, { name: 'texto colado' }, lido.itens.length ? '' : 'colado');
        }, 240);
      }));
      forma.appendChild(acoes);
      folha.appendChild(forma);
      setTimeout(function () { area.focus(); }, 270);
    });
  }

  // Quando a pessoa usa "Compartilhar" do Android, o service worker guarda o
  // arquivo e recarrega o aplicativo com ?compartilhado=1. Aqui eu pego ele.
  function pegarArquivoCompartilhado() {
    var busca = partilhaBusca;
    partilhaBusca = '';
    if (busca.indexOf('compartilhado=') < 0) return;

    if (busca.indexOf('compartilhado=1') < 0) {
      avisarCaixa('Nada chegou', 'O arquivo não veio junto. Tente compartilhar de novo.', function () {});
      return;
    }
    if (!window.caches) return;

    caches.open('finanz-partilha').then(function (cache) {
      return cache.match('./arquivo-compartilhado').then(function (r) {
        if (!r) return null;
        var nome = 'arquivo';
        try { nome = decodeURIComponent(r.headers.get('X-Nome') || 'arquivo'); } catch (e) {}
        var tipo = r.headers.get('Content-Type') || 'application/octet-stream';
        return r.blob().then(function (b) {
          cache.delete('./arquivo-compartilhado');
          return new File([b], nome, { type: tipo });
        });
      });
    }).then(function (arquivo) {
      if (!arquivo || !arquivo.size) return;
      lerVariosExtratos([arquivo], null, ['']);
    }).catch(function () {
      avisarCaixa('Nada chegou', 'Não consegui pegar o arquivo compartilhado. Tente de novo.', function () {});
    });
  }

  // O Android às vezes entrega um arquivo que o FileReader não consegue
  // abrir (veio da nuvem, ou o sistema recolheu a página enquanto o seletor
  // estava aberto). Por isso tento dois caminhos antes de desistir.
  function bytesDoArquivo(arquivo, ancora) {
    return new Promise(function (ok, erro) {
      if (!arquivo) { erro(new Error('sem arquivo')); return; }
      if (!arquivo.size) { erro(new Error('vazio')); return; }
      var ultimo = null;
      var tentados = [];

      function bom(b) {
        var by = new Uint8Array(b);
        if (by.length) { ok(by); return true; }
        return false;
      }

      var erroCru = erro;
      erro = function (e) {
        var novo = e || new Error('leitura falhou');
        try { novo.tentados = tentados.join(', '); } catch (x) { /* alguns erros são selados */ }
        erroCru(novo);
      };

      // Caminho 5: por fluxo. Por dentro do navegador isso desce por um cano
      // diferente do arrayBuffer, então às vezes passa onde os outros param.
      function viaFluxo() {
        if (typeof arquivo.stream !== 'function') { erro(ultimo || new Error('leitura falhou')); return; }
        tentados.push('stream');
        var partes = [];
        var leitor;
        try { leitor = arquivo.stream().getReader(); }
        catch (e) { erro(ultimo || e); return; }

        function puxar() {
          leitor.read().then(function (r) {
            if (r.done) {
              var total = 0, i;
              for (i = 0; i < partes.length; i++) total += partes[i].length;
              if (!total) { erro(ultimo || new Error('vazio')); return; }
              var fora = new Uint8Array(total), p = 0;
              for (i = 0; i < partes.length; i++) { fora.set(partes[i], p); p += partes[i].length; }
              ok(fora);
              return;
            }
            partes.push(new Uint8Array(r.value));
            puxar();
          }, function (e) { erro(ultimo || e); });
        }
        puxar();
      }

      // Caminho 4: em pedaços. Cada slice é outro blob, com leitura própria.
      function viaPedacos() {
        tentados.push('pedacos');
        var pedaco = 262144;
        var partes = [];
        var pos = 0;

        function proximo() {
          if (pos >= arquivo.size) {
            var total = 0, i;
            for (i = 0; i < partes.length; i++) total += partes[i].length;
            var fora = new Uint8Array(total), p = 0;
            for (i = 0; i < partes.length; i++) { fora.set(partes[i], p); p += partes[i].length; }
            if (fora.length) ok(fora); else viaFluxo();
            return;
          }
          var fatia = arquivo.slice(pos, Math.min(pos + pedaco, arquivo.size));
          pos += pedaco;
          var seguir = function (b) { partes.push(new Uint8Array(b)); proximo(); };
          if (typeof fatia.arrayBuffer === 'function') {
            fatia.arrayBuffer().then(seguir, function (e) { ultimo = ultimo || e; viaFluxo(); });
            return;
          }
          var l = new FileReader();
          l.onload = function () { seguir(l.result); };
          l.onerror = function () { ultimo = ultimo || l.error; viaFluxo(); };
          l.readAsArrayBuffer(fatia);
        }
        proximo();
      }

      // Caminho 3: pela rede interna do navegador. Em alguns aparelhos ele
      // funciona quando os dois de cima falham.
      function viaUrl() {
        tentados.push('objectURL');
        var url;
        try { url = URL.createObjectURL(arquivo); }
        catch (e) { ultimo = ultimo || e; viaPedacos(); return; }
        fetch(url).then(function (r) { return r.arrayBuffer(); }).then(function (b) {
          URL.revokeObjectURL(url);
          if (!bom(b)) viaPedacos();
        }, function (e) {
          URL.revokeObjectURL(url);
          ultimo = ultimo || e;
          viaPedacos();
        });
      }

      // Caminho 2: o velho FileReader.
      function viaLeitor() {
        tentados.push('FileReader');
        var leitor = new FileReader();
        leitor.onload = function () { if (!bom(leitor.result)) viaUrl(); };
        leitor.onerror = function () {
          ultimo = leitor.error || ultimo || new Error('leitura falhou');
          viaUrl();
        };
        try { leitor.readAsArrayBuffer(arquivo); }
        catch (e) { ultimo = ultimo || e; viaUrl(); }
      }

      // Caminho 1: a âncora feita na hora da escolha. É a que sobrevive a
      // quase tudo, então vem antes das outras.
      if (ancora) {
        tentados.push('ancora');
        fetch(ancora).then(function (r) { return r.arrayBuffer(); }).then(function (b) {
          if (!bom(b)) comeco();
        }, function (e) { ultimo = e; comeco(); });
        return;
      }
      comeco();

      // Caminho 2: o moderno.
      function comeco() {
        if (typeof arquivo.arrayBuffer === 'function') {
          tentados.push('arrayBuffer');
          arquivo.arrayBuffer().then(function (b) {
            if (!bom(b)) viaLeitor();
          }, function (e) { ultimo = ultimo || e; viaLeitor(); });
          return;
        }
        viaLeitor();
      }
    });
  }

  function recadoDeLeitura(e, arquivo) {
    var nome = (e && (e.name || e.message)) || '';
    var detalhe = '\n\n(v' + VERSAO + ' · ' + (nome || 'sem detalhe') +
      (arquivo && arquivo.name ? ' · ' + arquivo.name : '') +
      (arquivo && arquivo.size ? ' · ' + Math.round(arquivo.size / 1024) + ' KB' : '') +
      (e && e.tentados ? ' · tentei: ' + e.tentados : '') + ')';

    if (/NotFound/i.test(nome)) {
      return 'O celular deixou escolher o arquivo, mas não entregou o conteúdo dele.\n\n' +
        'Quase sempre é porque ele foi pego na lista "Recentes" do seletor, que dá um ' +
        'acesso de uma vez só. Tente assim:\n' +
        '1. Toque em "Tentar outro arquivo".\n' +
        '2. No seletor, abra o menu ☰ e escolha "Downloads" ou o nome do celular.\n' +
        '3. Ache o arquivo na pasta e toque nele.\n\n' +
        'Se ainda assim não for, mande pelo Compartilhar do celular ou use "Colar o extrato".' + detalhe;
    }
    if (/NotReadable|NotAllowed|Security/i.test(nome)) {
      return 'O Android bloqueou a leitura desse arquivo. Baixe ele para a pasta Downloads ' +
        'do celular e tente por lá, ou mande para o Finanz pelo Compartilhar.' + detalhe;
    }
    if (/vazio/.test(nome)) {
      return 'Esse arquivo veio vazio. Baixe de novo pelo aplicativo do banco.' + detalhe;
    }
    return 'Não consegui abrir o arquivo. Tente mandar para o Finanz pelo Compartilhar, ' +
      'a partir do gerenciador de arquivos.' + detalhe;
  }

  // A fila de arquivos escolhidos de uma vez. Cada um vira uma conferência
  // separada, porque cada um pode ser de um banco e de uma conta diferente.
  var filaExtrato = null;

  function lerVariosExtratos(arquivos, soltar, ancoras) {
    filaExtrato = {
      arquivos: arquivos, ancoras: ancoras || [],
      lidos: [], atual: 0, senhaDeTodos: '', soltar: soltar
    };
    proximoDaFila();
  }

  function proximoDaFila() {
    var f = filaExtrato;
    if (!f) return;
    if (f.atual >= f.arquivos.length) {
      if (f.soltar) f.soltar();
      var lidos = f.lidos;
      filaExtrato = null;
      limparAviso();
      if (!lidos.length) return;
      mostrarFilaLida(lidos);
      return;
    }
    var i = f.atual;
    avisar(f.arquivos.length > 1
      ? 'Lendo o arquivo ' + (i + 1) + ' de ' + f.arquivos.length + '...'
      : 'Abrindo o arquivo...');
    lerUmExtrato(f.arquivos[i], f.ancoras[i] || '', function (lido, problema) {
      if (lido && lido.itens.length) f.lidos.push({ arquivo: f.arquivos[i], lido: lido });
      else if (f.arquivos.length === 1) { queixarDoArquivo(problema); }
      else f.lidos.push({ arquivo: f.arquivos[i], lido: null, problema: problema });
      f.atual += 1;
      proximoDaFila();
    });
  }

  function mostrarFilaLida(lidos) {
    var bons = lidos.filter(function (x) { return x.lido && x.lido.itens.length; });
    if (!bons.length) { queixarDoArquivo(lidos[0] && lidos[0].problema); return; }
    var ruins = lidos.length - bons.length;
    if (ruins) {
      avisarCaixa('Alguns arquivos não deram',
        ruins + ' de ' + lidos.length + ' arquivos não tinham lançamentos que eu soubesse ler. ' +
        'Vou seguir com os outros ' + bons.length + '.', function () { abrirLote(bons, 0); });
      return;
    }
    abrirLote(bons, 0);
  }

  // Um arquivo por vez na conferência, sabendo em qual deles estamos.
  function abrirLote(bons, indice) {
    if (indice >= bons.length) return;
    var atual = bons[indice];
    mostrarExtrato(atual.lido, atual.arquivo, '', {
      indice: indice, total: bons.length,
      seguir: function () { abrirLote(bons, indice + 1); }
    });
  }

  function queixarDoArquivo(problema) {
    var recado = problema === 'imagem'
      ? 'Esse PDF é uma imagem escaneada, sem texto por dentro. Peça ao banco o extrato em PDF normal, OFX, CSV ou Excel.'
      : problema === 'planilha'
        ? 'Não consegui abrir essa planilha. Se for .xls antigo, salve como .xlsx ou baixe em CSV.'
        : problema === 'formato'
          ? 'Li o arquivo, mas não achei lançamentos com data e valor. Se o seu banco tiver OFX, CSV ou Excel, esse costuma vir mais certinho.'
          : 'Não achei lançamentos nesse arquivo. Tente o extrato ou a fatura em PDF, OFX, CSV ou Excel baixados do aplicativo do banco.';
    avisarCaixa('Não achei lançamentos', recado, function () {});
  }

  function lerUmExtrato(arquivo, ancora, pronto) {
    var nome = nomeDoArquivo(arquivo);

    bytesDoArquivo(arquivo, ancora).then(function (bytes) {
      var comeco = Extrato.textoDeBytes(bytes.subarray(0, 2048));

      if (comeco.indexOf('%PDF') >= 0 || /\.pdf$/.test(nome)) {
        abrirPdfDaFila(bytes, arquivo, filaExtrato ? filaExtrato.senhaDeTodos : '', false, pronto);
        return;
      }

      // Planilha do Excel é um zip: começa com PK.
      if ((bytes[0] === 0x50 && bytes[1] === 0x4B) || /\.xlsx?$/.test(nome)) {
        Extrato.lerXlsx(bytes).then(function (linhas) {
          if (!linhas || !linhas.length) { pronto(null, 'planilha'); return; }
          pronto(Extrato.lerTabela(linhas, nome), '');
        }, function () { pronto(null, 'planilha'); });
        return;
      }

      var texto;
      try { texto = new TextDecoder('utf-8').decode(bytes); }
      catch (e) { texto = Extrato.textoDeBytes(bytes); }
      // Extrato em ISO-8859-1 vira caractere trocado; o acento denuncia.
      if (/\uFFFD/.test(texto.slice(0, 4000))) texto = Extrato.textoDeBytes(bytes);

      var lido;
      if (/<OFX|OFXHEADER|<STMTTRN>/i.test(comeco + texto.slice(0, 4000))) lido = Extrato.lerOfx(texto, nome);
      else lido = Extrato.lerCsv(texto, nome);
      pronto(lido, lido.itens.length ? '' : 'csv');
    }, function (e) {
      limparAviso();
      perguntar({
        titulo: 'Não deu para abrir',
        texto: recadoDeLeitura(e, arquivo),
        ok: 'Colar o texto', cancelar: 'Seguir sem este',
        aoCancelar: function () { pronto(null, 'leitura'); }
      }, function () {
        pronto(null, 'leitura');
        setTimeout(abrirColarExtrato, 240);
      });
    });
  }

  function abrirPdfDaFila(bytes, arquivo, senha, errou, pronto) {
    Extrato.lerPdf(bytes, senha).then(function (r) { return r; }, function (e) {
      avisar('Não deu para ler o PDF: ' + (e && e.message ? e.message : 'arquivo estranho'));
      return null;
    }).then(function (r) {
      if (!r) { pronto(null, 'formato'); return; }
      if (r.precisaSenha) {
        // A senha guardada não serviu: pergunto de novo, agora para este.
        pedirSenhaDoPdf(bytes, arquivo, errou || !!senha, pronto);
        return;
      }
      var lido = Extrato.lerLinhas(r.linhas, nomeDoArquivo(arquivo));
      pronto(lido, lido.itens.length ? '' : (r.linhas.length ? 'formato' : 'imagem'));
    });
  }

  function pedirSenhaDoPdf(bytes, arquivo, errou, pronto) {
    // O "Lendo o arquivo" não faz sentido junto com o pedido de senha.
    limparAviso();
    var f = filaExtrato;
    var varios = f && f.arquivos.length > 1;
    var respondeu = false;

    empilhar({ tipo: 'aba', voltar: function () { if (!respondeu) { respondeu = true; pronto(null, 'senha'); } } });
    abrirFolha('PDF com senha', function (folha) {
      var forma = no('div');
      forma.appendChild(no('p', 'ajuda', errou
        ? 'Essa senha não abriu. Muitos bancos usam o CPF (só os números) ou a data de nascimento.'
        : 'Esse arquivo está trancado. Digite a senha que o banco pede para abrir ele.'));
      if (varios) {
        forma.appendChild(no('div', 'linha-nota',
          'Arquivo ' + (f.atual + 1) + ' de ' + f.arquivos.length + ': ' + (arquivo.name || 'sem nome')));
      }

      var entrada = no('input', 'entrada');
      entrada.type = 'password';
      entrada.id = proximoId();
      entrada.autocomplete = 'off';
      entrada.placeholder = 'Senha do arquivo';
      forma.appendChild(campo('Senha', entrada));

      var marcarTodos = null;
      if (varios) {
        var caixa = no('div', 'marcar-todos');
        marcarTodos = botao('caixinha', '', function () {
          marcarTodos.classList.toggle('marcada');
          marcarTodos.textContent = marcarTodos.classList.contains('marcada') ? '✓' : '';
        });
        caixa.appendChild(marcarTodos);
        caixa.appendChild(no('span', null, 'Usar esta senha para todos os arquivos'));
        caixa.addEventListener('click', function (e) { if (e.target !== marcarTodos) marcarTodos.click(); });
        forma.appendChild(caixa);
      }

      var acoes = no('div', 'acoes');
      acoes.appendChild(botao('btn btn-ouro', 'Abrir', function () {
        var senha = entrada.value;
        if (!senha) { mostrarErro(forma, 'Digite a senha.'); return; }
        if (marcarTodos && marcarTodos.classList.contains('marcada') && f) f.senhaDeTodos = senha;
        respondeu = true;
        voltarNavegacao();
        setTimeout(function () {
          avisar('Abrindo...');
          abrirPdfDaFila(bytes, arquivo, senha, true, pronto);
        }, 240);
      }));
      if (varios) {
        acoes.appendChild(botao('btn btn-perigo', 'Pular este arquivo', function () {
          respondeu = true;
          voltarNavegacao();
          setTimeout(function () { pronto(null, 'senha'); }, 240);
        }));
      }
      forma.appendChild(acoes);
      folha.appendChild(forma);
      setTimeout(function () { entrada.focus(); }, 270);
    });
  }

  // Um lançamento igual já na conta, no mesmo dia e valor, é repetido.
  function jaTemIgual(item, contaId) {
    return estado.lancamentos.some(function (l) {
      return l.contaId === contaId && l.data === item.data && l.valor === item.valor && l.tipo === item.tipo;
    });
  }

  function mostrarExtrato(lido, arquivo, problema, lote) {
    var itens = lido ? lido.itens : [];
    if (!itens.length) {
      var recado = problema === 'imagem'
        ? 'Esse PDF é uma imagem escaneada, sem texto por dentro. Peça ao banco o extrato em PDF normal, OFX, CSV ou Excel.'
        : problema === 'colado'
          ? 'Não achei data e valor no texto que você colou. Copie a parte da lista de lançamentos, com a data, a descrição e o valor de cada linha.'
        : problema === 'planilha'
          ? 'Não consegui abrir essa planilha. Se for .xls antigo, salve como .xlsx ou baixe em CSV.'
          : problema === 'formato'
            ? 'Li o arquivo, mas não achei lançamentos com data e valor. Se o seu banco tiver OFX, CSV ou Excel, esse costuma vir mais certinho.'
            : 'Não achei lançamentos nesse arquivo. Tente o extrato ou a fatura em PDF, OFX, CSV ou Excel baixados do aplicativo do banco.';
      avisarCaixa('Não achei lançamentos', recado, function () {});
      return;
    }

    // O que você já ensinou em outra importação vale aqui de novo.
    itens.forEach(function (it) {
      var jaSabe = regraDeCategoria(it.descricao);
      if (jaSabe && categoriasDe(it.tipo).indexOf(jaSabe) >= 0) {
        // A regra só guarda a categoria de cima. Mudando de categoria, a
        // subcategoria que o texto sugeriu não vale mais.
        if (jaSabe !== it.categoria) it.subcategoria = '';
        it.categoria = jaSabe;
        it.veioDeRegra = true;
      }
    });

    extratoLido = {
      itens: itens, arquivo: arquivo,
      fatura: !!lido.fatura,
      banco: lido.banco || null,
      // O saldo que o banco imprime no fim do extrato: é com ele que dá
      // para saber, depois de lançar, se a leitura bateu.
      saldoFinal: lido.saldoFinal == null ? null : lido.saldoFinal,
      contaId: contaSugerida(lido),
      lote: lote || null
    };
    abrirFolhaExtrato();
  }

  // Se já existe uma conta desse banco, ela é a escolha óbvia. Só olho as
  // do tipo certo: fatura vai para cartão, extrato vai para conta.
  function contaSugerida(lido) {
    var querCartao = !!lido.fatura;
    var pool = estado.contas.filter(function (c) {
      return (c.tipo === 'Cartão de crédito') === querCartao;
    });

    if (lido.banco) {
      for (var i = 0; i < pool.length; i++) {
        if (pool[i].banco === lido.banco.chave) return pool[i].id;
      }
      var alvo = semAcentoSimples(lido.banco.nome);
      for (var k = 0; k < pool.length; k++) {
        if (semAcentoSimples(pool[k].nome).indexOf(alvo) >= 0) return pool[k].id;
      }
    }
    // Nada do tipo certo: melhor criar a conta do que enfiar um extrato de
    // conta dentro de um cartão de crédito.
    return pool.length === 1 ? pool[0].id : '';
  }

  function semAcentoSimples(t) {
    return String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  }

  function abrirFolhaExtrato() {
    empilhar({ tipo: 'aba', voltar: function () { extratoLido = null; } });
    montarFolhaExtrato();
  }

  // Cria a conta do banco que eu reconheci, já com o nome, a cor e a marca.
  function criarContaDoBanco() {
    var dados = extratoLido;
    var b = dados.banco;
    var nome = b ? b.nome : 'Banco';
    if (dados.fatura) nome += ' (cartão)';
    var conta = {
      id: novoId(),
      nome: nome.slice(0, 40),
      tipo: dados.fatura ? 'Cartão de crédito' : 'Conta corrente',
      saldoInicial: 0,
      cor: b ? b.cor : CORES[0],
      banco: b ? b.chave : ''
    };
    estado.contas.push(conta);
    dados.contaId = conta.id;
    salvar();
    montarFolhaExtrato();
    avisar('Conta ' + conta.nome + ' criada.');
  }

  function montarFolhaExtrato() {
    var dados = extratoLido;
    if (!dados) return;
    var itens = dados.itens;
    var contaId = dados.contaId || '__nova__';

    // Remontar a folha zera a rolagem. Guardo onde a tela estava para
    // devolver no fim: trocar de página não pode mexer o que você olha.
    var folhaEl = $('folha');
    var rolagem = folhaEl.classList.contains('aberta') ? folhaEl.scrollTop : 0;

    itens.forEach(function (it) {
      if (it.repetido === undefined || it.contaConferida !== contaId) {
        it.repetido = jaTemIgual(it, contaId);
        it.contaConferida = contaId;
        it.usar = !it.repetido;
      }
    });

    abrirFolha(dados.fatura ? 'Conferir a fatura' : 'Conferir o extrato', function (folha) {
      var forma = no('div');

      // ---- quem emitiu o arquivo ----
      var cabeca = no('div', 'cabeca-banco');
      var b = dados.banco;
      cabeca.appendChild(selo(b ? b.cor : 'var(--ouro)', b ? b.marca : '?'));
      var txtB = no('div', 'cabeca-texto');
      txtB.appendChild(no('div', 'cabeca-nome', b ? b.nome : 'Banco não reconhecido'));
      txtB.appendChild(no('div', 'cabeca-sub',
        (dados.fatura ? 'Fatura de cartão' : 'Extrato de conta') +
        (b ? (dados.bancoNaMao ? ' · escolhido por você' : ' · achei pelo arquivo')
           : ' · escolha o banco, se quiser')));
      cabeca.appendChild(txtB);
      cabeca.appendChild(botao('btn-mini', 'Trocar', function () { escolherBanco(); }));
      forma.appendChild(cabeca);

      // Vieram vários arquivos: mostra em qual deles você está.
      if (dados.lote && dados.lote.total > 1) {
        var qual = no('div', 'linha-nota');
        qual.style.margin = '-8px 0 14px';
        qual.textContent = 'Arquivo ' + (dados.lote.indice + 1) + ' de ' + dados.lote.total +
          (dados.arquivo && dados.arquivo.name ? ' · ' + dados.arquivo.name : '');
        forma.appendChild(qual);
      }

      // ---- para qual conta vai ----
      var opcoes = estado.contas.map(function (c) {
        return { valor: c.id, rotulo: c.nome, detalhe: c.tipo };
      });
      opcoes.push({ valor: '__nova__',
        rotulo: '+ Criar conta ' + (b ? b.nome : 'nova') + (dados.fatura ? ' (cartão)' : ''),
        detalhe: dados.fatura ? 'Cartão de crédito' : 'Conta corrente' });

      var seletor = entradaSelecao(opcoes, contaId, 'Entra em qual conta?');
      seletor.aoMudar = function (v) {
        if (v === '__nova__') { criarContaDoBanco(); return; }
        dados.contaId = v;
        montarFolhaExtrato();
      };
      forma.appendChild(campo(dados.fatura ? 'Cartão' : 'Conta', seletor));

      var resumo = no('div', 'resumo-extrato');
      forma.appendChild(resumo);

      var lista = no('div', 'lista-extrato');
      forma.appendChild(lista);

      var acoes = no('div', 'acoes');
      var principal = botao('btn btn-ouro', 'Importar', function () { importarEscolhidos(); });
      acoes.appendChild(principal);
      // Num lote, o arquivo pode não ter nada de novo. Sem uma saída aqui
      // embaixo, a pessoa fica presa nele com o botão de importar apagado.
      if (dados.lote && dados.lote.seguir && dados.lote.indice + 1 < dados.lote.total) {
        acoes.appendChild(botao('btn btn-fantasma',
          'Pular para o arquivo ' + (dados.lote.indice + 2) + ' de ' + dados.lote.total + ' ›',
          function () { pularArquivoDoLote(); }));
      }
      forma.appendChild(acoes);

      function pintarResumo() {
        var escolhidos = itens.filter(function (i) { return i.usar; });
        var entra = 0, sai = 0;
        escolhidos.forEach(function (i) { if (i.tipo === 'entrada') entra += i.valor; else sai += i.valor; });
        resumo.textContent = '';
        var primeira = itens[0].data, ultima = itens[itens.length - 1].data;
        juntar(resumo,
          no('div', 'resumo-linha-forte', escolhidos.length + ' de ' + itens.length + ' lançamentos'),
          no('div', 'resumo-linha', 'De ' + dataBr(primeira) + ' a ' + dataBr(ultima)),
          juntar(no('div', 'resumo-par'),
            no('span', 'verde', (dados.fatura ? 'Créditos ' : 'Entradas ') + emReais(entra)),
            no('span', 'vermelho', (dados.fatura ? 'Gastos ' : 'Saídas ') + emReais(sai))));
        principal.textContent = escolhidos.length ? 'Importar ' + escolhidos.length + ' lançamento' + (escolhidos.length > 1 ? 's' : '') : 'Nada marcado';
        principal.disabled = !escolhidos.length;
      }

      var atalhos = no('div', 'atalhos-extrato');
      atalhos.appendChild(botao('btn-mini', 'Marcar todos', function () {
        itens.forEach(function (i) { i.usar = true; });
        montarFolhaExtrato();
      }));
      atalhos.appendChild(botao('btn-mini', 'Desmarcar todos', function () {
        itens.forEach(function (i) { i.usar = false; });
        montarFolhaExtrato();
      }));
      forma.insertBefore(atalhos, lista);

      var repetidos = itens.filter(function (i) { return i.repetido; }).length;
      if (repetidos) {
        forma.insertBefore(no('p', 'ajuda', repetidos + ' lançamento(s) já existem nessa conta, com a mesma data e valor. Deixei desmarcados para não duplicar.'), resumo);
      }

      // Um extrato de ano inteiro passa de mil linhas. Desenhar tudo de uma
      // vez trava o celular, então vai por páginas — e dá para ir e voltar.
      var porPagina = 100;
      var paginas = Math.max(1, Math.ceil(itens.length / porPagina));
      var pagina = Math.min(Math.max(dados.pagina || 0, 0), paginas - 1);
      dados.pagina = pagina;
      var de = pagina * porPagina;
      var ate = Math.min(de + porPagina, itens.length);

      function barraDePaginas() {
        var barra = no('div', 'paginas');
        var antes = botao('btn-mini', '‹ Anteriores', function () {
          dados.pagina = pagina - 1;
          montarFolhaExtrato();
        });
        antes.disabled = pagina === 0;
        var depois = botao('btn-mini', 'Próximos ›', function () {
          dados.pagina = pagina + 1;
          montarFolhaExtrato();
        });
        depois.disabled = pagina >= paginas - 1;
        juntar(barra, antes,
          no('span', 'paginas-conta', (de + 1) + '–' + ate + ' de ' + itens.length),
          depois);
        return barra;
      }

      if (paginas > 1) lista.appendChild(barraDePaginas());

      itens.slice(de, ate).forEach(function (it) {
        var linha = no('div', 'item-extrato' + (it.usar ? '' : ' apagado'));

        var marca = botao('caixinha' + (it.usar ? ' marcada' : ''), it.usar ? '✓' : '', function () {
          it.usar = !it.usar;
          marca.className = 'caixinha' + (it.usar ? ' marcada' : '');
          marca.textContent = it.usar ? '✓' : '';
          linha.className = 'item-extrato' + (it.usar ? '' : ' apagado');
          pintarResumo();
        });
        linha.appendChild(marca);

        var meio = no('div', 'item-meio');
        meio.appendChild(no('div', 'item-desc', it.descricao));
        var sub = no('div', 'item-sub');
        sub.appendChild(no('span', null, dataBr(it.data)));
        var cat = botao('etiqueta-cat', it.categoria, function () {
          escolherCategoria(it.tipo, it.categoria, function (v) {
            if (!v || v === it.categoria) { montarFolhaExtrato(); return; }
            it.categoria = v;
            // A subcategoria pertencia à categoria de antes; mudando de
            // categoria ela não quer dizer mais nada.
            it.subcategoria = '';
            it.categoriaTrocada = true;
            perguntarSeValeParaTodos(it, v);
          });
        });
        cat.style.color = corDeCategoria(it.categoria);
        sub.appendChild(cat);

        // A leitura do extrato já chuta a subcategoria pelo texto; aqui dá
        // para conferir e trocar, do mesmo jeito que a categoria.
        var subEtiqueta = botao('etiqueta-cat' + (it.subcategoria ? '' : ' etiqueta-vazia'),
          it.subcategoria || '+ subcategoria', function () {
            escolherSubcategoria(it.tipo, it.categoria, it.subcategoria || '', function (v) {
              if (v != null) it.subcategoria = v;
              montarFolhaExtrato();
            });
          });
        sub.appendChild(subEtiqueta);
        if (it.repetido) sub.appendChild(no('span', 'ja-tem', 'já existe'));
        meio.appendChild(sub);
        linha.appendChild(meio);

        linha.appendChild(no('div', 'item-valor ' + (it.tipo === 'entrada' ? 'verde' : 'vermelho'),
          (it.tipo === 'entrada' ? '+' : '−') + ' ' + emReais(it.valor)));

        lista.appendChild(linha);
      });

      if (paginas > 1) lista.appendChild(barraDePaginas());

      forma.insertBefore(no('p', 'ajuda',
        'Confira antes de lançar: toque na categoria ou na subcategoria para trocar. O arquivo foi lido aqui no seu aparelho, nada dele sai para a internet.'), acoes);

      pintarResumo();
      folha.appendChild(forma);
    });

    folhaEl.scrollTop = rolagem;
  }

  // Trocou a categoria de um lançamento: os outros do mesmo lugar quase
  // sempre são a mesma coisa. Mas isso é escolha da pessoa, então pergunto.
  function perguntarSeValeParaTodos(item, categoria) {
    var dados = extratoLido;
    if (!dados) return;
    var chave = nomeDeOrigem(item.descricao);
    if (!chave) { montarFolhaExtrato(); return; }

    var iguais = dados.itens.filter(function (o) {
      return o !== item && o.tipo === item.tipo &&
             nomeDeOrigem(o.descricao) === chave && o.categoria !== categoria;
    });

    if (!iguais.length) {
      // Mesmo sozinho vale guardar: na próxima importação já vem certo.
      if (!estado.regrasCategoria) estado.regrasCategoria = {};
      estado.regrasCategoria[chave] = categoria;
      salvar();
      montarFolhaExtrato();
      return;
    }

    perguntar({
      titulo: 'Vale para todos?',
      texto: 'Tem mais ' + iguais.length + ' lançamento(s) de "' + chave + '" nesta lista. ' +
             'Quer deixar todos em ' + categoria + '?\n\n' +
             'Marcando sim, eu também guardo isso para as próximas importações.',
      ok: 'Sim, todos', cancelar: 'Só este',
      aoCancelar: function () { montarFolhaExtrato(); }
    }, function () {
      iguais.forEach(function (o) {
        o.categoria = categoria;
        o.subcategoria = '';
        o.categoriaTrocada = true;
      });
      if (!estado.regrasCategoria) estado.regrasCategoria = {};
      estado.regrasCategoria[chave] = categoria;
      salvar();
      montarFolhaExtrato();
      avisar(iguais.length + 1 + ' lançamentos em ' + categoria + '.');
    });
  }

  function escolherBanco() {
    var dados = extratoLido;
    if (!dados) return;
    var lista = Extrato.listaDeBancos();
    abrirEscolha({
      titulo: 'De qual banco é?',
      valor: dados.banco ? dados.banco.chave : '',
      opcoes: [{ valor: '', rotulo: 'Não sei / outro banco' }].concat(
        lista.map(function (b) { return { valor: b.chave, rotulo: b.nome }; }))
    }, function (v) {
      if (v === undefined) return;
      dados.banco = v ? Extrato.bancoPorChave(v) : null;
      dados.bancoNaMao = true;
      montarFolhaExtrato();
    });
  }

  // Nada para usar neste arquivo: segue para o próximo sem lançar nada.
  function pularArquivoDoLote() {
    var dados = extratoLido;
    if (!dados || !dados.lote || !dados.lote.seguir) return;
    var lote = dados.lote;
    if (lote.indice + 1 >= lote.total) return;
    extratoLido = null;
    voltarNavegacao();
    setTimeout(function () { lote.seguir(); }, 240);
  }

  function importarEscolhidos() {
    var dados = extratoLido;
    if (!dados) return;
    var escolhidos = dados.itens.filter(function (i) { return i.usar; });
    if (!escolhidos.length) return;
    var contaId = dados.contaId;
    var conta = achar(estado.contas, contaId);
    if (!conta) {
      avisarCaixa('Falta escolher a conta',
        'Escolha em qual conta os lançamentos entram, ou crie a conta do banco ali no seletor.', function () {});
      return;
    }

    var deQuem = dados.banco ? dados.banco.nome : 'banco não reconhecido';
    var oQue = dados.fatura ? 'fatura de cartão' : 'extrato de conta';
    var trocadas = escolhidos.filter(function (i) { return i.categoriaTrocada; }).length;

    perguntar({
      titulo: 'É esse mesmo?',
      texto: 'Estou lendo uma ' + oQue + ' do ' + deQuem + ' e vou lançar ' +
             escolhidos.length + ' lançamento(s) em "' + (conta ? conta.nome : '') + '"' +
             (conta ? ' (' + conta.tipo + ')' : '') + '.' +
             (trocadas ? ' Você trocou ' + trocadas + ' categoria(s).' : '') +
             ' Se não for isso, cancele e troque o banco ou a conta lá em cima.',
      ok: 'Sim, pode lançar'
    }, function () {
      var agora = Date.now();
      var importacaoId = novoId();
      escolhidos.forEach(function (it, i) {
        estado.lancamentos.push({
          id: novoId(), tipo: it.tipo, valor: it.valor,
          descricao: it.descricao, categoria: it.categoria,
          subcategoria: it.subcategoria || '',
          data: it.data, contaId: contaId, contaDestinoId: '',
          importacaoId: importacaoId,
          criadoEm: agora + i
        });
      });

      // Guardo de onde veio cada leva. Se o extrato entrou errado, dá para
      // tirar tudo de uma vez em vez de apagar um por um.
      var quando = escolhidos.map(function (i) { return i.data; }).sort();
      if (!estado.importacoes) estado.importacoes = [];
      estado.importacoes.push({
        id: importacaoId, contaId: contaId,
        banco: dados.banco ? dados.banco.nome : '',
        arquivo: (dados.arquivo && dados.arquivo.name) || '',
        quando: agora, quantos: escolhidos.length,
        saldoExtrato: dados.saldoFinal == null ? null : dados.saldoFinal,
        de: quando[0], ate: quando[quando.length - 1]
      });
      if (estado.importacoes.length > 60) estado.importacoes = estado.importacoes.slice(-60);
      // O extrato quase sempre é de outro mês. Sem levar a tela para a data
      // do que entrou, a pessoa importa e não vê nada na frente dela.
      var datas = escolhidos.map(function (i) { return i.data; }).sort();
      periodo = { tipo: 'escolhido', de: datas[0], ate: datas[datas.length - 1] };

      var lote = dados.lote;
      var saldoDoExtrato = dados.saldoFinal;
      var todosMarcados = escolhidos.length === dados.itens.length;
      extratoLido = null;
      salvar();
      voltarNavegacao();
      setTimeout(function () {
        // Veio um monte de arquivos de uma vez? O próximo entra agora.
        if (lote && lote.seguir && lote.indice + 1 < lote.total) {
          avisar(escolhidos.length + ' lançamento(s) importados. Vamos ao próximo arquivo.');
          lote.seguir();
          return;
        }
        // O extrato dizia com quanto a conta terminava. Se não bate com o
        // app, é melhor dizer na hora do que a pessoa descobrir depois.
        if (saldoDoExtrato != null && todosMarcados) {
          var agora = saldoConta(contaId, null);
          if (agora !== saldoDoExtrato) {
            avisarCaixa('Confira o saldo',
              'Importei ' + escolhidos.length + ' lançamento(s). O extrato terminava com ' +
              emReais(saldoDoExtrato) + ', e a conta "' + conta.nome + '" aqui fechou em ' +
              emReais(agora) + '.\n\nQuase sempre é porque o extrato não pega desde o começo ' +
              'da conta. Em "Conferir esta conta" dá para acertar o saldo inicial ou tirar a ' +
              'importação inteira.', function () { irPara('transacoes'); });
            return;
          }
          avisar(escolhidos.length + ' lançamento(s). O saldo bateu com o extrato.');
          irPara('transacoes');
          return;
        }
        irPara('transacoes');
        avisar(escolhidos.length + ' lançamento(s) importados.');
      }, 240);
    });
  }

  function fazerBackup() {
    var pacote = { app: 'finanz', versao: VERSAO, exportadoEm: new Date().toISOString(), dados: estado };
    baixarArquivo('finanz-backup-' + carimbo() + '.json', JSON.stringify(pacote, null, 2), 'application/json');
    avisar('Backup gerado.');
  }

  function campoCsv(valor) {
    var v = String(valor == null ? '' : valor);
    return /[";\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  }

  function exportarCsv() {
    if (!estado.lancamentos.length) { avisar('Nada para exportar.'); return; }

    var linhas = [['Data', 'Tipo', 'Categoria', 'Descrição', 'Conta', 'Conta destino', 'Valor'].join(';')];

    estado.lancamentos.slice().sort(function (a, b) {
      return a.data < b.data ? -1 : a.data > b.data ? 1 : (a.criadoEm || 0) - (b.criadoEm || 0);
    }).forEach(function (l) {
      var origem = achar(estado.contas, l.contaId);
      var destino = achar(estado.contas, l.contaDestinoId);
      var sinal = l.tipo === 'entrada' ? 1 : l.tipo === 'saida' ? -1 : 0;
      linhas.push([
        campoCsv(dataBr(l.data)),
        campoCsv(l.tipo === 'entrada' ? 'Entrada' : l.tipo === 'saida' ? 'Saída' : 'Transferência'),
        campoCsv(l.categoria),
        campoCsv(l.descricao || ''),
        campoCsv(origem ? origem.nome : ''),
        campoCsv(destino ? destino.nome : ''),
        campoCsv(((sinal || 1) * l.valor / 100).toFixed(2).replace('.', ','))
      ].join(';'));
    });

    baixarArquivo('caixa-' + carimbo() + '.csv', '﻿' + linhas.join('\r\n'), 'text/csv;charset=utf-8');
    avisar('CSV exportado.');
  }

  // O que está no servidor e não veio no backup precisa sair de lá, senão a
  // primeira sincronia traz tudo de volta e o restauro parece não ter valido.
  function apagarNaNuvemOqueNaoVeio() {
    if (!NUVEM.ligada || !sessaoNuvem || !sessaoNuvem.usuario.id) return Promise.resolve();
    var meus = {};
    TABELAS_SINCRONIA.forEach(function (t) { meus[t] = {}; });
    var linhas = linhasDoEstado(sessaoNuvem.usuario.id);
    TABELAS_SINCRONIA.forEach(function (t) {
      (linhas[t] || []).forEach(function (l) { meus[t][String(l.id)] = true; });
    });

    var tarefa = comTokenValido();
    TABELAS_SINCRONIA.forEach(function (t) {
      tarefa = tarefa.then(function () {
        return pedirNuvem('/rest/v1/' + t + '?select=id&excluido_em=is.null', {});
      }).then(function (r) {
        (r || []).forEach(function (linha) {
          var id = String(linha.id);
          if (!meus[t][id]) estado.excluidos.push({ t: t, id: id });
        });
      });
    });
    return tarefa;
  }

  function restaurarBackup(arquivo, soltar, ancora) {
    // Mesmo caminho teimoso do importar: várias tentativas de leitura e um
    // recado de verdade quando o aparelho não deixa abrir.
    bytesDoArquivo(arquivo, ancora).then(function (bytes) {
      if (soltar) soltar();
      var bruto;
      try {
        // Alguns aparelhos entregam o arquivo com BOM ou com sobras de espaço.
        var cru = new TextDecoder('utf-8').decode(bytes);
        bruto = JSON.parse(cru.replace(/^\uFEFF/, '').trim());
      } catch (e) {
        avisarCaixa('Arquivo inválido',
          'Não consegui entender esse arquivo como backup do Finanz. (' +
          (e && e.message ? e.message : 'formato desconhecido') + ')', function () {});
        return;
      }

      var dados = null;
      if (bruto && bruto.dados) dados = bruto.dados;
      else if (bruto && Array.isArray(bruto.lancamentos)) dados = bruto;
      else if (Array.isArray(bruto)) dados = { lancamentos: bruto };

      if (!dados) { avisar('Arquivo inválido: não encontrei os dados do Finanz.'); return; }

      var limpo = limparEstado(dados);

      // Backup antigo, só com lançamentos soltos: cria uma conta para eles.
      if (limpo.lancamentos.length && !limpo.contas.length) {
        var carteira = { id: novoId(), nome: 'Carteira', tipo: 'Dinheiro físico', saldoInicial: 0, cor: CORES[0] };
        limpo.contas = [carteira];
        limpo.lancamentos.forEach(function (l) { if (!l.contaId) l.contaId = carteira.id; });
      }

      if (!limpo.lancamentos.length && !limpo.contas.length && !limpo.ativos.length && !limpo.metas.length) {
        avisar('Arquivo inválido: nenhum dado aproveitável.');
        return;
      }

      perguntar({
        titulo: 'Restaurar este backup?',
        texto: 'São ' + limpo.lancamentos.length + ' lançamento(s), ' + limpo.contas.length +
               ' conta(s), ' + limpo.ativos.length + ' ativo(s) e ' + limpo.metas.length +
               ' meta(s). Isso substitui tudo o que está no aplicativo agora.',
        ok: 'Restaurar', tom: 'perigo'
      }, function () {
        var antigo = estado;
        estado = limpo;
        estado.excluidos = [];
        fecharFolha();
        desenhar();
        avisar('Restaurando...');
        apagarNaNuvemOqueNaoVeio().catch(function () {
          // Sem internet o restauro vale aqui; a nuvem se acerta na próxima.
        }).then(function () {
          return salvar();
        }).then(function () {
          desenhar();
          avisar('Backup restaurado.');
          if (NUVEM.ligada && sessaoNuvem) sincronizar(true);
        }).catch(function (e) {
          estado = antigo;
          desenhar();
          avisar('Não deu para restaurar: ' + (e && e.message ? e.message : 'erro ao salvar'));
        });
      });
    }, function (e) {
      if (soltar) soltar();
      perguntar({
        titulo: 'Não deu para abrir',
        texto: recadoDeLeitura(e, arquivo),
        ok: 'Escolher de novo', cancelar: 'Fechar'
      }, function () {
        setTimeout(function () { $('arquivoRestaurar').click(); }, 200);
      });
    });
  }

  function apagarTudo() {
    var quanto = estado.lancamentos.length + estado.contas.length + estado.ativos.length + estado.metas.length;
    if (!quanto) { avisar('Não há nada para apagar.'); return; }
    perguntar({
      titulo: 'Apagar todos os seus dados?',
      texto: 'São ' + quanto + ' registros deste aparelho.',
      ok: 'Quero apagar', tom: 'perigo'
    }, function () {
      perguntar({
        titulo: 'Tem certeza mesmo?',
        texto: 'Depois disso não tem volta. Faça um backup antes, se quiser guardar.',
        ok: 'Apagar tudo', cancelar: 'Melhor não', tom: 'perigo'
      }, function () {
        estado = estadoPadrao();
        salvar();
        desenhar();
        avisar('Tudo apagado.');
      });
    });
  }

  // ---------- Avisos ----------

  var tempoAviso = null;

  function limparAviso() {
    clearTimeout(tempoAviso);
    $('toque').classList.remove('visivel');
  }

  function avisar(mensagem) {
    var el = $('toque');
    el.textContent = mensagem;
    el.classList.add('visivel');
    clearTimeout(tempoAviso);
    tempoAviso = setTimeout(function () { el.classList.remove('visivel'); }, 2600);
  }

  // ---------- Service worker ----------

  var atualizacaoPedida = false;

  function mostrarAvisoDeVersao(trabalhador) {
    if ($('avisoVersao')) return;
    var aviso = no('div', 'aviso');
    aviso.id = 'avisoVersao';
    aviso.appendChild(no('span', null, 'Nova versão disponível.'));
    var b = botao(null, 'Atualizar', function () {
      b.disabled = true;
      b.textContent = 'Atualizando…';
      atualizacaoPedida = true;
      trabalhador.postMessage({ tipo: 'PULAR_ESPERA' });
    });
    aviso.appendChild(b);
    document.body.appendChild(aviso);
  }

  function registrarServiceWorker() {
    if (!('serviceWorker' in navigator)) return;

    var recarregando = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (recarregando) return;
      // O app só recarrega quando a pessoa pediu, no aviso de versão nova.
      // Recarregar sozinho derrubava a leitura de arquivo pela metade: o
      // seletor devolve o arquivo, a página se recarrega e o conteúdo some.
      if (!atualizacaoPedida) return;
      recarregando = true;
      location.reload();
    });

    navigator.serviceWorker.register('sw.js').then(function (registro) {
      if (registro.waiting && navigator.serviceWorker.controller) mostrarAvisoDeVersao(registro.waiting);

      registro.addEventListener('updatefound', function () {
        var novo = registro.installing;
        if (!novo) return;
        novo.addEventListener('statechange', function () {
          if (novo.state === 'installed' && navigator.serviceWorker.controller) mostrarAvisoDeVersao(novo);
        });
      });

      setInterval(function () { registro.update().catch(function () {}); }, 60 * 60 * 1000);
    }).catch(function () { /* sem service worker o app segue funcionando */ });

    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState !== 'visible') return;
      // Voltar do seletor de arquivos também dispara isto. Procurar
      // atualização bem agora é o começo da confusão.
      if (lendoArquivo || folhaAberta || dialogoAberto) return;
      navigator.serviceWorker.getRegistration().then(function (r) {
        if (r) r.update().catch(function () {});
      });
    });
  }

  // ---------- Ligações ----------

  $('fab').addEventListener('click', function () {
    if (noEmpreendedor()) abrirFolhaCliente(null);
    else abrirFolhaLancamento(null);
  });
  $('cortina').addEventListener('click', fecharFolha);
  $('relFechar').addEventListener('click', fecharRelatorio);
  $('relImprimir').addEventListener('click', function () { window.print(); });

  // Enquanto o input segura o arquivo, o navegador mantém o conteúdo dele
  // ao alcance. Limpar o campo antes de a leitura terminar solta esse
  // conteúdo, e aí a leitura morre com NotFoundError mesmo tendo o nome e
  // o tamanho certos. Por isso a limpeza só acontece no fim.
  function comArquivoEscolhido(campo, usar, varios) {
    campo.addEventListener('change', function (evento) {
      var lista = evento.target.files;
      if (!lista || !lista.length) return;

      // Ancora o conteúdo agora, ainda dentro do evento: o endereço de blob
      // segura os dados mesmo que o campo seja limpo ou o arquivo saia de
      // vista. É a leitura mais teimosa que existe no navegador.
      var arquivos = [], ancoras = [];
      for (var i = 0; i < lista.length; i++) {
        arquivos.push(lista[i]);
        var a = '';
        try { a = URL.createObjectURL(lista[i]); } catch (e) { a = ''; }
        ancoras.push(a);
      }

      lendoArquivo += 1;
      var soltou = false;
      function soltar() {
        if (soltou) return;
        soltou = true;
        lendoArquivo = Math.max(0, lendoArquivo - 1);
        try { campo.value = ''; } catch (e) { /* nada a fazer */ }
        setTimeout(function () {
          ancoras.forEach(function (a) { if (a) URL.revokeObjectURL(a); });
        }, 1000);
      }

      if (varios) usar(arquivos, soltar, ancoras);
      else usar(arquivos[0], soltar, ancoras[0]);
    });
  }

  comArquivoEscolhido($('arquivoRestaurar'), restaurarBackup);
  comArquivoEscolhido($('arquivoExtrato'), lerVariosExtratos, true);

  document.addEventListener('keydown', function (evento) {
    if (evento.key !== 'Escape') return;
    if ($('relatorio').classList.contains('aberto')) fecharRelatorio();
    else if (folhaAberta) fecharFolha();
  });

  // No celular a barra de endereço do navegador entra e sai, e a área
  // realmente visível encolhe. Sem isso, a navegação de baixo fica
  // pendurada fora da tela e some pela metade.
  function acompanharAreaVisivel() {
    var vv = window.visualViewport;
    if (!vv) return;
    var ultimo = -1;
    function ajustar() {
      var oculto = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
      // Com o teclado aberto o vão é enorme; aí a barra fica onde está.
      if (oculto > 220) oculto = 0;
      if (oculto === ultimo) return;
      ultimo = oculto;
      document.documentElement.style.setProperty('--fundo-oculto', oculto + 'px');
    }
    vv.addEventListener('resize', ajustar);
    vv.addEventListener('scroll', ajustar);
    window.addEventListener('orientationchange', function () { setTimeout(ajustar, 300); });
    ajustar();
  }
  acompanharAreaVisivel();

  window.addEventListener('popstate', aoVoltar);

  // ---------- Início ----------

  function comecar() {
    iniciarNavegacao();

    if (!cripto) {
      // Sem WebCrypto (contexto não seguro) o app roda sem conta, como antes.
      estado = limparEstado(dadosParaImportar() || estadoPadrao());
      desenhar();
      avisar('Abra o app por HTTPS para usar contas com senha.');
      return;
    }

    if (NUVEM.ligada) {
      var veioDoGoogle = nuvemCapturarRetorno();
      sessaoNuvem = lerSessaoNuvem();
      if (!sessaoNuvem) { estado = estadoPadrao(); mostrarEntrada('abertura'); return; }
      entrarComoUsuarioDaNuvem(veioDoGoogle && !localStorage.getItem('caixa.importado.v3'))
        .catch(function () {
          nuvemEsquecer();
          sessao = null;
          estado = estadoPadrao();
          mostrarEntrada('login');
        });
      return;
    }

    var guardada = sessaoGuardada();
    if (!guardada) { estado = estadoPadrao(); mostrarEntrada('abertura'); return; }

    var conta = achar(lerContas(), guardada.contaId);
    if (!conta) { limparSessao(); estado = estadoPadrao(); mostrarEntrada('abertura'); return; }

    importarChave(guardada.chave).then(function (chave) {
      return abrirCofre(conta, chave);
    }).then(function () {
      esconderEntrada();
      desenhar();
    }).catch(function () {
      limparSessao();
      estado = estadoPadrao();
      mostrarEntrada('login');
    });
  }

  estado = estadoPadrao();
  comecar();
  registrarServiceWorker();
})();
</script>
