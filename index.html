  // =========================================================================
  // Orçamento: simular o serviço antes de fechar. Material, mão de obra e
  // logística de um lado; do outro, um PDF para mandar no WhatsApp ou
  // guardar no celular e imprimir.
  // =========================================================================

  function propostasDoCliente(id) {
    return (estado.propostas || []).filter(function (p) { return p.clienteId === id; })
      .sort(function (a, b) { return b.criadoEm - a.criadoEm; });
  }

  function proximoNumeroDeProposta() {
    var maior = 0;
    (estado.propostas || []).forEach(function (p) { if (p.numero > maior) maior = p.numero; });
    return maior + 1;
  }

  function propostaVencida(p) {
    return !!(p.validade && p.validade < hojeTexto());
  }

  // Os preços que saem de um orçamento. O preço cheio é o do cartão; quem
  // paga em dinheiro ou Pix leva o desconto. A taxa da maquininha não muda
  // o preço do cliente: ela diz quanto sobra para quem vende.
  // ---- Taxas da maquininha ----------------------------------------------
  // Cada bandeira cobra o seu, e o parcelamento cobra mais a cada parcela.
  // Guardo a tabela inteira: débito e uma taxa por número de parcelas.

  var TETO_PARCELAS = 18;

  function bandeiraVazia(nome) {
    var credito = [];
    for (var i = 0; i < TETO_PARCELAS; i++) credito.push(0);
    return { id: novoId(), nome: nome || 'Cartões', debito: 0, credito: credito };
  }

  function limparBandeira(b) {
    var credito = [];
    var vindo = Array.isArray(b && b.credito) ? b.credito : [];
    for (var i = 0; i < TETO_PARCELAS; i++) {
      credito.push(Math.min(Math.max(Number(vindo[i]) || 0, 0), 60));
    }
    return {
      id: texto(b && b.id) || novoId(),
      nome: texto(b && b.nome).slice(0, 40) || 'Cartões',
      debito: Math.min(Math.max(Number(b && b.debito) || 0, 0), 60),
      credito: credito
    };
  }

  function taxasGuardadas() {
    var t = (estado.perfil && estado.perfil.taxas) || {};
    var bandeiras = Array.isArray(t.bandeiras) && t.bandeiras.length
      ? t.bandeiras.map(limparBandeira)
      : [bandeiraVazia('Mastercard e Visa'), bandeiraVazia('Amex e Elo')];
    return {
      descontoAvista: t.descontoAvista == null ? 10 : Math.min(Math.max(Number(t.descontoAvista) || 0, 0), 90),
      repassar: t.repassar !== false,
      ateParcelas: Math.min(Math.max(inteiro(t.ateParcelas) || 12, 1), TETO_PARCELAS),
      bandeiras: bandeiras
    };
  }

  function guardarTaxas(pag) {
    estado.perfil.taxas = {
      descontoAvista: pag.descontoAvista,
      repassar: pag.repassar,
      ateParcelas: pag.ateParcelas,
      bandeiras: pag.bandeiras.map(limparBandeira)
    };
  }

  // O preço que cobre a taxa: cobrando isto, depois do desconto da
  // maquininha sobra exatamente o valor do orçamento.
  function comTaxa(base, taxa, repassar) {
    if (!repassar || !taxa) return base;
    var fator = 1 - Math.min(taxa, 60) / 100;
    return fator > 0 ? Math.round(base / fator) : base;
  }

  function precosDaProposta(p) {
    var itens = (p.materiais || []).reduce(function (soma, m) { return soma + inteiro(m.valor); }, 0);
    var outros = (p.outros || []).reduce(function (soma, m) { return soma + inteiro(m.valor); }, 0);
    var bruto = itens + outros + inteiro(p.maoDeObra) + inteiro(p.logistica);
    var cheio = Math.max(bruto - inteiro(p.desconto), 0);

    var pag = p.pagamento || taxasGuardadas();
    var descAvista = Math.min(Math.max(Number(pag.descontoAvista) || 0, 0), 90);
    var repassar = pag.repassar !== false;
    var ate = Math.min(Math.max(inteiro(pag.ateParcelas) || 1, 1), TETO_PARCELAS);
    var aVista = Math.round(cheio * (1 - descAvista / 100));

    // Uma linha por bandeira e por número de parcelas: é isso que vai no
    // papel, para o cliente escolher em quantas quer.
    var bandeiras = (pag.bandeiras || []).map(function (b) {
      var totalDebito = comTaxa(cheio, b.debito, repassar);
      var linhas = [];
      for (var n = 1; n <= ate; n++) {
        var taxa = Number(b.credito[n - 1]) || 0;
        var total = comTaxa(cheio, taxa, repassar);
        linhas.push({
          vezes: n, taxa: taxa, total: total,
          parcela: Math.round(total / n),
          liquido: Math.round(total * (1 - Math.min(taxa, 60) / 100))
        });
      }
      return {
        nome: b.nome, debito: b.debito,
        totalDebito: totalDebito,
        liquidoDebito: Math.round(totalDebito * (1 - Math.min(b.debito, 60) / 100)),
        credito: linhas
      };
    });

    // Parcelado direto: o cliente escolhe em quantas, então mostro todas.
    var d = p.direto || {};
    var direto = null;
    if (d.ligado) {
      var ateDireto = Math.min(Math.max(inteiro(d.vezes) || 1, 1), 24);
      var entrada = Math.min(inteiro(d.entrada), cheio);
      var aParcelar = Math.max(cheio - entrada, 0);
      var planos = [];
      for (var v = 1; v <= ateDireto; v++) {
        // Mesma regra do parcelamento de cliente: o acréscimo conta uma vez
        // para cada parcela depois da primeira, então o à vista sai pelo
        // total do orçamento e cada opção sobe um degrau.
        var c = calcularParcelas(aParcelar, v, d.modo || 'nenhum',
          d.modo === 'porcento' ? (Number(d.acrescimo) || 0) : inteiro(d.acrescimo),
          ehData(d.primeira) ? d.primeira : hojeTexto(), 0, 0);
        planos.push({ vezes: v, entrada: entrada, itens: c.itens,
                      total: entrada + c.total, acrescimo: c.acrescimoTotal });
      }
      direto = { ate: ateDireto, entrada: entrada, planos: planos,
                 maior: planos[planos.length - 1] };
    }

    return {
      materiais: itens, outros: outros, bruto: bruto, cheio: cheio,
      descAvista: descAvista, aVista: aVista, repassar: repassar,
      ate: ate, bandeiras: bandeiras, direto: direto
    };
  }

  // O que o resto do app chama de "total" é o preço do orçamento.
  function totalDaProposta(p) {
    var pr = precosDaProposta(p);
    return { materiais: pr.materiais, bruto: pr.bruto, total: pr.cheio };
  }

  // A tabela da maquininha, escrita uma vez e usada em todo orçamento.
  // Dá para digitar ou colar o texto do aplicativo da maquininha.
  function abrirFolhaTaxas(aoTerminar) {
    var pag = taxasGuardadas();
    montar();

    function montar() {
      abrirFolha('Taxas da maquininha', function (folha) {
        var forma = no('div');
        forma.appendChild(no('p', 'linha-sub',
          'O que a maquininha desconta de você, por bandeira e por número de parcelas. ' +
          'Escreva uma vez: todo orçamento novo já vem com ela.'));

        var campoDesc = entradaTextoNumero(numeroBr(pag.descontoAvista), '10');
        forma.appendChild(campo('Desconto no dinheiro ou Pix (%)', campoDesc));

        var campoAte = entradaSelecao(
          Array.apply(null, { length: TETO_PARCELAS }).map(function (_, i) {
            return { valor: String(i + 1), rotulo: i === 0 ? 'só à vista' : 'até ' + (i + 1) + 'x' };
          }), String(pag.ateParcelas), 'Parcelas que você aceita');
        forma.appendChild(campo('Parcelas que você aceita', campoAte));
        campoAte.aoMudar = function () { guardar(); montar(); };

        var campoRepassar = entradaSelecao([
          { valor: 'sim', rotulo: 'O cliente paga a taxa', detalhe: 'o preço sobe conforme as parcelas' },
          { valor: 'nao', rotulo: 'A taxa sai do meu bolso', detalhe: 'o preço é o mesmo em qualquer parcela' }
        ], pag.repassar ? 'sim' : 'nao', 'A taxa entra no preço?');
        forma.appendChild(campo('A taxa entra no preço?', campoRepassar));

        var ate = inteiro(campoAte.value) || 12;

        pag.bandeiras.forEach(function (b, indice) {
          var c = cartao();
          var topo = topoDeCartao(b.nome || 'Cartões', pag.bandeiras.length > 1 ? 'Tirar' : null, function () {
            guardar();
            pag.bandeiras.splice(indice, 1);
            montar();
          });
          c.appendChild(topo);

          var cNome = entradaTexto(b.nome, 'Ex.: Mastercard e Visa', 40);
          c.appendChild(campo('Bandeiras', cNome));
          b.campoNome = cNome;

          var cDeb = entradaTextoNumero(numeroBr(b.debito), '0');
          c.appendChild(campo('Débito (%)', cDeb));
          b.campoDebito = cDeb;

          var grade = no('div', 'grade-taxas');
          b.camposCredito = [];
          for (var n = 1; n <= ate; n++) {
            var cel = no('div', 'taxa-cel');
            cel.appendChild(no('span', 'taxa-vezes', n === 1 ? '1x' : n + 'x'));
            var i = entradaTextoNumero(numeroBr(b.credito[n - 1]), '0');
            cel.appendChild(i);
            b.camposCredito.push(i);
            grade.appendChild(cel);
          }
          c.appendChild(no('div', 'rotulo', 'Crédito (%)'));
          c.appendChild(grade);
          forma.appendChild(c);
        });

        var mais = botao('btn btn-fantasma', '+ Outra bandeira', function () {
          guardar();
          pag.bandeiras.push(bandeiraVazia('Outra bandeira'));
          montar();
        });
        forma.appendChild(mais);

        var colar = botao('btn btn-fantasma', 'Colar a tabela da maquininha', function () {
          guardar();
          abrirColarTaxas(function (lido) {
            if (!lido) return;
            var alvoB = pag.bandeiras[0] || bandeiraVazia('Cartões');
            if (lido.debito != null) alvoB.debito = lido.debito;
            lido.credito.forEach(function (v, i) { if (v != null) alvoB.credito[i] = v; });
            if (!pag.bandeiras.length) pag.bandeiras.push(alvoB);
            montar();
            avisar('Peguei ' + lido.quantos + ' taxa(s) para "' + alvoB.nome + '".');
          });
        });
        colar.style.marginTop = '8px';
        forma.appendChild(colar);
        var notaColar = no('div', 'linha-nota',
          'Copie o texto do aplicativo da maquininha e cole aqui. Ele entra na primeira ' +
          'bandeira da lista — o app não consegue ler uma foto da tela, só texto.');
        forma.appendChild(notaColar);

        function guardar() {
          pag.descontoAvista = Math.min(Math.max(comoNumero(campoDesc.value, 0), 0), 90);
          pag.repassar = campoRepassar.value === 'sim';
          pag.ateParcelas = inteiro(campoAte.value) || 12;
          pag.bandeiras.forEach(function (b) {
            if (b.campoNome) b.nome = b.campoNome.value.trim().slice(0, 40) || 'Cartões';
            if (b.campoDebito) b.debito = Math.min(Math.max(comoNumero(b.campoDebito.value, 0), 0), 60);
            (b.camposCredito || []).forEach(function (i, k) {
              b.credito[k] = Math.min(Math.max(comoNumero(i.value, 0), 0), 60);
            });
          });
        }

        var acoes = no('div', 'acoes');
        acoes.appendChild(botao('btn btn-ouro', 'Salvar as taxas', function () {
          guardar();
          if (!pag.bandeiras.length) pag.bandeiras.push(bandeiraVazia('Cartões'));
          guardarTaxas(pag);
          salvar();
          fecharFolha();
          avisar('Taxas guardadas.');
          if (aoTerminar) setTimeout(function () { aoTerminar(taxasGuardadas()); }, 240);
        }));
        forma.appendChild(acoes);
        folha.appendChild(forma);
      });
    }
  }

  // Lê a tabela colada: "Débito 1,37%", "1x 3,15%", uma por linha ou tudo
  // emendado. Só precisa achar o número de parcelas e o percentual.
  function lerTaxasColadas(texto) {
    var s = String(texto || '').replace(/ /g, ' ');
    var credito = [];
    var debito = null;
    var quantos = 0;

    var mDeb = /d[ée]bito[^0-9]{0,20}(\d{1,2}(?:[.,]\d{1,2})?)\s*%/i.exec(s);
    if (mDeb) { debito = Number(mDeb[1].replace(',', '.')); quantos++; }

    var re = /(\d{1,2})\s*x[^0-9]{0,20}(\d{1,2}(?:[.,]\d{1,2})?)\s*%/gi;
    var m;
    while ((m = re.exec(s))) {
      var n = +m[1];
      if (n < 1 || n > TETO_PARCELAS) continue;
      credito[n - 1] = Number(m[2].replace(',', '.'));
      quantos++;
    }
    return quantos ? { debito: debito, credito: credito, quantos: quantos } : null;
  }

  function abrirColarTaxas(pronto) {
    abrirFolha('Colar as taxas', function (folha) {
      var forma = no('div');
      forma.appendChild(no('p', 'linha-sub',
        'Cole aqui o texto que o aplicativo da maquininha mostra. O app procura ' +
        '"Débito 1,37%", "1x 3,15%", "2x 5,39%" e assim por diante.'));
      var area = no('textarea', 'entrada area-colar');
      area.rows = 10;
      area.placeholder = 'Débito 1,37%\n1x 3,15%\n2x 5,39%\n3x 6,12%\n...';
      forma.appendChild(area);
      var nota = no('div', 'linha-nota');
      forma.appendChild(nota);
      area.addEventListener('input', function () {
        var lido = lerTaxasColadas(area.value);
        nota.textContent = lido
          ? 'Achei ' + lido.quantos + ' taxa(s).'
          : 'Ainda não achei nenhuma taxa nesse texto.';
      });

      var acoes = no('div', 'acoes');
      acoes.appendChild(botao('btn btn-ouro', 'Usar estas taxas', function () {
        var lido = lerTaxasColadas(area.value);
        if (!lido) { mostrarErro(forma, 'Não achei taxa nenhuma nesse texto.'); return; }
        fecharFolha();
        setTimeout(function () { pronto(lido); }, 240);
      }));
      forma.appendChild(acoes);
      folha.appendChild(forma);
    });
  }

  // Um tipo novo escrito na hora, sem sair da tela do orçamento.
  function pedirTipoNovo(pronto) {
    abrirFolhaTexto('O que é?', 'Nome do tipo', '', 'Ex.: Aluguel, Consultoria, Frete',
      function (nome) {
        var limpo = String(nome || '').trim().slice(0, 30);
        if (!limpo) return;
        if (!estado.tiposRegistro) estado.tiposRegistro = [];
        if (tiposDeRegistro().indexOf(limpo) < 0) { estado.tiposRegistro.push(limpo); salvar(); }
        pronto(limpo);
      },
      function () {});
  }

  function abrirFolhaProposta(clienteId, propostaId) {
    var cliente = achar(estado.clientes, clienteId);
    if (!cliente) return;
    var existente = propostaId ? achar(estado.propostas || [], propostaId) : null;
    var guardadas = taxasGuardadas();

    // Rascunho na mão: só vira orçamento de verdade quando salvar.
    var rascunho = existente ? {
      tipo: existente.tipo || TIPO_PADRAO,
      titulo: existente.titulo,
      validade: existente.validade,
      materiais: existente.materiais.map(function (m) { return { nome: m.nome, valor: m.valor }; }),
      outros: (existente.outros || []).map(function (m) { return { nome: m.nome, valor: m.valor }; }),
      maoDeObra: existente.maoDeObra, logistica: existente.logistica,
      desconto: existente.desconto, obs: existente.obs,
      pagamento: JSON.parse(JSON.stringify(existente.pagamento || guardadas)),
      direto: JSON.parse(JSON.stringify(existente.direto || { ligado: false }))
    } : {
      tipo: TIPO_PADRAO, titulo: '', validade: somaDias(hojeTexto(), 15),
      materiais: [], outros: [],
      maoDeObra: 0, logistica: 0, desconto: 0, obs: '',
      pagamento: JSON.parse(JSON.stringify(guardadas)),
      direto: { ligado: false, entrada: 0, vezes: 3, modo: 'nenhum', acrescimo: 0,
                primeira: somaMeses(hojeTexto(), 1) }
    };
    if (!rascunho.direto.primeira) rascunho.direto.primeira = somaMeses(hojeTexto(), 1);

    montar();

    function montar() {
      abrirFolha(existente ? 'Editar orçamento' : 'Novo orçamento', function (folha) {
        var forma = no('div');
        forma.appendChild(no('p', 'linha-sub', 'Para ' + cliente.nome + '.'));

        // ---- o que é ----
        var opcoesTipo = opcoesDeTipo(rascunho.tipo)
          .concat([{ valor: '__novo__', rotulo: 'Outro / adicionar…', detalhe: 'escrever um tipo novo' }]);
        var campoTipo = entradaSelecao(opcoesTipo, rascunho.tipo, 'O que é');
        campoTipo.aoMudar = function (v) {
          if (v !== '__novo__') { rascunho.tipo = v; return; }
          guardarCampos();
          pedirTipoNovo(function (nome) { rascunho.tipo = nome; montar(); });
          campoTipo.value = rascunho.tipo;
        };
        forma.appendChild(campo('O que é', campoTipo));

        var campoTitulo = entradaTexto(rascunho.titulo, 'Ex.: Venda de um carro', 80);
        forma.appendChild(campo('Descrição', campoTitulo));
        campoTitulo.addEventListener('input', function () { rascunho.titulo = campoTitulo.value; });

        // ---- listas de valores ----
        var camposMat = [], camposOut = [];

        function listaDeValores(rotulo, chave, dica, guardaEm) {
          var c = cartao('liso');
          var topo = topoDeCartao(rotulo, '+ Item', function () {
            guardarCampos();
            rascunho[chave].push({ nome: '', valor: 0 });
            montar();
          });
          topo.style.padding = '14px 14px 0';
          c.appendChild(topo);
          var caixa = no('div');
          caixa.style.padding = '0 14px 14px';
          c.appendChild(caixa);

          if (!rascunho[chave].length) {
            caixa.appendChild(no('div', 'linha-nota', dica));
          } else {
            rascunho[chave].forEach(function (m, i) {
              var linha = no('div', 'linha-item-orc');
              var cNome = entradaTexto(m.nome, 'Nome', 60);
              var cValor = entradaValor(m.valor, false);
              guardaEm.push({ nome: cNome, valor: cValor });
              cValor.addEventListener('input', somar);
              cValor.addEventListener('change', somar);
              var tirar = botao('btn-mini', '✕', function () {
                guardarCampos();
                rascunho[chave].splice(i, 1);
                montar();
              });
              tirar.setAttribute('aria-label', 'Tirar este item');
              juntar(linha, cNome, cValor, tirar);
              caixa.appendChild(linha);
            });
          }
          return c;
        }

        var campoMao = entradaValor(rascunho.maoDeObra, false);
        forma.appendChild(campo('Mão de obra', campoMao));

        var campoLog = entradaValor(rascunho.logistica, false);
        forma.appendChild(campo('Custo logístico', campoLog));
        var notaLog = no('div', 'linha-nota', 'Deslocamento, combustível, frete do material.');
        notaLog.style.margin = '-8px 0 18px';
        forma.appendChild(notaLog);

        forma.appendChild(listaDeValores('Materiais', 'materiais',
          'Sem material nenhum. Toque em "+ Item" se o serviço usar peças.', camposMat));

        forma.appendChild(listaDeValores('Outros valores', 'outros',
          'Para o que não é material nem mão de obra: valor de venda, diária, aluguel.', camposOut));

        var campoDesc = entradaValor(rascunho.desconto, false);
        forma.appendChild(campo('Desconto', campoDesc));
        [campoMao, campoLog, campoDesc].forEach(function (c) {
          c.addEventListener('input', somar);
          c.addEventListener('change', somar);
        });

        // ---- validade ----
        var campoValidade = entradaSelecao([
          { valor: '7', rotulo: '7 dias' },
          { valor: '15', rotulo: '15 dias' },
          { valor: '30', rotulo: '30 dias' },
          { valor: 'sem', rotulo: 'Sem prazo' }
        ], diasDeValidade(), 'Este orçamento vale por');
        forma.appendChild(campo('Validade', campoValidade));
        var notaVal = no('div', 'linha-nota');
        notaVal.style.margin = '-8px 0 18px';
        forma.appendChild(notaVal);
        campoValidade.aoMudar = function () { pintarValidade(); };

        function diasDeValidade() {
          if (!rascunho.validade) return 'sem';
          var d = Math.round((comoData(rascunho.validade) - comoData(hojeTexto())) / 86400000);
          if (d <= 7) return '7';
          if (d <= 15) return '15';
          return '30';
        }
        function pintarValidade() {
          var v = campoValidade.value;
          rascunho.validade = v === 'sem' ? '' : somaDias(hojeTexto(), +v);
          notaVal.textContent = rascunho.validade
            ? 'Vale até ' + dataBr(rascunho.validade) + '.'
            : 'Sem data de vencimento no papel.';
        }
        pintarValidade();

        // ---- formas de pagamento ----
        // As taxas vêm da tabela da maquininha, escrita uma vez em Mais.
        // Aqui só se escolhe o que este orçamento aceita.
        var cPag = cartao();
        cPag.appendChild(topoDeCartao('Formas de pagamento', 'Taxas', function () {
          guardarCampos();
          fecharFolha();
          setTimeout(function () {
            abrirFolhaTaxas(function (novas) {
              rascunho.pagamento = JSON.parse(JSON.stringify(novas));
              montar();
            });
          }, 240);
        }));

        var campoDescAv = entradaTextoNumero(numeroBr(rascunho.pagamento.descontoAvista), '10');
        cPag.appendChild(campo('Desconto no dinheiro ou Pix (%)', campoDescAv));
        campoDescAv.addEventListener('input', somar);
        campoDescAv.addEventListener('change', somar);

        var campoVezesCartao = entradaSelecao(
          Array.apply(null, { length: TETO_PARCELAS }).map(function (_, i) {
            return { valor: String(i + 1), rotulo: i === 0 ? 'só à vista' : 'até ' + (i + 1) + 'x' };
          }), String(rascunho.pagamento.ateParcelas || 12), 'Parcelas no cartão');
        cPag.appendChild(campo('Parcelas no cartão', campoVezesCartao));
        campoVezesCartao.aoMudar = function () { somar(); };
        var notaVezes = no('div', 'linha-nota',
          'No PDF o cliente vê o preço de cada parcelamento, de 1x até esse número, ' +
          'e escolhe o que couber no bolso dele.');
        notaVezes.style.marginTop = '-8px';
        cPag.appendChild(notaVezes);

        // Quais bandeiras este orçamento aceita.
        var todasBandeiras = taxasGuardadas().bandeiras;
        var aceitas = {};
        (rascunho.pagamento.bandeiras || []).forEach(function (b) { aceitas[b.nome] = true; });
        cPag.appendChild(no('div', 'rotulo', 'Cartões que você aceita'));
        // Duas colunas com a tabela inteira de cada bandeira, do jeito que o
        // aplicativo da maquininha mostra: dá para conferir sem sair daqui.
        var grelha = no('div', 'grelha-bandeiras');
        todasBandeiras.forEach(function (b) {
          var cartaoB = no('div', 'cartao-bandeira' + (aceitas[b.nome] ? ' aceito' : ''));
          var marca = botao('lembrar bandeira-topo', null, function () {
            aceitas[b.nome] = !aceitas[b.nome];
            marca.setAttribute('aria-pressed', aceitas[b.nome] ? 'true' : 'false');
            marca.querySelector('.caixinha').textContent = aceitas[b.nome] ? '✓' : '';
            cartaoB.className = 'cartao-bandeira' + (aceitas[b.nome] ? ' aceito' : '');
            somar();
          });
          marca.setAttribute('aria-pressed', aceitas[b.nome] ? 'true' : 'false');
          marca.appendChild(no('span', 'caixinha', aceitas[b.nome] ? '✓' : ''));
          marca.appendChild(no('span', 'bandeira-nome', b.nome));
          cartaoB.appendChild(marca);

          var lista = no('div', 'bandeira-taxas');
          function linhaTaxa(rot, valor) {
            var l = no('div', 'bandeira-linha');
            l.appendChild(no('span', null, rot));
            l.appendChild(no('span', 'num', porcentoBr(valor)));
            lista.appendChild(l);
          }
          if (b.debito) linhaTaxa('Débito', b.debito);
          var ateAqui = inteiro(campoVezesCartao.value) || 12;
          for (var n = 1; n <= ateAqui; n++) linhaTaxa(n + 'x', b.credito[n - 1] || 0);
          cartaoB.appendChild(lista);
          grelha.appendChild(cartaoB);
        });
        cPag.appendChild(grelha);

        var campoRepassar = entradaSelecao([
          { valor: 'sim', rotulo: 'O cliente paga a taxa', detalhe: 'o preço sobe conforme as parcelas' },
          { valor: 'nao', rotulo: 'A taxa sai do meu bolso', detalhe: 'o preço é o mesmo em qualquer parcela' }
        ], rascunho.pagamento.repassar !== false ? 'sim' : 'nao', 'A taxa entra no preço?');
        var caixaRepassar = campo('A taxa entra no preço?', campoRepassar);
        caixaRepassar.style.marginTop = '14px';
        cPag.appendChild(caixaRepassar);
        campoRepassar.aoMudar = function () { somar(); };
        forma.appendChild(cPag);

        // ---- parcelar direto ----
        var marcarDireto = botao('lembrar', null, function () {
          guardarCampos();
          rascunho.direto.ligado = !rascunho.direto.ligado;
          montar();
        });
        marcarDireto.setAttribute('aria-pressed', rascunho.direto.ligado ? 'true' : 'false');
        marcarDireto.style.margin = '4px 0 14px';
        marcarDireto.appendChild(no('span', 'caixinha', rascunho.direto.ligado ? '✓' : ''));
        marcarDireto.appendChild(no('span', null, 'Parcelar direto comigo'));
        forma.appendChild(marcarDireto);

        var campoEntrada = null, campoVezesD = null, campoModoD = null,
            campoPorcentoD = null, campoReaisD = null, campoPrimeira = null;

        if (rascunho.direto.ligado) {
          var cDir = cartao();
          cDir.appendChild(no('div', 'rotulo', 'Parcelado direto'));

          campoEntrada = entradaValor(rascunho.direto.entrada, false);
          cDir.appendChild(campo('Entrada', campoEntrada));

          campoVezesD = entradaSelecao(
            Array.apply(null, { length: 24 }).map(function (_, i) {
              return { valor: String(i + 1), rotulo: i === 0 ? 'só à vista' : 'até ' + (i + 1) + 'x' };
            }), String(rascunho.direto.vezes || 3), 'Em até quantas vezes');
          cDir.appendChild(campo('Em até quantas vezes', campoVezesD));
          campoVezesD.aoMudar = function () { somar(); };
          var notaDir = no('div', 'linha-nota',
            'No PDF o cliente vê todas as opções, de 1x até esse número.');
          notaDir.style.marginTop = '-8px';
          cDir.appendChild(notaDir);

          campoModoD = entradaSelecao([
            { valor: 'nenhum', rotulo: 'Sem acréscimo' },
            { valor: 'porcento', rotulo: 'Acrescentar % por parcela' },
            { valor: 'reais', rotulo: 'Acrescentar R$ por parcela' }
          ], rascunho.direto.modo || 'nenhum', 'Acréscimo');
          cDir.appendChild(campo('Acréscimo', campoModoD));

          campoPorcentoD = entradaTextoNumero(
            rascunho.direto.modo === 'porcento' ? numeroBr(rascunho.direto.acrescimo) : '0', '0');
          var caixaPorc = campo('Quanto por cento por parcela', campoPorcentoD);
          campoReaisD = entradaValor(rascunho.direto.modo === 'reais' ? rascunho.direto.acrescimo : 0, false);
          var caixaReais = campo('Quantos reais por parcela', campoReaisD);
          cDir.appendChild(caixaPorc);
          cDir.appendChild(caixaReais);
          function pintarModo() {
            caixaPorc.style.display = campoModoD.value === 'porcento' ? '' : 'none';
            caixaReais.style.display = campoModoD.value === 'reais' ? '' : 'none';
          }
          campoModoD.aoMudar = function () { pintarModo(); somar(); };
          pintarModo();

          campoPrimeira = entradaData(rascunho.direto.primeira);
          cDir.appendChild(campo('Primeira parcela vence em', campoPrimeira));
          campoPrimeira.addEventListener('change', somar);

          [campoEntrada, campoPorcentoD, campoReaisD].forEach(function (c) {
            c.addEventListener('input', somar);
            c.addEventListener('change', somar);
          });
          forma.appendChild(cDir);
        }

        var campoObs = entradaTexto(rascunho.obs, 'O que mais o cliente precisa saber (opcional)', 400);
        forma.appendChild(campo('Observações', campoObs));

        // ---- os preços, sempre à vista ----
        var cTotal = cartao();
        var resumo = no('div');
        cTotal.appendChild(resumo);
        forma.appendChild(cTotal);

        function guardarCampos() {
          rascunho.titulo = campoTitulo.value;
          rascunho.materiais = camposMat.map(function (c) {
            return { nome: c.nome.value.trim(), valor: digitosParaCentavos(c.valor.value) };
          });
          rascunho.outros = camposOut.map(function (c) {
            return { nome: c.nome.value.trim(), valor: digitosParaCentavos(c.valor.value) };
          });
          rascunho.maoDeObra = digitosParaCentavos(campoMao.value);
          rascunho.logistica = digitosParaCentavos(campoLog.value);
          rascunho.desconto = digitosParaCentavos(campoDesc.value);
          rascunho.obs = campoObs.value;
          rascunho.pagamento.descontoAvista = Math.min(Math.max(comoNumero(campoDescAv.value, 0), 0), 90);
          rascunho.pagamento.ateParcelas = inteiro(campoVezesCartao.value) || 12;
          rascunho.pagamento.repassar = campoRepassar.value === 'sim';
          // O orçamento guarda as taxas do dia em que foi feito: mexer na
          // tabela depois não muda um papel que já foi para o cliente.
          rascunho.pagamento.bandeiras = todasBandeiras
            .filter(function (b) { return aceitas[b.nome]; })
            .map(function (b) { return JSON.parse(JSON.stringify(b)); });
          if (rascunho.direto.ligado && campoVezesD) {
            rascunho.direto.entrada = digitosParaCentavos(campoEntrada.value);
            rascunho.direto.vezes = inteiro(campoVezesD.value) || 1;
            rascunho.direto.modo = campoModoD.value;
            rascunho.direto.acrescimo = campoModoD.value === 'porcento'
              ? Math.max(comoNumero(campoPorcentoD.value, 0), 0)
              : digitosParaCentavos(campoReaisD.value);
            rascunho.direto.primeira = ehData(campoPrimeira.value) ? campoPrimeira.value : hojeTexto();
          }
        }

        function linhaDePreco(rotulo, valor, detalhe, destaque) {
          var l = no('div', 'preco-linha' + (destaque ? ' forte' : ''));
          var esq = no('div');
          esq.appendChild(no('div', 'preco-rotulo', rotulo));
          if (detalhe) esq.appendChild(no('div', 'linha-nota', detalhe));
          l.appendChild(esq);
          l.appendChild(no('div', 'preco-valor num', emReais(valor)));
          return l;
        }

        function somar() {
          guardarCampos();
          var pr = precosDaProposta(rascunho);
          resumo.textContent = '';
          resumo.appendChild(no('div', 'rotulo', 'Como fica para o cliente'));
          if (!pr.cheio) {
            resumo.appendChild(no('div', 'linha-nota', 'Nada somado ainda.'));
            return;
          }
          resumo.appendChild(linhaDePreco('Dinheiro ou Pix', pr.aVista,
            pr.descAvista ? numeroBr(pr.descAvista) + '% de desconto' : 'sem desconto', true));

          pr.bandeiras.forEach(function (b) {
            resumo.appendChild(no('div', 'rotulo', b.nome));
            if (b.debito) {
              resumo.appendChild(linhaDePreco('Débito', b.totalDebito,
                numeroBr(b.debito) + '% de taxa · você recebe ' + emReais(b.liquidoDebito)));
            }
            var ultima = b.credito[b.credito.length - 1];
            resumo.appendChild(linhaDePreco('Crédito 1x', b.credito[0].total,
              (b.credito[0].taxa ? numeroBr(b.credito[0].taxa) + '% de taxa' : 'sem taxa') +
              ' · você recebe ' + emReais(b.credito[0].liquido)));
            if (b.credito.length > 1) {
              resumo.appendChild(linhaDePreco('Crédito ' + ultima.vezes + 'x', ultima.total,
                ultima.vezes + 'x de ' + emReais(ultima.parcela) +
                ' · ' + numeroBr(ultima.taxa) + '% de taxa · você recebe ' + emReais(ultima.liquido)));
              resumo.appendChild(no('div', 'linha-nota',
                'No PDF vão as ' + b.credito.length + ' opções, de 1x a ' + ultima.vezes + 'x.'));
            }
          });

          if (pr.direto) {
            var d = pr.direto;
            var maior = d.maior;
            var primeiro = maior.itens[0].valor;
            var det = 'até ' + maior.vezes + 'x de ' + emReais(primeiro);
            if (d.entrada) det = 'entrada de ' + emReais(d.entrada) + ' + ' + det;
            resumo.appendChild(no('div', 'rotulo', 'Parcelado direto comigo'));
            // O à vista aparece aqui para você conferir que ele bate com o
            // total do orçamento antes de mandar o PDF.
            if (maior.vezes > 1) {
              resumo.appendChild(linhaDePreco('À vista', d.planos[0].total,
                'sem acréscimo — é o total do orçamento'));
            }
            resumo.appendChild(linhaDePreco('Até ' + maior.vezes + 'x', maior.total, det));
            resumo.appendChild(no('div', 'linha-nota',
              'No PDF vão as ' + d.planos.length + ' opções, de 1x a ' + maior.vezes + 'x. ' +
              'O acréscimo entra a partir de 2x.'));
          }
          var soma = [];
          if (pr.materiais) soma.push('materiais ' + emReais(pr.materiais));
          if (rascunho.maoDeObra) soma.push('mão de obra ' + emReais(rascunho.maoDeObra));
          if (pr.outros) soma.push('outros ' + emReais(pr.outros));
          if (rascunho.logistica) soma.push('logística ' + emReais(rascunho.logistica));
          if (rascunho.desconto) soma.push('desconto −' + emReais(rascunho.desconto));
          resumo.appendChild(no('div', 'linha-nota', soma.join(' · ')));
        }
        somar();

        var acoes = no('div', 'acoes');
        acoes.appendChild(botao('btn btn-ouro', 'Salvar orçamento', function () {
          guardarCampos();
          if (!rascunho.titulo.trim()) { mostrarErro(forma, 'Escreva a descrição do serviço.'); return; }
          var pr = precosDaProposta(rascunho);
          if (!pr.bruto) { mostrarErro(forma, 'Ponha ao menos um valor: material, mão de obra, outros ou logística.'); return; }
          if (!rascunho.pagamento.bandeiras.length) {
            mostrarErro(forma, 'Marque ao menos um cartão que você aceita.'); return;
          }
          rascunho.materiais = rascunho.materiais.filter(function (m) { return m.nome || m.valor; });
          rascunho.outros = rascunho.outros.filter(function (m) { return m.nome || m.valor; });

          var alvo = existente;
          if (!alvo) {
            alvo = { id: novoId(), clienteId: clienteId, numero: proximoNumeroDeProposta(),
                     data: hojeTexto(), servicoId: '', criadoEm: Date.now() };
            if (!estado.propostas) estado.propostas = [];
            estado.propostas.push(alvo);
          }
          alvo.tipo = rascunho.tipo;
          alvo.titulo = rascunho.titulo.trim();
          alvo.validade = rascunho.validade;
          alvo.materiais = rascunho.materiais;
          alvo.outros = rascunho.outros;
          alvo.maoDeObra = rascunho.maoDeObra;
          alvo.logistica = rascunho.logistica;
          alvo.desconto = rascunho.desconto;
          alvo.obs = rascunho.obs.trim();
          alvo.pagamento = JSON.parse(JSON.stringify(rascunho.pagamento));
          alvo.direto = rascunho.direto.ligado
            ? JSON.parse(JSON.stringify(rascunho.direto)) : { ligado: false };
          guardarTaxas(rascunho.pagamento);
          salvar();
          fecharFolha();
          setTimeout(function () {
            empilhar({ tipo: 'aba', voltar: function () { montarFichaCliente(clienteId); } });
            abrirFolhaPropostaPronta(alvo.id);
          }, 240);
        }));
        forma.appendChild(acoes);
        folha.appendChild(forma);
      });
    }
  }

  // Desenha o orçamento numa folha A4. É este arquivo que vai para o
  // cliente, então ele tem que se explicar sozinho.
  function pdfDaProposta(p) {
    var cliente = achar(estado.clientes, p.clienteId);
    var t = totalDaProposta(p);
    var f = PDF.folha();
    var MARGEM = 44;
    var direita = f.largura - MARGEM;
    var OURO = [0.91, 0.70, 0.30];
    var CINZA = [0.42, 0.42, 0.42];

    // ---- cabeçalho ----
    f.retangulo(0, 0, f.largura, 92, [0.03, 0.03, 0.04]);
    f.texto('FINANZ', MARGEM, 44, { tamanho: 19, negrito: true, cor: OURO });
    f.texto('Orçamento de serviço', MARGEM, 64, { tamanho: 9, cor: [0.72, 0.72, 0.72] });
    f.texto('Nº ' + ('000' + p.numero).slice(-4), direita, 44,
            { tamanho: 13, negrito: true, alinhar: 'direita', cor: [1, 1, 1] });
    f.texto(dataBr(p.data), direita, 64, { tamanho: 9, alinhar: 'direita', cor: [0.72, 0.72, 0.72] });

    var y = 128;
    var emitente = String(estado.perfil.negocio || estado.perfil.nome || '').trim();
    if (emitente) {
      f.texto('DE', MARGEM, y, { tamanho: 7.5, negrito: true, cor: CINZA });
      f.texto(emitente, MARGEM, y + 14, { tamanho: 11, negrito: true });
      var contato = String(estado.perfil.contato || '').trim();
      if (contato) f.texto(contato, MARGEM, y + 29, { tamanho: 9, cor: CINZA });
      y += contato ? 48 : 34;
    }

    f.texto('PARA', MARGEM, y, { tamanho: 7.5, negrito: true, cor: CINZA });
    f.texto(cliente ? cliente.nome : 'Cliente', MARGEM, y + 14, { tamanho: 11, negrito: true });
    y += 28;
    var fones = cliente ? telefonesDoCliente(cliente) : [];
    if (fones.length) {
      f.texto(telefoneBonito(fones[0].numero), MARGEM, y, { tamanho: 9, cor: CINZA });
      y += 13;
    }
    if (cliente && cliente.endereco) {
      f.quebrar(cliente.endereco, 9, false, direita - MARGEM).forEach(function (l) {
        f.texto(l, MARGEM, y, { tamanho: 9, cor: CINZA });
        y += 12;
      });
    }

    // Uma faixa por seção: o cliente vê de longe onde acaba o serviço e
    // onde começa a conversa de preço.
    function faixaDeSecao(titulo, folga) {
      y += folga == null ? 26 : folga;
      if (y > f.altura - 130) { f.novaPagina(); y = 70; }
      f.linha(MARGEM, y - 12, direita, y - 12, 1.1, [0.03, 0.03, 0.04]);
      f.texto(titulo, MARGEM, y + 4, { tamanho: 10.5, negrito: true });
      y += 24;
    }

    faixaDeSecao(String(p.tipo || 'Serviço').toUpperCase() === 'VENDA' ? 'O QUE ESTÁ SENDO VENDIDO' : 'O SERVIÇO', 18);
    f.quebrar(p.titulo, 12.5, true, direita - MARGEM).forEach(function (l) {
      f.texto(l, MARGEM, y, { tamanho: 12.5, negrito: true });
      y += 17;
    });

    // ---- a conta, item por item ----
    y += 12;
    f.retangulo(MARGEM, y - 12, direita - MARGEM, 22, [0.94, 0.94, 0.94]);
    f.texto('DESCRIÇÃO', MARGEM + 8, y + 3, { tamanho: 8, negrito: true, cor: CINZA });
    f.texto('VALOR', direita - 8, y + 3, { tamanho: 8, negrito: true, alinhar: 'direita', cor: CINZA });
    y += 26;

    function linhaDaConta(rotulo, valor, negrito) {
      if (y > f.altura - 150) { f.novaPagina(); y = 70; }
      f.quebrar(rotulo, 10, !!negrito, direita - MARGEM - 110).forEach(function (l, i) {
        f.texto(l, MARGEM + 8, y, { tamanho: 10, negrito: !!negrito });
        if (i === 0) {
          f.texto(emReais(valor), direita - 8, y, { tamanho: 10, negrito: !!negrito, alinhar: 'direita' });
        }
        y += 15;
      });
      f.linha(MARGEM, y - 5, direita, y - 5, 0.4, [0.86, 0.86, 0.86]);
      y += 5;
    }

    if (p.materiais.length) {
      f.texto('Materiais', MARGEM + 8, y, { tamanho: 8.5, negrito: true, cor: CINZA });
      y += 14;
      p.materiais.forEach(function (m) { linhaDaConta(m.nome || 'Material', m.valor); });
    }
    if (p.maoDeObra) linhaDaConta('Mão de obra', p.maoDeObra);
    (p.outros || []).forEach(function (m) { linhaDaConta(m.nome || 'Item', m.valor); });
    if (p.logistica) linhaDaConta('Custo logístico (deslocamento e frete)', p.logistica);
    if (p.desconto) linhaDaConta('Desconto', -p.desconto);

    // ---- total ----
    y += 8;
    f.retangulo(MARGEM, y - 12, direita - MARGEM, 34, [0.03, 0.03, 0.04]);
    f.texto('TOTAL', MARGEM + 8, y + 8, { tamanho: 12, negrito: true, cor: [1, 1, 1] });
    f.texto(emReais(t.total), direita - 8, y + 8,
            { tamanho: 14, negrito: true, alinhar: 'direita', cor: OURO });
    y += 52;

    // ---- como pagar ----
    var pr = precosDaProposta(p);
    faixaDeSecao('COMO PAGAR');

    function formaDePagamento(rotulo, valor, detalhe, forte) {
      if (y > f.altura - 110) { f.novaPagina(); y = 70; }
      if (forte) f.retangulo(MARGEM, y - 13, direita - MARGEM, detalhe ? 34 : 24, [0.97, 0.94, 0.86]);
      f.texto(rotulo, MARGEM + 8, y, { tamanho: 10.5, negrito: !!forte });
      f.texto(emReais(valor), direita - 8, y,
              { tamanho: 11.5, negrito: true, alinhar: 'direita' });
      y += detalhe ? 13 : 12;
      if (detalhe) {
        f.texto(detalhe, MARGEM + 8, y, { tamanho: 8.5, cor: CINZA });
        y += 13;
      }
      f.linha(MARGEM, y - 4, direita, y - 4, 0.4, [0.86, 0.86, 0.86]);
      y += 8;
    }

    formaDePagamento('Dinheiro ou Pix', pr.aVista,
      pr.descAvista ? numeroBr(pr.descAvista) + '% de desconto sobre ' + emReais(pr.cheio) : '', true);
    y += 8;

    // Duas colunas lado a lado, como o quadro de taxas da maquininha: o
    // papel fica curto e a comparação entra de uma olhada só.
    var LARGURA_COL = (direita - MARGEM - 18) / 2;

    function alturaDoQuadro(linhas) { return 30 + linhas.length * 14 + 10; }

    function desenharQuadro(x, topo, titulo, subtitulo, linhas) {
      var alt = alturaDoQuadro(linhas) + (subtitulo ? 11 : 0);
      f.retangulo(x, topo, LARGURA_COL, alt, [0.965, 0.965, 0.965]);
      var yy = topo + 16;
      f.texto(titulo, x + 10, yy, { tamanho: 9.5, negrito: true });
      yy += subtitulo ? 12 : 0;
      if (subtitulo) f.texto(subtitulo, x + 10, yy, { tamanho: 7.5, cor: CINZA });
      yy += 8;
      f.linha(x + 10, yy, x + LARGURA_COL - 10, yy, 0.5, [0.82, 0.82, 0.82]);
      yy += 13;
      linhas.forEach(function (l) {
        f.texto(l.esq, x + 10, yy, { tamanho: 8.5, negrito: !!l.forte, cor: l.forte ? [0, 0, 0] : CINZA });
        if (l.meio) f.texto(l.meio, x + LARGURA_COL - 78, yy, { tamanho: 8.5, alinhar: 'direita', cor: CINZA });
        f.texto(l.dir, x + LARGURA_COL - 10, yy, { tamanho: 8.5, negrito: true, alinhar: 'direita' });
        yy += 14;
      });
      return alt;
    }

    // Os quadros saem dois a dois; sozinho, um quadro parte em duas colunas
    // para não deixar meia página vazia.
    function quadrosEmPares(quadros) {
      for (var i = 0; i < quadros.length; i += 2) {
        var a = quadros[i], b = quadros[i + 1] || null;
        var alt = Math.max(alturaDoQuadro(a.linhas) + (a.subtitulo ? 11 : 0),
                           b ? alturaDoQuadro(b.linhas) + (b.subtitulo ? 11 : 0) : 0);
        if (y + alt > f.altura - 70) { f.novaPagina(); y = 70; }
        desenharQuadro(MARGEM, y, a.titulo, a.subtitulo, a.linhas);
        if (b) desenharQuadro(MARGEM + LARGURA_COL + 18, y, b.titulo, b.subtitulo, b.linhas);
        y += alt + 14;
      }
    }

    function linhasDeCredito(b, de, ate) {
      var fora = [];
      if (de === 0 && b.debito) {
        fora.push({ esq: 'Débito', meio: '', dir: emReais(b.totalDebito) });
      }
      b.credito.slice(de, ate).forEach(function (l) {
        fora.push({
          esq: l.vezes === 1 ? 'à vista' : l.vezes + 'x',
          meio: l.vezes === 1 ? '' : emReais(l.parcela),
          dir: emReais(l.total)
        });
      });
      return fora;
    }

    var quadros = [];
    if (pr.bandeiras.length === 1) {
      // Uma bandeira só: parto as parcelas em duas metades lado a lado.
      var b0 = pr.bandeiras[0];
      var meio = Math.ceil(b0.credito.length / 2);
      quadros.push({ titulo: b0.nome, subtitulo: 'cada parcela  ·  total',
                     linhas: linhasDeCredito(b0, 0, meio) });
      if (b0.credito.length > meio) {
        quadros.push({ titulo: b0.nome, subtitulo: 'cada parcela  ·  total',
                       linhas: linhasDeCredito(b0, meio, b0.credito.length) });
      }
    } else {
      pr.bandeiras.forEach(function (b) {
        quadros.push({ titulo: b.nome, subtitulo: 'cada parcela  ·  total',
                       linhas: linhasDeCredito(b, 0, b.credito.length) });
      });
    }
    quadrosEmPares(quadros);

    if (pr.direto) {
      var planos = pr.direto.planos;
      var metade = Math.ceil(planos.length / 2);
      function linhasDireto(de, ate) {
        return planos.slice(de, ate).map(function (pl) {
          var pri = pl.itens[0].valor;
          return {
            esq: pl.vezes === 1 ? 'à vista' : pl.vezes + 'x',
            meio: pl.vezes === 1 ? '' : emReais(pri),
            dir: emReais(pl.total)
          };
        });
      }
      var sub = 'parcelado direto' + (pr.direto.entrada ? '  ·  entrada ' + emReais(pr.direto.entrada) : '');
      var doDireto = [{ titulo: 'Parcelado direto', subtitulo: sub, linhas: linhasDireto(0, metade) }];
      if (planos.length > metade) {
        doDireto.push({ titulo: 'Parcelado direto', subtitulo: sub, linhas: linhasDireto(metade, planos.length) });
      }
      quadrosEmPares(doDireto);
      if (planos[0].itens.length) {
        f.texto('Primeira parcela em ' + dataBr(planos[0].itens[0].vencimento) + '.',
                MARGEM, y, { tamanho: 8.5, cor: CINZA });
        y += 16;
      }
    }
    y += 10;

    if (p.validade) {
      f.texto('Este orçamento vale até ' + dataBr(p.validade) + '.', MARGEM, y,
              { tamanho: 9.5, negrito: true });
      y += 18;
    }
    if (p.obs) {
      y += 6;
      f.texto('OBSERVAÇÕES', MARGEM, y, { tamanho: 7.5, negrito: true, cor: CINZA });
      y += 14;
      f.quebrar(p.obs, 9.5, false, direita - MARGEM).forEach(function (l) {
        f.texto(l, MARGEM, y, { tamanho: 9.5 });
        y += 13;
      });
    }

    f.texto('Documento gerado pelo Finanz. Os valores podem mudar se o serviço mudar.',
            f.largura / 2, f.altura - 40, { tamanho: 8, alinhar: 'centro', cor: [0.6, 0.6, 0.6] });
    return f.bytes();
  }

  function nomeDoArquivoDaProposta(p) {
    var cliente = achar(estado.clientes, p.clienteId);
    var quem = (cliente ? cliente.nome : 'cliente').toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 24);
    return 'orcamento-' + ('000' + p.numero).slice(-4) + '-' + (quem || 'cliente') + '.pdf';
  }

  // O mesmo orçamento escrito em texto, para quando só der para mandar
  // mensagem — e para acompanhar o arquivo na conversa.
  function textoDaProposta(p) {
    var cliente = achar(estado.clientes, p.clienteId);
    var t = totalDaProposta(p);
    var primeiro = String(cliente ? cliente.nome : '').split(' ')[0];
    var linhas = [];
    linhas.push('Oi' + (primeiro ? ', ' + primeiro : '') + '! Segue o orçamento:');
    linhas.push('');
    linhas.push('*' + p.titulo + '*');
    linhas.push('Orçamento nº ' + ('000' + p.numero).slice(-4) + ' · ' + dataBr(p.data));
    linhas.push('');
    p.materiais.forEach(function (m) {
      linhas.push('• ' + (m.nome || 'Material') + ': ' + emReais(m.valor));
    });
    if (p.maoDeObra) linhas.push('• Mão de obra: ' + emReais(p.maoDeObra));
    (p.outros || []).forEach(function (m) {
      linhas.push('• ' + (m.nome || 'Item') + ': ' + emReais(m.valor));
    });
    if (p.logistica) linhas.push('• Custo logístico: ' + emReais(p.logistica));
    if (p.desconto) linhas.push('• Desconto: −' + emReais(p.desconto));

    var pr = precosDaProposta(p);
    linhas.push('');
    linhas.push('*Como pagar*');
    linhas.push('• Dinheiro ou Pix: *' + emReais(pr.aVista) + '*' +
      (pr.descAvista ? ' (' + numeroBr(pr.descAvista) + '% de desconto)' : ''));
    pr.bandeiras.forEach(function (b) {
      if (b.debito) linhas.push('• Débito (' + b.nome + '): ' + emReais(b.totalDebito));
      var ultima = b.credito[b.credito.length - 1];
      linhas.push('• Crédito (' + b.nome + '): à vista ' + emReais(b.credito[0].total) +
        (b.credito.length > 1
          ? ', até ' + ultima.vezes + 'x de ' + emReais(ultima.parcela)
          : ''));
    });
    if (pr.direto) {
      var maior = pr.direto.maior;
      var det = 'até ' + maior.vezes + 'x de ' + emReais(maior.itens[0].valor);
      if (pr.direto.entrada) det = 'entrada de ' + emReais(pr.direto.entrada) + ' + ' + det;
      linhas.push('• Parcelado direto comigo: ' + det);
    }
    linhas.push('');
    linhas.push('No PDF em anexo tem o preço de cada parcelamento, um por um.');
    if (p.validade) { linhas.push(''); linhas.push('Vale até ' + dataBr(p.validade) + '.'); }
    if (p.obs) { linhas.push(''); linhas.push(p.obs); }
    return linhas.join('\n');
  }

  function arquivoDaProposta(p) {
    return new File([pdfDaProposta(p)], nomeDoArquivoDaProposta(p), { type: 'application/pdf' });
  }

  // Mandar o PDF pela folha de compartilhar do aparelho: é por ela que o
  // WhatsApp recebe arquivo. Onde ela não existe, vai o texto e o arquivo
  // fica salvo para anexar na mão.
  function enviarProposta(p) {
    var arquivo;
    try { arquivo = arquivoDaProposta(p); } catch (e) {
      avisarCaixa('Não consegui gerar o PDF', String(e && e.message || e), function () {});
      return;
    }
    var texto = textoDaProposta(p);

    if (navigator.share && navigator.canShare && navigator.canShare({ files: [arquivo] })) {
      navigator.share({ files: [arquivo], text: texto, title: 'Orçamento ' + p.titulo })
        .catch(function () {});
      return;
    }

    var cliente = achar(estado.clientes, p.clienteId);
    baixarArquivo(arquivo.name, pdfDaProposta(p), 'application/pdf');
    avisarCaixa('PDF salvo no celular',
      'Este navegador não deixa o app mandar o arquivo direto. Salvei o PDF em Downloads: ' +
      'na conversa do WhatsApp, use o clipe para anexar. Vou abrir a conversa já com o ' +
      'orçamento escrito.', function () {
        if (cliente && temWhatsapp(cliente)) abrirWhatsapp(cliente, texto);
      });
  }

  // Abrir o PDF numa aba, sem baixar. Serve para conferir antes de mandar.
  function verProposta(p) {
    try {
      var blob = new Blob([pdfDaProposta(p)], { type: 'application/pdf' });
      var url = URL.createObjectURL(blob);
      var aba = window.open(url, '_blank');
      if (!aba) {
        // Navegador barrou a aba nova: o jeito que sobra é baixar.
        URL.revokeObjectURL(url);
        avisarCaixa('O navegador não deixou abrir',
          'Ele bloqueou a janela nova. Use "Salvar o PDF no celular" e abra pelo ' +
          'gerenciador de arquivos.', function () {});
        return;
      }
      setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
    } catch (e) {
      avisarCaixa('Não consegui gerar o PDF', String(e && e.message || e), function () {});
    }
  }

  function salvarProposta(p) {
    try {
      baixarArquivo(nomeDoArquivoDaProposta(p), pdfDaProposta(p), 'application/pdf');
      avisar('PDF salvo. Procure em Downloads.');
    } catch (e) {
      avisarCaixa('Não consegui gerar o PDF', String(e && e.message || e), function () {});
    }
  }

  function abrirFolhaPropostaPronta(id) {
    var p = achar(estado.propostas || [], id);
    if (!p) { fecharFolha(); return; }
    var cliente = achar(estado.clientes, p.clienteId);
    var t = totalDaProposta(p);

    abrirFolha('Orçamento nº ' + ('000' + p.numero).slice(-4), function (folha) {
      var forma = no('div');

      var topo = cartao();
      topo.appendChild(no('div', 'rotulo', (p.tipo ? p.tipo + ' · ' : '') + p.titulo));
      topo.appendChild(no('div', 'valorao num', emReais(t.total)));
      topo.appendChild(no('div', 'linha-nota',
        (cliente ? cliente.nome + ' · ' : '') + dataBr(p.data) +
        (p.validade ? ' · vale até ' + dataBr(p.validade) : ' · sem prazo')));
      if (propostaVencida(p)) {
        topo.appendChild(no('div', 'linha-nota vermelho', 'O prazo deste orçamento já passou.'));
      }
      if (p.servicoId) {
        topo.appendChild(no('div', 'linha-nota verde', 'Já virou registro na ficha do cliente.'));
      }
      forma.appendChild(topo);

      var det = cartao();
      det.appendChild(no('div', 'rotulo', 'A conta'));
      var tab = no('div', 'tabela-conf');
      function linhaDet(rot, val, forte) {
        var l = no('div', 'conf-linha');
        l.style.gridTemplateColumns = '1fr auto';
        l.appendChild(no('span', forte ? 'n' : null, rot));
        l.appendChild(no('span', 'num' + (forte ? ' n' : ''), emReais(val)));
        tab.appendChild(l);
      }
      p.materiais.forEach(function (m) { linhaDet(m.nome || 'Material', m.valor); });
      if (p.maoDeObra) linhaDet('Mão de obra', p.maoDeObra);
      (p.outros || []).forEach(function (m) { linhaDet(m.nome || 'Item', m.valor); });
      if (p.logistica) linhaDet('Custo logístico', p.logistica);
      if (p.desconto) linhaDet('Desconto', -p.desconto);
      linhaDet('Total', t.total, true);
      det.appendChild(tab);
      if (p.obs) det.appendChild(no('div', 'linha-nota', p.obs));
      forma.appendChild(det);

      // As formas de pagamento, do jeito que vão para o cliente.
      var pr = precosDaProposta(p);
      var cPag = cartao();
      cPag.appendChild(no('div', 'rotulo', 'Como pagar'));
      function precoPronto(rotulo, valor, detalhe, forte) {
        var l = no('div', 'preco-linha' + (forte ? ' forte' : ''));
        var esq = no('div');
        esq.appendChild(no('div', 'preco-rotulo', rotulo));
        if (detalhe) esq.appendChild(no('div', 'linha-nota', detalhe));
        l.appendChild(esq);
        l.appendChild(no('div', 'preco-valor num', emReais(valor)));
        cPag.appendChild(l);
      }
      precoPronto('Dinheiro ou Pix', pr.aVista,
        pr.descAvista ? numeroBr(pr.descAvista) + '% de desconto' : '', true);
      pr.bandeiras.forEach(function (b) {
        var rot = no('div', 'rotulo', b.nome);
        rot.style.marginTop = '10px';
        cPag.appendChild(rot);
        if (b.debito) {
          precoPronto('Débito', b.totalDebito,
            numeroBr(b.debito) + '% · você recebe ' + emReais(b.liquidoDebito));
        }
        // Cada parcelamento numa linha: é o que o cliente vê no PDF.
        b.credito.forEach(function (l) {
          precoPronto(l.vezes === 1 ? 'Crédito à vista' : 'Crédito ' + l.vezes + 'x', l.total,
            (l.vezes > 1 ? l.vezes + 'x de ' + emReais(l.parcela) + ' · ' : '') +
            numeroBr(l.taxa) + '% · você recebe ' + emReais(l.liquido));
        });
      });

                              : 'sem acréscimo';

            if (pri !== ult) det2 += ' (última ' + emReais(ult) + ')';
            if (pl.entrada) det2 = emReais(pl.entrada) + ' + ' + det2;

          precoPronto(pl.vezes === 1 ? 'À vista' : pl.vezes + 'x', pl.total, det2);

      forma.appendChild(cPag);

      var acoes = no('div', 'acoes');
      acoes.appendChild(botao('btn btn-ouro', 'Enviar no WhatsApp', function () { enviarProposta(p); }));
      var verPdf = botao('btn btn-fantasma', 'Ver o PDF antes', function () { verProposta(p); });
      verPdf.style.marginTop = '8px';
      acoes.appendChild(verPdf);
      var salvar2 = botao('btn btn-fantasma', 'Salvar o PDF no celular', function () { salvarProposta(p); });
      salvar2.style.marginTop = '8px';

      forma.appendChild(acoes);

      var mais = cartao();
      mais.appendChild(no('div', 'rotulo', 'Depois de fechar'));
      if (!p.servicoId) {
        mais.appendChild(no('div', 'linha-nota',
          'Fechando com o cliente, o orçamento vira um registro na ficha dele pelo valor total.'));
        var virar = botao('btn btn-fantasma', 'Cliente aceitou: lançar como registro', function () {
          perguntar({
            titulo: 'Lançar como registro?',
            texto: 'Vai entrar na ficha de ' + (cliente ? cliente.nome : 'cliente') + ' um registro de ' +
                   emReais(t.total) + ' com o nome "' + p.titulo + '". O orçamento continua guardado.',
            ok: 'Lançar'
          }, function () {

            };

      var editar = botao('btn btn-fantasma', 'Editar este orçamento', function () {

      var apagar = botao('btn btn-vermelho', 'Excluir o orçamento', function () {

          titulo: 'Excluir este orçamento?',

          ok: 'Excluir', tom: 'perigo'
        }, function () {
          estado.propostas = (estado.propostas || []).filter(function (o) { return o.id !== p.id; });
          salvar();
          fecharFolha();
          setTimeout(function () { montarFichaCliente(p.clienteId); }, 240);
          avisar('Orçamento excluído.');
        });
      });
      apagar.style.marginTop = '8px';
      mais.appendChild(apagar);

      folha.appendChild(forma);
