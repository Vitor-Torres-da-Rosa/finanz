<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050506">
<meta name="description" content="Controle de receitas, despesas, investimentos e metas.">
<title>Finanz</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanz">
<style>
  :root {
    --fundo: #050506;
    --cartao: rgba(12,11,9,.62);
    --cartao-2: rgba(38,30,18,.78);
    --borda: rgba(198,158,78,.26);
    --borda-viva: rgba(233,180,76,.55);
    --texto: #F4F0E7;
    --suave: #A79C89;
    --fraco: #7C7362;
    --ouro: #E9B44C;
    --ouro-2: #C2913A;
    --ouro-claro: #F6DDA0;
    --dourado: linear-gradient(140deg, #F7E2A8 0%, #E9B44C 45%, #C2913A 100%);
    --verde: #3DDC84;
    --vermelho: #FF6B6B;
    --azul: #60A5FA;
    --roxo: #A78BFA;
    --rosa: #F472B6;
    --ciano: #22D3EE;
    --raio: 18px;
    --baixo: env(safe-area-inset-bottom, 0px);
    /* Quanto da tela está escondido embaixo pela barra do navegador. */
    --fundo-oculto: 0px;
    --alto: env(safe-area-inset-top, 0px);
    --nav: 62px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html { background: var(--fundo); }

  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    color: var(--texto);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
  }

  /* Camada fixa com o mármore. Fica presa à tela, então o conteúdo
     desliza por cima dela sem arrastar a imagem junto. */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -2;
    background: var(--fundo) url('fundo.webp') center center / cover no-repeat;
  }
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    background:
      radial-gradient(120% 70% at 50% 0%, rgba(233,180,76,.06), transparent 60%),
      linear-gradient(180deg, rgba(4,4,5,.30) 0%, rgba(4,4,5,.50) 55%, rgba(4,4,5,.68) 100%);
  }

  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; padding: 0; }
  input, select { -webkit-appearance: none; appearance: none; }

  .oculto { display: none !important; }
  /* O input de arquivo fica invisível, mas desenhado: com display:none
     alguns Android devolvem um arquivo que depois não deixam ler. */
  .input-arquivo {
    position: fixed; left: 0; bottom: 0;
    width: 1px; height: 1px; opacity: 0;
    border: 0; padding: 0; margin: 0;
    pointer-events: none; z-index: -1;
  }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- Estrutura ---------- */

  .tela { display: none; padding: 0 16px; }
  .tela.ativa { display: block; }

  main { padding-bottom: calc(var(--nav) + var(--baixo) + 92px + var(--fundo-oculto)); }

  .cabecalho {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    padding: calc(14px + var(--alto)) 0 14px;
  }
  .cabecalho h1 { font-size: 21px; font-weight: 700; margin: 0; letter-spacing: -.01em; }
  .cabecalho .sub { font-size: 13px; color: var(--suave); margin-top: 2px; }

  .mes-seletor {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    background: var(--cartao);
    border: 1px solid var(--borda);
    border-radius: 999px;
    padding: 3px;
    flex: 0 0 auto;
  }
  .mes-seletor button {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    color: var(--suave);
    font-size: 17px;
    line-height: 1;
    display: grid;
    place-items: center;
  }
  .mes-seletor button:active { background: var(--cartao-2); }
  .mes-seletor .rotulo {
    font-size: 13px;
    font-weight: 600;
    padding: 0 4px;
    min-width: 94px;
    text-align: center;
    text-transform: capitalize;
  }

  /* ---------- Cartões ---------- */

  .cartao {
    background: linear-gradient(165deg, rgba(22,18,12,.62) 0%, rgba(6,6,7,.74) 62%);
    border: 1px solid var(--borda);
    border-radius: var(--raio);
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: inset 0 1px 0 rgba(246,221,160,.07), 0 10px 26px rgba(0,0,0,.42);
  }
  .cartao.liso { padding: 0; overflow: hidden; }

  .cartao-topo {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }
  .cartao-titulo { font-size: 15px; font-weight: 600; }
  .cartao-acao { font-size: 13px; color: var(--ouro); font-weight: 600; }

  .rotulo {
    font-size: 12px;
    color: var(--suave);
    text-transform: uppercase;
    letter-spacing: .06em;
    font-weight: 600;
  }

  .valorao { font-size: 32px; font-weight: 700; letter-spacing: -.02em; margin: 4px 0; color: var(--ouro); }
  .valorao.pequeno { font-size: 26px; }

  .variacao { font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
  .variacao.sobe { color: var(--verde); }
  .variacao.desce { color: var(--vermelho); }
  .variacao .resto { color: var(--fraco); font-weight: 500; }

  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
  .kpi {
    background: linear-gradient(165deg, rgba(22,18,12,.62) 0%, rgba(6,6,7,.74) 62%);
    border: 1px solid var(--borda);
    border-radius: 15px;
    padding: 12px 10px;
    box-shadow: inset 0 1px 0 rgba(246,221,160,.06);
  }
  .kpi .rotulo { font-size: 11px; letter-spacing: .04em; }
  .kpi .n { font-size: 14.5px; font-weight: 700; margin: 5px 0 4px; }
  .kpi .variacao { font-size: 12px; }

  .duas { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  [hidden] { display: none !important; }

  /* ---------- Gráficos ---------- */

  .grafico { width: 100%; display: block; }
  .grafico-eixo { display: flex; justify-content: space-between; margin-top: 6px; font-size: 11px; color: var(--fraco); }

  .rosca-caixa { position: relative; width: 168px; margin: 4px auto 12px; }
  .rosca-centro {
    position: absolute;
    inset: 0;
    display: grid;
    place-content: center;
    text-align: center;
    pointer-events: none;
  }
  .rosca-centro .t { font-size: 11px; color: var(--suave); }
  .rosca-centro .v { font-size: 17px; font-weight: 700; }

  .legenda { display: flex; flex-direction: column; gap: 9px; }
  .legenda-item { display: flex; align-items: center; gap: 10px; font-size: 13.5px; }
  .legenda-item .bolinha { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
  .legenda-item .nome { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .legenda-item .pct { color: var(--suave); font-size: 12.5px; }
  .legenda-item .val { font-size: 12.5px; color: var(--suave); }
  .legenda-alvo { width: 100%; background: none; border: 0; padding: 4px 0; margin: -4px 0;
                  color: inherit; font: inherit; text-align: left; cursor: pointer; }
  .legenda-alvo:active { opacity: .6; }
  .legenda-seta { color: var(--fraco); font-size: 15px; margin-left: 2px; flex: 0 0 auto; }

  /* ---------- Barras e progresso ---------- */

  .trilho { height: 7px; border-radius: 999px; background: rgba(255,255,255,.07); overflow: hidden; }
  .trilho i { display: block; height: 100%; border-radius: 999px; transition: width .3s ease; }

  .barra-dupla { display: flex; height: 9px; border-radius: 999px; overflow: hidden; background: rgba(255,255,255,.07); }
  .barra-dupla i { display: block; height: 100%; }

  /* ---------- Listas ---------- */

  .linha {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 13px 16px;
    text-align: left;
    border-top: 1px solid var(--borda);
  }
  .linha:first-child { border-top: 0; }
  .linha:active { background: var(--cartao-2); }
  label.linha, label.btn { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  label.btn { display: grid; place-items: center; }

  .selo {
    width: 36px;
    height: 36px;
    border-radius: 11px;
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    font-size: 15px;
    font-weight: 700;
  }

  .linha-texto { flex: 1 1 auto; min-width: 0; }
  .linha-titulo { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .linha-sub { font-size: 12.5px; color: var(--suave); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .linha-fim { flex: 0 0 auto; text-align: right; }
  .linha-valor { font-size: 15px; font-weight: 700; }
  .linha-nota { font-size: 12px; color: var(--fraco); }

  .verde { color: var(--verde); }
  .vermelho { color: var(--vermelho); }
  .ouro { color: var(--ouro); }
  .suave { color: var(--suave); }

  .dia-cabecalho {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 16px 4px 8px;
  }
  .dia-nome { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--suave); }
  .dia-total { font-size: 12.5px; font-weight: 600; color: var(--fraco); }

  .vazio { padding: 32px 18px; text-align: center; color: var(--suave); font-size: 14px; }
  .vazio strong { display: block; color: var(--texto); font-size: 15.5px; margin-bottom: 5px; }

  /* ---------- Segmentos e chips ---------- */

  .segmentos {
    display: flex;
    gap: 4px;
    padding: 4px;
    background: var(--cartao);
    border: 1px solid var(--borda);
    border-radius: 999px;
    margin-bottom: 12px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .segmentos::-webkit-scrollbar { display: none; }
  .segmentos button {
    flex: 1 0 auto;
    padding: 8px 12px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    color: var(--suave);
    white-space: nowrap;
  }
  .segmentos button[aria-selected="true"] {
    background: var(--dourado);
    color: #1A1408;
    box-shadow: 0 2px 12px rgba(233,180,76,.28);
  }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 9px 13px;
    border-radius: 999px;
    background: var(--cartao-2);
    border: 1px solid var(--borda);
    font-size: 13.5px;
    color: var(--texto);
  }
  .chip[aria-pressed="true"] { background: var(--dourado); border-color: transparent; color: #1A1408; font-weight: 600; }
  .chip-mais { border-style: dashed; color: var(--ouro); }
  .chip-mais[aria-pressed="true"] { background: var(--cartao-2); border-color: var(--borda);
                                    color: var(--ouro); font-weight: 400; }

  /* ---------- Busca ---------- */

  .busca {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--cartao);
    border: 1px solid var(--borda);
    border-radius: 999px;
    padding: 0 18px;
    margin-bottom: 12px;
  }
  .busca input { flex: 1; border: 0; background: none; outline: none; padding: 13px 0; font-size: 14.5px; }
  .busca .lupa { color: var(--suave); display: grid; place-items: center; flex: 0 0 auto; }
  .busca .lupa svg { width: 18px; height: 18px; }

  /* ---------- Navegação ---------- */

  nav {
    position: fixed;
    left: 0; right: 0;
    bottom: var(--fundo-oculto);
    height: calc(var(--nav) + var(--baixo));
    padding-bottom: var(--baixo);
    display: flex;
    background: rgba(6,6,7,.88);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid var(--borda);
    z-index: 40;
  }
  nav button {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    color: var(--fraco);
    font-size: 10.5px;
    font-weight: 600;
  }
  nav button svg { width: 21px; height: 21px; }
  nav button[aria-selected="true"] { color: var(--ouro); }

  .fab {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(var(--nav) + var(--baixo) + 16px + var(--fundo-oculto));
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: var(--dourado);
    color: #1A1408;
    font-size: 30px;
    font-weight: 300;
    line-height: 1;
    display: grid;
    place-items: center;
    box-shadow: 0 10px 26px rgba(0,0,0,.6), 0 0 22px rgba(233,180,76,.22), 0 0 0 5px #08090B;
    z-index: 41;
  }
  .fab:active { transform: translateX(-50%) scale(.94); }

  /* ---------- Folhas ---------- */

  .cortina {
    position: fixed;
    inset: 0;
    background: rgba(4,7,10,.72);
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease;
    z-index: 105;
  }
  .cortina.aberta { opacity: 1; pointer-events: auto; }

  .folha {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    max-height: 92vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    background: linear-gradient(180deg, #14110C 0%, #08080A 34%);
    border-top: 1px solid var(--borda-viva);
    border-radius: 22px 22px 0 0;
    padding: 8px 16px calc(22px + var(--baixo));
    transform: translateY(101%);
    transition: transform .27s cubic-bezier(.32,.72,0,1);
    z-index: 106;
  }
  .folha.aberta { transform: translateY(0); }

  .puxador { width: 38px; height: 4px; border-radius: 999px; background: rgba(233,180,76,.4); margin: 6px auto 14px; }
  .folha-titulo { font-size: 17px; font-weight: 700; text-align: center; margin-bottom: 16px; }
  .folha-titulo.com-acao {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .folha-titulo .titulo-acao {
    width: 30px;
    height: 30px;
    border-radius: 9px;
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    color: var(--suave);
  }
  .folha-titulo .titulo-acao:active { background: var(--cartao-2); color: var(--ouro); }
  .folha-titulo .titulo-acao svg { width: 16px; height: 16px; }

  .campo { margin-bottom: 14px; }
  .campo > label { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--suave); margin-bottom: 7px; }

  .entrada {
    width: 100%;
    padding: 13px 14px;
    border: 1px solid var(--borda);
    border-radius: 12px;
    background: var(--cartao);
    outline: none;
    font-size: 15px;
  }
  .entrada:focus { border-color: var(--ouro); }
  .melhor-dia { display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
    background: rgba(233,180,76,.07); border-color: rgba(233,180,76,.35); }
  .melhor-dia.sem-conta { background: var(--cartao); border-color: var(--borda);
    color: var(--fraco); font-size: 14px; }
  .melhor-dia-num { color: var(--ouro); font-weight: 700; }
  .melhor-dia-prazo { color: var(--suave); font-size: 12.5px; }
  input[type="date"].entrada { min-height: 47px; }
  ::placeholder { color: var(--fraco); }

  .valor-grande {
    width: 100%;
    padding: 6px 0 12px;
    border: 0;
    border-bottom: 2px solid var(--borda);
    border-radius: 0;
    background: none;
    font-size: 34px;
    font-weight: 700;
    letter-spacing: -.02em;
    text-align: center;
    outline: none;
  }
  .valor-grande:focus { border-bottom-color: currentColor; }
  .forma[data-tipo="saida"] .valor-grande { color: var(--vermelho); }
  .forma[data-tipo="entrada"] .valor-grande { color: var(--verde); }
  .forma[data-tipo="transferencia"] .valor-grande { color: var(--azul); }

  .acoes { display: flex; flex-direction: column; gap: 9px; margin-top: 20px; }

  .btn {
    width: 100%;
    padding: 15px;
    border-radius: 13px;
    font-size: 15.5px;
    font-weight: 700;
    text-align: center;
  }
  .btn-ouro { background: var(--dourado); color: #1A1408; box-shadow: 0 6px 20px rgba(233,180,76,.22); }
  .btn-fantasma { background: var(--cartao); border: 1px solid var(--borda); color: var(--texto); }

  /* Calendário de escolher data: ano em cima, mês e dias embaixo. */
  .cal { border: 1px solid var(--borda); border-radius: 14px; padding: 10px 10px 12px;
         background: var(--cartao); user-select: none; touch-action: pan-y; }
  .cal-fita { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .cal-fita + .cal-fita { margin-top: 4px; }
  .cal-seta { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--borda);
              background: transparent; color: var(--ouro); font-size: 17px; line-height: 1;
              display: flex; align-items: center; justify-content: center; flex: none; }
  .cal-ano { font-size: 19px; font-weight: 600; letter-spacing: .06em; color: var(--texto); }
  .cal-mes { font-size: 15px; color: var(--suave); text-transform: capitalize; }
  .cal-grade { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-top: 8px; }
  .cal-cab { text-align: center; font-size: 11px; color: var(--fraco); padding: 4px 0; }
  .cal-dia { aspect-ratio: 1 / 1; border: 0; background: transparent; color: var(--texto);
             border-radius: 10px; font-size: 14px; display: flex; align-items: center;
             justify-content: center; }
  .cal-dia.fora { color: var(--fraco); opacity: .45; }
  .cal-dia.hoje { border: 1px solid var(--borda); }
  .cal-dia.escolhido { background: var(--ouro); color: #1B1608; font-weight: 700; }
  .cal-rotulo { display: flex; justify-content: space-between; align-items: baseline;
                margin: 0 2px 6px; }
  .cal-rotulo .num { color: var(--ouro); font-size: 13px; }

  /* Conferência da conta: números em grade e o mês a mês em tabela. */
  .grade-conf { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .conf-item { border: 1px solid var(--borda); border-radius: 12px; padding: 9px 11px; }
  .conf-rotulo { font-size: 11px; color: var(--fraco); text-transform: uppercase;
                 letter-spacing: .08em; }
  .conf-valor { font-size: 14px; color: var(--texto); margin-top: 3px; }
  .tabela-conf { margin-top: 10px; }
  .conf-linha { display: grid; grid-template-columns: 62px 1fr 1fr 1fr; gap: 6px;
                padding: 7px 2px; border-bottom: 1px solid var(--borda); font-size: 12.5px; }
  .conf-linha span:not(:first-child) { text-align: right; }
  .conf-linha:last-child { border-bottom: 0; }
  .conf-cab { color: var(--fraco); font-size: 11px; text-transform: uppercase;
              letter-spacing: .06em; }
  /* ---------- Análise financeira ----------
     Mesma linguagem do resto do app: fundo escuro, borda discreta, ouro
     para o que importa. O que muda é a hierarquia, não a estética. */
  .analise-titulo { font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
                    color: var(--fraco); margin: 2px 2px 10px; }

  .cartao.saude { padding: 18px 16px; }
  .saude-linha { display: flex; align-items: center; gap: 16px; }
  .saude-anel { position: relative; width: 84px; height: 84px; flex: none; }
  .saude-num { position: absolute; inset: 0; display: flex; align-items: baseline;
               justify-content: center; gap: 1px; }
  .saude-valor { font-size: 26px; font-weight: 700; color: var(--texto); line-height: 1; }
  .saude-de { font-size: 11px; color: var(--fraco); }
  .saude-texto { min-width: 0; }
  .saude-faixa { font-size: 19px; font-weight: 600; margin: 2px 0 4px; }
  .saude-esperando { font-size: 18px; font-weight: 600; color: var(--suave); margin: 8px 0 6px; }

  .parte-nota { padding: 10px 0; border-bottom: 1px solid var(--borda); }
  .parte-nota:last-child { border-bottom: 0; }
  .parte-topo { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
  .parte-barra, .meta-barra, .mini-barra { height: 5px; border-radius: 3px;
                 background: rgba(255,255,255,.07); overflow: hidden; margin-top: 8px; }
  .parte-cheio, .meta-cheio { height: 100%; background: var(--ouro); border-radius: 3px;
                 transition: width .8s cubic-bezier(.2,.8,.2,1); }
  .mini-barra { margin-top: 6px; }
  .mini-cheio { height: 100%; border-radius: 3px; }

  /* Um achado: ícone, título curto, número, uma explicação e um caminho. */
  .cartao.achado { padding: 16px; animation: subir .45s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes subir { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .cartao.achado { animation: none; }
    .parte-cheio, .meta-cheio, .anel-nota circle { transition: none; }
  }
  .achado-topo { display: flex; align-items: center; gap: 9px; }
  .achado-icone { font-size: 15px; width: 26px; height: 26px; border-radius: 8px;
                  display: flex; align-items: center; justify-content: center;
                  background: rgba(255,255,255,.05); flex: none; }
  .achado-titulo { font-size: 14.5px; font-weight: 600; color: var(--texto); }
  .achado-valor { font-size: 25px; font-weight: 700; margin: 10px 0 2px;
                  letter-spacing: -.01em; }
  .achado-texto { font-size: 13.5px; color: var(--suave); line-height: 1.5; margin: 4px 0 0; }
  .achado-nota { font-size: 11px; color: var(--fraco); line-height: 1.5; margin-top: 8px; }
  .achado-detalhes { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--borda); }
  .achado-linha { display: flex; justify-content: space-between; gap: 12px;
                  font-size: 13px; color: var(--suave); padding: 5px 0; }
  .achado-linha .num { color: var(--texto); }
  .meta-legenda { display: flex; justify-content: space-between; font-size: 11.5px;
                  color: var(--fraco); margin-top: 6px; }

  .btn-acao { margin-top: 14px; color: var(--ouro); font-size: 13.5px; font-weight: 600;
              padding: 10px 0; text-align: left; width: 100%; min-height: 44px; }
  .btn-acao:active { opacity: .6; }

  /* O tom é uma faixa fina na borda, não um cartão colorido. */
  .cartao.tom-ruim { border-left: 2px solid rgba(255,107,107,.55); }
  .cartao.tom-atencao { border-left: 2px solid rgba(233,180,76,.55); }
  .cartao.tom-bom { border-left: 2px solid rgba(61,220,132,.45); }
  .cartao.tom-info { border-left: 2px solid var(--borda); }

  .cartao.proxima { border: 1px solid rgba(233,180,76,.4); }
  .cartao.proxima .btn { margin-top: 14px; }

  .linha-verTudo { border: 1px solid var(--borda); border-radius: var(--raio);
                   margin-bottom: 12px; }

  .recorrente { padding: 4px 0 10px; border-bottom: 1px solid var(--borda); }
  .recorrente:last-child { border-bottom: 0; }
  .recorrente-acoes { display: flex; gap: 8px; padding: 0 2px; }
  .recorrente-acoes .btn-mini { flex: 1; }

  /* As bandeiras lado a lado, cada uma com a sua tabela de taxas — a mesma
     leitura do aplicativo da maquininha. */
  .grelha-bandeiras { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .cartao-bandeira { border: 1px solid var(--borda); border-radius: 12px; padding: 10px;
                     opacity: .5; transition: opacity .15s; }
  .cartao-bandeira.aceito { opacity: 1; }
  .bandeira-topo { width: 100%; gap: 7px; align-items: flex-start; }
  .bandeira-nome { font-size: 12.5px; color: var(--texto); text-align: left; line-height: 1.25; }
  .bandeira-taxas { margin-top: 8px; }
  .bandeira-linha { display: flex; justify-content: space-between; gap: 6px;
                    font-size: 11.5px; color: var(--suave); padding: 2.5px 0; }
  .bandeira-linha .num { color: var(--texto); }

  /* A tabela de taxas: 1x, 2x, 3x... lado a lado, três por linha. */
  .grade-taxas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
  .taxa-cel { display: flex; align-items: center; gap: 6px; }
  .taxa-vezes { font-size: 12px; color: var(--fraco); width: 26px; flex: none; }
  .taxa-cel .entrada { margin: 0; padding: 10px 8px; font-size: 13px; }

  /* Cada forma de pagamento numa linha, com o preço à direita. */
  .preco-linha { display: flex; align-items: center; justify-content: space-between;
                 gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--borda); }
  .preco-linha:last-child { border-bottom: 0; }
  .preco-rotulo { font-size: 14px; color: var(--texto); }
  .preco-valor { font-size: 15px; color: var(--texto); white-space: nowrap; }
  .preco-linha.forte .preco-rotulo { font-weight: 600; }
  .preco-linha.forte .preco-valor { color: var(--ouro); font-size: 17px; font-weight: 700; }
  .preco-linha .linha-nota { margin-top: 2px; }

  /* Uma linha de material do orçamento: nome, valor e o X de tirar. */
  .linha-item-orc { display: grid; grid-template-columns: 1fr 108px 38px; gap: 6px;
                    align-items: center; margin-top: 8px; }
  .linha-item-orc .entrada { margin: 0; }
  .linha-item-orc .btn-mini { padding: 10px 0; }
  .aba-cliente button { flex: 1 1 0; min-width: 0; font-size: 12.5px; padding: 9px 4px; }

  /* As transações de dentro de um grupo repetido, recuadas e presas nele. */
  .grupo-aberto { margin: 0 0 6px 14px; border-left: 2px solid var(--borda);
                  padding-left: 8px; }
  .grupo-aberto .linha { padding-top: 8px; padding-bottom: 8px; }
  .btn.btn-vermelho { background: transparent; border: 1px solid rgba(224,69,63,.55);
                      color: #FF9A94; }
  .btn.btn-vermelho:active { background: rgba(224,69,63,.14); }
  .btn-perigo { background: transparent; color: var(--vermelho); font-size: 14.5px; padding: 12px; }
  .btn-perigo:active { background: rgba(248,113,113,.1); }
  .btn:disabled { opacity: .45; }

  .erro { color: var(--vermelho); font-size: 13px; text-align: center; margin-top: 4px; }

  /* ---------- Insights ---------- */

  .insight {
    background: linear-gradient(165deg, rgba(22,18,12,.62) 0%, rgba(6,6,7,.74) 62%);
    border: 1px solid var(--borda);
    border-radius: 15px;
    padding: 14px;
    margin-bottom: 10px;
    box-shadow: inset 0 1px 0 rgba(246,221,160,.06);
  }
  .insight-topo { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; font-size: 13.5px; font-weight: 700; }
  .insight-topo .pino { width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center; font-size: 13px; }
  .insight p { margin: 0; font-size: 13.5px; color: var(--suave); line-height: 1.5; }
  .insight .destaque { margin-top: 9px; font-size: 13.5px; font-weight: 700; }

  /* ---------- Caixa de pergunta ---------- */

  .dialogo-fundo {
    position: fixed;
    inset: 0;
    z-index: 130;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(3,3,4,.72);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    opacity: 0;
    transition: opacity .18s ease;
  }
  .dialogo-fundo[hidden] { display: none; }
  .dialogo-fundo.aberta { opacity: 1; }

  .dialogo {
    width: 100%;
    max-width: 340px;
    padding: 24px 22px 18px;
    border-radius: 22px;
    text-align: center;
    background: linear-gradient(165deg, rgba(28,23,15,.96) 0%, rgba(8,8,10,.98) 60%);
    border: 1px solid var(--borda-viva);
    box-shadow: inset 0 1px 0 rgba(246,221,160,.1), 0 24px 60px rgba(0,0,0,.7);
    transform: scale(.94);
    transition: transform .18s cubic-bezier(.32,.72,0,1);
  }
  .dialogo-fundo.aberta .dialogo { transform: scale(1); }

  .dialogo-icone {
    width: 58px;
    height: 58px;
    margin: 0 auto 16px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    color: var(--ouro);
    background: radial-gradient(circle at 50% 35%, rgba(233,180,76,.22), rgba(233,180,76,.05) 70%);
    border: 1px solid rgba(233,180,76,.35);
  }
  .dialogo-icone svg { width: 27px; height: 27px; }
  .dialogo.perigo .dialogo-icone {
    color: var(--vermelho);
    background: radial-gradient(circle at 50% 35%, rgba(255,107,107,.20), rgba(255,107,107,.04) 70%);
    border-color: rgba(255,107,107,.35);
  }

  .dialogo-titulo { font-size: 18px; font-weight: 700; margin: 0 0 8px; }
  .dialogo-texto { font-size: 14px; color: var(--suave); line-height: 1.5; margin: 0 0 20px; white-space: pre-line; }
  .dialogo-acoes { display: flex; flex-direction: column; gap: 9px; }
  .dialogo-acoes .btn { padding: 14px; border-radius: 13px; }
  .dialogo .btn-vermelho {
    background: linear-gradient(140deg, #FF8B8B, #E0453F);
    color: #1B0806;
    box-shadow: 0 6px 20px rgba(255,107,107,.2);
  }
  .dialogo .btn-discreto { color: var(--suave); font-weight: 600; padding: 12px; }
  .dialogo .btn-discreto:active { background: var(--cartao-2); }

  .rotulo-secao {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .07em;
    text-transform: uppercase;
    color: var(--ouro);
    margin: 22px 0 12px;
    padding-top: 16px;
    border-top: 1px solid var(--borda);
  }

  .telefone-linha {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .telefone-linha > .entrada { flex: 1 1 auto; min-width: 0; }
  .telefone-linha .linha-acao {
    border: 1px solid var(--borda);
    background: rgba(14,12,10,.62);
  }
  .telefone-linha .linha-acao.tem-whats { color: #25D366; border-color: rgba(37,211,102,.45); }
  .telefone-marca { font-size: 12px; color: var(--suave); margin: -4px 0 14px; }
  .telefone-marca .n { color: #25D366; font-weight: 700; }

  .pilula-periodo {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    flex: 0 0 auto;
    padding: 7px 12px;
    border-radius: 999px;
    background: var(--cartao);
    border: 1px solid var(--borda);
    color: var(--texto);
    font-size: 13px;
    font-weight: 600;
    max-width: 62%;
  }
  .pilula-periodo:active { background: var(--cartao-2); }
  .pilula-periodo svg { width: 15px; height: 15px; color: var(--ouro); flex: 0 0 auto; }
  .pilula-periodo > span:nth-child(2) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pilula-periodo .seta { color: var(--suave); font-size: 10px; flex: 0 0 auto; }

  .linha-dupla-campo { display: flex; align-items: center; gap: 8px; }
  .linha-dupla-campo > .entrada { flex: 1 1 auto; min-width: 0; }
  .linha-dupla-campo > .linha-acao {
    border: 1px solid var(--borda);
    background: rgba(14,12,10,.62);
  }

  /* ---------- Seletor próprio ---------- */

  .selecao {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    text-align: left;
  }
  .selecao .rotulo-valor { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .selecao .seta { flex: 0 0 auto; color: var(--suave); font-size: 11px; }
  .selecao[aria-expanded="true"] { border-color: var(--ouro); }

  .escolha-caixa {
    width: 100%;
    max-width: 380px;
    max-height: 74vh;
    display: flex;
    flex-direction: column;
    border-radius: 22px;
    overflow: hidden;
    background: linear-gradient(165deg, rgba(28,23,15,.97) 0%, rgba(8,8,10,.98) 55%);
    border: 1px solid var(--borda-viva);
    box-shadow: 0 24px 60px rgba(0,0,0,.7);
    transform: scale(.94);
    transition: transform .18s cubic-bezier(.32,.72,0,1);
  }
  .dialogo-fundo.aberta .escolha-caixa { transform: scale(1); }
  .escolha-titulo {
    padding: 18px 20px 12px;
    font-size: 16px;
    font-weight: 700;
    text-align: center;
    border-bottom: 1px solid var(--borda);
  }
  .escolha-lista { overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .escolha-item {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 15px 20px;
    text-align: left;
    font-size: 15px;
    border-top: 1px solid rgba(198,158,78,.12);
  }
  .escolha-item:first-child { border-top: 0; }
  .escolha-item:active { background: var(--cartao-2); }
  .escolha-item .marca {
    width: 20px; height: 20px;
    border-radius: 50%;
    border: 1.5px solid rgba(198,158,78,.4);
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    font-size: 12px;
    color: #1A1408;
  }
  .escolha-item[aria-selected="true"] .marca { background: var(--dourado); border-color: transparent; }
  .escolha-item[aria-selected="true"] { color: var(--ouro); font-weight: 600; }
  .escolha-item .txt { flex: 1 1 auto; min-width: 0; }
  .escolha-item .extra { color: var(--suave); font-size: 13px; font-weight: 400; }
  .area-colar { min-height: 170px; resize: vertical; font-size: 13px; line-height: 1.45;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .selo-marca { font-weight: 800; letter-spacing: -.3px; box-shadow: 0 2px 8px rgba(0,0,0,.35); }
  .cabeca-cartao { display: flex; align-items: center; gap: 11px; margin-bottom: 14px; }
  .cabeca-banco { display: flex; align-items: center; gap: 11px; padding: 12px;
    margin: 2px 0 14px; border: 1px solid var(--borda-viva); border-radius: 14px;
    background: rgba(233,180,76,.05); }
  .cabeca-texto { flex: 1 1 auto; min-width: 0; }
  .cabeca-nome { font-size: 14.5px; font-weight: 700; }
  .cabeca-sub { font-size: 11.5px; color: var(--suave); margin-top: 2px; }
  .cabeca-banco .btn-mini { flex: 0 0 auto; }
  .selo-curto { font-size: 12.5px; letter-spacing: -.2px; }
  .caminho-conta { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .caminho-conta .selo { width: 26px; height: 26px; border-radius: 8px; font-size: 10.5px; }
  .seta-conta { color: var(--suave); font-size: 15px; }
  .item-valor.azul { color: var(--azul); }
  .marcar-todos { display: flex; align-items: center; gap: 11px; margin: -4px 0 16px;
    font-size: 13.5px; color: var(--texto); }
  .paginas { display: flex; align-items: center; gap: 8px; padding: 10px 0; }
  .paginas .btn-mini { flex: 0 0 auto; padding: 8px 12px; }
  .paginas .btn-mini:disabled { opacity: .35; }
  .paginas-conta { flex: 1 1 auto; text-align: center; font-size: 12px; color: var(--suave);
    font-variant-numeric: tabular-nums; }
  .atalhos-extrato { display: flex; gap: 8px; margin: 10px 0 2px; }
  .btn-mini { flex: 1 1 0; padding: 8px 10px; border-radius: 10px; font-size: 12.5px;
    font-weight: 600; border: 1px solid var(--borda); background: rgba(255,255,255,.03);
    color: var(--texto); }
  .lista-extrato .btn-fantasma { margin-top: 12px; }
  .resumo-extrato { margin: 4px 0 14px; padding: 12px 14px; border: 1px solid var(--borda);
    border-radius: 14px; background: rgba(255,255,255,.02); }
  .resumo-linha-forte { font-weight: 700; font-size: 15px; }
  .resumo-linha { color: var(--suave); font-size: 12.5px; margin-top: 2px; }
  .resumo-par { display: flex; gap: 14px; margin-top: 8px; font-size: 12.5px; font-weight: 600; }
  .lista-extrato { display: flex; flex-direction: column; }
  .item-extrato { display: flex; align-items: center; gap: 11px; padding: 10px 2px;
    border-top: 1px solid var(--borda); }
  .item-extrato.alto { align-items: flex-start; }
  .item-extrato.apagado { opacity: .42; }
  .item-meio { flex: 1 1 auto; min-width: 0; }
  .item-desc { font-size: 13.5px; line-height: 1.3; word-break: break-word; }
  .item-sub { display: flex; align-items: center; gap: 8px; margin-top: 3px;
    font-size: 11.5px; color: var(--suave); flex-wrap: wrap; }
  .item-valor { flex: 0 0 auto; font-size: 13px; font-weight: 700; white-space: nowrap; }
  .par-lados { margin-top: 7px; border-left: 2px solid var(--borda); padding-left: 10px;
    display: flex; flex-direction: column; gap: 7px; }
  .par-topo { display: flex; align-items: baseline; gap: 7px; font-size: 11.5px;
    color: var(--suave); flex-wrap: wrap; }
  .par-sinal { font-weight: 700; font-size: 12.5px; }
  .par-desc { font-size: 12.5px; line-height: 1.3; word-break: break-word; }
  .etiqueta-cat { background: rgba(255,255,255,.05); border: 1px solid var(--borda);
    border-radius: 999px; padding: 2px 9px; font-size: 11px; font-weight: 600; }
  .etiqueta-vazia { border-style: dashed; color: var(--fraco); font-weight: 400; }
  .ja-tem { color: var(--ouro); }
  .caixinha { flex: 0 0 auto; width: 23px; height: 23px; border-radius: 7px;
    border: 1px solid var(--borda-viva); background: transparent; color: #1A1408;
    font-size: 13px; font-weight: 800; display: grid; place-items: center; }
  .caixinha.marcada { background: var(--dourado); border-color: transparent; }
  .escolha-item .escolha-icone { flex: 0 0 auto; color: var(--suave); display: grid; place-items: center; }
  .escolha-item .escolha-icone svg { width: 17px; height: 17px; }
  .escolha-rodape { padding: 12px 16px calc(14px + var(--baixo)); border-top: 1px solid var(--borda); }

  /* ---------- WhatsApp e atrasos ---------- */

  .btn-whats {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    width: 100%;
    padding: 14px;
    border-radius: 13px;
    background: rgba(37,211,102,.12);
    border: 1px solid rgba(37,211,102,.45);
    color: #25D366;
    font-size: 14.5px;
    font-weight: 700;
  }
  .btn-whats:active { background: rgba(37,211,102,.2); }
  .btn-whats svg { width: 20px; height: 20px; }

  .linha.atrasada .linha-titulo { color: var(--vermelho); }
  .aviso-atraso {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    border-radius: 13px;
    background: rgba(255,107,107,.10);
    border: 1px solid rgba(255,107,107,.32);
    font-size: 13px;
    color: var(--texto);
    margin-bottom: 12px;
  }
  .aviso-atraso .n { color: var(--vermelho); font-weight: 700; }

  .parcela-linha { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid rgba(198,158,78,.14); font-size: 13.5px; }
  .parcela-linha:last-child { border-bottom: 0; }
  .parcela-linha .q { color: var(--suave); }
  .parcela-linha .v { font-weight: 700; font-variant-numeric: tabular-nums; }
  .parcela-linha.paga .v { color: var(--verde); }
  .parcela-linha.vencida .q, .parcela-linha.vencida .v { color: var(--vermelho); }

  /* ---------- Linha com ação ao lado ---------- */

  .linha.linha-dupla { padding: 0 10px 0 0; gap: 0; }
  .linha-alvo {
    display: flex;
    align-items: center;
    gap: 12px;
    flex: 1 1 auto;
    min-width: 0;
    padding: 13px 8px 13px 16px;
    text-align: left;
  }
  .linha-alvo:active { background: var(--cartao-2); }
  .linha-acao {
    width: 36px;
    height: 36px;
    border-radius: 11px;
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    color: var(--suave);
  }
  .linha-acao:active { background: var(--cartao-2); color: var(--ouro); }
  .linha-acao svg { width: 18px; height: 18px; }

  /* ---------- Aviso e toque ---------- */

  .aviso {
    position: fixed;
    left: 12px; right: 12px;
    top: calc(10px + var(--alto));
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    background: var(--cartao-2);
    border: 1px solid var(--borda);
    color: var(--texto);
    border-radius: 13px;
    box-shadow: 0 12px 30px rgba(0,0,0,.6);
    z-index: 118;
    font-size: 14px;
  }
  .aviso span { flex: 1; }
  .aviso button { padding: 8px 13px; border-radius: 999px; background: var(--dourado); color: #1A1408; font-size: 13.5px; font-weight: 700; }

  .toque {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(var(--nav) + var(--baixo) + 84px + var(--fundo-oculto));
    max-width: calc(100% - 32px);
    padding: 11px 18px;
    background: #16130D;
    border: 1px solid var(--borda);
    border-radius: 999px;
    font-size: 14px;
    box-shadow: 0 10px 26px rgba(0,0,0,.5);
    z-index: 120;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease;
  }
  .toque.visivel { opacity: 1; }

  /* ---------- Relatório ---------- */

  #relatorio {
    position: fixed;
    inset: 0;
    background: var(--fundo) url('fundo.webp') center center / cover no-repeat;
    z-index: 90;
    overflow-y: auto;
    display: none;
  }
  #relatorio.aberto { display: block; }
  .rel-barra {
    position: sticky;
    top: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: calc(12px + var(--alto)) 16px 12px;
    background: rgba(6,6,7,.92);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--borda);
  }
  .rel-barra button { font-size: 14px; font-weight: 600; color: var(--ouro); }
  .rel-folha { padding: 18px 16px 40px; max-width: 720px; margin: 0 auto; }
  .rel-folha h1 { font-size: 22px; margin: 0 0 4px; }
  .rel-folha .rel-sub { color: var(--suave); font-size: 13px; margin-bottom: 20px; }
  .rel-folha h2 { font-size: 15px; margin: 24px 0 10px; padding-bottom: 7px; border-bottom: 1px solid var(--borda); }
  .rel-tabela { width: 100%; border-collapse: collapse; font-size: 13px; }
  .rel-tabela th { text-align: left; color: var(--suave); font-weight: 600; padding: 7px 6px; border-bottom: 1px solid var(--borda); font-size: 12px; }
  .rel-tabela td { padding: 8px 6px; border-bottom: 1px solid rgba(198,158,78,.16); }
  .rel-tabela td.n, .rel-tabela th.n { text-align: right; font-variant-numeric: tabular-nums; }
  .rel-par { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(198,158,78,.16); font-size: 14px; }
  .rel-par .v { font-weight: 700; font-variant-numeric: tabular-nums; }
  .rel-nota { font-size: 12px; color: var(--fraco); margin-top: 18px; line-height: 1.6; }

  /* ---------- Entrada: abertura, login e cadastro ---------- */

  #entrada {
    position: fixed;
    inset: 0;
    z-index: 100;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    /* O mesmo mármore do resto do app, para a arte assentar sem emenda. */
    background: var(--fundo) url('fundo.webp') center center / cover no-repeat;
  }
  #entrada.escondida { display: none; }
  #entrada:not([data-tela="abertura"])::before {
    content: '';
    position: fixed;
    inset: 0;
    background: linear-gradient(180deg, rgba(4,4,5,.52), rgba(4,4,5,.68));
    pointer-events: none;
  }
  #entrada .ent-folha { position: relative; z-index: 1; }

  .ent-folha {
    min-height: 100%;
    max-width: 460px;
    margin: 0 auto;
    padding: calc(18px + var(--alto)) 24px calc(26px + var(--baixo));
    display: flex;
    flex-direction: column;
  }

  .ent-voltar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: rgba(20,17,12,.8);
    border: 1px solid var(--borda);
    color: var(--texto);
    display: grid;
    place-items: center;
    font-size: 19px;
    margin-bottom: 22px;
    flex: 0 0 auto;
  }
  .ent-voltar:active { background: rgba(38,30,18,.9); }

  .marca-caixa { text-align: center; margin: 0 0 4px; }

  /* A arte sangra de borda a borda: sem laterais, não há emenda para ver.
     Em cima o tom já é o do fundo; embaixo, um degradê dissolve o corte. */
  .marca-heroi {
    display: block;
    width: calc(100% + 48px);
    max-width: none;
    height: auto;
    margin: calc(-18px - var(--alto)) -24px -16px;
    -webkit-mask-image: linear-gradient(180deg, #000 82%, transparent 100%);
    mask-image: linear-gradient(180deg, #000 82%, transparent 100%);
  }
  .marca-nome {
    font-size: 26px;
    font-weight: 600;
    letter-spacing: .42em;
    text-indent: .42em;
    margin-top: 0;
    color: #F6F2E9;
    text-shadow: 0 2px 18px rgba(0,0,0,.65);
  }
  /* Subtítulo entre dois fios, como no desenho. */
  .marca-sub {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-size: 9px;
    letter-spacing: .3em;
    text-indent: .3em;
    color: #C8B183;
    margin-top: 9px;
    text-transform: uppercase;
  }
  .marca-sub::before, .marca-sub::after {
    content: '';
    width: 26px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(233,180,76,.75));
  }
  .marca-sub::after { background: linear-gradient(90deg, rgba(233,180,76,.75), transparent); }

  /* Selo da marca no alto do Início */
  .marca-barra { text-align: center; padding: calc(12px + var(--alto)) 0 2px; }
  .marca-selo {
    display: block;
    width: 46px;
    height: auto;
    margin: 0 auto 6px;
    -webkit-mask-image: radial-gradient(ellipse 66% 62% at 50% 50%, #000 34%, transparent 92%);
    mask-image: radial-gradient(ellipse 66% 62% at 50% 50%, #000 34%, transparent 92%);
  }
  .marca-barra .marca-nome { font-size: 17px; letter-spacing: .38em; text-indent: .38em; }
  .marca-barra .marca-sub { font-size: 8px; margin-top: 6px; }
  .marca-barra + .cabecalho { padding-top: 10px; }

  /* Cabeçalho de duas colunas: texto à esquerda, ilustração à direita */
  .ent-cabecalho { display: flex; align-items: flex-start; gap: 10px; }
  .ent-cabecalho > div:first-child { flex: 1 1 auto; min-width: 0; }
  .ent-cabecalho .ilustra { flex: 0 0 auto; margin-top: -6px; }

  /* Campos agrupados num cartão só, com divisórias */
  .campos-grupo {
    background: linear-gradient(165deg, rgba(22,18,12,.62) 0%, rgba(6,6,7,.74) 62%);
    border: 1px solid var(--borda);
    border-radius: 16px;

    margin-bottom: 16px;
  }
  .campos-grupo .ent-campo {

  .campos-grupo .ent-campo:first-child { border-top: 0; }
  .campos-grupo:focus-within { border-color: var(--borda-viva); }
  .campos-grupo .ent-campo:focus-within { background: rgba(233,180,76,.05); }

  .ent-titulo {
    font-size: 34px;
    line-height: 1.12;
    font-weight: 700;
    letter-spacing: -.02em;
    text-align: center;
    margin: 26px 0 0;
  }
  .ent-titulo .ouro { color: var(--ouro); display: block; }
  .ent-texto {
    text-align: center;
    color: var(--suave);
    font-size: 14.5px;
    line-height: 1.5;
    margin: 12px 0 0;
  }

  .carrossel {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
    margin: 0 -24px;
  }
  .carrossel::-webkit-scrollbar { display: none; }
  .carrossel > div {
    flex: 0 0 100%;

    padding: 0 24px;
  }

  .vantagens { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 26px; }
  .vantagem { text-align: center; }
  .vantagem .quadro {
    width: 54px;
    height: 54px;
    margin: 0 auto 10px;
    border-radius: 15px;
    background: linear-gradient(160deg, rgba(30,25,16,.85), rgba(10,10,11,.9));
    border: 1px solid var(--borda);
    box-shadow: inset 0 1px 0 rgba(246,221,160,.08);
    display: grid;
    place-items: center;
    color: var(--ouro);
  }
  .vantagem .quadro svg { width: 24px; height: 24px; }
  .vantagem .nome { font-size: 12.5px; font-weight: 700; }
  .vantagem .detalhe { font-size: 11px; color: var(--fraco); line-height: 1.45; margin-top: 4px; }

  .pontos { display: flex; justify-content: center; gap: 7px; margin: 22px 0 4px; }
  .pontos i {
    width: 8px; height: 8px; border-radius: 50%;
    background: rgba(233,180,76,.22);
    transition: background .2s ease;
  }
  .pontos i.ativo { background: var(--ouro); }

  .ent-fundo { margin-top: auto; padding-top: 26px; }

  .btn-dourado {
    width: 100%;
    padding: 16px;
    border-radius: 14px;
    background: var(--dourado);
    color: #1A1408;
    font-size: 15.5px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    box-shadow: 0 10px 26px rgba(233,180,76,.18);
  }
  .btn-dourado:active { filter: brightness(.94); }
  .btn-dourado:disabled { opacity: .5; box-shadow: none; }
  .btn-dourado svg { width: 19px; height: 19px; }

  .btn-contorno {
    width: 100%;
    padding: 15px;
    border-radius: 14px;
    background: rgba(14,12,10,.72);
    border: 1px solid rgba(198,158,78,.26);
    color: var(--texto);
    font-size: 15px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 11px;
  }
  .btn-contorno:active { background: rgba(38,30,18,.85); }
  .btn-contorno svg { width: 19px; height: 19px; }

  .separador {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 22px 0 14px;
    color: var(--fraco);
    font-size: 12.5px;
  }
  .separador::before, .separador::after {
    content: '';
    flex: 1;
    height: 1px;
    background: rgba(198,158,78,.18);
  }

  .sociais-linha { display: flex; flex-direction: column; gap: 10px; }
  .social {
    position: relative;
    width: 100%;
    padding: 15px 18px;
    border-radius: 14px;
    background: rgba(14,12,10,.72);
    border: 1px solid rgba(198,158,78,.26);
    display: flex;
    align-items: center;
    font-size: 14.5px;
    font-weight: 600;
  }
  .social > span { flex: 1; text-align: center; margin-left: -20px; }
  .social:active { background: rgba(38,30,18,.85); }
  .social svg { width: 20px; height: 20px; flex: 0 0 auto; }

  .sociais-redondas { display: flex; justify-content: center; gap: 16px; }
  .social-redonda {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: rgba(14,12,10,.72);
    border: 1px solid rgba(198,158,78,.26);
    display: grid;
    place-items: center;
  }
  .social-redonda:active { background: rgba(38,30,18,.85); }
  .social-redonda svg { width: 24px; height: 24px; }

  .termos {
    text-align: center;
    font-size: 11.5px;
    color: var(--fraco);
    line-height: 1.6;
    margin-top: 18px;
  }
  .termos button { color: var(--ouro); font-weight: 600; font-size: 11.5px; }

  .ent-campo {
    display: flex;
    align-items: center;
    gap: 11px;
    background: rgba(14,12,10,.72);
    border: 1px solid rgba(198,158,78,.26);
    border-radius: 14px;
    padding: 0 14px;
    margin-bottom: 12px;
  }
  .ent-campo:focus-within { border-color: var(--ouro); }
  .ent-campo .icone { color: var(--fraco); display: grid; place-items: center; }
  .ent-campo .icone svg { width: 19px; height: 19px; }

    border: 0;
    background: none;
    outline: none;
    padding: 15px 0;
    font-size: 15px;
  }
  .ent-campo .olho { color: var(--fraco); padding: 8px; margin-right: -8px; }
  .ent-campo .olho svg { width: 19px; height: 19px; display: block; }

  .ent-linha-meio {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin: 4px 0 20px;
    font-size: 13.5px;
  }
  .lembrar { display: flex; align-items: center; gap: 9px; color: var(--suave); }
  .caixinha {
    width: 20px; height: 20px;
    border-radius: 6px;
    border: 1.5px solid rgba(198,158,78,.38);
    display: grid;
    place-items: center;
    color: #1A1408;
    font-size: 13px;
    font-weight: 700;
    flex: 0 0 auto;
  }
  .lembrar[aria-pressed="true"] .caixinha { background: var(--ouro); border-color: var(--ouro); }
  .elo { color: var(--ouro); font-weight: 600; font-size: 13.5px; }

  .passos { display: flex; align-items: flex-start; margin: 22px 0 24px; }
  .passo { flex: 1; text-align: center; position: relative; }
  .passo .bola {
    width: 38px; height: 38px;
    border-radius: 50%;
    margin: 0 auto 7px;
    display: grid;
    place-items: center;
    background: rgba(24,20,14,.8);
    border: 1px solid rgba(198,158,78,.26);
    color: var(--fraco);
    font-size: 14.5px;
    font-weight: 700;
  }
  .passo.ativo .bola { background: var(--dourado); border-color: transparent; color: #1A1408; }
  .passo.feito .bola { background: rgba(61,220,132,.12); border-color: rgba(61,220,132,.4); color: var(--verde); }
  .passo .nome { font-size: 11.5px; color: var(--fraco); }
  .passo.ativo .nome { color: var(--texto); font-weight: 600; }
  .passo::after {
    content: '';

    top: 19px;
    left: 62%;

    background: rgba(198,158,78,.26);

  .passo:last-child::after { display: none; }

  .cofre-aviso {
    display: flex;
    gap: 12px;
    padding: 14px;
    border-radius: 14px;

    border: 1px solid rgba(233,180,76,.22);

  }

  .cofre-aviso .t { font-size: 13.5px; font-weight: 700; margin-bottom: 3px; }
  .cofre-aviso .d { font-size: 12px; color: var(--suave); line-height: 1.5; }

  .rodape-troca { text-align: center; font-size: 13.5px; color: var(--suave); margin-top: 18px; }

  .codigo-recuperacao {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 19px;
    letter-spacing: .12em;
    text-align: center;
    padding: 16px;
    border-radius: 12px;
    background: rgba(14,12,10,.72);
    border: 1px dashed rgba(233,180,76,.4);
    color: var(--ouro);

  .contas-salvas { display: flex; flex-direction: column; gap: 9px; margin-bottom: 18px; }

    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 14px;
    border-radius: 14px;

    border: 1px solid rgba(198,158,78,.26);

  .conta-salva:active { background: rgba(38,30,18,.85); }
  .conta-salva .avatar {

    color: #1A1408;
    display: grid;
    place-items: center;
    font-weight: 700;
    flex: 0 0 auto;
  }

  /* ---------- Seleção de categorias do orçamento ---------- */

  .cat-linha {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 13px 14px;
    border-top: 1px solid var(--borda);

  }
  .cat-linha:first-child { border-top: 0; }
  .cat-linha:active { background: var(--cartao-2); }
  .cat-linha .marca {
    width: 22px; height: 22px;
    border-radius: 7px;
    border: 1.5px solid rgba(198,158,78,.38);
    display: grid;
    place-items: center;
    color: #1A1408;
    font-size: 13px;
    font-weight: 700;
    flex: 0 0 auto;
  }

  .cat-linha .nome { flex: 1; min-width: 0; font-size: 15px; }
  .cat-linha .gasto { font-size: 13px; color: var(--suave); font-variant-numeric: tabular-nums; }

  .orc-item {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .orc-item .rot { flex: 1; min-width: 0; font-size: 14.5px; }
  .orc-item .rot small { display: block; color: var(--fraco); font-size: 11.5px; }
  .orc-item input { width: 132px; flex: 0 0 auto; text-align: right; padding: 11px 12px; }
  .orc-item .tirar { color: var(--vermelho); font-size: 20px; padding: 6px; flex: 0 0 auto; }

  /* ---------- Empreendedor ---------- */

  .resumo-grade { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
  .resumo-grade > div { text-align: center; }
  .resumo-grade .r { font-size: 11px; color: var(--suave); text-transform: uppercase; letter-spacing: .04em; }
  .resumo-grade .v { font-size: 15px; font-weight: 700; margin-top: 3px; font-variant-numeric: tabular-nums; }

  .aba-cliente { display: flex; gap: 8px; margin: 14px 0 6px; }

    flex: 1;
    padding: 10px;
    border-radius: 11px;

    border: 1px solid var(--borda);
    font-size: 13.5px;
    font-weight: 600;
    color: var(--suave);

  .etiqueta {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
  }
  .etiqueta.quitado { background: rgba(52,211,153,.14); color: var(--verde); }
  .etiqueta.aberto { background: rgba(233,180,76,.14); color: var(--ouro); }
  .etiqueta.atrasado { background: rgba(248,113,113,.14); color: var(--vermelho); }
  .etiqueta.hoje { background: rgba(61,220,132,.16); color: var(--verde); }
  .etiqueta.fora { background: rgba(255,255,255,.05); color: var(--fraco);
                   border: 1px solid var(--borda); display: inline-block; }
  .cartao.recado { padding: 14px 16px; }
  .recado-topo { display: flex; align-items: flex-start; gap: 9px; }
  .recado-icone { font-size: 16px; line-height: 1.35; }
  .recado-texto { font-size: 13.5px; color: var(--suave); line-height: 1.45; }

  /* ---------- Novidades ---------- */

  .novidade { border-left: 2px solid var(--ouro); padding: 2px 0 2px 14px; margin-bottom: 20px; }
  .novidade .v { font-size: 15px; font-weight: 700; }
  .novidade .q { font-size: 12px; color: var(--fraco); margin-bottom: 8px; }
  .novidade ul { margin: 0; padding-left: 17px; font-size: 13.5px; color: var(--suave); line-height: 1.65; }

  @media print {
    :root { --fundo: #fff; --texto: #111; --suave: #555; --fraco: #777; --borda: #ccc; }
    body { background: #fff; color: #111; }
    body::before, body::after { display: none !important; }
    body > *:not(#relatorio) { display: none !important; }
    #relatorio { position: static; display: block; background: #fff; color: #111; overflow: visible; }
    .rel-barra { display: none; }
    .rel-folha { padding: 0; max-width: none; }

    .tela, .rel-folha { max-width: 620px; margin-left: auto; margin-right: auto; }

  }
</style>
</head>
<body>

<div id="entrada" class="escondida"></div>

<main>
  <section class="tela ativa" id="telaInicio"></section>
  <section class="tela" id="telaTransacoes"></section>
  <section class="tela" id="telaInvestimentos"></section>

</main>

    <button id="relImprimir">Salvar em PDF</button>

</div>

<div class="dialogo-fundo" id="dialogoFundo" hidden>

    <div class="dialogo-icone" id="dialogoIcone"></div>
    <h2 class="dialogo-titulo" id="dialogoTitulo"></h2>

    <div class="dialogo-acoes" id="dialogoAcoes"></div>
  </div>
</div>

<div class="dialogo-fundo" id="escolhaFundo" hidden>
  <div class="escolha-caixa" role="dialog" aria-modal="true" aria-labelledby="escolhaTitulo">
    <div class="escolha-titulo" id="escolhaTitulo"></div>
    <div class="escolha-lista" id="escolhaLista"></div>
    <div class="escolha-rodape" id="escolhaRodape"></div>
  </div>
</div>

<div class="toque" id="toque" role="status" aria-live="polite"></div>
<input type="file" id="arquivoRestaurar" class="input-arquivo">
<input type="file" id="arquivoExtrato" class="input-arquivo" multiple>

<script src="config.js"></script>
<script>
(function () {

    if (lista.length === 1) { enviar(lista[0].numero); return; }

    abrirEscolha({
      titulo: 'Para qual número?',
      valor: lista[0].numero,
      opcoes: lista.map(function (t) {
        return { valor: t.numero, rotulo: telefoneBonito(t.numero), detalhe: t.rotulo || '' };
      })
    }, function (escolhido) {
      if (escolhido) enviar(escolhido);
    });
  }

  // O Postgres devolve bigint como texto em algumas configurações, então
  // aceitamos número ou texto numérico antes de arredondar.
  function inteiro(v) {
    var n = typeof v === 'string' && v.trim() !== '' ? Number(v) : v;
    return typeof n === 'number' && isFinite(n) ? Math.round(n) : 0;
  }

  function texto(v) { return typeof v === 'string' ? v : ''; }

  function ehData(v) { return typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v); }

  // Aceita '2026-09-05' e também '2026-09-05T00:00:00Z', ficando só com o dia.
  function soData(v) {
    if (typeof v !== 'string') return '';
    var m = /^(\d{4}-\d{2}-\d{2})/.exec(v);
    return m ? m[1] : '';
  }

  // O extrato de alguns bancos repete o tipo do lançamento: a coluna diz
  // "Pix enviado" e o detalhe começa com "Pix enviado:" outra vez. Fica uma
  // vez só, inclusive no que já foi importado antes desta correção.
  function semRepeticao(descricao) {
    var s = String(descricao || '').replace(/\s{2,}/g, ' ').trim();
    var rep = /^(.{5,40}?)\s*[:\u2013\u2014-]?\s+\1\b/i.exec(s);
    if (!rep) return s;
    return s.slice(rep[1].length).replace(/^\s*[:\u2013\u2014-]?\s*/, '');
  }

  // Tabela de taxas, arrumada. Mora aqui porque o perfil e cada orçamento
  // guardam a mesma coisa.
  function limparPagamento(t) {
    var b = t && Array.isArray(t.bandeiras) ? t.bandeiras : [];
    // Sem nada escrito, vale o padrão de 10% — zerar aqui apagaria o
    // desconto de quem nunca abriu a tela de taxas.
    var desc = t && t.descontoAvista != null ? Number(t.descontoAvista) : 10;
    return {
      descontoAvista: Math.min(Math.max(isFinite(desc) ? desc : 10, 0), 90),
      repassar: !(t && t.repassar === false),
      ateParcelas: Math.min(Math.max(inteiro(t && t.ateParcelas) || 12, 1), 18),
      bandeiras: b.map(limparBandeira)
    };
  }

  function limparEstado(bruto) {
    var limpo = estadoPadrao();
    if (!bruto || typeof bruto !== 'object') return limpo;

    if (bruto.perfil && typeof bruto.perfil === 'object') {
      limpo.perfil.nome = texto(bruto.perfil.nome).slice(0, 40);
      limpo.perfil.reservaMeses = Math.min(Math.max(inteiro(bruto.perfil.reservaMeses) || 6, 1), 24);
      limpo.perfil.idadeAtual = Math.min(Math.max(inteiro(bruto.perfil.idadeAtual) || 30, 14), 100);
      limpo.perfil.idadeAposentadoria = Math.min(Math.max(inteiro(bruto.perfil.idadeAposentadoria) || 60, 15), 110);
      limpo.perfil.aporteMensal = Math.max(inteiro(bruto.perfil.aporteMensal), 0);
      var rend = Number(bruto.perfil.rendimentoAnual);
      limpo.perfil.rendimentoAnual = isFinite(rend) ? Math.min(Math.max(rend, 0), 60) : 8;
      if (Array.isArray(bruto.perfil.objetivos)) {
        limpo.perfil.objetivos = bruto.perfil.objetivos.filter(function (o) { return typeof o === 'string'; }).slice(0, 10);
      }
      var infl = Number(bruto.perfil.inflacaoAnual);
      limpo.perfil.inflacaoAnual = isFinite(infl) ? Math.min(Math.max(infl, 0), 40) : 4;
      if (bruto.perfil.taxas && Array.isArray(bruto.perfil.taxas.bandeiras) &&
          bruto.perfil.taxas.bandeiras.length) {
        limpo.perfil.taxas = limparPagamento(bruto.perfil.taxas);
      }
      limpo.perfil.metaEconomia = Math.min(Math.max(inteiro(bruto.perfil.metaEconomia) || 20, 1), 90);
      limpo.perfil.negocio = texto(bruto.perfil.negocio).slice(0, 60);
      limpo.perfil.contato = texto(bruto.perfil.contato).slice(0, 40);
      var ret = Number(bruto.perfil.retiradaAnual);
      limpo.perfil.retiradaAnual = isFinite(ret) && ret > 0 ? Math.min(ret, 20) : 4;
      limpo.perfil.metaPatrimonio = Math.max(inteiro(bruto.perfil.metaPatrimonio), 0);
      limpo.perfil.contaAposentadoria = texto(bruto.perfil.contaAposentadoria);
      limpo.perfil.reservaLigada = bruto.perfil.reservaLigada !== false;
      limpo.perfil.reservaConta = texto(bruto.perfil.reservaConta);
      limpo.perfil.reservaManual = Math.max(inteiro(bruto.perfil.reservaManual), 0);
    }

    if (Array.isArray(bruto.tiposRegistro)) {
      limpo.tiposRegistro = bruto.tiposRegistro
        .filter(function (t) { return typeof t === 'string' && t.trim(); })
        .map(function (t) { return t.trim().slice(0, 30); })
        .filter(function (t) { return TIPOS_REGISTRO_BASE.indexOf(t) < 0; })
        .slice(0, 30);
    }

    if (Array.isArray(bruto.paresIgnorados)) {
      limpo.paresIgnorados = bruto.paresIgnorados
        .filter(function (k) { return typeof k === 'string' && k.indexOf('|') > 0; })
        .slice(0, 4000);
    }

    if (bruto.regrasCategoria && typeof bruto.regrasCategoria === 'object') {
      Object.keys(bruto.regrasCategoria).slice(0, 800).forEach(function (k) {
        var v = bruto.regrasCategoria[k];
        if (typeof k === 'string' && typeof v === 'string' && k.trim() && v.trim()) {
          limpo.regrasCategoria[k.slice(0, 60)] = v.slice(0, 30);
        }
      });
    }

    if (bruto.categoriasExtras && typeof bruto.categoriasExtras === 'object') {
      ['saida', 'entrada'].forEach(function (tipo) {
        var lista = bruto.categoriasExtras[tipo];
        if (!Array.isArray(lista)) return;
        limpo.categoriasExtras[tipo] = lista
          .filter(function (c) { return typeof c === 'string' && c.trim(); })
          .map(function (c) { return c.trim().slice(0, 30); })
          .slice(0, 40);
      });
    }

    if (bruto.subcategoriasExtras && typeof bruto.subcategoriasExtras === 'object') {
      ['saida', 'entrada'].forEach(function (tipo) {
        var mapa = bruto.subcategoriasExtras[tipo];
        if (!mapa || typeof mapa !== 'object') return;
        var guardado = {};
        Object.keys(mapa).slice(0, 60).forEach(function (cat) {
          if (!Array.isArray(mapa[cat])) return;
          var lista = mapa[cat]
            .filter(function (sc) { return typeof sc === 'string' && sc.trim(); })
            .map(function (sc) { return sc.trim().slice(0, 30); })
            .slice(0, 40);
          if (lista.length) guardado[String(cat).slice(0, 30)] = lista;
        });
        limpo.subcategoriasExtras[tipo] = guardado;
      });
    }

    if (Array.isArray(bruto.importacoes)) {
      limpo.importacoes = bruto.importacoes.filter(function (i) {
        return i && typeof i === 'object' && typeof i.id === 'string';
      }).map(function (i) {
        return {
          id: i.id,
          contaId: texto(i.contaId),
          banco: texto(i.banco).slice(0, 40),
          arquivo: texto(i.arquivo).slice(0, 80),
          quando: inteiro(i.quando) || Date.now(),
          quantos: Math.max(inteiro(i.quantos), 0),
          saldoExtrato: i.saldoExtrato == null ? null : inteiro(i.saldoExtrato),
          de: soData(i.de), ate: soData(i.ate)
        };
      }).slice(-60);
    }

    if (bruto.revisados && typeof bruto.revisados === 'object') {
      Object.keys(bruto.revisados).slice(0, 400).forEach(function (k) {
        var v = bruto.revisados[k];
        if (typeof k === 'string' && (v === 'manter' || v === 'revisar')) {
          limpo.revisados[k.slice(0, 80)] = v;
        }
      });
    }

    if (Array.isArray(bruto.propostas)) {
      var comBandeira = function (pag) {
        if (!pag.bandeiras.length) pag.bandeiras = [limparBandeira({ nome: 'Cartões' })];
        return pag;
      };
      var limparDireto = function (d) {
        if (!d || typeof d !== 'object' || !d.ligado) return { ligado: false };
        return {
          ligado: true,
          entrada: inteiro(d.entrada),
          vezes: Math.min(Math.max(inteiro(d.vezes) || 1, 1), 60),
          modo: ['nenhum', 'porcento', 'reais'].indexOf(d.modo) >= 0 ? d.modo : 'nenhum',
          acrescimo: Number(d.acrescimo) || 0,
          primeira: soData(d.primeira) || hojeTexto()
        };
      };
      limpo.propostas = bruto.propostas.filter(function (p) {
        return p && typeof p === 'object' && typeof p.id === 'string';
      }).map(function (p) {
        return {
          id: p.id,
          clienteId: texto(p.clienteId),
          numero: Math.max(inteiro(p.numero), 1),
          tipo: texto(p.tipo).slice(0, 30) || TIPO_PADRAO,
          titulo: texto(p.titulo).slice(0, 80),
          data: soData(p.data) || hojeTexto(),
          validade: soData(p.validade),
          materiais: (Array.isArray(p.materiais) ? p.materiais : []).filter(function (m) {
            return m && typeof m === 'object';
          }).map(function (m) {
            return { nome: texto(m.nome).slice(0, 60), valor: inteiro(m.valor) };
          }).slice(0, 60),
          outros: (Array.isArray(p.outros) ? p.outros : []).filter(function (m) {
            return m && typeof m === 'object';
          }).map(function (m) {
            return { nome: texto(m.nome).slice(0, 60), valor: inteiro(m.valor) };
          }).slice(0, 60),
          maoDeObra: inteiro(p.maoDeObra),
          logistica: inteiro(p.logistica),
          desconto: inteiro(p.desconto),
          pagamento: comBandeira(limparPagamento(p.pagamento || {
            // Orçamento das versões antigas: uma taxa só para tudo.
            descontoAvista: p.descontoAvista == null ? 0 : p.descontoAvista, repassar: false,
            ateParcelas: p.parcelasCartao,
            bandeiras: [{ nome: 'Cartões', debito: 0,
              credito: Array.apply(null, { length: 24 }).map(function (_, i) {
                return i === 0 ? (Number(p.taxaCredito) || 0) : (Number(p.taxaParcelado) || 0);
              }) }]
          })),
          direto: limparDireto(p.direto),
          obs: texto(p.obs).slice(0, 400),
          servicoId: texto(p.servicoId),
          criadoEm: inteiro(p.criadoEm) || Date.now()
        };
      }).slice(-300);
    }

    if (Array.isArray(bruto.clientes)) {
      limpo.clientes = bruto.clientes.filter(function (c) {
        return c && typeof c === 'object' && typeof c.id === 'string' && texto(c.nome);
      }).map(function (c) {
        return {
          id: c.id,
          nome: texto(c.nome).slice(0, 60),
          telefone: texto(c.telefone).slice(0, 30),
          endereco: texto(c.endereco).slice(0, 160),
          obs: texto(c.obs).slice(0, 200),
          proximoPagamento: soData(c.proximoPagamento),
          whatsapp: c.whatsapp !== false,
          telefones: telefonesLimpos(c),
          criadoEm: inteiro(c.criadoEm) || Date.now()
        };
      });
    }

    if (Array.isArray(bruto.servicos)) {
      limpo.servicos = bruto.servicos.filter(function (s) {
        return s && typeof s === 'object' && typeof s.id === 'string' &&
          typeof s.clienteId === 'string' && inteiro(s.valor) > 0 && soData(s.data);
      }).map(function (s) {
        return {
          id: s.id,
          clienteId: s.clienteId,
          nome: texto(s.nome).slice(0, 60) || 'Serviço',
          tipo: texto(s.tipo).slice(0, 30) || 'Serviço',
          valor: inteiro(s.valor),
          data: soData(s.data),
          obs: texto(s.obs).slice(0, 200),
          criadoEm: inteiro(s.criadoEm) || Date.now()
        };
      });
    }

    if (Array.isArray(bruto.parcelas)) {
      limpo.parcelas = bruto.parcelas.filter(function (p) {
        return p && typeof p === 'object' && typeof p.id === 'string' &&
          typeof p.clienteId === 'string' && inteiro(p.valor) > 0 && soData(p.vencimento);
      }).map(function (p) {
        return {
          id: p.id,
          clienteId: p.clienteId,
          servicoId: texto(p.servicoId),
          numero: Math.max(inteiro(p.numero), 1),
          total: Math.max(inteiro(p.total), 1),
          valor: inteiro(p.valor),
          vencimento: soData(p.vencimento),
          minimo: Math.max(inteiro(p.minimo), 0),
          jurosAtraso: Math.min(Math.max(Number(p.jurosAtraso) || 0, 0), 100),
          quitadaEm: soData(p.quitadaEm),
          pagamentoId: texto(p.pagamentoId),
          criadoEm: inteiro(p.criadoEm) || Date.now()
        };
      });
    }

    if (Array.isArray(bruto.excluidos)) {
      limpo.excluidos = bruto.excluidos.filter(function (m) {
        return m && typeof m.t === 'string' && typeof m.id === 'string' && m.id;
      }).slice(0, 5000);
    }

    if (Array.isArray(bruto.pagamentos)) {
      limpo.pagamentos = bruto.pagamentos.filter(function (p) {
        return p && typeof p === 'object' && typeof p.id === 'string' &&
          typeof p.clienteId === 'string' && inteiro(p.valor) > 0 && soData(p.data);
      }).map(function (p) {
        return {
          id: p.id,
          clienteId: p.clienteId,
          servicoId: texto(p.servicoId),
          valor: inteiro(p.valor),
          data: soData(p.data),
          parcelaId: texto(p.parcelaId),
          lancamentoId: texto(p.lancamentoId),
          criadoEm: inteiro(p.criadoEm) || Date.now()
        };
      });
    }

    if (Array.isArray(bruto.contas)) {
      limpo.contas = bruto.contas.filter(function (c) {
        return c && typeof c === 'object' && typeof c.id === 'string' && texto(c.nome);
      }).map(function (c) {
        return {
          id: c.id,
          nome: texto(c.nome).slice(0, 40),
          tipo: TIPOS_CONTA.indexOf(c.tipo) >= 0 ? c.tipo : 'Conta corrente',
          saldoInicial: inteiro(c.saldoInicial),
          // A cor pode vir da paleta ou da marca de um banco reconhecido.
          cor: /^#[0-9a-fA-F]{6}$/.test(c.cor) ? c.cor : CORES[0],
          banco: texto(c.banco).slice(0, 20),
          fechamento: Math.min(Math.max(inteiro(c.fechamento), 0), 31),
          vencimento: Math.min(Math.max(inteiro(c.vencimento), 0), 31),
          limite: Math.max(inteiro(c.limite), 0)
        };
      });
    }

    if (Array.isArray(bruto.lancamentos)) {
      limpo.lancamentos = bruto.lancamentos.filter(function (l) {
        return l && typeof l === 'object' && typeof l.id === 'string' &&
          ['entrada', 'saida', 'transferencia'].indexOf(l.tipo) >= 0 &&
          inteiro(l.valor) > 0 && soData(l.data);
      }).map(function (l) {
        return {
          id: l.id,
          tipo: l.tipo,
          valor: inteiro(l.valor),
          descricao: semRepeticao(texto(l.descricao)).slice(0, 80),
          importacaoId: texto(l.importacaoId),
          categoria: texto(l.categoria) || 'Outros',
          subcategoria: texto(l.subcategoria),
          data: soData(l.data),
          contaId: texto(l.contaId),
          contaDestinoId: texto(l.contaDestinoId),
          criadoEm: inteiro(l.criadoEm) || Date.now()
        };
      });
    }

    if (Array.isArray(bruto.ativos)) {
      limpo.ativos = bruto.ativos.filter(function (a) {
        return a && typeof a === 'object' && typeof a.id === 'string' && texto(a.nome);
      }).map(function (a) {
        var historico = Array.isArray(a.historico) ? a.historico.filter(function (p) {
          return p && soData(p.data) && inteiro(p.valor) >= 0;
        }).map(function (p) {
          return { data: soData(p.data), valor: inteiro(p.valor) };
        }).sort(function (x, y) { return x.data < y.data ? -1 : 1; }) : [];
        return {
          id: a.id,
          nome: texto(a.nome).slice(0, 50),
          classe: CLASSES_ATIVO.indexOf(a.classe) >= 0 ? a.classe : 'Outros',
          aplicado: Math.max(inteiro(a.aplicado), 0),
          historico: historico.length ? historico : [{ data: hojeTexto(), valor: Math.max(inteiro(a.aplicado), 0) }]
        };
      });
    }

    if (Array.isArray(bruto.metas)) {
      limpo.metas = bruto.metas.filter(function (m) {
        return m && typeof m === 'object' && typeof m.id === 'string' && texto(m.nome) && inteiro(m.alvo) > 0;
      }).map(function (m) {
        return {
          id: m.id,
          nome: texto(m.nome).slice(0, 50),
          alvo: inteiro(m.alvo),
          guardado: Math.max(inteiro(m.guardado), 0),
          contaId: texto(m.contaId),
          prazo: soData(m.prazo)
        };
      });
    }

    if (bruto.orcamentos && typeof bruto.orcamentos === 'object') {
      limpo.orcamentos.geral = Math.max(inteiro(bruto.orcamentos.geral), 0);
      var cats = bruto.orcamentos.categorias;
      if (cats && typeof cats === 'object') {
        Object.keys(cats).slice(0, 60).forEach(function (c) {
          var v = Math.max(inteiro(cats[c]), 0);
          if (v > 0 && c.length <= 30) limpo.orcamentos.categorias[c] = v;
        });
      }
    }

    arrumarCategorias(limpo);
    return limpo;
  }

  // Passa os dados da lista antiga de categorias para os dois andares.
  //
  // Roda toda vez que o estado é lido, e por isso precisa ser inofensiva na
  // segunda passada: nome que já é categoria de cima fica quieto. O que era
  // categoria e virou subcategoria desce para o lugar novo levando o
  // lançamento junto, com a grafia arrumada — "Custo Juridico" vira
  // "Negócio · Custo jurídico".
  //
  // Categoria que a pessoa criou e não está na tabela continua sendo
  // categoria dela: mexer nisso seria jogar fora o que ela organizou.
  function arrumarCategorias(e) {
    function destino(tipo, nome) {
      var mapa = CATEGORIA_ANTIGA[tipo] || {};
      if (mapa[nome]) return mapa[nome];
      return null;
    }

    e.lancamentos.forEach(function (l) {
      if (l.tipo === 'transferencia') return;
      var d = destino(l.tipo, l.categoria);
      if (!d) return;
      l.categoria = d[0];
      if (!l.subcategoria && d[1]) l.subcategoria = d[1];
    });

    // O que virou subcategoria sai da lista de categorias criadas na mão,
    // senão continuaria aparecendo como chip lá em cima.
    ['saida', 'entrada'].forEach(function (tipo) {
      var lista = e.categoriasExtras[tipo] || [];
      e.categoriasExtras[tipo] = lista.filter(function (nome) {
        return !destino(tipo, nome) && CATEGORIAS[tipo].indexOf(nome) < 0;
      });
    });

    // Teto de orçamento segue a categoria. Dois tetos que caem na mesma
    // categoria somam: eram dois pedaços do mesmo gasto.
    var tetos = {};
    Object.keys(e.orcamentos.categorias).forEach(function (nome) {
      var d = destino('saida', nome);
      var alvo = d ? d[0] : nome;
      tetos[alvo] = (tetos[alvo] || 0) + e.orcamentos.categorias[nome];
    });
    e.orcamentos.categorias = tetos;

    // O que a pessoa ensinou na importação ("esse nome é Combustível")
    // continua valendo, apontando para o lugar novo.
    var regras = e.regrasCategoria || {};
    Object.keys(regras).forEach(function (chave) {
      var d = destino('saida', regras[chave]) || destino('entrada', regras[chave]);
      if (d) regras[chave] = d[0];
    });
  }

  function migrarDaV1() {
    var bruto;
    try { bruto = JSON.parse(localStorage.getItem(CHAVE_ANTIGA) || 'null'); } catch (e) { return null; }
    if (!Array.isArray(bruto) || !bruto.length) return null;

    var carteira = { id: novoId(), nome: 'Carteira', tipo: 'Dinheiro físico', saldoInicial: 0, cor: CORES[0] };
    var novo = estadoPadrao();
    novo.contas = [carteira];
    novo.lancamentos = bruto.map(function (l) {
      return {
        id: typeof l.id === 'string' ? l.id : novoId(),
        tipo: l.tipo === 'entrada' ? 'entrada' : 'saida',
        valor: inteiro(l.valor),
        descricao: texto(l.descricao),
        categoria: texto(l.categoria) || 'Outros',
        data: ehData(l.data) ? l.data : hojeTexto(),
        contaId: carteira.id,
        contaDestinoId: '',
        criadoEm: inteiro(l.criadoEm) || Date.now()
      };
    });
    return limparEstado(novo);
  }

  // ---------- Criptografia dos dados ----------
  // Cada conta tem uma chave mestra aleatória. Ela é guardada duas vezes:
  // embrulhada pela senha e embrulhada pelo código de recuperação. O cofre
  // com os dados é cifrado com AES-GCM usando essa chave mestra.

  var cripto = window.crypto && window.crypto.subtle ? window.crypto : null;

  function paraBase64(bytes) {
    var s = '';
    for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    return btoa(s);
  }

  function deBase64(texto) {
    var s = atob(texto);
    var bytes = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) bytes[i] = s.charCodeAt(i);
    return bytes;
  }

  function bytesAleatorios(n) { return cripto.getRandomValues(new Uint8Array(n)); }

  function derivarChave(segredo, saltB64) {
    return cripto.subtle.importKey('raw', new TextEncoder().encode(segredo), 'PBKDF2', false, ['deriveKey'])
      .then(function (base) {
        return cripto.subtle.deriveKey(
          { name: 'PBKDF2', salt: deBase64(saltB64), iterations: 210000, hash: 'SHA-256' },
          base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
      });
  }

  function cifrarBytes(chave, bytes) {
    var iv = bytesAleatorios(12);
    return cripto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, chave, bytes).then(function (cif) {
      var saida = new Uint8Array(12 + cif.byteLength);
      saida.set(iv, 0);
      saida.set(new Uint8Array(cif), 12);
      return paraBase64(saida);
    });
  }

  function decifrarBytes(chave, b64) {
    var bytes = deBase64(b64);
    return cripto.subtle.decrypt(
      { name: 'AES-GCM', iv: bytes.slice(0, 12) }, chave, bytes.slice(12)
    ).then(function (claro) { return new Uint8Array(claro); });
  }

  function cifrar(chave, objeto) {
    return cifrarBytes(chave, new TextEncoder().encode(JSON.stringify(objeto)));
  }

  function decifrar(chave, b64) {
    return decifrarBytes(chave, b64).then(function (bytes) {
      return JSON.parse(new TextDecoder().decode(bytes));
    });
  }

  function novaChaveMestra() {
    return cripto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']);
  }

  function exportarChave(chave) {
    return cripto.subtle.exportKey('raw', chave).then(function (b) { return paraBase64(new Uint8Array(b)); });
  }

  function importarChave(b64) {
    return cripto.subtle.importKey('raw', deBase64(b64), { name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']);
  }

  function embrulhar(chaveMestra, segredo, saltB64) {
    return Promise.all([exportarChave(chaveMestra), derivarChave(segredo, saltB64)])
      .then(function (r) { return cifrarBytes(r[1], deBase64(r[0])); });
  }

  function desembrulhar(envelope, segredo, saltB64) {
    return derivarChave(segredo, saltB64)
      .then(function (chaveSegredo) { return decifrarBytes(chaveSegredo, envelope); })
      .then(function (bruto) { return importarChave(paraBase64(bruto)); });
  }

  function gerarCodigoRecuperacao() {
    // Sem vogais, para o código nunca formar palavra.
    var alfabeto = 'BCDFGHJKLMNPQRSTVWXZ23456789';
    var bytes = bytesAleatorios(20);
    var saida = '';
