# Mantém o projeto do Supabase acordado.
#
# O plano gratuito pausa o projeto depois de 7 dias sem nenhum pedido. Em
# 03/10/2026 isso aconteceu: o endereço sumiu do DNS e o app ficou sem
# login e sem sincronização até alguém restaurar na mão.
#
# Este agendamento faz um pedido por dia. É de graça, não precisa de senha
# nenhuma e não guarda nada: ele lê o endereço e a chave pública do
# próprio config.js, que já estão no repositório e são públicos por
# natureza — quem protege os dados é o RLS do banco, não o sigilo delas.
#
# Se o servidor não responder, o passo falha de propósito: o GitHub manda
# um e-mail, e você fica sabendo no mesmo dia em vez de descobrir quando
# for usar o app.

name: Manter o servidor acordado

on:
  schedule:
    # Duas vezes por dia: 11:00 e 23:00 UTC (8:00 e 20:00 em Brasília).
    #
    # Uma por dia já bastaria para o limite de sete, mas o GitHub atrasa
    # agendamento quando está cheio — nas rondas de outubro houve atraso
    # de até dez horas — e também pode simplesmente pular uma. Duas
    # batidas não custam nada e tiram essa dependência de sorte.
    - cron: '0 11,23 * * *'
  # Para rodar na hora, pelo botão, sem esperar o horário.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acordar:
    runs-on: ubuntu-latest
    steps:
      - name: Pegar o endereço e a chave pública do config.js
        uses: actions/checkout@v4

      - name: Bater no servidor
        env:
          # Opcional. Sem ele a ronda so avisa; com ele, ela levanta o
          # projeto pausado sozinha. Guardado em Settings > Secrets and
          # variables > Actions, nunca no repositorio.
          TOKEN: ${{ secrets.SUPABASE_TOKEN }}
        run: |
          set -u

          URL=$(grep -oE "supabaseUrl: *'[^']+'" config.js | head -1 | cut -d"'" -f2)
          CHAVE=$(grep -oE "supabaseAnonKey: *'[^']+'" config.js | head -1 | cut -d"'" -f2)

          if [ -z "$URL" ] || [ -z "$CHAVE" ]; then
            echo "Não achei supabaseUrl ou supabaseAnonKey no config.js."
            exit 1
          fi
          echo "Servidor: $URL"

          # Duas batidas, porque elas provam coisas diferentes:
          #
          # 1) /auth/v1/health diz que o serviço de login está de pé. Ele
          #    exige a chave pública no cabeçalho apikey: sem ela a borda
          #    corta antes com 401 e "No API key found in request". (Já
          #    respondeu sem chave; em 08/10/2026 não respondia mais.)
          # 2) pulso_bater() é uma escrita de verdade no Postgres, e é ela
          #    que conta como atividade do banco.
          #
          #    Antes aqui havia uma leitura em /rest/v1/perfis que o RLS
          #    recusava com 401. Parecia esperto — provava que a trava
          #    funciona — mas como prova de atividade era duvidosa: há
          #    relatos de que pedido recusado não marca ponto, e descobrir
          #    isso no dia em que o projeto pausa é tarde. Agora exigimos
          #    200: a escrita aconteceu, não tem o que interpretar.
          #
          #    A função carimba a hora numa linha só, não lê dado de
          #    ninguém e a tabela por trás dela é inalcançável pela API.
          #    Está no schema.sql e na migracao-07.sql.
          FALHOU=0

          # O curl escreve o %{http_code} uma vez por tentativa, então com
          # repetição saía "000000"; e o arquivo de saída fica com o corpo
          # da chamada anterior quando a conexão nem abre. Daí o tail e o
          # esvaziar antes.
          bater() {
            : > /tmp/corpo.txt
            curl -sS -o /tmp/corpo.txt -w '%{http_code}' --max-time 30 \
              --retry 2 --retry-delay 5 --retry-all-errors "$@" | tail -c 3
          }

          echo "--- /auth/v1/health"
          CODIGO=$(bater -H "apikey: $CHAVE" "$URL/auth/v1/health" || echo "000")
          echo "HTTP ${CODIGO:-000}"; head -c 300 /tmp/corpo.txt; echo
          # Aqui exigimos 2xx mesmo. Com a chave certa, um projeto de pé
          # responde 200. Um 401 aqui significa chave inválida ou trocada,
          # que é exatamente o tipo de coisa que vale um e-mail.
          case "$CODIGO" in 2*) ;; *) FALHOU=1 ;; esac

          echo "--- /rest/v1/rpc/pulso_bater"
          CODIGO=$(bater -X POST -H "apikey: $CHAVE" -H "Authorization: Bearer $CHAVE" \
            -H "Content-Type: application/json" -d '{}' \
            "$URL/rest/v1/rpc/pulso_bater" || echo "000")
          echo "HTTP ${CODIGO:-000}"; head -c 300 /tmp/corpo.txt; echo
          # Exigimos 2xx: a escrita tem de ter acontecido.
          #
          # 404 aqui quer dizer que a função não existe no projeto — rode
          # a migracao-07.sql. 401 quer dizer chave inválida.
          case "$CODIGO" in 2*) ;; *) FALHOU=1 ;; esac

          # ----------------------------------------------------------
          # Levantar sozinho, se o projeto tiver caido
          #
          # Ate aqui tudo e leitura: a ronda descobre a queda e manda
          # e-mail, mas quem levanta e uma pessoa no painel. Com um
          # segredo SUPABASE_TOKEN guardado no repositorio, ela levanta.
          #
          # Sem o segredo, nada disso roda e a ronda segue como antes.
          # E de proposito: o token e opcional, nao obrigatorio.
          #
          # Esta parte tambem conserta uma cegueira. De fora, projeto
          # pausado e projeto apagado sao identicos: o nome some do DNS
          # nos dois casos. A API de gestao responde a diferenca.
          # ----------------------------------------------------------
          if [ "$FALHOU" = "1" ] && [ -n "${TOKEN:-}" ]; then
            REF=$(printf '%s' "$URL" | sed -E 's#^https?://([^.]+)\..*#\1#')
            API=${API_SUPABASE:-https://api.supabase.com}
            echo
            echo "--- perguntando à API de gestão sobre o projeto $REF"

            : > /tmp/projeto.txt
            CODIGO=$(curl -sS -o /tmp/projeto.txt -w '%{http_code}' --max-time 30 \
              -H "Authorization: Bearer $TOKEN" "$API/v1/projects/$REF" | tail -c 3)
            echo "HTTP ${CODIGO:-000}"; head -c 300 /tmp/projeto.txt; echo

            case "$CODIGO" in
              404)
                echo
                echo "O projeto NAO EXISTE MAIS. Isso nao e pausa, e sumico:"
                echo "apagado, ou a chave do config.js aponta para um ref"
                echo "que nunca existiu. Levantar nao resolve - tem de criar"
                echo "outro e rodar o supabase/schema.sql. Veja a secao 2b"
                echo "do supabase/CONFIGURACAO.md."
                ;;
              401|403)
                echo
                echo "O token nao foi aceito. Gere outro em"
                echo "supabase.com/dashboard/account/tokens com a permissao"
                echo "project_admin_write e troque o segredo SUPABASE_TOKEN."
                ;;
              2*)
                # O estado vem no corpo. ACTIVE_HEALTHY e o de pe;
                # INACTIVE e o pausado. Procuro pelo texto para nao
                # depender de jq nem do formato exato do JSON.
                if grep -qi 'INACTIVE\|PAUSED' /tmp/projeto.txt; then
                  echo
                  echo "Projeto PAUSADO. Mandando levantar."
                  : > /tmp/restaura.txt
                  CODIGO=$(curl -sS -o /tmp/restaura.txt -w '%{http_code}' --max-time 60 \
                    -X POST -H "Authorization: Bearer $TOKEN" \
                    -H "Content-Type: application/json" -d '{}' \
                    "$API/v1/projects/$REF/restore" | tail -c 3)
                  echo "HTTP ${CODIGO:-000}"; head -c 300 /tmp/restaura.txt; echo
                  case "$CODIGO" in
                    2*)
                      echo
                      echo "Pedido de restauracao aceito. Levar de uns"
                      echo "minutos a algumas dezenas. A proxima ronda"
                      echo "confirma; se ela passar, acabou sozinho."
                      echo
                      echo "Mesmo assim este passo FALHA de proposito: o"
                      echo "servidor esta fora agora, e voce merece saber"
                      echo "que caiu, nao so que foi levantado."
                      ;;
                    *)
                      echo
                      echo "A restauracao foi recusada. Tem de ser no painel:"
                      echo "supabase.com/dashboard/projects"
                      ;;
                  esac
                else
                  echo
                  echo "A API diz que o projeto existe e nao esta pausado,"
                  echo "mas o endereco nao responde. Isso e pane do lado"
                  echo "deles, ou o config.js aponta para o projeto errado."
                fi
                ;;
              *)
                echo
                echo "Nao consegui falar com a API de gestao."
                ;;
            esac
          elif [ "$FALHOU" = "1" ]; then
            echo
            echo "(Sem o segredo SUPABASE_TOKEN eu so sei avisar, nao levantar."
            echo " Como ligar isso esta no supabase/CONFIGURACAO.md.)"
          fi

          if [ "$FALHOU" = "1" ]; then
            echo
            echo "O servidor não respondeu como esperado. Pelo código acima:"
            echo
            echo "  000  o nome nem resolve. Projeto pausado, apagado ou"
            echo "       desligado. Com o SUPABASE_TOKEN ligado, o trecho"
            echo "       acima ja diz QUAL dos tres."
            echo "  401  no health: a chave do config.js nao vale mais."
            echo "  404  no pulso: falta rodar a supabase/migracao-07.sql."
            echo "  5xx  o servidor esta de pe mas quebrado por dentro."
            echo
            echo "O passo a passo está em supabase/CONFIGURACAO.md."
            exit 1
          fi

          echo
          echo "Servidor acordado."
